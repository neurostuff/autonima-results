# GENERATED by scripts/run_baseline_searches.py from baselines.yaml -- do not
# hand-edit; edit the spec instead. Search baseline for manual annotation
# 'all_reappraisal'. Screening is skipped, so this is a Neurosynth-style pool over a
# topic-targeted search: every hit whose coordinates we could parse. The
# comparison column is 'all_analyses'.
#
# Broad emotion-regulation/reappraisal search, serving all four manual annotations. There are no per-sub-annotation arms because decrease/increase/maintain/reappraisal are contrast directions within a single paradigm rather than separable search topics.
search:
  database: pubmed
  query: '((("functional magnetic resonance imaging"[tiab] OR "functional MRI"[tiab] OR fMRI[tiab] OR
    neuroimaging[tiab] OR "Magnetic Resonance Imaging"[Mesh] OR "Brain Mapping"[Mesh]) AND ("emotion regulation"[tiab]
    OR "affective regulation"[tiab] OR "emotion regulation"[Mesh] OR reappraisal[tiab] OR reappraise*[tiab]
    OR "cognitive reappraisal"[tiab] OR "emotional regulation"[tiab] OR "regulation of emotion"[tiab]
    OR "downregulat*"[tiab] OR "down-regulat*"[tiab] OR "upregulat*"[tiab] OR "up-regulat*"[tiab])) AND
    ("2000/01/01"[Date - Publication] : "2019/12/31"[Date - Publication])) NOT (Editorial[pt] OR Letter[pt]
    OR Comment[pt] OR "Case Reports"[pt] OR News[pt] OR Review[pt])'
  date_from: 2000/01/01
  date_to: 2019/12/31
retrieval:
  load_excluded: false
  sources:
  - pubget
  full_text_sources:
  - root_path: /home/zorro/repos/autonima-results/articles/elsevier_output
    pmid_source: folder_name
    text_path_templates:
    - text.txt
    coordinates_path_templates:
    - coordinates.json
  - root_path: /home/zorro/repos/autonima-results/articles/ace_outputs
    pmid_source: file_name
    allowed_extensions:
    - .html
    processed_data_path: /home/zorro/repos/autonima-results/articles/ace_outputs/processed
screening:
  abstract:
    skip_stage: true
  fulltext:
    skip_stage: true
parsing:
  parse_coordinates: false
annotation:
  enabled: true
  model: '@psyc-aid338-ope-333f18/gpt-5-mini-2025-08-07'
  create_all_included_annotations: true
  annotations: []
output:
  formats:
  - csv
  nimads: true
