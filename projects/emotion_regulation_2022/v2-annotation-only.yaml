# v2 annotation-only -- trial harness for the draft annotation criteria.
#
# NUMBERED v2, NOT v3. v2-allstudies is the screening version this project will work from:
# v3-allstudies regressed badly (full-text TP 42 -> 19, recall 0.840 -> 0.404), mainly via
# its I11 change, so it is treated as a failed experiment. These annotation criteria pair
# with v2, and get ported into v2-allstudies.yaml once trialled.
#
# Annotation-only over the benchmark's own 88 gold PMIDs with both screening stages skipped, so
# this run exercises retrieval, parsing and annotation and nothing else. Its purpose is to find
# out whether the draft criteria below are workable before they are committed to a full run.
#
# annotation-only-ids.txt was generated from
# neurometabench/data/included_studies.csv (meta_pmid 35413444): 89 rows, 88 unique PMIDs, which
# matches the 88 studies in the merged nimads studyset.
#
# parse_coordinates is TRUE here, unlike v*-allstudies which have it off. Annotation judges
# analyses by name, description and table caption, so it needs the parsed analysis structure --
# mechanical coordinate extraction alone yields poorly identified analyses.
#
# !! BENCHMARK CROSS-CHECK against the supplementary material (mmc1.docx, Table S1: 266 contrast
# rows over 90 studies, with per-contrast Goal and Strategy columns) and the paper's Fig. 1.
# NOT corrected here -- the gold files are what the original author supplied, so the discrepancies
# are recorded rather than patched.
#
#     construct      gold Sleuth   Table S1   Fig. 1     verdict
#     studies             --           90        90      S1 agrees with Fig. 1
#     reappraisal        154          162       154      gold agrees with Fig. 1
#     increase            24           34        24      gold agrees with Fig. 1 (S1 counts the
#                                                        12 dual-goal contrasts in both buckets)
#     decrease           152          139       130      GOLD WRONG
#     maintain / Look      7          104       104      GOLD WRONG -- S1 and Fig. 1 agree at 104
#
# DEFECT 1 -- Decrease.txt holds the reappraisal UNION, not the decrease subset. It is a strict
# subset of Reappraisal.txt differing by only two labels, and it contains 23 of the 24 explicitly
# up-regulation contrasts ("Domes 2010 Increase>Maintain", "Ochsner 2004 Increase>Look Negative",
# "Morawetz 2016b Increase>Look film", ...). Those are labelled Increase in the file itself, so
# this is not the legitimate dual-goal set described below. Expected size is 130 (Fig. 1) or 139
# (S1 counting dual-goal contrasts); the file has 152.
#
# DEFECT 2 -- Maintain.txt is missing ~97 of 104 Look experiments. Table S1 and Fig. 1 independently
# agree on 104; the gold file has 7.
#
# Consequences if scoring proceeds against the gold as-is:
#   - `decrease`  ~23 false negatives, since correct criteria label those contrasts increase and
#                 the gold also demands decrease.
#   - `maintain`  large numbers of false positives, since correct criteria find Look in far more
#                 studies than the 7 recorded.
#   - `reappraisal` and `increase` should score cleanly -- both agree with Fig. 1.
# Treat the decrease and maintain columns as uninterpretable until the gold is rebuilt from S1.
#
# TWO THINGS THE SUPPLEMENT SETTLED ABOUT THE CRITERIA THEMSELVES
#
# (a) decrease and increase are NOT mutually exclusive. Table S1 marks 12 contrasts `decr+incr`
#     or `incr+decr`, every one of them a `task > emotion` contrast with task=reg -- studies that
#     pooled up- and down-regulation into a single regulate-versus-view contrast. Fig. 1's
#     130 + 24 = 154 arithmetic suggested disjointness and was misleading. The dual-goal rule is
#     restored below.
# (b) The stated static-picture restriction is contradicted by the realized inclusions. Criterion
#     (4) says "Only studies using static visual stimuli (i.e., pictures) were included", but 7 of
#     the 90 studies in Table S1 are film (Allard 2014, Beauregard 2001, Engen & Singer 2014,
#     Goldin 2008, Levesque 2003, Levesque 2004, Morawetz 2016a). Same stated-versus-realized
#     mismatch found in executive_function. The criterion below is softened accordingly.
#
# annotation-only-ids.txt was generated from
# neurometabench/data/included_studies.csv (meta_pmid 35413444): 89 rows, 88 unique PMIDs, which
# matches the 88 studies in the merged nimads studyset.
#
# parse_coordinates is TRUE here, unlike v*-allstudies which have it off. Annotation judges
# analyses by name, description and table caption, so it needs the parsed analysis structure --
# mechanical coordinate extraction alone yields poorly identified analyses.
#
# !! TWO BENCHMARK DATA DEFECTS, found by reconciling the gold Sleuth files against the paper's
# Fig. 1. Neither is a schema problem, and both will distort per-construct scoring:
#
#     construct        gold file   paper Fig.1   discrepancy
#     Reappraisal         154         154        ok
#     Increase             24          24        ok
#     Decrease            152         130        gold contains 23 of the 24 INCREASE contrasts
#     Maintain / Look       7         104        gold is missing ~97 experiments
#
# Decrease.txt genuinely contains up-regulation contrasts: "Domes 2010 Increase>Maintain",
# "Eippert 2007 Increase>View", "Kim 2007 Increase negative>Watch negative" and 20 more appear in
# BOTH Decrease.txt and Increase.txt. Removing them leaves 129, matching the paper's Dec n[e]=130.
# Since Fig. 1 gives 130 + 24 = 154, Dec and Inc are disjoint by construction, so the overlap
# cannot be intentional.
#
# Consequences if the gold is not rebuilt first:
#   - `decrease` shows ~23 false negatives, because correct criteria label those contrasts
#     increase-only while the gold also demands decrease.
#   - `maintain` shows many false positives, because correct criteria find the Look condition in
#     far more studies than the 7 the gold records.
#   - `reappraisal` and `increase` should score cleanly; those two files agree with the paper.
# Treat the decrease and maintain columns as uninterpretable until the gold files are rebuilt.

search:
  database: "pubmed"
  pmids_file: "/home/zorro/repos/autonima-results/projects/emotion_regulation_2022/annotation-only-ids.txt"

retrieval:
  # No screening runs, so there is no excluded arm to load.
  load_excluded: false
  sources:
    - pubget
  full_text_sources:
    - root_path: '/home/zorro/repos/autonima-results/articles/elsevier_output'
      pmid_source: "folder_name"
      text_path_templates:
        - 'text.txt'
      coordinates_path_templates:
        - 'coordinates.json'
    - root_path: '/home/zorro/repos/autonima-results/articles/ace_outputs'
      pmid_source: "file_name"
      allowed_extensions: [".html"]
      processed_data_path: '/home/zorro/repos/autonima-results/articles/ace_outputs/processed'

screening:
  abstract:
    skip_stage: true
  fulltext:
    skip_stage: true

parsing:
  parse_coordinates: true
  coordinate_model: "@psyc-aid338-ope-333f18/gpt-5-mini-2025-08-07"

annotation:
  # REWRITTEN 2026-08-26 FROM THE SOURCE PAPER FULL TEXT (Morawetz et al. 2022, NeuroImage 255:
  # 119194, PMID 35413444, "Reappraisal and empathic perspective-taking"). Drafted by Claude
  # (Opus 5) -- still for expert review, but no longer reverse-engineered: the criteria below now
  # come from the paper's own section 2.1 (Selection criteria) and its category definitions on
  # p.4, not from guessing at the benchmark's contrast labels.
  #
  # THE PAPER'S CATEGORIES (its section 2, p.4, verbatim in substance)
  #
  # Emotion regulation studies were categorized into three categories according to their GOAL:
  #   decrease (Dec)  down-regulation of emotion, reappraisal as the strategy
  #   increase (Inc)  up-regulation of emotion, reappraisal as the strategy
  #   maintain (Look) the CONTROL condition -- "participants are usually asked to just view the
  #                   images passively and respond naturally without regulating their emotional
  #                   responses". The paper calls this Look; this benchmark calls it maintain.
  # Reappraisal is the union of Dec and Inc: Fig. 1 gives Reappraisal n[e]=154 = Dec 130 + Inc 24.
  # The strategy "includes a wide spectrum of tactics such as reinterpretation, perspective-taking
  # and distancing", so the tactic does not matter -- the GOAL does.
  #
  # WHAT CHANGED FROM THE PREVIOUS (REVERSE-ENGINEERED) DRAFT
  #
  #  - Dec and Inc are NOT disjoint after all. Fig. 1's 130 + 24 = 154 suggested they were, and an
  #    intermediate version of this file said so; Table S1 then showed 12 dual-goal contrasts. The
  #    dual-goal rule is restored.
  #  - Added the sample rule: healthy adults only, no neurological/medical/psychiatric disorders.
  #    Patient studies qualify ONLY through a separately reported control group, and only that
  #    group. Gender/subgroup effects are excluded outright.
  #  - Added the stimulus rule: STATIC VISUAL STIMULI (pictures) only. This is criterion (4) and it
  #    is restrictive -- film, audio, script-driven imagery and word stimuli are all out.
  #  - Added fMRI-only. Criterion (2) says whole-brain fMRI; PET is not admitted (contrast with
  #    problem_solving and executive_function, which do admit PET).
  #  - DEACTIVATIONS ARE INCLUDED. Criterion (2) admits coordinates "for brain activation or
  #    deactivation". Do NOT filter by contrast direction here -- the opposite of the
  #    increases-only rule that problem_solving needs.
  #  - Added: both positive AND negative emotions qualify (criterion 5). Do not restrict to
  #    negative valence.
  #  - Partial-brain coverage is excluded alongside ROI-only (criterion 3).
  #
  # EXPECTED LABEL STRUCTURE. A regulation contrast carries two labels (its goal + reappraisal);
  # a Look contrast carries one (maintain). There should be no three-label analyses.
  #
  # !! BENCHMARK DATA DEFECTS THAT WILL DISTORT SCORING -- see the file header note. Two of the
  # four gold files disagree with the paper, so per-construct scores for `decrease` and `maintain`
  # will be wrong no matter how good these criteria are. Fix the benchmark before drawing
  # conclusions from those two columns.
  enabled: true
  model: "@psyc-aid338-ope-333f18/gpt-5-mini-2025-08-07"
  create_all_included_annotations: true
  prompt_type: "multi_analysis"
  metadata_fields:
    - "analysis_name"
    - "analysis_description"
    - "table_caption"
    - "study_title"
    - "study_fulltext"
  inclusion_criteria:
    - >-
      The analysis must come from a whole-brain fMRI study and be a group-level voxelwise
      task-evoked statistical map, with coordinates reported in MNI or Talairach space.
    - >-
      Direction- coordinates for either ACTIVATION or DEACTIVATION qualify. Do not exclude an
      analysis because its effect is a decrease in signal.
    - >-
      Sample- healthy adults with no reported neurological, medical or psychiatric disorder. A
      study of patients qualifies ONLY through a control group whose results are reported
      separately, and then only that control group's analysis.
    - >-
      Stimuli- the task must use VISUAL emotional stimuli. Static pictures are the norm (83 of the
      90 included studies) but film and video clips also qualify- the paper states a
      static-picture-only rule that its own included studies contradict, so do not exclude a study
      for using film. Auditory-only stimuli, script-driven imagery with no visual stimulus, and
      word or sentence stimuli do not qualify.
    - >-
      Emotional valence- both positive and negative emotional stimuli qualify.
    - >-
      The contrast must concern either the regulation of an emotional response to those pictures,
      or the passive unregulated viewing of them.
    - >-
      Judge this analysis from its own name, description and table caption. An empty or generic
      analysis name is never itself a reason to exclude- read the caption instead.
    - >-
      Assign every label that applies. A regulation contrast carries TWO labels: its goal
      (decrease or increase) and the strategy label (reappraisal).
  exclusion_criteria:
    - >-
      Region-of-interest (ROI) or small-volume-corrected analyses, and studies with only PARTIAL
      brain coverage rather than whole-brain acquisition.
    - >-
      Positron emission tomography (PET) studies. This meta-analysis admits fMRI only.
    - >-
      Connectivity or resting-state analyses (seed-based or effective connectivity, PPI, DCM,
      ICA) with no task activation map.
    - >-
      Contrasts between two participant GROUPS, or group x condition interactions, including
      gender or other subgroup difference effects. Only within-group effects in healthy adults
      qualify.
    - >-
      Emotion regulation by a strategy other than reappraisal where the paper frames it as a
      distinct strategy- e.g. expressive suppression, or attentional distraction used as its own
      condition. Note that reinterpretation, perspective-taking and distancing are treated by
      this meta-analysis as TACTICS WITHIN reappraisal and do qualify.
  annotations:
    - name: "reappraisal"
      description: "Cognitive reappraisal as the regulation strategy: changing the meaning of a pictured situation in order to change one's emotional response to it. The union of the decrease and increase goals."
      inclusion_criteria:
        - >-
          The contrast isolates a reappraisal regulation attempt against a less-regulated or
          unregulated comparison- typical forms are reappraise > look, reappraise > view,
          reappraise > watch, reappraise > maintain, decrease > look, or increase > maintain.
        - >-
          Either regulation goal qualifies, since this label is the union of decrease and
          increase. Assign it IN ADDITION to the goal label, never instead of it.
        - >-
          The tactic does not matter. Reinterpretation, perspective-taking and distancing all
          count as reappraisal for this meta-analysis.
      exclusion_criteria:
        - >-
          Passive viewing contrasts with no regulation instruction. Those are the Look control
          condition and belong to `maintain` alone.

    - name: "decrease"
      description: "Down-regulation goal (the paper's Dec): reappraisal used to reduce the intensity of an emotional response."
      inclusion_criteria:
        - >-
          The contrast's regulation goal is to reduce or dampen the emotional response- e.g.
          decrease > look, decrease > maintain, downregulate > view, "distance oneself".
        - >-
          Treat an UNDIRECTED reappraisal contrast (e.g. "reappraise > view", with no goal
          stated) as decrease. Down-regulation is this literature's default and the benchmark's
          Dec set contains exactly such contrasts.
      exclusion_criteria:
        - >-
          Contrasts whose ONLY stated goal is to amplify emotion. Note this is not a
          mutual-exclusion rule- a contrast that pools both regulation directions (typically
          "regulate > view" or "task > emotion", where the study had both up- and down-regulation
          conditions) carries BOTH decrease and increase. Table S1 marks 12 such contrasts.

    - name: "increase"
      description: "Up-regulation goal (the paper's Inc): reappraisal used to amplify the intensity of an emotional response."
      inclusion_criteria:
        - >-
          The contrast's regulation goal is explicitly to amplify or intensify the emotional
          response- e.g. increase > maintain, increase > look, increase > view, upregulate >
          watch, "feel the emotion more intensely".
        - >-
          Up-regulation must be stated or clearly implied by the condition name. Do not infer it
          from an undirected reappraisal contrast naming a single regulation attempt- that is
          decrease.
        - >-
          A contrast that POOLS both regulation directions does qualify, in addition to decrease.
          The signature is a generic regulation contrast ("regulate > view", "task > emotion") in
          a study whose design had both an up- and a down-regulation condition.
      exclusion_criteria:
        - >-
          Contrasts whose only stated goal is to dampen emotion.

    - name: "maintain"
      description: "The paper's Look control condition: viewing emotional pictures passively and responding naturally, with no instruction to regulate."
      inclusion_criteria:
        - >-
          The contrast reflects passive, uninstructed viewing of emotional pictures- e.g.
          emotion > baseline, look negative > baseline, view emotional > neutral, watch > rest.
          The defining feature is the ABSENCE of any regulation instruction.
      exclusion_criteria:
        - >-
          Any contrast involving a regulation attempt. `maintain` is mutually exclusive with the
          other three labels- if the participant was told to change their emotional response, it
          is not maintain.

output:
  nimads: true
  export_excluded_studies: true
