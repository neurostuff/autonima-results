# Autonima config for emotion_regulation_2022 (Morawetz et al., 2022, NeuroImage 255:119194)
#
# Target: the emotion regulation arm only. The paper's Section 2.1 lists six criteria;
# 1-4 are shared across both arms, 5 and 6 fork into (a) reappraisal / (b) empathy.
# This config encodes 1, 2, 3, 4, 5(a), 6(a).
#
# The 275-PMID pool is the PubMed slice of the paper's emotion-regulation search
# (p. 3: EMBASE 315, PsychINFO 219, Medline 42, PubMed 275). It is NOT the empathy arm,
# and it holds only 56 of the 88 gold studies -- the rest came from the other databases.
#
# ---- v2 -> v3 -------------------------------------------------------------------
# v2 lifted full-text recall 0.404 -> 0.840 and precision 0.467 -> 0.568, almost entirely
# via the disjunctive I6 rewrite (23 of v1's 31 I6-cluster false negatives recovered).
# v3 keeps every v2 criterion and changes only things with no fidelity cost:
#
#   A. Dropped the empathy exclusions added in v2. They were premised on a
#      mis-identification of the pool: the abstract one fired on 1 of 273 studies, the
#      full-text one on 0 of 145. Dead weight. The "perspective-taking and distancing
#      count as reappraisal" carve-out in I2/I6 is retained -- that part does real work.
#   B. The stimulus restriction moved from the abstract `objective` string into a declared
#      exclusion criterion. In v2 it was enforced only via the objective, which made the
#      model exclude studies while reporting "Exclusion IDs met: none" (e.g. 25698699:
#      all of I1-I4 met, excluded anyway for using film clips). Same behaviour, now
#      auditable. 
#   C. I11 now requires coordinates to be verifiable in the text actually provided.
#      v2 let a bare citation to an unseen supplement satisfy it -- 30946860 was included
#      on the reasoning that "absence of supplemental files is acceptable".
#   D. E7 now states that PPI/DCM/seed-selection peaks are not whole-brain task
#      activation coordinates (29931375 credited PPI peaks toward I10).
#   E. (no config change -- see below). 33 gold studies passed full-text screening and then
#      died at the coordinate stage; 32 were sourced from ace_outputs/html/Manual/, which
#      has a 0/106 coordinate-extraction rate (vs 28/34 for pubget). The activation tables
#      ARE present in that HTML (3-9 coordinate-like tables per paper, some with explicit
#      x/y/z headers), so this is recoverable data, not missing data. parse_coordinates is
#      gated on pre-extraction and so cannot rescue it; the fix is upstream -- re-run ACE's
#      coordinate extraction over that batch with the current (higher-recall) table logic
#      and regenerate ace_outputs/processed/coordinates.csv.
#
# ---- deliberately unchanged (fidelity to the published criteria) ------------------
# The "healthy adults" restriction stays, though the gold standard includes child,
# adolescent and mixed 10-25 samples: costs 5 false negatives (21686071, 24646887,
# 28372994 at abstract; 25439326, 26596970 at full text).
# The static-visual-stimuli rule stays, though 4 gold studies use film clips: costs
# 25631055, 17888411, 24782800, 17588776, plus 25698699 at abstract.
# Also unchanged: no date filter, and the authors' verbatim wording on prior
# neurological/medical/psychiatric history.
#
# ---- known evaluation artefacts (do not tune against these) -----------------------
# Full-text precision has a floor well under 1.0. Fig. 1 shows the ER arm ran 115 eligible
# -> 90 included, so ~25 criteria-eligible studies were dropped by the original authors for
# want of usable coordinates/contrasts. Several v2 "false positives" are canonical
# reappraisal-of-IAPS papers of exactly that profile (19400679, 22345383, 20226799).

search:
  database: "pubmed"
  pmids_file: "/home/zorro/repos/autonima-results/projects/emotion_regulation_2022/pubmed_search_pmids.txt"
  max_results: 5000
  email: "delavega@utexas.edu"

retrieval:
  load_excluded: true
  sources:
    - pubget
  full_text_sources:
    - root_path: '/home/zorro/repos/autonima-results/articles/elsevier_output'
      pmid_source: "folder_name"
      text_path_templates:
        - 'text.txt'
      coordinates_path_templates:
        - 'coordinates.json'
    - root_path: '/home/zorro/repos/autonima-results/articles/ace_outputs'
      pmid_source: "file_name"
      allowed_extensions: [".html"]
      processed_data_path: '/home/zorro/repos/autonima-results/articles/ace_outputs/processed'

screening:
  abstract:
    model: "@psyc-aid338-ope-333f18/gpt-5-mini-2025-08-07"
    objective: "Identify task-based fMRI studies in which participants regulated their own emotional responses to static pictures, using reappraisal."
    additional_instructions: >-
      Base every include/exclude decision solely on the enumerated inclusion and exclusion
      criteria. The objective is context only, never itself a criterion. Do not exclude a
      study unless you can name the specific inclusion criterion it fails or the exclusion
      criterion it triggers. If all inclusion criteria are met and no exclusion criterion is
      triggered, the decision must be include. This is a first-pass screen: where an abstract
      is silent or ambiguous on a criterion, include the study for full-text review rather
      than excluding it.
    inclusion_criteria:
      - Task-based fMRI study.
      - Human participants performing an emotion regulation or reappraisal task, broadly defined. Reappraisal covers a wide spectrum of tactics including reinterpretation, perspective-taking, and distancing.
      - Includes at least one group of healthy adults. A study of a patient population qualifies if it also includes a healthy control group.
      - Reports task-related brain activation results.
    exclusion_criteria:
      - Non-empirical papers (e.g., reviews, meta-analyses) without original human data.
      - Doesn't include at least one healthy adult sample.
      - "The abstract clearly indicates that the emotional stimuli being regulated are something other than static pictures - e.g. film or video clips, music or other audio, odours, narrative scripts, recalled autobiographical memories, imagined scenarios, monetary or social decision outcomes, or delivered pain. Apply this only when the abstract states the stimulus type; if the stimulus type is not stated, do NOT exclude on this basis."
    confidence_reporting: true

  fulltext:
    model: "@psyc-aid338-ope-333f18/gpt-5-mini-2025-08-07"
    confidence_reporting: true
    objective: "Identify task-based fMRI studies in which healthy adults used reappraisal to regulate emotional responses to static visual stimuli, with whole-brain coordinates reported."
    inclusion_criteria:
      - Task-based fMRI study.
      - "fMRI Task- reappraisal used as the emotion regulation strategy, construed broadly to include reinterpretation, perspective-taking, and distancing tactics. The regulation goal may be up-regulation (increase) OR down-regulation (decrease) of emotion, and the emotional stimuli may be positive OR negative. A study qualifies if it implements EITHER regulation direction with EITHER stimulus valence; it does NOT need to include both directions or both valences."
      - "Stimuli- the emotional stimuli being regulated are static visual images (e.g., IAPS pictures, photographs of faces or scenes). Exclude studies in which the regulated stimuli are film or video clips, audio, narrative scripts, imagined or recalled autobiographical scenarios, monetary or social decision outcomes, anticipatory cues, or delivered pain/shock."
      - Target sample- at least one group of healthy adults with no prior report of neurological, medical, or psychiatric disorders. A study of a patient or clinical population qualifies only if results for the healthy control group are reported separately; only that group is of interest.
      - Analysis- Reports at least one within-task contrast related to emotion regulation (e.g., “reappraise > look”, “down-regulate > maintain”, “up-regulate > maintain”) for the target sample.
      - Whole-brain evidence- The target analysis must be a group-level, whole-brain (voxelwise) task-evoked statistical map, with peak coordinates reported in a standard anatomical reference space (Talairach/Tournoux or MNI).
      - "Verifiability- the qualifying whole-brain coordinates must be present in the text you have been given: a table of peak coordinates, or coordinates quoted in the Results narrative. Coordinates in tables, figures, or supplementary materials qualify only if their actual values appear in the provided text. A citation to a supplementary table, appendix, or online resource whose contents are NOT in the provided text does not satisfy this criterion."
    exclusion_criteria:
      - Non-empirical papers (e.g., reviews, meta-analyses, methods-only, simulations) without original fMRI data in healthy adults.
      - Studies that report only region-of-interest (ROI) analyses, only small-volume corrected results, or that used partial brain coverage, without an accompanying whole-brain map.
      - "Studies that report only seed-based connectivity, effective connectivity (e.g., PPI, DCM), or resting-state analyses (e.g., ICA, PLE, Hurst exponents) without also reporting a whole-brain task activation map. Peak coordinates originating from PPI, DCM, seed-selection, or mediation analyses are not whole-brain task activation coordinates and do not satisfy the whole-brain evidence criterion."
      - Studies that report only between-group contrasts or interactions (e.g., subgroup vs subgroup, patient vs control, gender differences)

parsing:
  parse_coordinates: false
  coordinate_model: "@psyc-aid338-ope-333f18/gpt-5-mini-2025-08-07"

annotation:
  # MINIMAL FIRST DRAFT by Claude (Opus 5), 2026-08-26 -- for expert review, not final.
  #
  # The source paper (Morawetz et al. 2022, NeuroImage 255:119194, PMID 35413444, "Reappraisal
  # and empathic perspective-taking") is not open access, so these criteria were NOT written from
  # its stated methods. They were reverse-engineered from the benchmark's own contrast labels in
  # neurometabench/raw/meta-datasets/Emotion Regulation - 2022 - Morawetz/{Decrease,Increase,
  # Maintain,Reappraisal}.txt, plus the label structure of the merged annotation. Treat every
  # criterion below as a hypothesis about what the authors did, to be corrected against the paper.
  #
  # WHAT THE LABELS ACTUALLY CONTAIN (counts from the Sleuth files; nimads agrees within one)
  #
  #   reappraisal  154   effectively the UNION of decrease and increase (152 + 24 - 23 overlap)
  #   decrease     152   "Decrease>Baseline", "Decrease>maintain", "Decrease>View",
  #                      and bare "Reappraise>View" / "Reappraisal>View emotional"
  #   increase      24   "Increase>Maintain", "Increase>View", "Increase negative>Watch negative",
  #                      "Increase>Look Negative", "Increase>look"
  #   maintain       8   "Emotion>Baseline" only -- emotional reactivity with NO regulation
  #
  # THREE STRUCTURAL FACTS THAT DRIVE THE DESIGN
  #
  # 1. Multi-labelling is the norm, not the exception: of 161 annotated analyses, 130 carry two
  #    labels, 23 carry three, and only 8 carry one. A schema that assigns one label per analysis
  #    cannot exceed ~0.5 recall here.
  # 2. `reappraisal` is a STRATEGY label and `decrease`/`increase` are GOAL labels, so they stack.
  #    Every one of the 152 decrease contrasts is also reappraisal; so are all 24 increase ones.
  # 3. `maintain` is DISJOINT from everything -- it co-occurs with no other label. It is not a
  #    regulation contrast at all but the unregulated reactivity condition, so it must never be
  #    labelled reappraisal.
  #
  # The 23 three-label analyses are decrease + increase + reappraisal: contrasts that pool both
  # regulation directions (e.g. regulate > view collapsing up- and down-regulation).
  #
  # DELIBERATELY LEFT OUT, pending the paper: any sample restriction (age, healthy vs clinical),
  # any stimulus-modality restriction, and any rule about strategies other than reappraisal
  # (suppression, distraction, expressive suppression). The benchmark is reappraisal-only in
  # practice, but whether that is an inclusion rule or just what the literature contains is not
  # something the contrast labels can settle.
  enabled: true
  model: "@psyc-aid338-ope-333f18/gpt-5-mini-2025-08-07"
  create_all_included_annotations: true
  prompt_type: "multi_analysis"
  metadata_fields:
    - "analysis_name"
    - "analysis_description"
    - "table_caption"
    - "study_title"
    - "study_fulltext"
  inclusion_criteria:
    - >-
      The analysis must be a group-level, univariate whole-brain (voxelwise) task-evoked
      statistical map with coordinates reported in MNI or Talairach space.
    - >-
      The task must involve emotional stimuli, and the contrast must concern either the
      regulation of an emotional response or the unregulated experience of one.
    - >-
      Judge this analysis from its own name, description and table caption. An empty or generic
      analysis name is never itself a reason to exclude- read the caption instead.
    - >-
      Assign every label that applies, not just the best one. Most analyses in this benchmark
      carry two labels, because the regulation STRATEGY (reappraisal) and the regulation GOAL
      (decrease, increase) are labelled separately and stack on the same contrast.
  exclusion_criteria:
    - Region-of-interest (ROI) or small-volume-corrected analyses without whole-brain results.
    - >-
      Connectivity or resting-state analyses (seed-based or effective connectivity, PPI, DCM,
      ICA) with no task activation map.
    - >-
      Contrasts between two participant GROUPS, or group x condition interactions, with no
      within-group effect. This is about who is compared, not about the conditions- a
      within-group regulation contrast qualifies.
  annotations:
    - name: "reappraisal"
      description: "Cognitive reappraisal: reinterpreting the meaning of an emotional stimulus in order to change one's emotional response to it."
      inclusion_criteria:
        - >-
          The contrast isolates a cognitive-reappraisal regulation attempt against a
          less-regulated or unregulated comparison- typical forms are reappraise > view,
          reappraise > look, reappraise > watch, reappraise > maintain, or reappraise > baseline.
        - >-
          Either regulation direction qualifies. A contrast named only "reappraise > view", with
          no direction stated, still belongs here.
        - >-
          Assign this IN ADDITION to the goal label (decrease or increase) rather than instead of
          it- in this benchmark every decrease and every increase contrast is also reappraisal.
      exclusion_criteria:
        - >-
          Contrasts of emotional versus neutral stimuli with no regulation instruction. Those are
          reactivity contrasts and belong to `maintain` only.

    - name: "decrease"
      description: "Down-regulation goal: reappraisal used to reduce the intensity of an emotional response."
      inclusion_criteria:
        - >-
          The contrast's regulation goal is to reduce or dampen the emotional response- e.g.
          decrease > baseline, decrease > maintain, decrease > view, downregulate > look.
        - >-
          Treat an undirected reappraisal contrast (e.g. "reappraise > view") as decrease.
          Down-regulation is the default goal in this literature and the benchmark labels such
          contrasts this way.

    - name: "increase"
      description: "Up-regulation goal: reappraisal used to amplify the intensity of an emotional response."
      inclusion_criteria:
        - >-
          The contrast's regulation goal is explicitly to amplify or intensify the emotional
          response- e.g. increase > maintain, increase > view, increase > look, upregulate >
          watch, "increase negative > watch negative".
        - >-
          Up-regulation must be stated. Do not infer it from an undirected reappraisal contrast.
        - >-
          If a single contrast pools both directions (e.g. regulate > view collapsing up- and
          down-regulation), assign BOTH increase and decrease.

    - name: "maintain"
      description: "Unregulated emotional reactivity: experiencing an emotional stimulus with no instruction to regulate."
      inclusion_criteria:
        - >-
          The contrast is emotional stimuli versus a neutral or low-level baseline, with no
          regulation instruction- e.g. emotion > baseline, negative > neutral, look negative >
          look neutral.
      exclusion_criteria:
        - >-
          Any contrast involving a regulation attempt. `maintain` is mutually exclusive with the
          other three labels in this benchmark- if the contrast regulates, it is not maintain.

output:
  formats:
    - csv
  nimads: true
  export_excluded_studies: true
