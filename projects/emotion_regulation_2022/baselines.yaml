# Search baseline for emotion_regulation_2022.
#
# WHAT THIS IS FOR
#
# The baseline answers "how good is a coarse, Neurosynth-style meta-analysis of everything a
# broad PubMed search returns?" -- no screening, no annotation, every table with coordinates
# pooled into one map. It is the thing autonima has to beat to be worth running.
#
# MAINTAIN HAS NO TARGETED ARM, AND THAT WAS TESTED RATHER THAN ASSUMED.
#
# `maintain` is the Look control condition -- viewing emotional pictures with no regulation
# instruction. Three plausible researcher queries were measured against its 57 gold studies:
#
#     query                          hits   gold   recall   precision
#     broad control                  1264     50    0.877     0.0396
#     "emotional reactivity" family   975     23    0.404     0.0236
#     affective-picture-viewing      1287     14    0.246     0.0109
#     both combined                  1634     21    0.368     0.0129
#
# Every variant is worse than the broad arm on BOTH recall and precision. The reason is
# structural: a control condition is not what a paper is about, so it does not appear in titles
# or abstracts. There is no query a researcher could write that targets "the passive-viewing
# condition of reappraisal studies". The broad arm is the best baseline that can exist here.
#
# ORIGINALLY ONE ARM ONLY; NOW THREE.
#
# Every other project in this corpus also gets per-sub-annotation baselines: a narrowed query per
# manual annotation, because a researcher targeting only the alcohol sub-meta-analysis would put
# "alcohol" in the search rather than reuse the broad one. That construction does not transfer
# here. This project's four targets -- decrease, increase, maintain, reappraisal -- are not
# separable topics but CONTRAST DIRECTIONS WITHIN ONE PARADIGM. A researcher targeting the
# down-regulation column and one targeting the up-regulation column would run the same reappraisal
# search and differ only in which contrasts they then selected. Narrowed arms would therefore be
# four near-identical queries, and the "sub-targeting" comparison would measure nothing.
#
# That is not a guess: the same collapse was measured in social (sub-targeting caps at 47-83%
# against a 95% broad ceiling) and problem_solving, both of which have cognitive-construct rather
# than topic sub-annotations. ER is the clearest case of it, so it gets the broad control alone.
# The evaluator will report baseline_sub as MISSING for all four columns, which is correct.
#
# QUERY PROVENANCE
#
# Terms are the paper's own (section 2.1, p.3): "emotion regulation", "affective regulation",
# "reappraisal" for the topic; "neuroimaging", "functional magnetic resonance imaging",
# "functional MRI" for the modality. The window is the paper's stated 2000-01-01 to 2019-12-31.
# The paper searched EMBASE, PsychINFO, Medline AND PubMed (315/219/42/275 hits); we can only
# reach the PubMed slice, so this baseline -- like the pipeline arm -- sees a subset of what the
# authors screened. Both arms share that limit, so the comparison stays fair.
#
# !! THE ASYMMETRY HERE RUNS THE WRONG WAY -- MEASURE BEFORE QUOTING.
#
# Usually the worry is that a broad baseline is unfairly WEAK. Here it is unfairly STRONG. This
# query reaches 81 of the 88 gold studies (recall 0.920) from 2,909 hits, while the project's own
# search pool -- pubmed_search_pmids.txt, the 275-PMID slice the -allstudies runs screen -- holds
# only 56 of 88 (recall 0.636).
#
# So the baseline arm would search a corpus with a third more gold in it than the pipeline arm
# ever sees. Any "autonima vs baseline" number computed that way is not a fair comparison; it
# would measure the difference between two searches, not between screening-plus-annotation and
# no screening. Do not report an ER end-to-end margin until the pipeline arm runs a real search
# of comparable reach -- which is the tracked "ER needs a plain vN.yaml" item.
#
# WHY THE GAP EXISTS, measured rather than assumed. It is not that the project pool is careless:
# the paper's exact keywords reproduce it precisely (854 hits, 56/88 gold -- the pool's own
# coverage). The authors' PubMed keyword list omits the abbreviation "fMRI" while spelling out
# "functional magnetic resonance imaging", so on PubMed alone it had a 0.636 ceiling. Their search
# worked because they ALSO queried EMBASE, PsychINFO and Medline and chased reference lists. We
# can only reach PubMed, so a faithful reproduction inherits the ceiling without the compensation.
# Restoring "fMRI" is what lifts this baseline to 0.898.
#
# The annotation-only arm is unaffected: it works from the fixed 88-PMID gold list and does not
# involve a search at all.
#
# RETRIEVAL CEILING, SHARED BY BOTH ARMS
#
# The pipeline arm currently reaches 63 of 88 gold texts, and coordinate parsing finds tables in
# only 48 studies. The baseline inherits the same full_text_sources, so it is limited the same
# way. Read any ER baseline comparison as covering roughly half the benchmark.

meta_pmid: "35413444"

shared:
  # The paper's modality keywords PLUS the abbreviation and MeSH terms. This is the one
  # deliberate deviation, and it is where all the recall lives: the paper's stated list spells
  # out "functional magnetic resonance imaging" and "functional MRI" but never includes "fMRI",
  # which is what most fMRI abstracts actually use. Measured against the gold, adding fMRI[tiab]
  # and the MeSH terms takes recall 0.636 -> 0.898 and recovers 23 studies.
  modality: >-
    "functional magnetic resonance imaging"[tiab] OR "functional MRI"[tiab] OR fMRI[tiab] OR
    neuroimaging[tiab] OR "Magnetic Resonance Imaging"[Mesh] OR "Brain Mapping"[Mesh]
  # Applied as NOT (...).
  exclude: >-
    Editorial[pt] OR Letter[pt] OR Comment[pt] OR "Case Reports"[pt] OR News[pt] OR Review[pt]
  date_from: "2000/01/01"
  date_to: "2019/12/31"

baselines:
  - manual_annotation: decrease
    # Targeting IS possible for the two goal columns, contrary to a first reading -- but only by
    # conjoining the regulation vocabulary with a direction term, not by direction terms alone.
    # Measured against the 86 studies in the decrease column:
    #
    #     query                        hits   gold   recall   precision
    #     broad control                1264     78    0.907     0.0617
    #     down-regulation terms alone  9356     37    0.430     0.0040   <- useless
    #     this arm (reapp AND down)     680     61    0.709     0.0897
    #
    # Direction terms alone fail badly because "downregulat*" is overwhelmingly molecular
    # biology; 9,356 hits for 37 gold studies. Conjoining with the regulation vocabulary halves
    # the pool against the broad arm and raises precision 1.5x, at a cost of 17 gold studies --
    # the shape of a genuine targeted arm.
    note: >-
      Down-regulation arm. Regulation vocabulary conjoined with direction terms; direction terms
      alone are unusable because downregulat* is dominated by molecular biology.
    topic: >-
      (reappraisal[tiab] OR reappraise*[tiab] OR "emotion regulation"[tiab]) AND
      ("down-regulat*"[tiab] OR downregulat*[tiab] OR decreas*[tiab] OR reduc*[tiab] OR
      attenuat*[tiab] OR dampen*[tiab] OR distanc*[tiab])

  - manual_annotation: increase
    # Same construction as the decrease arm. Against the 18 studies in the increase column:
    #
    #     query                       hits   gold   recall   precision
    #     broad control               1264     17    0.944     0.0134
    #     up-regulation terms alone   2276      8    0.444     0.0035
    #     this arm (reapp AND up)      655     12    0.667     0.0183
    #
    # Only 18 gold studies, so this column is noisy whichever arm is used.
    note: >-
      Up-regulation arm, mirroring the decrease arm's construction.
    topic: >-
      (reappraisal[tiab] OR reappraise*[tiab] OR "emotion regulation"[tiab]) AND
      ("up-regulat*"[tiab] OR upregulat*[tiab] OR increas*[tiab] OR amplif*[tiab] OR
      intensif*[tiab] OR enhanc*[tiab])

  - manual_annotation: reappraisal
    # A genuinely targeted arm, and the ONE case where sub-targeting is meaningful here.
    # decrease/increase/maintain are contrast directions with no distinct search vocabulary, but
    # reappraisal is a named strategy, so a researcher targeting that column would search for it.
    #
    # Measured against the 88 studies contributing to the reappraisal column:
    #
    #     query                            hits   gold   recall   precision
    #     broad control (all_reappraisal)  1264     79    0.898     0.0625
    #     this arm                          400     67    0.761     0.1675
    #     + reinterpret/distancing terms    500     67    0.761     0.1340   <- +100 hits, +0 gold
    #
    # The trade is 12 gold studies for 864 fewer hits. That makes this baseline a STRONGER
    # competitor than the broad control, not a weaker one: a less diluted pool yields a sharper
    # map, so autonima's margin over it should be smaller and the comparison harder. That is the
    # point of a sub-targeted arm.
    #
    # Reinterpretation and distancing terms are deliberately absent -- measured, they add hits
    # without adding gold, because papers using those tactics still say "reappraisal".
    note: >-
      Reappraisal-targeted arm. The only ER column with its own search vocabulary; the other
      three are contrast directions within the same paradigm and get the broad control alone.
    topic: >-
      reappraisal[tiab] OR reappraise*[tiab] OR "cognitive reappraisal"[tiab]

  - name: all_reappraisal
    # The only arm. Flagged as the like-vintage broad control so the evaluator prefers it over
    # the project run's own `all_studies` column, which is a different retrieval vintage.
    broad_control: true
    note: >-
      Broad emotion-regulation/reappraisal search, serving all four manual annotations. There are
      no per-sub-annotation arms because decrease/increase/maintain/reappraisal are contrast
      directions within a single paradigm rather than separable search topics.
    # The paper's three topic keywords verbatim. Deliberately NOT expanded: measured against
    # the gold, adding reappraise*, "cognitive reappraisal", "emotional regulation",
    # "regulation of emotion", up/downregulat* and the MeSH term contributed ~1,900 extra hits
    # and recovered ZERO additional gold studies (56/88 either way). Pure noise.
    topic: >-
      "emotion regulation"[tiab] OR "affective regulation"[tiab] OR reappraisal[tiab]
