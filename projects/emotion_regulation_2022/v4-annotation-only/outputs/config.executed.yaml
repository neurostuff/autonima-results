search:
  database: pubmed
  query: ''
  max_results: null
  date_from: null
  date_to: null
  email: null
  pmids_file: /home/zorro/repos/autonima-results/projects/emotion_regulation_2022/annotation-only-ids.txt
  pmids_list: null
screening:
  abstract:
    skip_stage: true
  fulltext:
    skip_stage: true
retrieval:
  sources:
  - pubget
  timeout: 30
  max_retries: 3
  download_directory: downloads
  n_jobs: 1
  load_excluded: false
  full_text_sources:
  - root_path: /home/zorro/repos/autonima-results/articles/elsevier_output
    pmid_source: folder_name
    text_path_templates:
    - text.txt
    coordinates_path_templates:
    - coordinates.json
  - root_path: /home/zorro/repos/autonima-results/articles/ace_outputs
    pmid_source: file_name
    allowed_extensions:
    - .html
    processed_data_path: /home/zorro/repos/autonima-results/articles/ace_outputs/processed
  parse_coordinates: false
  coordinate_model: gpt-4o-mini
parsing:
  parse_coordinates: true
  coordinate_model: '@psyc-aid338-ope-333f18/gpt-5-mini-2025-08-07'
annotation:
  model: '@psyc-aid338-ope-333f18/gpt-5-mini-2025-08-07'
  create_all_included_annotations: true
  metadata_fields:
  - analysis_name
  - analysis_description
  - table_caption
  - study_title
  - study_fulltext
  prompt_type: multi_analysis
  inclusion_criteria:
  - Voxelwise task evidence- this analysis must itself be a group-level, univariate,
    whole-brain (voxelwise) task-evoked statistical map. A study qualifying on the
    strength of one whole-brain analysis does not make its other analyses eligible.
  - The contrast must be WITHIN-group, and must concern either the regulation of an
    emotional response or the passive unregulated viewing of emotional stimuli.
  - Direction- either an ACTIVATION or a DEACTIVATION effect qualifies.
  - Judge this analysis from its own name, description and table caption. An empty
    or generic analysis name (e.g. "analysis_0") is never itself a reason to exclude-
    it usually means the analysis is the only one in its table, so the caption describes
    it fully.
  - 'Assign every label that applies. A regulation contrast carries TWO labels: its
    goal (decrease or increase) and the strategy label (reappraisal).'
  exclusion_criteria:
  - This analysis is EXPLICITLY described as region-of-interest or small-volume-corrected,
    with no whole-brain result behind it. Do not infer an ROI analysis from a short
    coordinate table or from anatomically focused results- whole-brain analyses routinely
    report few peaks.
  - This analysis is a connectivity or resting-state result- seed-based or effective
    connectivity, PPI, DCM, ICA- rather than a task activation map.
  - This contrast is between two participant GROUPS, or a group x condition interaction,
    including gender and other subgroup difference effects.
  annotations:
  - name: reappraisal
    description: 'Cognitive reappraisal as the regulation strategy: changing the meaning
      of a pictured situation in order to change one''s emotional response to it.
      The union of the decrease and increase goals.'
    inclusion_criteria:
    - The contrast isolates a reappraisal regulation attempt against a less-regulated
      or unregulated comparison- typical forms are reappraise > look, reappraise >
      view, reappraise > watch, reappraise > maintain, decrease > look, or increase
      > maintain.
    - Either regulation goal qualifies, since this label is the union of decrease
      and increase. Assign it IN ADDITION to the goal label, never instead of it.
    exclusion_criteria:
    - Passive viewing contrasts with no regulation instruction.
  - name: decrease
    description: 'Down-regulation goal: reappraisal used to reduce the intensity of
      an emotional response.'
    inclusion_criteria:
    - The contrast's regulation goal is to reduce or dampen the emotional response-
      e.g. decrease > look, decrease > maintain, downregulate > view, "distance oneself".
    exclusion_criteria:
    - 'Contrasts whose ONLY stated goal is to amplify emotion. '
  - name: increase
    description: 'Up-regulation goal: reappraisal used to amplify the intensity of
      an emotional response.'
    inclusion_criteria:
    - The contrast's regulation goal is explicitly to amplify or intensify the emotional
      response- e.g. increase > maintain, increase > look, increase > view, upregulate
      > watch, "feel the emotion more intensely".
    - Up-regulation must be stated or clearly implied by the condition name.
    exclusion_criteria:
    - Contrasts whose only stated goal is to dampen emotion.
  - name: maintain
    description: Viewing emotional pictures passively and responding naturally, with
      no instruction to regulate.
    inclusion_criteria:
    - The contrast reflects viewing emotional stimuli under NO regulation instruction-
      e.g. emotion > baseline, look negative > baseline, view emotional > neutral,
      watch negative > watch neutral, react > baseline, attend > rest.
    - Expect to find this INSIDE regulation studies. Almost every study in this benchmark
      is a reappraisal experiment, and its Look/Watch/React condition is the control
      arm of that same experiment. That the paper is about regulation is NOT a reason
      to withhold this label from its unregulated condition- judge the contrast, not
      the study.
    exclusion_criteria:
    - Contrasts in which THIS contrast's active condition involves a regulation attempt.
      `maintain` is mutually exclusive with the other three labels at the level of
      the contrast, not the study.
  enabled: true
output:
  directory: projects/emotion_regulation_2022/v4-annotation-only
  prisma_diagram: true
  formats:
  - csv
  - json
  nimads: true
  export_excluded_studies: true
