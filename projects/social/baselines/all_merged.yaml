# GENERATED by scripts/run_baseline_searches.py from baselines.yaml -- do not
# hand-edit; edit the spec instead. Search baseline for manual annotation
# 'all_merged'. Screening is skipped, so this is a Neurosynth-style pool over a
# topic-targeted search: every hit whose coordinates we could parse. The
# comparison column is 'all_analyses'.
#
# Reproduces v2.yaml's social clause.
search:
  database: pubmed
  query: '(((("functional MRI"[Title/Abstract] OR "functional magnetic resonance imaging"[Title/Abstract]
    OR fMRI[Title/Abstract]) AND Humans[MeSH]) AND ("social communication"[Title/Abstract] OR "social
    processing"[Title/Abstract] OR "social interaction"[Title/Abstract] OR affiliation[Title/Abstract]
    OR "social attachment"[Title/Abstract] OR "social cognition"[Title/Abstract] OR "understanding others"[Title/Abstract]))
    AND ("1995/01/01"[Date - Publication] : "2020/03/01"[Date - Publication])) NOT (review[pt] OR "systematic
    review"[tiab] OR meta-analysis[pt])'
  email: delavega@utexas.edu
  date_from: 1995/01/01
  date_to: 2020/03/01
retrieval:
  load_excluded: false
  sources:
  - pubget
  full_text_sources:
  - root_path: /home/zorro/repos/autonima-results/articles/ace_outputs/
    pmid_source: file_name
    allowed_extensions:
    - .html
    processed_data_path: /home/zorro/repos/autonima-results/articles/ace_outputs/processed/
screening:
  abstract:
    skip_stage: true
  fulltext:
    skip_stage: true
parsing:
  parse_coordinates: false
annotation:
  enabled: true
  model: gpt-5-mini-2025-08-07
  create_all_included_annotations: true
  annotations: []
output:
  formats:
  - csv
  nimads: true
