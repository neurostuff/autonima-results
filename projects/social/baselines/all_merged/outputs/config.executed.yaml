search:
  database: pubmed
  query: '(((("functional MRI"[Title/Abstract] OR "functional magnetic resonance imaging"[Title/Abstract]
    OR fMRI[Title/Abstract]) AND Humans[MeSH]) AND ("social communication"[Title/Abstract]
    OR "social processing"[Title/Abstract] OR "social interaction"[Title/Abstract]
    OR affiliation[Title/Abstract] OR "social attachment"[Title/Abstract] OR "social
    cognition"[Title/Abstract] OR "understanding others"[Title/Abstract])) AND ("1995/01/01"[Date
    - Publication] : "2020/03/01"[Date - Publication])) NOT (review[pt] OR "systematic
    review"[tiab] OR meta-analysis[pt])'
  max_results: null
  date_from: 1995/01/01
  date_to: 2020/03/01
  email: delavega@utexas.edu
  pmids_file: null
  pmids_list: null
screening:
  abstract:
    skip_stage: true
  fulltext:
    skip_stage: true
retrieval:
  sources:
  - pubget
  timeout: 30
  max_retries: 3
  download_directory: downloads
  n_jobs: 1
  load_excluded: false
  full_text_sources:
  - root_path: /home/zorro/repos/autonima-results/articles/ace_outputs/
    pmid_source: file_name
    allowed_extensions:
    - .html
    processed_data_path: /home/zorro/repos/autonima-results/articles/ace_outputs/processed/
  parse_coordinates: false
  coordinate_model: gpt-4o-mini
parsing:
  parse_coordinates: false
  coordinate_model: gpt-4o-mini
annotation:
  model: gpt-5-mini-2025-08-07
  create_all_included_annotations: true
  metadata_fields:
  - analysis_name
  - analysis_description
  - table_caption
  - study_title
  prompt_type: multi_analysis
  inclusion_criteria: []
  exclusion_criteria: []
  annotations: []
  enabled: true
output:
  directory: projects/social/baselines/all_merged
  prisma_diagram: true
  formats:
  - csv
  nimads: true
  export_excluded_studies: false
