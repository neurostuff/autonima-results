# v4 annotation-only -- AUTOMATICALLY GENERATED by Claude (Opus 5) on 2026-08-25.
#
# PROVENANCE, STATED PLAINLY
#
# This schema was written by an LLM agent, not by a human expert. Its inputs were:
#   1. the source paper's full text, fetched from PMC9843621 (Lopez et al., PMID 36436737)
#   2. this project's own v3-annotation-only error reports, specifically the criterion-level
#      attribution tables in reports/annotation_review_reports/*.html
# No human domain expert reviewed the criteria below before the run. Treat it as a
# machine-proposed revision to be evaluated, not as an expert-defined schema. This matters for
# the paper: it is a test of whether an agent can repair a schema from its own error reports,
# which is a different claim from "a domain expert can write a good schema".
#
# It is also, by construction, TUNED AGAINST THE BENCHMARK -- the error reports it draws on are
# derived from the gold standard. Report it alongside v1/v3 as an iterated version, never as a
# held-out one.
#
# WHAT IS UNCHANGED
#
# search, retrieval, screening and parsing are byte-identical to v3-annotation-only. This is an
# annotation-only run over a fixed PMID list with both screening stages skipped, so NOTHING is
# re-searched and NOTHING is re-screened. v3 -> v4 isolates the annotation block exactly.
#
# THE PROBLEM
#
# v3's umbrella construct is essentially solved (social_processing_all: F1 0.937, precision
# 1.000, recall 0.882). All four RDoC constructs are recall-starved:
#
#     construct                 F1     prec    recall   TP    FP    FN
#     affiliation_attachment   0.330   0.469   0.254    15    17    44
#     perception_self          0.408   0.750   0.281    39    13   100
#     social_communication     0.471   0.694   0.356    68    30   123
#     perception_others        0.635   0.615   0.657   163   102    85
#
# 352 false negatives against 162 false positives. Three distinct mechanisms produce them, and
# each is separately evidenced.
#
# MECHANISM 1 -- WE MONO-ANNOTATE; THE PAPER DUAL-ANNOTATES.
#
# The paper assigns 1,109 construct labels to 864 contrasts. On the 475 analyses in our matched
# universe the manual labels number 637 (1.34 per analysis); v3 assigns 447 (0.94 per analysis).
# We are 190 labels short before any judgement error, which alone caps achievable recall at
# 0.746. Recall is worst exactly where the paper dual-annotates most:
#
#     construct                 contrasts   dual   dual%   v3 recall
#     affiliation_attachment       106       75     71%      0.254
#     perception_self              208      117     56%      0.281
#     perception_others            410      170     41%      0.657
#     social_communication         385      138     36%      0.356
#
# affiliation_attachment is the clearest case: 71% of its manual contrasts carry a second label,
# it has the worst recall in the project, and yet its own criteria are barely implicated (its
# exclusion fires 3 errors against 12 correct uses). Its analyses are not being rejected on the
# merits -- they are being spent on a different construct.
#
# v3 did permit multi-labelling, but only as a grudging allowance ("Multiple annotations are
# allowed, but each assigned annotation must be independently justified"), set against five
# separate clauses demanding the contrast "isolate" a single construct. v4 states the expected
# rate numerically instead, and caps it at two -- the paper observed no contrast needing three.
#
# MECHANISM 2 -- SEVERAL v3 CRITERIA CONTRADICT THE PAPER OUTRIGHT.
#
# From the criterion-level error tables (error mentions vs correct mentions):
#
#     GLOBAL_E4                  10 errors,  0 correct   <- across two constructs; pure harm
#     SOCIAL_COMMUNICATION_E1    13 errors,  3 correct   (rate 4.33)
#     SOCIAL_PROCESSING_ALL_E1    5 errors,  0 correct   <- pure harm
#     SOCIAL_PROCESSING_ALL_I2    6 errors,  1 correct   (rate 6.00)
#
# SOCIAL_COMMUNICATION_E1 excluded "generic person perception". The paper's single most common
# Social Communication task family is "viewing pictures of faces and other objects", with
# emotion tasks (happy/sad faces), gaze, and gesture next. v3 excluded the modal case. REMOVED.
#
# GLOBAL_E4 excluded "contrasts dominated by task-irrelevant controls/baselines". It has never
# once been cited correctly in any construct. REMOVED outright.
#
# MECHANISM 3 -- "BETWEEN-GROUP" IS BEING READ AS "BETWEEN SOCIAL TARGETS".
#
# GLOBAL_E3 fires 7 errors against 6 correct uses in perception_self and 7 against 4 in the
# umbrella. Social paradigms are built from contrasts like self vs other, close other vs
# stranger, and partner vs stranger. These are WITHIN-subject condition contrasts, but the
# phrase "between-group contrasts" invites rejection. Since the corpus is healthy-participants-
# only by the paper's own inclusion rule, a genuine participant-group contrast is rare here and
# a target contrast is common. v4 names the distinction explicitly. This is the same
# sample-versus-contrast conflation that had to be fixed in executive_function v2.
#
# WHAT CHANGED, ITEMISED
#
#  - GLOBAL_E4 removed (pure harm, 10-0).
#  - GLOBAL_E3 rewritten to distinguish participant groups from social targets/conditions.
#  - GLOBAL_I3 kept in intent but no longer demands construct "isolation"; it now only blocks
#    inclusion justified solely by the paper being broadly social.
#  - GLOBAL_I4 reframed so an uninformative analysis name is never itself grounds for exclusion.
#  - GLOBAL_I5 replaced with a quantified dual-annotation expectation, capped at two labels.
#  - Every per-construct criterion re-grounded in the task families the paper actually lists,
#    with its concrete examples, replacing the abstract "must isolate X at contrast level".
#  - SOCIAL_COMMUNICATION_E1 removed; AFFILIATION_ATTACHMENT_E1 narrowed (the paper includes
#    cooperation-versus-competition and social-comparison tasks that v3's wording excluded).
#  - SOCIAL_PROCESSING_ALL_E1 removed and I2 softened, without touching what makes the umbrella
#    work -- it is at precision 1.000 and the only headroom there is recall.
#
# RISK
#
# This trades precision for recall deliberately and broadly. perception_others is the one
# construct already precision-limited (0.615 with 102 FPs), and widening it may cost more than
# it gains; if v4's perception_others precision falls below ~0.50 without a recall gain, that
# construct should be reverted to v3 wording independently of the other three. The
# dual-annotation instruction is the main precision risk overall, since it explicitly asks for
# more labels per analysis. Watch that the umbrella's precision (1.000 in v3) survives.

search:
  pmids_file: "/home/zorro/repos/autonima-results/projects/social/validation_ids/official.txt"

retrieval:
  load_excluded: true
  sources:
    - pubget
  full_text_sources:
    - root_path: "/home/zorro/repos/autonima-results/articles/elsevier_output/"
      pmid_source: "folder_name"
      text_path_templates:
        - 'text.txt'
      coordinates_path_templates:
        - 'coordinates.json'
    - root_path: "/home/zorro/repos/autonima-results/articles/ace_outputs"
      pmid_source: "file_name"
      allowed_extensions: [".html"]
      processed_data_path: "/home/zorro/repos/autonima-results/articles/ace_outputs/processed/"

screening:
  abstract:
    skip_stage: true
  fulltext:
    skip_stage: true

parsing:
  parse_coordinates: true
  coordinate_model: "gpt-5-mini-2025-08-07"

annotation:
  enabled: true
  model: "gpt-5-mini-2025-08-07"
  create_all_included_annotations: true
  prompt_type: "multi_analysis"
  metadata_fields:
    - "analysis_name"
    - "analysis_description"
    - "table_caption"
    - "study_title"
    - "study_fulltext"

  inclusion_criteria:
    - >-
      Sample- The analysis must be on healthy adult participants (alone, or a healthy/control
      subgroup reported separately from clinical or special groups).
    - >-
      Whole-brain evidence- The analysis must come from a group-level, univariate whole-brain
      (voxelwise) task-evoked statistical map, such as a main effect or a within-group contrast.
    - >-
      Judge the analysis, not the paper- decide from THIS analysis's name, description and table
      caption. That the paper is broadly social is not by itself a reason to assign a construct.
      You do NOT, however, need the contrast to isolate a construct in a pure or exclusive way-
      a contrast that engages a construct as part of a richer social task still counts.
    - >-
      How to read a sparse label- an empty or generic analysis name (e.g. "analysis_0") usually
      means the analysis is the only one in its table, so the caption describes it fully. Judge
      from the caption and surrounding full text. A blank or uninformative name is never itself
      a reason to exclude.
    - >-
      Assign every construct that applies, not just the best one- this benchmark's contrasts
      carry on average 1.34 construct labels each, and roughly 29% carry exactly two. After
      choosing the construct that fits best, explicitly check each of the other three and add
      any that the contrast also engages. Common genuine pairings, in descending frequency-
      perception_self with perception_others; social_communication with perception_others;
      affiliation_attachment with social_communication; social_communication with
      perception_self; affiliation_attachment with perception_others. Assign AT MOST two of the
      four constructs- no contrast in this benchmark required three or more.
  exclusion_criteria:
    - "Region-of-interest (ROI) or small-volume-corrected analyses."
    - >-
      Seed-based connectivity, effective connectivity (e.g. PPI, DCM) or resting-state analyses
      (e.g. ICA, PLE, Hurst exponents), unless a separate qualifying univariate task-evoked map
      is explicitly the analyzed row.
    - >-
      Contrasts between two GROUPS OF PARTICIPANTS (e.g. patients vs controls, men vs women,
      high- vs low-trait groups) or a group x condition interaction. This is about who is being
      compared, NOT about what is depicted- a within-subject contrast between social targets or
      conditions (self vs other, close other vs stranger, partner vs stranger, friend vs
      celebrity) is eligible and is in fact the standard design in this literature.

  annotations:
    - name: "social_processing_all"
      description: "Social Processing encompasses processes that enable individuals to perceive, interpret, and respond to social information, including social cues, emotions, social interaction, and social bonds."
      inclusion_criteria:
        - >-
          The analysis comes from a task involving social stimuli, social judgements or social
          interaction- this includes faces and facial expressions, voices and speech directed at
          or between people, gaze, gesture and imitation, self- and other-referential judgement,
          mentalizing and empathy, biological motion and action observation, and social
          exchange or bonding paradigms.
        - >-
          The contrast reflects some aspect of that social task rather than a purely perceptual,
          motor or physiological control effect.

    - name: "affiliation_attachment"
      description: "Affiliation and Attachment involves social bonding, closeness, affiliative valuation, and relationship-oriented social processing (attachment, bonding, closeness, kinship relevance, social comparison)."
      inclusion_criteria:
        - >-
          The contrast engages social bonding, closeness, affiliative value or relationship
          relevance. Task families the source paper places here- cooperation versus competition
          tasks; kinship or affiliative scenarios (situations involving mother, father, spouse
          or offspring versus non-affiliative or neutral ones); social comparison tasks
          (describing a close other such as a romantic partner versus a non-close other such as
          a roommate); perspective-taking toward a loved one versus a stranger; social
          acceptance or rejection by a specific person; and economic exchange where the
          relationship to the other player is the manipulated variable (e.g. dividing money
          between oneself and people who previously included or excluded one).
        - >-
          Relationship closeness or affiliative value must be part of what the contrast varies-
          not merely that another person is present.
      exclusion_criteria:
        - >-
          Contrasts about deception or aggression where no bond, closeness or relationship
          dimension is manipulated. Note that competition and social-exchange paradigms are NOT
          excluded here- the source paper places cooperation-versus-competition and
          money-division tasks within this construct.

    - name: "social_communication"
      description: "Social Communication involves the exchange of socially relevant information through receptive and expressive signals: facial expression, gaze, prosody, speech, gesture and imitation."
      inclusion_criteria:
        - >-
          The contrast involves a communicative social signal, whether the participant is
          receiving or producing it. Task families the source paper places here- viewing
          pictures of faces (including face versus object or face versus non-face contrasts);
          emotional expression tasks such as judging happy, sad, angry or neutral faces;
          auditory social stimuli such as communicative versus non-communicative sounds, speech
          and prosody; direct versus averted gaze; and observing or mimicking hand movements and
          gestures.
        - >-
          Simple face viewing and facial-expression contrasts DO qualify. The source paper's
          most common Social Communication task is viewing pictures of faces, so do not require
          an explicit communicative-intent manipulation on top of the facial signal.

    - name: "perception_self"
      description: "Perception and Understanding of Self includes awareness, judgements and representations about oneself, including self-knowledge, self-evaluation, agency and bodily self."
      inclusion_criteria:
        - >-
          The contrast engages self-referential processing, self-knowledge, self-evaluation,
          agency or the bodily self. Task families the source paper places here- self versus
          other contrasts; self-judgements about personality-trait words ("does this adjective
          describe you?"); rating one's own emotional reaction to a stimulus; judging whether a
          picture or social role personally relates to oneself; imagining an event happening to
          oneself; viewing pictures of oneself; endorsing another's evaluation of oneself; and
          affective or social touch delivered to the participant (e.g. gentle brush strokes to
          the arm or palm).
        - >-
          The self side of a self-versus-other contrast is sufficient- the contrast does not
          need to be exclusively about the self. Note that self-versus-other is a within-subject
          condition contrast, not a between-group contrast.

    - name: "perception_others"
      description: "Perception and Understanding of Others includes representations and inferences about other people's mental states, intentions, emotions, traits and actions."
      inclusion_criteria:
        - >-
          The contrast engages perceiving, representing or reasoning about another person.
          Task families the source paper places here- Theory of Mind and mental-state inference
          (including inferring the mental states of characters in a film); empathy tasks;
          compassion ratings; judging another person's traits; observing an action being
          performed by another; imitation; and point-light biological motion (e.g. a coherent
          versus a scrambled walker).
        - >-
          Explicit mentalizing is NOT required. Action observation, imitation and biological
          motion qualify on the source paper's own accounting even though no mental-state
          inference is demanded of the participant.
      exclusion_criteria:
        - >-
          Contrasts about object identity, or about the physical properties of a stimulus, where
          no other person is represented at all.

output:
  formats:
    - csv
  nimads: true
  export_excluded_studies: true
