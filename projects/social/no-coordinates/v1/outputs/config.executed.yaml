search:
  database: pubmed
  query: ( ('functional MRI'[Title/Abstract] OR 'functional magnetic resonance imaging'[Title/Abstract]
    OR 'fMRI'[Title/Abstract] ) AND ( 'social communication'[Title/Abstract] OR 'social
    processing'[Title/Abstract] OR 'social interaction'[Title/Abstract] OR 'affiliation'[Title/Abstract]
    OR 'social attachment'[Title/Abstract] OR 'social cognition'[Title/Abstract] OR
    'understanding others'[Title/Abstract] ) AND 'Humans'[MeSH])
  max_results: 5000
  date_from: 1995/01/01
  date_to: 2020/03/01
  email: delavega@utexas.edu
  pmids_file: null
  pmids_list: null
screening:
  abstract:
    model: gpt-5-mini-2025-08-07
    threshold: null
    confidence_reporting: true
    objective: Identify fMRI studies of social related processing in healthy adults
    inclusion_criteria:
    - &id001
      functional MRI scan while a human was completing a social-related task, including but not only the following constructs: Affiliation
        and Attachment, Social Communication, Perception and Understanding of Self,
        and Perception and Understanding of Others
    - at least 1 group of healthy participants, age 17-65, even if other groups have
      psychiatric and/or neurological disorders
    exclusion_criteria:
    - systematic reviews or meta-analyses
    additional_instructions: null
    criteria_mapping:
      inclusion:
        I1: *id001
        I2: at least 1 group of healthy participants, age 17-65, even if other groups
          have psychiatric and/or neurological disorders
      exclusion:
        E1: systematic reviews or meta-analyses
  fulltext:
    model: gpt-5-mini-2025-08-07
    threshold: null
    confidence_reporting: true
    objective: Identify fMRI studies of social related processing in healthy adults
    inclusion_criteria:
    - &id002
      functional MRI scan while a human was completing a social-related task, including but not only following constructs: Affiliation
        and Attachment, Social Communication, Perception and Understanding of Self,
        and Perception and Understanding of Others
    - at least 1 group of healthy participants, age 17-65, even if other groups have
      psychiatric and/or neurological disorders, as long as results for healthy participants
      are reported separately
    - the previous results must be whole-brain analyses (not only region of interest
      analyses). If both whole-brain and ROI analyses are reported, the study is included.
    exclusion_criteria:
    - only region of interest (ROI) analyses are reported
    - only reporting results among participants with psychiatric and/or neurological
      disorders, or comparing such participants to healthy controls
    additional_instructions: null
    criteria_mapping:
      inclusion:
        I3: *id002
        I4: at least 1 group of healthy participants, age 17-65, even if other groups
          have psychiatric and/or neurological disorders, as long as results for healthy
          participants are reported separately
        I5: the previous results must be whole-brain analyses (not only region of
          interest analyses). If both whole-brain and ROI analyses are reported, the
          study is included.
      exclusion:
        E2: only region of interest (ROI) analyses are reported
        E3: only reporting results among participants with psychiatric and/or neurological
          disorders, or comparing such participants to healthy controls
retrieval:
  sources:
  - pubget
  - ace
  timeout: 30
  max_retries: 3
  download_directory: downloads
  n_jobs: 1
  load_excluded: false
  full_text_sources: []
  parse_coordinates: false
  coordinate_model: gpt-4o-mini
parsing:
  parse_coordinates: false
  coordinate_model: gpt-4o-mini
annotation:
  model: gpt-4o-mini
  create_all_included_annotations: true
  metadata_fields:
  - analysis_name
  - analysis_description
  - table_caption
  - study_title
  - study_fulltext
  prompt_type: multi_analysis
  inclusion_criteria: []
  exclusion_criteria: []
  annotations: []
  enabled: true
output:
  directory: /home/zorro/repos/autonima-results/projects/social/no-coordinates/v1
  prisma_diagram: true
  formats:
  - csv
  - json
  - pdf
  nimads: false
  export_excluded_studies: false
