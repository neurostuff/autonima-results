# v4 -- AUTOMATICALLY GENERATED by Claude (Opus 5) on 2026-11-03.
#
# PROVENANCE, STATED PLAINLY
#
# Written by an LLM agent, not a human expert. No human domain expert reviewed these criteria
# before the run. It is tuned against the benchmark and must be reported as an ITERATED version,
# never as held-out.
#
# Its inputs were, specifically:
#   - v3/evaluation/performance_metrics.json (regenerated 2026-11-03)
#   - v3/reports/qualitative/false_positives_fulltext.html  (323 papers)
#   - v3/reports/qualitative/false_negatives_fulltext.html  (1 paper)
#   - v3/reports/qualitative/false_negatives_abstract.html  (1 paper)
#   - v3/outputs/fulltext_screening_results.json, read directly so that all 323 false positives
#     could be cross-tabulated against all 221 true positives rather than sampled by eye
#   - the source paper's stated criteria as recorded in the benchmark's own registry,
#     ../neurometabench/data/meta_datasets.csv, row pmid=36436737 (Pintos Lobo et al. 2022)
#
# READ THIS FIRST: THIS IS A DELIBERATE NEAR-NULL EDIT
#
# The honest finding from v3's reports is that v3's full-text criteria have NO well-evidenced
# systematic defect. This file exists so that social contributes to the tuned-versus-untuned
# contrast at all, and it carries two small, specifically evidenced changes. A null or negative
# result here is the expected outcome and must be reported as such, not worked around. Do not let
# the existence of a v4 imply that a defect was found.
#
# WHAT IS UNCHANGED -- AND WHY THIS RUN IS CHEAP
#
# search, retrieval, parsing, annotation and output are byte-identical to v3. ONLY
# `screening.fulltext` differs. Abstract screening is untouched, so search results and abstract
# decisions both come from cache; only full-text screening and the stages after it re-run.
# v3 -> v4 isolates full-text screening exactly.
#
# WHY PRECISION -- AND WHY NO LARGE PRECISION LEVER EXISTS
#
# v3's funnel, regenerated:
#
#     stage                 gold kept              precision   lost here
#     search                226 / 238  (0.950)      0.221       12 gold never retrieved
#     abstract              225 / 226  (0.996)      0.326        1 gold
#     fulltext              221 / 222  (0.996)      0.406        1 gold
#     fulltext_with_coords  147 / 222  (0.662)      0.457       74 more gold lost at parsing
#
# Full-text screening loses ONE paper out of 222. Recall is at ceiling; precision is the only
# thing a schema edit can move. (The project's real haemorrhage is the last line -- 74 correctly
# included gold papers yield no parsed coordinates -- but that is parsing, and editing `parsing`
# would stop v3 -> v4 from isolating criteria.)
#
# All 323 false positives were then cross-tabulated against all 221 true positives by the phrases
# in the model's own reasoning, looking for any class of paper enriched among the errors. Almost
# nothing separates them:
#
#     task type mentioned          true positives   false positives   enrichment
#     mentalizing / theory of mind     13.6%            13.9%            1.0x
#     face / emotion perception        11.3%            14.6%            1.3x
#     economic game / reward            3.2%             5.0%            1.6x
#     empathy for pain                  4.1%             1.9%            0.5x
#     emotion regulation                1.4%             0.9%            0.7x
#     clinical / patient group          5.0%            10.2%            2.0x
#     MVPA / RSA / searchlight          1.8%             5.3%            2.9x
#
# The two big categories are evenly split, so narrowing the construct list -- the obvious
# candidate, since v3's criteria say "include (but are not limited to)" -- would cut true
# positives at the same rate as false positives. That hypothesis was tested and rejected; it is
# recorded here so nobody re-runs it.
#
# Requiring reported coordinates, which is the change that works in dementia v4 and
# vbm_of_substance_use v3, was also tested and rejected for social: 45% of false positives never
# mention a coordinate, but so do 32% of true positives. Enforcing it would take precision to
# ~0.54 while dropping recall to ~0.68 -- a clear F1 loss. Do not add it here.
#
# CHANGE 1 (PRECISION): MULTIVARIATE MAPS ARE NOT ACTIVATION FOCI
#
# The one class with real enrichment, 2.9x, is multivariate pattern analysis. ALE pools
# univariate activation foci; a searchlight accuracy map or a representational-similarity map is
# not one. The model's own reasoning shows it being accepted:
#
#   "reports group-level, whole-brain voxelwise results (SEARCHLIGHT RSA and
#    REPETITION-SUPPRESSION voxelwise maps with permutation TFCE correction)"   -- PMID 30389840
#
# v3's annotation block already requires a "univariate whole-brain" map; its full-text block does
# not. ADDED there, so the two stages agree. This is 17 false positives against 4 true positives:
# expected precision 0.406 -> ~0.415. That is the whole size of the precision effect available.
#
# CHANGE 2 (RECALL): THE HARD AGE WINDOW CONTRADICTS THE BENCHMARK
#
# Pintos Lobo et al. state "healthy participants, age 18-60". v3 encoded 18-65 as a hard gate,
# and that gate is the cause of the project's ONLY full-text false negative:
#
#   "the younger group includes participants aged 17-27 (includes minors <18) and the older group
#    is 65-75 ... Therefore the study violates the age-range eligibility"   -- PMID 27716474,
#    which is IN the gold set.
#
# So the benchmark's own inclusions do not honour its stated age rule, and the rule as encoded is
# strictly worse than no rule. Narrowed to exclude only samples wholly outside adulthood, rather
# than any sample whose range crosses 18 or 65. Expected full-text recall 0.996 -> 1.000.
#
# A CAVEAT ON WHAT "PRECISION" MEANS HERE
#
# Sampling the 323 false positives shows healthy-adult social-task fMRI studies with group-level
# whole-brain maps and coordinate tables -- papers that look includable and that this ALE simply
# did not include. Pintos Lobo et al. kept 239 studies from one narrow query; our search returned
# 1024 and our own search recall is 0.950, so the pools overlap only partly. Treat social
# precision as a FLOOR rather than a measurement.
#
# RISK
#
# Change 1 could reject a gold paper that ran a searchlight analysis ALONGSIDE a conventional
# univariate contrast, if the screener reads the multivariate analysis as the paper's only
# whole-brain result; the criterion is therefore worded as "only ... without also reporting".
# Change 2 only loosens, so it cannot cost recall, but it can cost precision by admitting
# developmental and ageing cohorts. If v4's full-text precision falls below v3's 0.406 while
# recall stays at 0.996, change 2 is the cause and the age wording should be put back.
# Watch the fulltext stage of v4/evaluation/performance_metrics.json for both.
#
# ---------------------------------------------------------------------------------------------
# Inherited from v3 -- social's canonical search-driven run.
#
# Same criteria and the same annotation mode as v3-allstudies and v3-annotation-only. Only the
# search block differs, which is what a suffix denotes here. This is social's first arm whose
# pool comes from its query alone, with no curated PMIDs injected.
#
# WHY THIS FILE EXISTS. Social previously had no clean search-driven arm. Its v3-search-* arms set
# BOTH a query and a pmids_file, and autonima UNIONS the two rather than preferring one
# (search/pubmed.py: `pmids +=` the search hits, then `pmids +=` the file; the docstring at
# pubmed.py:51 claiming the query is ignored is stale). So those arms screened their query hits
# PLUS the 486-PMID curated pool, which contains every gold study by construction:
# v3-search-all_pmids-multi_analysis-ft screened 1063 unique studies (query 1023 + 485 screened
# pool members, 445 in both) -- and screened those 445 TWICE, 1508 records in all, since the
# concatenated list is never deduped. The injected pool lifted its gold coverage from 0.952 -- what the query reaches
# on its own, 219/230 -- to 1.000, handing it 11 gold studies its search would have missed. The
# bias is modest but real: a search arm that cannot fail to retrieve gold overstates recall, and no
# social run measured search in isolation. This file is that measurement.
#
# v2 is not a substitute either: it lacks study_fulltext in annotation metadata_fields. Two things
# that are NOT differences, contrary to an earlier note here: prompt_type unset defaults to
# multi_analysis, and include_all_analyses is the deprecated spelling of
# create_all_included_annotations, which defaults to true. With those two removed, v2's screening
# AND annotation criteria are byte-identical to v3-allstudies' -- so under the naming convention
# (version tracks criteria, suffix tracks everything else) v2 and the v3 family are one criteria
# generation, and v2's separate number is itself a convention violation. Left as-is for now: v2 is
# already run and reported, and renaming it would churn every table that cites it.
#
# The query is taken verbatim from v3-search-all_pmids-multi_analysis-ft, the run the
# cross-project overrides previously pointed at.

search:
  database: "pubmed"
  query: "( ('functional MRI'[Title/Abstract] OR 'functional magnetic resonance imaging'[Title/Abstract] OR 'fMRI'[Title/Abstract] ) AND ( 'social communication'[Title/Abstract] OR 'social processing'[Title/Abstract] OR 'social interaction'[Title/Abstract] OR 'affiliation'[Title/Abstract] OR 'social attachment'[Title/Abstract] OR 'social cognition'[Title/Abstract] OR 'understanding others'[Title/Abstract] ) AND 'Humans'[MeSH])"
  date_from: "1995/01/01"
  date_to: "2020/03/01"
  max_results: 5000
  email: "delavega@utexas.edu"

retrieval:
  load_excluded: true
  sources:
    - pubget
  full_text_sources:
    - root_path: "articles/elsevier_output/"
      pmid_source: "folder_name"
      text_path_templates:
        - 'text.txt'
      coordinates_path_templates:
        - 'coordinates.json'
    - root_path: "articles/ace_outputs/"
      pmid_source: "file_name"
      allowed_extensions: [".html"]
      processed_data_path: "articles/ace_outputs/processed/"
      
screening:
  objective: "Identify fMRI studies of social related processing in healthy adults"
  abstract:
    model: "gpt-5-mini-2025-08-07"
    objective: "Identify fMRI studies of social related processing in healthy adults"
    inclusion_criteria:
      - Functional MRI scan conducted while human participants performed a social-related task. Relevant constructs include (but are not limited to) Affiliation and Attachment, Social Communication, Perception and Understanding of Self, and Perception and Understanding of Others.
      - At least one group of healthy participants, age 18–65, even if other groups include participants with psychiatric or neurological disorders.
    exclusion_criteria:
      - systematic reviews or meta-analyses
    confidence_reporting: true

  fulltext:
    model: "gpt-5-mini-2025-08-07"
    confidence_reporting: true
    objective: "Identify fMRI studies of social related processing in healthy adults"
    inclusion_criteria:
      - Study uses functional MRI during a social-related task. Relevant constructs include (but are not limited to)- Affiliation and Attachment, Social Communication, Perception and Understanding of Self, and Perception and Understanding of Others.
      - Sample- At least one group of healthy adult participants (age 18–65). Studies that also include clinical or special groups are eligible only if results for the healthy group are reported separately.
      - Whole-brain evidence- The paper must report at least one group-level, whole-brain (voxelwise) task-evoked statistical map (e.g., main effect or within-group contrast) that is clearly identified as coming from the healthy/control group (i.e., not limited to a narrowly defined subgroup).
      - It is acceptable for qualifying whole-brain results to be reported in tables of coordinates, figures, or supplementary materials, as long as they are clearly described in the text.
    exclusion_criteria:
      - Studies that report only region-of-interest (ROI) analyses with no whole-brain results.
      - Studies that report only seed-based connectivity, effective connectivity (e.g., PPI, DCM), or resting-state analyses (e.g., ICA, PLE, Hurst exponents) without also reporting a healthy-group whole-brain task activation map.
      - Studies that report only between-group contrasts or interactions (e.g., subgroup vs subgroup, patient vs control) without an accompanying unmasked, whole-brain healthy-group task effect.
      - >-
        Studies whose sample is wholly outside adulthood- exclusively children or adolescents
        studied for development, or exclusively a geriatric cohort studied for ageing, with no
        adult group analyzed and reported separately. Do NOT exclude an adult sample merely
        because its reported age range extends a little past 18 or past 65 (e.g. "aged 17-27" or
        "aged 22-70"); the benchmark itself includes such samples.
      - >-
        Studies whose only whole-brain healthy-group result is a MULTIVARIATE map- searchlight
        MVPA, classification-accuracy maps, representational similarity analysis, or
        repetition-suppression pattern maps -- without also reporting a univariate, group-level
        task-evoked activation contrast. This benchmark pools univariate activation foci.
      - Non-empirical papers (e.g., reviews, meta-analyses, methods-only, simulations) without original fMRI data in healthy adults.

parsing:
  parse_coordinates: true  # Enable coordinate parsing for studies with activation tables
  coordinate_model: "gpt-5-mini-2025-08-07"  # Model to use for coordinate parsing

annotation:
  enabled: true
  model: "gpt-5-mini-2025-08-07"
  create_all_included_annotations: true
  metadata_fields:
    - "analysis_name"
    - "analysis_description"
    - "table_caption"
    - "study_title"
    - "study_abstract"
    - "study_fulltext"
  prompt_type: "multi_analysis"
  inclusion_criteria:
    - Sample- The analysis must be on a healthy adult participants (alone, not a clinical or special group, or a comparison between healthy and clinical/special groups).
    - Whole-brain evidence- The analysis must be from a group-level, univariate whole-brain (voxelwise) task-evoked statistical map (e.g., main effect or within-group contrast) that is from the healthy/control group and is generalizable to the healthy adult population.
  exclusion_criteria:
    - Region-of-interest (ROI) analyses
    - Seed-based connectivity, effective connectivity (e.g., PPI, DCM), or resting-state analyses (e.g., ICA, PLE, Hurst exponents) 
    - Between-group contrasts or interactions (e.g., subgroup vs subgroup, patient vs control)
  annotations:
    - name: "social_processing_all"
      description: "Social Processing encompasses a broad range of processes that enable individuals to perceive, interpret, and respond to social information. This includes understanding social cues, recognizing emotions in others, engaging in social interactions, and forming social bonds. Social processing is fundamental to human behavior and is crucial for effective communication and relationship-building."
      inclusion_criteria:
        - Analyses performed a social-related task. Relevant constructs include (but are not limited to) Affiliation and Attachment, Social Communication, Perception and Understanding of Self, and Perception and Understanding of Others.
        - "The analysis/contrast must measure Social Processing"
    - name: "affiliation_attachment"
      description: "Affiliation and Attachment is characterized by positive interactions and social bonds, and typically involves the detection of and attention to social cues, as well as social learning associated with the formation of relationships. Assessment measures generally relate to attachment styles, close relationship scales, and parental and peer bonding."
      inclusion_criteria:
        - "Analyses must be on a task measuring affiliation and attachment (example tasks: Kinship-related social scenarios; Cooperation and competition; Social comparison)"
        - "The analysis/contrast must measure Affiliation and Attachment (example contrast: Loved one vs Stranger)"
    - name: "social_communication"
      description: "Social Communication involves the exchange of socially relevant information and involves both receptive (e.g., affect recognition, facial recognition, and characterization) and productive (e.g., eye contact, expressive reciprocation, gaze following) aspects of communication. Within this construct, there exist four subconstructs: (i) Reception of Facial Communication, (ii) Production of Facial Communication, (iii) Reception of Non-Facial Communication, and (iv) Production of Non-Facial Communication. "
      inclusion_criteria:
        - "Analyses from tasks measuring Social Communication (example tasks: Kinship-related social scenarios; Cooperation and competition; Social comparison)"
        - "The analysis/contrast must measure Social Communication (example contrast: Loved one vs Stranger)"
    - name: "perception_self"
      description: "Perception and Understanding of Self includes processes involved in being aware of, accessing knowledge, or making judgments about the self, and can include current cognitive or emotional internal states, traits, and/or abilities, as well as mechanisms that support self-awareness, self-monitoring, and self-knowledge. Within this construct, there exist two subconstructs: (i) Agency and (ii) Self-knowledge. "
      inclusion_criteria:
        - "Analyses from tasks measuring Perception and Understanding of Self (example tasks: Kinship-related social scenarios; Cooperation and competition; Social comparison)"
        - "The analysis/contrast must measure Perception and Understanding of Self (example contrast: Loved one vs Stranger)"
    - name: "perception_others"
      description: "Perception and Understanding of Others are the representations involved in being aware of, assessing knowledge about, and reasoning about others’ emotional states, traits, or abilities. Among this construct exist three subconstructs: (i) Animacy Perception, (ii) Action Perception, and (iii) Understanding Mental States."
      inclusion_criteria:
        - "Analyses from tasks measuring Perception and Understanding of Others (example tasks: Kinship-related social scenarios; Cooperation and competition; Social comparison)"
        - "The analysis/contrast must measure Perception and Understanding of Others (example contrast: Loved one vs Stranger)"

output:
  formats:
    - csv
  nimads: true
  export_excluded_studies: true