  parse_coordinates: false
  coordinate_model: gpt-4o-mini
parsing:
  parse_coordinates: true
  coordinate_model: gpt-5-mini-2025-08-07
annotation:
  model: gpt-5-mini-2025-08-07
  create_all_included_annotations: true
  metadata_fields:
  - analysis_name
  - analysis_description
  - table_caption
  - study_title
  - study_fulltext
  prompt_type: multi_analysis
  inclusion_criteria:
  - Sample- The analysis must be on healthy adult participants (alone, or a healthy/control
    subgroup reported separately from clinical or special groups).
  - Whole-brain evidence- The analysis must come from a group-level, univariate whole-brain
    (voxelwise) task-evoked statistical map, such as a main effect or a within-group
    contrast.
  - Judge the analysis, not the paper- decide from THIS analysis's name, description
    and table caption. That the paper is broadly social is not by itself a reason
    to assign a construct. You do NOT, however, need the contrast to isolate a construct
    in a pure or exclusive way- a contrast that engages a construct as part of a richer
    social task still counts.
  - How to read a sparse label- an empty or generic analysis name (e.g. "analysis_0")
    usually means the analysis is the only one in its table, so the caption describes
    it fully. Judge from the caption and surrounding full text. A blank or uninformative
    name is never itself a reason to exclude.
  - Assign every construct that applies, not just the best one- this benchmark's contrasts
    carry on average 1.34 construct labels each, and roughly 29% carry exactly two.
    After choosing the construct that fits best, explicitly check each of the other
    three and add any that the contrast also engages. Common genuine pairings, in
    descending frequency- perception_self with perception_others; social_communication
    with perception_others; affiliation_attachment with social_communication; social_communication
    with perception_self; affiliation_attachment with perception_others. Assign AT
    MOST two of the four constructs- no contrast in this benchmark required three
    or more.
  exclusion_criteria:
  - Region-of-interest (ROI) or small-volume-corrected analyses.
  - Seed-based connectivity, effective connectivity (e.g. PPI, DCM) or resting-state
    analyses (e.g. ICA, PLE, Hurst exponents), unless a separate qualifying univariate
    task-evoked map is explicitly the analyzed row.
  - Contrasts between two GROUPS OF PARTICIPANTS (e.g. patients vs controls, men vs
    women, high- vs low-trait groups) or a group x condition interaction. This is
    about who is being compared, NOT about what is depicted- a within-subject contrast
    between social targets or conditions (self vs other, close other vs stranger,
    partner vs stranger, friend vs celebrity) is eligible and is in fact the standard
    design in this literature.
  annotations:
  - name: social_processing_all
    description: Social Processing encompasses processes that enable individuals to
      perceive, interpret, and respond to social information, including social cues,
      emotions, social interaction, and social bonds.
    inclusion_criteria:
    - The analysis comes from a task involving social stimuli, social judgements or
      social interaction- this includes faces and facial expressions, voices and speech
      directed at or between people, gaze, gesture and imitation, self- and other-referential
      judgement, mentalizing and empathy, biological motion and action observation,
      and social exchange or bonding paradigms.
    - The contrast reflects some aspect of that social task rather than a purely perceptual,
      motor or physiological control effect.
    exclusion_criteria: []
  - name: affiliation_attachment
    description: Affiliation and Attachment involves social bonding, closeness, affiliative
      valuation, and relationship-oriented social processing (attachment, bonding,
      closeness, kinship relevance, social comparison).
    inclusion_criteria:
    - The contrast engages social bonding, closeness, affiliative value or relationship
      relevance. Task families the source paper places here- cooperation versus competition
      tasks; kinship or affiliative scenarios (situations involving mother, father,
      spouse or offspring versus non-affiliative or neutral ones); social comparison
      tasks (describing a close other such as a romantic partner versus a non-close
      other such as a roommate); perspective-taking toward a loved one versus a stranger;
      social acceptance or rejection by a specific person; and economic exchange where
      the relationship to the other player is the manipulated variable (e.g. dividing
      money between oneself and people who previously included or excluded one).
    - Relationship closeness or affiliative value must be part of what the contrast
      varies- not merely that another person is present.
    exclusion_criteria:
    - Contrasts about deception or aggression where no bond, closeness or relationship
      dimension is manipulated. Note that competition and social-exchange paradigms
      are NOT excluded here- the source paper places cooperation-versus-competition
      and money-division tasks within this construct.
  - name: social_communication
    description: 'Social Communication involves the exchange of socially relevant
      information through receptive and expressive signals: facial expression, gaze,
      prosody, speech, gesture and imitation.'
    inclusion_criteria:
    - The contrast involves a communicative social signal, whether the participant
      is receiving or producing it. Task families the source paper places here- viewing
      pictures of faces (including face versus object or face versus non-face contrasts);
      emotional expression tasks such as judging happy, sad, angry or neutral faces;
      auditory social stimuli such as communicative versus non-communicative sounds,
      speech and prosody; direct versus averted gaze; and observing or mimicking hand
      movements and gestures.
    - Simple face viewing and facial-expression contrasts DO qualify. The source paper's
      most common Social Communication task is viewing pictures of faces, so do not
      require an explicit communicative-intent manipulation on top of the facial signal.
    exclusion_criteria: []
  - name: perception_self
    description: Perception and Understanding of Self includes awareness, judgements
      and representations about oneself, including self-knowledge, self-evaluation,
      agency and bodily self.
    inclusion_criteria:
    - The contrast engages self-referential processing, self-knowledge, self-evaluation,
      agency or the bodily self. Task families the source paper places here- self
      versus other contrasts; self-judgements about personality-trait words ("does
      this adjective describe you?"); rating one's own emotional reaction to a stimulus;
      judging whether a picture or social role personally relates to oneself; imagining
      an event happening to oneself; viewing pictures of oneself; endorsing another's
      evaluation of oneself; and affective or social touch delivered to the participant
      (e.g. gentle brush strokes to the arm or palm).
    - The self side of a self-versus-other contrast is sufficient- the contrast does
      not need to be exclusively about the self. Note that self-versus-other is a
      within-subject condition contrast, not a between-group contrast.
    exclusion_criteria: []
  - name: perception_others
    description: Perception and Understanding of Others includes representations and
      inferences about other people's mental states, intentions, emotions, traits
      and actions.
    inclusion_criteria:
    - The contrast engages perceiving, representing or reasoning about another person.
      Task families the source paper places here- Theory of Mind and mental-state
      inference (including inferring the mental states of characters in a film); empathy
      tasks; compassion ratings; judging another person's traits; observing an action
      being performed by another; imitation; and point-light biological motion (e.g.
      a coherent versus a scrambled walker).
    - Explicit mentalizing is NOT required. Action observation, imitation and biological
      motion qualify on the source paper's own accounting even though no mental-state
      inference is demanded of the participant.
    exclusion_criteria:
    - Contrasts about object identity, or about the physical properties of a stimulus,
      where no other person is represented at all.
  enabled: true
