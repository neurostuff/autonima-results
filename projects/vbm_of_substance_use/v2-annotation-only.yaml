screening:
  abstract:
    model: "gpt-5-mini-2025-08-07" 
    objective: "identify consistent regions of structurally altered grey matter (GM) between substance users and controls across five pharmacological classes of drugs: alcohol, nicotine, opioids, cannabis, and stimulants."
    inclusion_criteria:
      - Empirical English language MRI studies assessing grey matter (GM) volume differences between substance users and controls
    exclusion_criteria:
      - Studies using pharmacological manipulations
      - Brain lesion studies
      - Studies including participants with reports of mental and/or neurological disorders
      - Systematic reviews or meta-analyses
    confidence_reporting: true

  fulltext:
    model: "gpt-5-mini-2025-08-07"
    confidence_reporting: true
    objective: "identify consistent regions of structurally altered grey matter (GM) between substance users and controls across five pharmacological classes of drugs: alcohol, nicotine, opioids, cannabis, and stimulants."
    inclusion_criteria:
      - Empirical English language MRI studies assessing grey matter (GM) volume differences (e.g., volume, density, or concentration) between substance users and controls
      - Whole-brain evidence- The paper must report at least one whole-brain between-group contrast of substance users vs controls comparing GM volume
      - It is acceptable for qualifying voxelwise results to be reported in tables of coordinates, figures, or supplementary materials when the main text clearly indicates those results are available.
      - Reporting of participant age/sex, substance use characteristics, MRI field strength, and preprocessing/statistical software is preferred; missing one or more of these details alone should not exclude an otherwise qualifying study.
    exclusion_criteria:
      - Studies that report only region-of-interest (ROI) analyses with no qualifying whole-brain results.
      - Non-empirical papers (e.g., reviews, meta-analyses, methods-only, simulations) without original human structural MRI data.

parsing:
  parse_coordinates: true
  coordinate_model: "gpt-5-mini-2025-08-07"

annotation:
  enabled: true
  model: "gpt-5-mini-2025-08-07"
  prompt_type: "multi_analysis"
  create_all_included_annotations: true
  metadata_fields:
    - "analysis_name"
    - "analysis_description"
    - "table_caption"
    - "study_title"
    - "study_abstract"
  inclusion_criteria:
    - Voxelwise whole-brain grey matter comparison between substance users and controls, with a users < controls contrast indicating reduced grey matter in substance users.
    - Must be a voxelwise whole brain analysis of grey matter volume
    - Multiple experiments from the same article may be included only when they share the same control group but involve non-overlapping substance-user groups. For example, moderate smoker<control, and separately severe smoker<control include two different samples of cigarette smokers. 
  exclusion_criteria:
    - Region of interest (ROI) or small volume correction (SVC) analyses 
    - Analyses other than substance users < controls (e.g., user > control contrasts)
    - Analyses of other modalities (e.g., functional MRI, diffusion tensor imaging) or other structural measures 
  annotations:
    - name: all_drug_classes
      description: convergent lower GM common across all substances
      inclusion_criteria:
        - Comparison of drug users of any class to controls
    - name: alcohol
      description: lower GM in alcohol users relative to controls
      inclusion_criteria:
        - Comparison of alcohol users to controls
      exclusion_criteria:
        - Comparison of users of other drug classes to controls
    - name: nicotine
      description: lower GM in nicotine users relative to controls
      inclusion_criteria:
        - Comparison of nicotine users to controls
      exclusion_criteria:
        - Comparison of users of other drug classes to controls
    - name: opioids
      description: lower GM in opioid users relative to controls
      inclusion_criteria:
        - Comparison of opioid users to controls
      exclusion_criteria:
        - Comparison of users of other drug classes to controls
    - name: stimulants
      description: lower GM in stimulant users relative to controls
      inclusion_criteria:
        - Comparison of stimulant users to controls
      exclusion_criteria:
        - Comparison of users of other drug classes to controls
    - name: cannabis
      description: lower GM in cannabis users relative to controls
      inclusion_criteria:
        - Comparison of cannabis users to controls
      exclusion_criteria:
        - Comparison of users of other drug classes to controls

output:
  formats:
    - csv
  nimads: true
  export_excluded_studies: true
