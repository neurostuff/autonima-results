# v3 -- AUTOMATICALLY GENERATED by Claude (Opus 5) on 2026-11-03.
#
# PROVENANCE, STATED PLAINLY
#
# Written by an LLM agent, not a human expert. No human domain expert reviewed these criteria
# before the run. It is tuned against the benchmark and must be reported as an ITERATED version,
# never as held-out.
#
# Its inputs were, specifically:
#   - v2/evaluation/performance_metrics.json, REGENERATED on 2026-11-03 (see below)
#   - v2/reports/qualitative/false_positives_fulltext.html  (82 papers)
#   - v2/reports/qualitative/false_negatives_fulltext.html  (2 papers)
#   - v2/reports/qualitative/false_negatives_abstract.html  (4 papers)
#   - v2/outputs/fulltext_screening_results.json, read directly so that all 82 false positives
#     could be cross-tabulated against all 63 true positives rather than sampled by eye
#   - the source paper's stated criteria as recorded in the benchmark's own registry,
#     ../neurometabench/data/meta_datasets.csv, row pmid=36115222 (Hill-Bowen et al. 2022)
#
# THE COMMITTED v2 METRICS WERE STALE AND WERE NOT USED
#
# projects/vbm_of_substance_use/v2/evaluation/performance_metrics.json as committed contains ONLY
# a search stage. Every number quoted below comes from a regeneration run on 2026-11-03 against
# ../neurometabench/data/included_studies.csv. Anyone comparing v3 to v2 must regenerate v2's
# metrics too.
#
# WHAT IS UNCHANGED
#
# search, retrieval, parsing, annotation and output are byte-identical to v2. This version bumps
# TWO criteria blocks, not one: `screening.abstract` AND `screening.fulltext`. Because abstract
# screening changes, abstract decisions do NOT come from cache and this run is more expensive
# than a fulltext-only bump. The reason is given under CHANGE A: abstract recall is the one place
# in this project where recall is not at ceiling, and the cause is identified exactly.
#
# WHERE THIS PROJECT ACTUALLY LOSES
#
# v2's funnel, regenerated:
#
#     stage                 gold kept             precision   lost here
#     search                 71 / 79  (0.899)      0.110       8 gold never retrieved
#     abstract               67 / 71  (0.944)      0.258       4 gold
#     fulltext               63 / 65  (0.969)      0.435       2 gold
#     fulltext_with_coords   55 / 65  (0.846)      0.655       8 more gold lost at parsing
#
# Abstract recall, 0.944, is the lowest screening recall of the four projects revised in this
# pass, and all four of its losses are attributable. Full-text recall is 0.969 and its two losses
# are also attributable. Full-text precision, 0.435 against 82 false positives, is the largest
# single quantity a criteria edit can move. So: a recall edit at abstract, a precision edit at
# full text.
#
# THE OVERARCHING FINDING: THIS BENCHMARK DOES NOT HONOUR ITS OWN STATED EXCLUSIONS
#
# Hill-Bowen et al. state three exclusions: "presence of pharmacological manipulations, brain
# lesion studies, and studies including participants with reports of MENTAL AND/OR NEUROLOGICAL
# DISORDERS". v2 encodes the third at the abstract stage, and it is WRONG to do so -- the gold
# set contains studies it rejects. The same paper's stated inclusion is restricted to "GM volume
# differences" across "alcohol, nicotine, opiates, stimulants, cocaine, cannabis", and the gold
# set contains a cortical-thickness study and a betel-quid study. The corrective direction for
# this project is therefore LOOSER at abstract and TIGHTER at full text, which is the opposite of
# the pattern in the three sibling projects revised in the same pass.
#
# CHANGE A (RECALL, `screening.abstract`): THE DISORDER EXCLUSION COSTS GOLD
#
# Two of the four abstract false negatives were rejected by it, verbatim from the report:
#
#   "EXCLUDED because the sample includes participants diagnosed with ADHD, a psychiatric
#    (mental) disorder, thus meeting exclusion criterion E3"            -- PMID 23726981
#   "Exclusion E3 met: participants are described as having Antisocial Substance Dependence /
#    serious conduct problems (a psychiatric disorder)"                 -- PMID 21592680
#
# Both are IN the gold set. Substance-use cohorts are routinely comorbid, so an exclusion written
# this broadly removes the population the meta-analysis is about. NARROWED to exclude only samples
# where a psychiatric or neurological patient group, rather than substance use, is the grouping
# variable.
#
# The other two abstract false negatives were rejected on scope, and both are also in the gold:
#
#   "this MRI study reports CORTICAL THICKNESS (CT) differences rather than grey matter (GM)
#    volume, and the substance (ayahuasca/DMT, a psychedelic) is OUTSIDE the meta-analysis target
#    classes"                                                           -- PMID 25637267
#   "Study examines BETEL QUID (areca nut) users, which is not one of the five targeted drug
#    classes"                                                           -- PMID 28824470
#
# So the benchmark admits substances beyond the five its abstract names, and admits surface-based
# grey-matter measures. Both are now stated explicitly as qualifying. This also repairs the
# project's full-text false negative 24140937, rejected for the same cortical-thickness reason.
#
# CHANGE B (PRECISION, `screening.fulltext`): A NULL CONTRAST IS NOT A RESULT
#
# Hill-Bowen et al.'s stated inclusion (3) admits only "studies reporting FOCI as 3D coordinates
# (X, Y, Z) in Talairach or MNI stereotaxic space". v2's criteria ask only that a whole-brain
# contrast be PERFORMED and REPORTED. The model noticed the gap and said so out loud while
# admitting papers on it -- five of the first fifteen false positives:
#
#   "the null result is reported, WHICH STILL CONSTITUTES a reported whole-brain between-group
#    contrast"                                                          -- PMID 25278147
#   "Whole-brain contrasts were explicitly performed and reported (THOUGH NULL), satisfying the
#    requirement for whole-brain evidence"                              -- PMID 25632127
#   "the Results explicitly report VBM findings (NO STATISTICALLY SIGNIFICANT GM differences)"
#                                                                       -- PMID 26303184
#   "between-group comparison (stated as NON-SIGNIFICANT in highlighted regions)"
#                                                                       -- PMID 25678093
#   "a whole-brain VBM between-group contrast (stating NO SIGNIFICANT CLUSTERS on whole-brain
#    analysis) and ROI-corrected voxelwise results"                     -- PMID 27865039
#
# A null contrast contributes no foci and cannot enter an ALE. ADDED: the qualifying contrast must
# yield at least one significant cluster with reported peak coordinates.
#
# CHANGE C (PRECISION, `screening.fulltext`): ATLAS PARCELLATIONS AND CLASSIFIERS ARE NOT
# WHOLE-BRAIN MAPS
#
# The paper excludes ROI analyses explicitly, "as region of interest (ROI) analyses violate the
# ALE null-hypothesis that assumes equal activity across all brain regions". Several false
# positives are ROI analyses that call themselves whole-brain because the atlas covers the whole
# brain:
#
#   "whole-brain coverage via a 1,024-ROI PARCELLATION of the AAL atlas ... the primary analysis
#    is a MULTIVARIATE CLASSIFIER rather than a conventional univariate voxelwise t-contrast"
#                                                                       -- PMID 26497657
#   "whole-brain analyses using FreeSurfer cortical PARCELLATION (34 bilateral ROIs covering the
#    cortex) and lobar ROIs"                                            -- PMID 29084454
#
# ADDED as an exclusion, worded to catch per-atlas-label region averages and classifier maps while
# leaving voxel/vertexwise statistical maps alone.
#
# WHAT WAS DELIBERATELY NOT CHANGED, AND WHY
#
#   - CORTICAL THICKNESS IS NOT EXCLUDED, although it is 26% of false positives against 13% of
#     true positives and although the source paper's exclusions arguably reach it. Two gold
#     studies (24140937, 25637267) are cortical-thickness papers. Excluding it would trade two
#     gold studies for thirteen false positives and contradict the benchmark. The 2x enrichment
#     is recorded here so nobody re-runs the experiment.
#   - THE "MENTAL AND/OR NEUROLOGICAL DISORDERS" EXCLUSION IS NOT ADDED AT FULL TEXT. It already
#     costs two gold papers at abstract; adding it at a second stage would compound that.
#   - MASK-RESTRICTED VOXELWISE ANALYSES ARE NOT EXCLUDED. Gold study 21909705 is a SUIT
#     cerebellum-restricted VBM, rejected by v2 as ROI-only. Change C is therefore worded to catch
#     parcellation averages and classifiers, NOT voxelwise maps confined to an anatomical
#     sub-volume. This is the opposite of the choice made in dementia v4, and deliberately so --
#     the two benchmarks differ on this point.
#
# RISK
#
# The significance-and-coordinates requirement is the change that could cost recall. A gold paper
# whose coordinate table sits in a supplementary file we did not retrieve now looks to the
# screener like a paper with no foci. If v3's full-text recall_in_search drops below ~0.92 (60/65)
# the rule is being read too strictly and should be relaxed to exclude only contrasts the text
# EXPLICITLY describes as null or non-significant.
#
# The loosened abstract exclusion cuts the other way: it will admit more comorbid-psychiatric
# samples and more non-target substances, so abstract precision (0.258) should be expected to FALL
# and the full-text stage will see more papers. If abstract recall does not rise above 0.944 while
# abstract precision falls, change A bought nothing and should be reverted.
#
# Watch the abstract and fulltext stages of v3/evaluation/performance_metrics.json for both.

search:
  database: "pubmed"
  query: '(("voxel-based morphometr*"[tiab] OR VBM[tiab] OR "gray matter volum*"[tiab] OR "grey matter volum*"[tiab] OR "gray matter densit*"[tiab] OR "grey matter densit*"[tiab] OR "cortical thickness"[tiab] OR "gray matter reduc*"[tiab] OR "grey matter reduc*"[tiab] OR "gray matter abnormal*"[tiab] OR "grey matter abnormal*"[tiab] OR "reduced gray matter"[tiab] OR "reduced grey matter"[tiab] OR "tensor-based morphometr*"[tiab] OR "brain volumetric"[tiab] OR "brain morphometr*"[tiab]) AND ("Substance-Related Disorders"[Mesh] OR addiction[tiab] OR addict*[tiab] OR "substance use"[tiab] OR "substance abuse"[tiab] OR alcoholism[tiab] OR "alcohol depend*"[tiab] OR "alcohol use disorder*"[tiab] OR "alcohol abuse"[tiab] OR smoker*[tiab] OR "nicotine depend*"[tiab] OR "cannabis use"[tiab] OR "cannabis depend*"[tiab] OR "marijuana use"[tiab] OR "cocaine depend*"[tiab] OR "cocaine use"[tiab] OR "methamphetamine depend*"[tiab] OR "heroin depend*"[tiab] OR "opioid use disorder*"[tiab] OR "betel quid"[tiab] OR psychedelic*[tiab] OR stimulant*[tiab] OR amphetamine*[tiab])) NOT (Editorial[pt] OR Letter[pt] OR Comment[pt] OR "Case Reports"[pt] OR News[pt])'
  email: "delavega@utexas.edu"
  date_to: "2019/7/31"

retrieval:
  load_excluded: true
  sources:
    - pubget
  full_text_sources:
    - root_path: "articles/elsevier_output/"
      pmid_source: "folder_name"
      text_path_templates:
        - 'text.txt'
      coordinates_path_templates:
        - 'coordinates.json'
    - root_path: "articles/ace_outputs"
      pmid_source: "file_name"
      allowed_extensions: [".html"]
      processed_data_path: "articles/ace_outputs/processed/"

screening:
  abstract:
    model: "gpt-5-mini-2025-08-07" 
    objective: "identify consistent regions of structurally altered grey matter (GM) between substance users and controls across five pharmacological classes of drugs: alcohol, nicotine, opioids, cannabis, and stimulants."
    inclusion_criteria:
      - Empirical English language MRI studies assessing grey matter (GM) volume differences between substance users and controls
      - >-
        Any grey-matter structural measure qualifies- GM volume, GM density, GM concentration, and
        also surface-based measures such as cortical thickness or cortical volume. Do not exclude a
        study because its grey-matter measure is cortical thickness rather than voxel-based volume.
      - >-
        Any substance of abuse qualifies, not only alcohol, nicotine, opioids, cannabis and
        stimulants. Studies of other psychoactive substances (e.g. betel quid/areca nut,
        psychedelics) are in scope and must not be excluded for being outside a named list.
    exclusion_criteria:
      - Studies using pharmacological manipulations
      - Brain lesion studies
      - >-
        Studies in which a psychiatric or neurological PATIENT GROUP, rather than substance use,
        is the grouping variable (e.g. schizophrenia vs controls, epilepsy vs controls). Do NOT
        exclude a substance-user sample merely because its participants also carry a comorbid
        diagnosis such as ADHD, conduct disorder, antisocial personality or depression, which is
        the norm in this literature.
      - Systematic reviews or meta-analyses
    confidence_reporting: true

  fulltext:
    model: "gpt-5-mini-2025-08-07"
    confidence_reporting: true
    objective: "identify consistent regions of structurally altered grey matter (GM) between substance users and controls across five pharmacological classes of drugs: alcohol, nicotine, opioids, cannabis, and stimulants."
    inclusion_criteria:
      - Empirical English language MRI studies assessing grey matter (GM) volume differences (e.g., volume, density, or concentration) between substance users and controls
      - >-
        Grey-matter measure- GM volume, density or concentration, and also surface-based measures
        such as cortical thickness or cortical volume. Do not exclude a study because its
        grey-matter measure is cortical thickness rather than voxel-based volume.
      - >-
        Whole-brain evidence- The paper must report at least one whole-brain between-group contrast
        of substance users vs controls comparing a grey-matter measure, computed as a
        voxelwise or vertexwise statistical map. A voxelwise map confined to a single anatomical
        sub-volume (e.g. a cerebellum-restricted SUIT analysis) still qualifies, provided it
        reports voxel coordinates.
      - >-
        Significant foci must exist- that whole-brain contrast must yield at least one SIGNIFICANT
        cluster with reported peak coordinates (x, y, z in MNI or Talairach space). A whole-brain
        contrast that the paper describes as null, non-significant, or yielding no surviving
        clusters does NOT satisfy this criterion, even though it was performed and reported, and
        even if significant findings are reported elsewhere from an ROI or small-volume-corrected
        analysis. This meta-analysis pools coordinates and a null contrast contributes none.
      - It is acceptable for qualifying voxelwise results to be reported in tables of coordinates, figures, or supplementary materials when the main text clearly indicates those results are available.
      - Reporting of participant age/sex, substance use characteristics, MRI field strength, and preprocessing/statistical software is preferred; missing one or more of these details alone should not exclude an otherwise qualifying study.
    exclusion_criteria:
      - Studies that report only region-of-interest (ROI) analyses with no qualifying whole-brain results.
      - >-
        Studies whose only between-group result is derived from a predefined ATLAS PARCELLATION
        (per-region average volumes or thicknesses over atlas labels, e.g. AAL or FreeSurfer
        Desikan-Killiany regions) or from a MULTIVARIATE CLASSIFIER, rather than from a
        voxelwise or vertexwise statistical map. Whole-brain coverage by an atlas does not make a
        parcellation analysis a whole-brain voxelwise analysis; the source meta-analysis excludes
        region-of-interest analyses because they violate the ALE null hypothesis.
      - Non-empirical papers (e.g., reviews, meta-analyses, methods-only, simulations) without original human structural MRI data.

parsing:
  parse_coordinates: true
  coordinate_model: "gpt-5-mini-2025-08-07"

annotation:
  enabled: true
  model: "gpt-5-mini-2025-08-07"
  prompt_type: "multi_analysis"
  create_all_included_annotations: true
  metadata_fields:
    - "analysis_name"
    - "analysis_description"
    - "table_caption"
    - "study_title"
    - "study_abstract"
  inclusion_criteria:
    - Voxelwise whole-brain grey matter comparison between substance users and controls, with a users < controls contrast indicating reduced grey matter in substance users.
    - Must be a voxelwise whole brain analysis of grey matter volume
    - Multiple experiments from the same article may be included only when they share the same control group but involve non-overlapping substance-user groups. For example, moderate smoker<control, and separately severe smoker<control include two different samples of cigarette smokers. 
  exclusion_criteria:
    - Region of interest (ROI) or small volume correction (SVC) analyses 
    - Analyses other than substance users < controls (e.g., user > control contrasts)
    - Analyses of other modalities (e.g., functional MRI, diffusion tensor imaging) or other structural measures 
  annotations:
    - name: all_drug_classes
      description: convergent lower GM common across all substances
      inclusion_criteria:
        - Comparison of drug users of any class to controls
    - name: alcohol
      description: lower GM in alcohol users relative to controls
      inclusion_criteria:
        - Comparison of alcohol users to controls
      exclusion_criteria:
        - Comparison of users of other drug classes to controls
    - name: nicotine
      description: lower GM in nicotine users relative to controls
      inclusion_criteria:
        - Comparison of nicotine users to controls
      exclusion_criteria:
        - Comparison of users of other drug classes to controls
    - name: opioids
      description: lower GM in opioid users relative to controls
      inclusion_criteria:
        - Comparison of opioid users to controls
      exclusion_criteria:
        - Comparison of users of other drug classes to controls
    - name: stimulants
      description: lower GM in stimulant users relative to controls
      inclusion_criteria:
        - Comparison of stimulant users to controls
      exclusion_criteria:
        - Comparison of users of other drug classes to controls
    - name: cannabis
      description: lower GM in cannabis users relative to controls
      inclusion_criteria:
        - Comparison of cannabis users to controls
      exclusion_criteria:
        - Comparison of users of other drug classes to controls

output:
  formats:
    - csv
  nimads: true
  export_excluded_studies: true
