search:
  database: pubmed
  query: (("voxel-based morphometr*"[tiab] OR VBM[tiab] OR "gray matter volum*"[tiab]
    OR "grey matter volum*"[tiab] OR "gray matter densit*"[tiab] OR "grey matter densit*"[tiab]
    OR "cortical thickness"[tiab] OR "gray matter reduc*"[tiab] OR "grey matter reduc*"[tiab]
    OR "gray matter abnormal*"[tiab] OR "grey matter abnormal*"[tiab] OR "reduced
    gray matter"[tiab] OR "reduced grey matter"[tiab] OR "tensor-based morphometr*"[tiab]
    OR "brain volumetric"[tiab] OR "brain morphometr*"[tiab]) AND ("Substance-Related
    Disorders"[Mesh] OR addiction[tiab] OR addict*[tiab] OR "substance use"[tiab]
    OR "substance abuse"[tiab] OR alcoholism[tiab] OR "alcohol depend*"[tiab] OR "alcohol
    use disorder*"[tiab] OR "alcohol abuse"[tiab] OR smoker*[tiab] OR "nicotine depend*"[tiab]
    OR "cannabis use"[tiab] OR "cannabis depend*"[tiab] OR "marijuana use"[tiab] OR
    "cocaine depend*"[tiab] OR "cocaine use"[tiab] OR "methamphetamine depend*"[tiab]
    OR "heroin depend*"[tiab] OR "opioid use disorder*"[tiab] OR "betel quid"[tiab]
    OR psychedelic*[tiab] OR stimulant*[tiab] OR amphetamine*[tiab])) NOT (Editorial[pt]
    OR Letter[pt] OR Comment[pt] OR "Case Reports"[pt] OR News[pt])
  max_results: null
  date_from: null
  date_to: 2019/7/31
  email: delavega@utexas.edu
  pmids_file: null
  pmids_list: null
screening:
  abstract:
    model: gpt-5-mini-2025-08-07
    threshold: null
    confidence_reporting: true
    objective: 'identify consistent regions of structurally altered grey matter (GM)
      between substance users and controls across five pharmacological classes of
      drugs: alcohol, nicotine, opioids, cannabis, and stimulants.'
    inclusion_criteria:
    - Empirical English language MRI studies assessing grey matter (GM) volume differences
      between substance users and controls
    - Any grey-matter structural measure qualifies- GM volume, GM density, GM concentration,
      and also surface-based measures such as cortical thickness or cortical volume.
      Do not exclude a study because its grey-matter measure is cortical thickness
      rather than voxel-based volume.
    - Any substance of abuse qualifies, not only alcohol, nicotine, opioids, cannabis
      and stimulants. Studies of other psychoactive substances (e.g. betel quid/areca
      nut, psychedelics) are in scope and must not be excluded for being outside a
      named list.
    exclusion_criteria:
    - Studies using pharmacological manipulations
    - Brain lesion studies
    - Studies in which a psychiatric or neurological PATIENT GROUP, rather than substance
      use, is the grouping variable (e.g. schizophrenia vs controls, epilepsy vs controls).
      Do NOT exclude a substance-user sample merely because its participants also
      carry a comorbid diagnosis such as ADHD, conduct disorder, antisocial personality
      or depression, which is the norm in this literature.
    - Systematic reviews or meta-analyses
    additional_instructions: null
    criteria_mapping:
      inclusion:
        I1: Empirical English language MRI studies assessing grey matter (GM) volume
          differences between substance users and controls
        I2: Any grey-matter structural measure qualifies- GM volume, GM density, GM
          concentration, and also surface-based measures such as cortical thickness
          or cortical volume. Do not exclude a study because its grey-matter measure
          is cortical thickness rather than voxel-based volume.
        I3: Any substance of abuse qualifies, not only alcohol, nicotine, opioids,
          cannabis and stimulants. Studies of other psychoactive substances (e.g.
          betel quid/areca nut, psychedelics) are in scope and must not be excluded
          for being outside a named list.
      exclusion:
        E1: Studies using pharmacological manipulations
        E2: Brain lesion studies
        E3: Studies in which a psychiatric or neurological PATIENT GROUP, rather than
          substance use, is the grouping variable (e.g. schizophrenia vs controls,
          epilepsy vs controls). Do NOT exclude a substance-user sample merely because
          its participants also carry a comorbid diagnosis such as ADHD, conduct disorder,
          antisocial personality or depression, which is the norm in this literature.
        E4: Systematic reviews or meta-analyses
  fulltext:
    model: gpt-5-mini-2025-08-07
    threshold: null
    confidence_reporting: true
    objective: 'identify consistent regions of structurally altered grey matter (GM)
      between substance users and controls across five pharmacological classes of
      drugs: alcohol, nicotine, opioids, cannabis, and stimulants.'
    inclusion_criteria:
    - Empirical English language MRI studies assessing grey matter (GM) volume differences
      (e.g., volume, density, or concentration) between substance users and controls
    - Grey-matter measure- GM volume, density or concentration, and also surface-based
      measures such as cortical thickness or cortical volume. Do not exclude a study
      because its grey-matter measure is cortical thickness rather than voxel-based
      volume.
    - Whole-brain evidence- The paper must report at least one whole-brain between-group
      contrast of substance users vs controls comparing a grey-matter measure, computed
      as a voxelwise or vertexwise statistical map. A voxelwise map confined to a
      single anatomical sub-volume (e.g. a cerebellum-restricted SUIT analysis) still
      qualifies, provided it reports voxel coordinates.
    - Significant foci must exist- that whole-brain contrast must yield at least one
      SIGNIFICANT cluster with reported peak coordinates (x, y, z in MNI or Talairach
      space). A whole-brain contrast that the paper describes as null, non-significant,
      or yielding no surviving clusters does NOT satisfy this criterion, even though
      it was performed and reported, and even if significant findings are reported
      elsewhere from an ROI or small-volume-corrected analysis. This meta-analysis
      pools coordinates and a null contrast contributes none.
    - It is acceptable for qualifying voxelwise results to be reported in tables of
      coordinates, figures, or supplementary materials when the main text clearly
      indicates those results are available.
    - Reporting of participant age/sex, substance use characteristics, MRI field strength,
      and preprocessing/statistical software is preferred; missing one or more of
      these details alone should not exclude an otherwise qualifying study.
    exclusion_criteria:
    - Studies that report only region-of-interest (ROI) analyses with no qualifying
      whole-brain results.
    - Studies whose only between-group result is derived from a predefined ATLAS PARCELLATION
      (per-region average volumes or thicknesses over atlas labels, e.g. AAL or FreeSurfer
      Desikan-Killiany regions) or from a MULTIVARIATE CLASSIFIER, rather than from
      a voxelwise or vertexwise statistical map. Whole-brain coverage by an atlas
      does not make a parcellation analysis a whole-brain voxelwise analysis; the
      source meta-analysis excludes region-of-interest analyses because they violate
      the ALE null hypothesis.
    - Non-empirical papers (e.g., reviews, meta-analyses, methods-only, simulations)
      without original human structural MRI data.
    additional_instructions: null
    criteria_mapping:
      inclusion:
        I4: Empirical English language MRI studies assessing grey matter (GM) volume
          differences (e.g., volume, density, or concentration) between substance
          users and controls
        I5: Grey-matter measure- GM volume, density or concentration, and also surface-based
          measures such as cortical thickness or cortical volume. Do not exclude a
          study because its grey-matter measure is cortical thickness rather than
          voxel-based volume.
        I6: Whole-brain evidence- The paper must report at least one whole-brain between-group
          contrast of substance users vs controls comparing a grey-matter measure,
          computed as a voxelwise or vertexwise statistical map. A voxelwise map confined
          to a single anatomical sub-volume (e.g. a cerebellum-restricted SUIT analysis)
          still qualifies, provided it reports voxel coordinates.
        I7: Significant foci must exist- that whole-brain contrast must yield at least
          one SIGNIFICANT cluster with reported peak coordinates (x, y, z in MNI or
          Talairach space). A whole-brain contrast that the paper describes as null,
          non-significant, or yielding no surviving clusters does NOT satisfy this
          criterion, even though it was performed and reported, and even if significant
          findings are reported elsewhere from an ROI or small-volume-corrected analysis.
          This meta-analysis pools coordinates and a null contrast contributes none.
        I8: It is acceptable for qualifying voxelwise results to be reported in tables
          of coordinates, figures, or supplementary materials when the main text clearly
          indicates those results are available.
        I9: Reporting of participant age/sex, substance use characteristics, MRI field
          strength, and preprocessing/statistical software is preferred; missing one
          or more of these details alone should not exclude an otherwise qualifying
          study.
      exclusion:
        E5: Studies that report only region-of-interest (ROI) analyses with no qualifying
          whole-brain results.
        E6: Studies whose only between-group result is derived from a predefined ATLAS
          PARCELLATION (per-region average volumes or thicknesses over atlas labels,
          e.g. AAL or FreeSurfer Desikan-Killiany regions) or from a MULTIVARIATE
          CLASSIFIER, rather than from a voxelwise or vertexwise statistical map.
          Whole-brain coverage by an atlas does not make a parcellation analysis a
          whole-brain voxelwise analysis; the source meta-analysis excludes region-of-interest
          analyses because they violate the ALE null hypothesis.
        E7: Non-empirical papers (e.g., reviews, meta-analyses, methods-only, simulations)
          without original human structural MRI data.
retrieval:
  sources:
  - pubget
  timeout: 30
  max_retries: 3
  download_directory: downloads
  n_jobs: 1
  load_excluded: true
  full_text_sources:
  - root_path: articles/elsevier_output/
    pmid_source: folder_name
    text_path_templates:
    - text.txt
    coordinates_path_templates:
    - coordinates.json
  - root_path: articles/ace_outputs
    pmid_source: file_name
    allowed_extensions:
    - .html
    processed_data_path: articles/ace_outputs/processed/
  parse_coordinates: false
  coordinate_model: gpt-4o-mini
parsing:
  parse_coordinates: true
  coordinate_model: gpt-5-mini-2025-08-07
annotation:
  model: gpt-5-mini-2025-08-07
  create_all_included_annotations: true
  metadata_fields:
  - analysis_name
  - analysis_description
  - table_caption
  - study_title
  - study_abstract
  prompt_type: multi_analysis
  inclusion_criteria:
  - Voxelwise whole-brain grey matter comparison between substance users and controls,
    with a users < controls contrast indicating reduced grey matter in substance users.
  - Must be a voxelwise whole brain analysis of grey matter volume
  - Multiple experiments from the same article may be included only when they share
    the same control group but involve non-overlapping substance-user groups. For
    example, moderate smoker<control, and separately severe smoker<control include
    two different samples of cigarette smokers.
  exclusion_criteria:
  - Region of interest (ROI) or small volume correction (SVC) analyses
  - Analyses other than substance users < controls (e.g., user > control contrasts)
  - Analyses of other modalities (e.g., functional MRI, diffusion tensor imaging)
    or other structural measures
  annotations:
  - name: all_drug_classes
    description: convergent lower GM common across all substances
    inclusion_criteria:
    - Comparison of drug users of any class to controls
    exclusion_criteria: []
  - name: alcohol
    description: lower GM in alcohol users relative to controls
    inclusion_criteria:
    - Comparison of alcohol users to controls
    exclusion_criteria:
    - Comparison of users of other drug classes to controls
  - name: nicotine
    description: lower GM in nicotine users relative to controls
    inclusion_criteria:
    - Comparison of nicotine users to controls
    exclusion_criteria:
    - Comparison of users of other drug classes to controls
  - name: opioids
    description: lower GM in opioid users relative to controls
    inclusion_criteria:
    - Comparison of opioid users to controls
    exclusion_criteria:
    - Comparison of users of other drug classes to controls
  - name: stimulants
    description: lower GM in stimulant users relative to controls
    inclusion_criteria:
    - Comparison of stimulant users to controls
    exclusion_criteria:
    - Comparison of users of other drug classes to controls
  - name: cannabis
    description: lower GM in cannabis users relative to controls
    inclusion_criteria:
    - Comparison of cannabis users to controls
    exclusion_criteria:
    - Comparison of users of other drug classes to controls
  enabled: true
output:
  directory: projects/vbm_of_substance_use/v3
  prisma_diagram: true
  formats:
  - csv
  nimads: true
  export_excluded_studies: true
