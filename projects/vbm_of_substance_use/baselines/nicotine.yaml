# GENERATED by scripts/run_baseline_searches.py from baselines.yaml -- do not
# hand-edit; edit the spec instead. Search baseline for manual annotation
# 'nicotine'. Screening is skipped, so this is a Neurosynth-style pool over a
# topic-targeted search: every hit whose coordinates we could parse. The
# comparison column is 'all_analyses'.
search:
  database: pubmed
  query: '((("voxel-based morphometr*"[tiab] OR VBM[tiab] OR "gray matter volum*"[tiab] OR "grey matter
    volum*"[tiab] OR "gray matter densit*"[tiab] OR "grey matter densit*"[tiab] OR "cortical thickness"[tiab]
    OR "gray matter reduc*"[tiab] OR "grey matter reduc*"[tiab] OR "gray matter abnormal*"[tiab] OR "grey
    matter abnormal*"[tiab] OR "reduced gray matter"[tiab] OR "reduced grey matter"[tiab] OR "tensor-based
    morphometr*"[tiab] OR "brain volumetric"[tiab] OR "brain morphometr*"[tiab]) AND ("Tobacco Use Disorder"[Mesh]
    OR "Smoking"[Mesh] OR nicotine[tiab] OR tobacco[tiab] OR smoking[tiab] OR smoker*[tiab] OR "nicotine
    depend*"[tiab] OR "cigarette smok*"[tiab] OR "tobacco use"[tiab])) AND ("1800"[Date - Publication]
    : "2019/7/31"[Date - Publication])) NOT (Editorial[pt] OR Letter[pt] OR Comment[pt] OR "Case Reports"[pt]
    OR News[pt])'
  email: delavega@utexas.edu
  date_to: 2019/7/31
retrieval:
  load_excluded: false
  sources:
  - pubget
  full_text_sources:
  - root_path: /home/zorro/repos/autonima-results/articles/elsevier_output/
    pmid_source: folder_name
    text_path_templates:
    - text.txt
    coordinates_path_templates:
    - coordinates.json
  - root_path: /home/zorro/repos/autonima-results/articles/ace_outputs
    pmid_source: file_name
    allowed_extensions:
    - .html
    processed_data_path: /home/zorro/repos/autonima-results/articles/ace_outputs/processed/
screening:
  abstract:
    skip_stage: true
  fulltext:
    skip_stage: true
parsing:
  parse_coordinates: true
  coordinate_model: gpt-5-mini-2025-08-07
annotation:
  enabled: true
  model: gpt-5-mini-2025-08-07
  create_all_included_annotations: true
  annotations: []
output:
  formats:
  - csv
  nimads: true
