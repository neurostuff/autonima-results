search:
  database: pubmed
  query: ((("voxel-based morphometr*"[tiab] OR VBM[tiab] OR "gray matter volum*"[tiab]
    OR "grey matter volum*"[tiab] OR "gray matter densit*"[tiab] OR "grey matter densit*"[tiab])
    AND ("magnetic resonance imaging"[Mesh] OR MRI[tiab] OR "structural MRI"[tiab]))
    AND ((alcohol[tiab] OR "Alcohol-Related Disorders"[Mesh]) OR (nicotine[tiab] OR
    tobacco[tiab] OR smoking[tiab] OR "Tobacco Use Disorder"[Mesh]) OR (opioid*[tiab]
    OR opiate*[tiab] OR heroin[tiab] OR "Opioid-Related Disorders"[Mesh]) OR (cannabis[tiab]
    OR marijuana[tiab] OR marihuana[tiab] OR THC[tiab]) OR (stimulant*[tiab] OR cocaine[tiab]
    OR amphetamine*[tiab] OR methamphetamine[tiab] OR "Cocaine-Related Disorders"[Mesh]
    OR "Amphetamine-Related Disorders"[Mesh]))
  max_results: 10000
  date_from: null
  date_to: 2019/7/31
  email: delavega@utexas.edu
  pmids_file: null
  pmids_list: null
screening:
  abstract:
    model: gpt-5-mini-2025-08-07
    threshold: null
    confidence_reporting: true
    objective: 'identify consistent regions of structurally altered grey matter (GM)
      between substance users and controls across five pharmacological classes of
      drugs: alcohol, nicotine, opioids, cannabis, and stimulants.'
    inclusion_criteria:
    - Empirical English language MRI studies assessing grey matter (GM) volume differences
      between substance users and controls
    exclusion_criteria:
    - Studies using pharmacological manipulations
    - Brain lesion studies
    - Studies including participants with reports of mental and/or neurological disorders
    - Systematic reviews or meta-analyses
    additional_instructions: null
    criteria_mapping:
      inclusion:
        I1: Empirical English language MRI studies assessing grey matter (GM) volume
          differences between substance users and controls
      exclusion:
        E1: Studies using pharmacological manipulations
        E2: Brain lesion studies
        E3: Studies including participants with reports of mental and/or neurological
          disorders
        E4: Systematic reviews or meta-analyses
  fulltext:
    model: gpt-5-mini-2025-08-07
    threshold: null
    confidence_reporting: true
    objective: 'identify consistent regions of structurally altered grey matter (GM)
      between substance users and controls across five pharmacological classes of
      drugs: alcohol, nicotine, opioids, cannabis, and stimulants.'
    inclusion_criteria:
    - Empirical English language MRI studies assessing grey matter (GM) volume differences
      (e.g., volume, density, or concentration) between substance users and controls
    - Whole-brain evidence- The paper must report at least one whole-brain between-group
      contrast of substance users vs controls comparing GM volume
    - It is acceptable for qualifying voxelwise results to be reported in tables of
      coordinates, figures, or supplementary materials when the main text clearly
      indicates those results are available.
    - Reporting of participant age/sex, substance use characteristics, MRI field strength,
      and preprocessing/statistical software is preferred; missing one or more of
      these details alone should not exclude an otherwise qualifying study.
    exclusion_criteria:
    - Studies that report only region-of-interest (ROI) analyses with no qualifying
      whole-brain results.
    - Non-empirical papers (e.g., reviews, meta-analyses, methods-only, simulations)
      without original human structural MRI data.
    additional_instructions: null
    criteria_mapping:
      inclusion:
        I2: Empirical English language MRI studies assessing grey matter (GM) volume
          differences (e.g., volume, density, or concentration) between substance
          users and controls
        I3: Whole-brain evidence- The paper must report at least one whole-brain between-group
          contrast of substance users vs controls comparing GM volume
        I4: It is acceptable for qualifying voxelwise results to be reported in tables
          of coordinates, figures, or supplementary materials when the main text clearly
          indicates those results are available.
        I5: Reporting of participant age/sex, substance use characteristics, MRI field
          strength, and preprocessing/statistical software is preferred; missing one
          or more of these details alone should not exclude an otherwise qualifying
          study.
      exclusion:
        E5: Studies that report only region-of-interest (ROI) analyses with no qualifying
          whole-brain results.
        E6: Non-empirical papers (e.g., reviews, meta-analyses, methods-only, simulations)
          without original human structural MRI data.
retrieval:
