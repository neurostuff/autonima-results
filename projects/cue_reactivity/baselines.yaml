# Search baselines for cue_reactivity.
#
# Shared: the cue/craving clause, the imaging clause and Humans, verbatim from v4.yaml.
# Varying: the reward-type clause. The benchmark splits cue reactivity by what the cue is for,
# so the natural decomposition is drug cues versus natural (food/sexual) rewards, with the
# pooled column keeping both.

meta_pmid: "34400176"

shared:
  modality: >-
    ((cue reactiv*[tiab] OR cue-induced*[tiab] OR cue-induc*[tiab] OR cue-related*[tiab] OR
    "drug cue*"[tiab] OR "smoking cue*"[tiab] OR "alcohol cue*"[tiab] OR "food cue*"[tiab] OR
    "sexual cue*"[tiab] OR "erotic cue*"[tiab] OR "reward cue*"[tiab] OR "appetitive cue*"[tiab]
    OR "incentive salience"[tiab] OR craving[tiab] OR cravings[tiab] OR urge[tiab] OR
    urges[tiab]) OR ((cue[tiab] OR cues[tiab] OR cued[tiab] OR cueing[tiab]) AND (crav*[tiab]
    OR urge*[tiab] OR induc*[tiab] OR react*[tiab] OR reward*[tiab] OR appetit*[tiab])))
    AND Humans[mh]
    AND (Magnetic Resonance Imaging, Functional[mh] OR fMRI[tiab] OR "functional MRI"[tiab] OR
    "functional magnetic resonance imaging"[tiab] OR BOLD[tiab] OR
    "blood oxygenation level dependent"[tiab] OR neuroimaging[tiab])
  exclude: >-
    review[pt] OR "systematic review"[tiab] OR meta-analysis[pt]
  date_from: "1995/01/01"
  date_to: "2020/08/31"

baselines:
  - manual_annotation: 1_reward_neutral_2020_wbonly
    broad_control: true
    note: Pooled column — drug and natural rewards together, as in v4.yaml.
    topic: >-
      Substance-Related Disorders[mh] OR Tobacco Use Disorder[mh] OR Smoking[mh] OR
      Alcohol-Related Disorders[mh] OR Cocaine-Related Disorders[mh] OR
      Opioid-Related Disorders[mh] OR Cannabis[mh] OR Marijuana Abuse[mh] OR nicotine[tiab] OR
      smoking[tiab] OR tobacco[tiab] OR cigarette*[tiab] OR alcohol[tiab] OR ethanol[tiab] OR
      "alcohol use disorder"[tiab] OR AUD[tiab] OR cocaine[tiab] OR crack[tiab] OR
      cannabis[tiab] OR marijuana[tiab] OR heroin[tiab] OR opioid*[tiab] OR opiate*[tiab] OR
      morphine[tiab] OR "Feeding Behavior"[mh] OR appetite[mh] OR "food craving*"[tiab] OR
      "Sexual Behavior"[mh] OR erotica[tiab]

  - manual_annotation: 2_drug_neutral_2020_wbonly
    topic: >-
      Substance-Related Disorders[mh] OR Tobacco Use Disorder[mh] OR Smoking[mh] OR
      Alcohol-Related Disorders[mh] OR Cocaine-Related Disorders[mh] OR
      Opioid-Related Disorders[mh] OR Cannabis[mh] OR Marijuana Abuse[mh] OR nicotine[tiab] OR
      smoking[tiab] OR tobacco[tiab] OR cigarette*[tiab] OR alcohol[tiab] OR ethanol[tiab] OR
      "alcohol use disorder"[tiab] OR AUD[tiab] OR cocaine[tiab] OR crack[tiab] OR
      cannabis[tiab] OR marijuana[tiab] OR heroin[tiab] OR opioid*[tiab] OR opiate*[tiab] OR
      morphine[tiab] OR "drug cue*"[tiab] OR addiction[tiab]

  - manual_annotation: 3_natural_neutral_2020_wbonly
    topic: >-
      "Feeding Behavior"[mh] OR appetite[mh] OR "food craving*"[tiab] OR "food cue*"[tiab] OR
      food[tiab] OR eating[tiab] OR palatable[tiab] OR "Sexual Behavior"[mh] OR erotica[tiab]
      OR erotic[tiab] OR sexual[tiab] OR "monetary reward*"[tiab] OR "natural reward*"[tiab]
