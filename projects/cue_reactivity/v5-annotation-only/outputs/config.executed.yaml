search:
  database: pubmed
  query: ''
  max_results: null
  date_from: null
  date_to: null
  email: null
  pmids_file: /home/zorro/repos/autonima-results/projects/cue_reactivity/official_pmids.txt
  pmids_list: null
screening:
  abstract:
    skip_stage: true
  fulltext:
    skip_stage: true
retrieval:
  sources:
  - pubget
  timeout: 30
  max_retries: 3
  download_directory: downloads
  n_jobs: 1
  load_excluded: true
  full_text_sources:
  - root_path: /home/zorro/repos/autonima-results/articles/elsevier_output/
    pmid_source: folder_name
    text_path_templates:
    - text.txt
    coordinates_path_templates:
    - coordinates.json
  - root_path: /home/zorro/repos/autonima-results/articles/ace_outputs
    pmid_source: file_name
    allowed_extensions:
    - .html
    processed_data_path: /home/zorro/repos/autonima-results/articles/ace_outputs/processed/
  parse_coordinates: false
  coordinate_model: gpt-4o-mini
parsing:
  parse_coordinates: true
  coordinate_model: gpt-5-mini-2025-08-07
annotation:
  model: gpt-5-mini-2025-08-07
  create_all_included_annotations: true
  metadata_fields:
  - analysis_name
  - analysis_description
  - table_caption
  - study_title
  - study_fulltext
  prompt_type: multi_analysis
  inclusion_criteria:
  - Voxelwise task evidence- The analysis must be a group-level, univariate task-evoked
    voxelwise map (typically whole-brain; small-volume-corrected maps are acceptable).
    Between-group contrasts/interactions are acceptable when they compare a qualifying
    cue-reactivity effect across groups.
  - ROI exception for benchmark compatibility- ROI-focused analyses may be included
    only when they provide stereotactic coordinates for a qualifying visual cue-reactivity
    contrast.
  - Contrast or analysis must be relevant to reward-related cue-reactivity using visual
    stimuli.
  exclusion_criteria:
  - ROI analyses that do not provide stereotactic coordinates for a qualifying cue-reactivity
    contrast.
  - Seed-based connectivity, effective connectivity (e.g., PPI, DCM), or resting-state
    analyses (e.g., ICA, PLE, Hurst exponents)
  - Analyses on non-appetitive cue contrasts, or regulation/control contrasts (e.g.,
    reappraisal/decrease/increase, go/no-go) without a qualifying cue-reactivity contrast.
  annotations:
  - name: pooled_cue_reactivity
    description: Appetitive cue reactivity across reward-related cues
    inclusion_criteria:
    - 'Analyses must be on a task measuring drug OR natural reward-related cue-reactivity
      using visual stimuli (example tasks: Drug cue reactivity; Food cue reactivity;
      Sexual cue reactivity; monetary reward cue tasks).'
    - 'The analysis/contrast must index appetitive cue reactivity versus a valid comparator
      condition (e.g., neutral, non-reward/non-drug, low-level baseline, or matched
      control cues; examples: Drug cues>neutral cues, Alcohol cues>non-alcoholic beverage
      cues, Food cues>neutral/non-food cues).'
    exclusion_criteria:
    - Exclude analyses where cue-reactivity cannot be identified at the analysis/contrast
      level (e.g., generic pooled group maps with no explicit qualifying cue contrast).
  - name: natural_reward_cue_reactivity
    description: Natural reward cue reactivity is characterized by the detection of
      and attention to natural reward-related cues, such as food or social stimuli.
    inclusion_criteria:
    - Analyses must explicitly involve NATURAL reward-related visual cue-reactivity
      at the analysis/contrast level (e.g., food, sexual/erotic, social, monetary/gaming
      reward cues).
    - The analysis/contrast must measure natural reward-related cue reactivity versus
      a valid comparator condition (e.g., neutral, non-reward, low-level baseline,
      or matched control cues).
    exclusion_criteria:
    - Drug cue contrasts (e.g., Drug cues>neutral cues) should not be included in
      this annotation
    - Exclude mixed or ambiguous analyses where natural-reward and drug-cue effects
      are not separable at the reported contrast/map level (e.g., generic group maps
      in mixed-task studies without an explicit natural-reward contrast).
  - name: drug_cue_reactivity
    description: Drug cue reactivity as characterized by the detection of and attention
      to drug-related cues.
    inclusion_criteria:
    - 'Analyses must explicitly involve drug-related visual cue-reactivity at the
      analysis/contrast level (example tasks: smoking, alcohol, cannabis, cocaine
      cue reactivity).'
    - 'The analysis/contrast must measure drug-related cue reactivity versus a valid
      comparator condition (e.g., neutral, non-drug, low-level baseline, or matched
      control cues; examples: Drug cues>neutral cues, Alcohol cues>non-alcoholic beverage
      cues).'
    exclusion_criteria:
    - Analyses on natural reward-related cue contrasts (e.g., Food cues>neutral cues)
      should not be included in this annotation
    - Exclude mixed or ambiguous analyses where drug-cue effects are not separable
      at the reported contrast/map level.
  enabled: true
output:
  directory: projects/cue_reactivity/v5-annotation-only-gpt
  prisma_diagram: true
  formats:
  - csv
  nimads: true
  export_excluded_studies: true
