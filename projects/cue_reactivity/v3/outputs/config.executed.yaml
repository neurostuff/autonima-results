screening:
  abstract:
    model: gpt-5-mini-2025-08-07
    threshold: null
    confidence_reporting: true
    objective: Meta-analysis of fMRI studies of drug and natural reward-related cue-reactivity
      using visual stimuli.
    inclusion_criteria:
    - English language empirical studies with original data
    - Functional MRI scan conducted while human participants assessing drug or natural
      reward-related cue-reactivity using visual stimuli
    exclusion_criteria:
    - Systematic reviews or meta-analyses
    - Cue-reactivity using only other sensory cues (e.g., gustatory, olfactory, tactile)
    additional_instructions: null
    criteria_mapping:
      inclusion:
        I1: English language empirical studies with original data
        I2: Functional MRI scan conducted while human participants assessing drug
          or natural reward-related cue-reactivity using visual stimuli
      exclusion:
        E1: Systematic reviews or meta-analyses
        E2: Cue-reactivity using only other sensory cues (e.g., gustatory, olfactory,
          tactile)
  fulltext:
    model: gpt-5-mini-2025-08-07
    threshold: null
    confidence_reporting: true
    objective: Meta-analysis of fMRI studies of drug and natural reward-related cue-reactivity
      using visual stimuli.
    inclusion_criteria:
    - Functional MRI study assesing drug or natural reward-related cue-reactivity
      using visual stimuli
    - At least one analysis involving a within-participant contrast of drug cues>control
      stimuli or natural reward-related cues>control stimuli
    - Whole-brain evidence- At least one analysis must be a group-level, whole-brain
      (voxelwise) task-evoked statistical map
    - It is acceptable for qualifying whole-brain results to be reported in tables
      of coordinates, figures, or supplementary materials, as long as they are clearly
      described in the text.
    - Relevant information was reported regarding participant age and sex, cue type
      (i.e., nicotine, alcohol, cannabis, cocaine, heroin, food, or sexual), MRI scanner
      field strength, and processing software (e.g., AFNI, FSL, SPM).
    exclusion_criteria:
    - Studies that report only region-of-interest (ROI) analyses with no whole-brain
      results.
    - Studies that report only seed-based connectivity, effective connectivity (e.g.,
      PPI, DCM), or resting-state analyses (e.g., ICA, PLE, Hurst exponents) without
      also reporting a whole-brain task activation map.
    - Studies that report only between-group contrasts or interactions (e.g., subgroup
      vs subgroup, patient vs control) without an accompanying unmasked, whole-brain
      task effect.
    - Non-empirical papers (e.g., reviews, meta-analyses, methods-only, simulations)
      without original human fMRI data.
    additional_instructions: null
    criteria_mapping:
      inclusion:
        I3: Functional MRI study assesing drug or natural reward-related cue-reactivity
          using visual stimuli
        I4: At least one analysis involving a within-participant contrast of drug
          cues>control stimuli or natural reward-related cues>control stimuli
        I5: Whole-brain evidence- At least one analysis must be a group-level, whole-brain
          (voxelwise) task-evoked statistical map
        I6: It is acceptable for qualifying whole-brain results to be reported in
          tables of coordinates, figures, or supplementary materials, as long as they
          are clearly described in the text.
        I7: Relevant information was reported regarding participant age and sex, cue
          type (i.e., nicotine, alcohol, cannabis, cocaine, heroin, food, or sexual),
          MRI scanner field strength, and processing software (e.g., AFNI, FSL, SPM).
      exclusion:
        E3: Studies that report only region-of-interest (ROI) analyses with no whole-brain
          results.
        E4: Studies that report only seed-based connectivity, effective connectivity
          (e.g., PPI, DCM), or resting-state analyses (e.g., ICA, PLE, Hurst exponents)
          without also reporting a whole-brain task activation map.
        E5: Studies that report only between-group contrasts or interactions (e.g.,
          subgroup vs subgroup, patient vs control) without an accompanying unmasked,
          whole-brain task effect.
        E6: Non-empirical papers (e.g., reviews, meta-analyses, methods-only, simulations)
          without original human fMRI data.
retrieval:
  sources:
  - pubget
  timeout: 30
  max_retries: 3
  download_directory: downloads
  n_jobs: 1
  load_excluded: true
  full_text_sources:
  - root_path: /home/zorro/repos/autonima-results/articles/elsevier_output/
    pmid_source: folder_name
    text_path_templates:
    - text.txt
    coordinates_path_templates:
    - coordinates.json
  - root_path: /home/zorro/repos/autonima-results/articles/ace_outputs
    pmid_source: file_name
    allowed_extensions:
    - .html
    processed_data_path: /home/zorro/repos/autonima-results/articles/ace_outputs/processed/
  parse_coordinates: false
  coordinate_model: gpt-4o-mini
parsing:
  parse_coordinates: true
  coordinate_model: gpt-5-mini-2025-08-07
annotation:
  model: gpt-5-mini-2025-08-07
  create_all_included_annotations: true
  metadata_fields:
  - analysis_name
  - analysis_description
  - table_caption
  - study_title
  - study_fulltext
  prompt_type: multi_analysis
  inclusion_criteria:
  - Whole-brain evidence- The analysis must be from a group-level, univariate whole-brain
    (voxelwise) task-evoked statistical map (e.g., main effect or within-group contrast).
    Between-group contrasts or interactions (e.g., subgroup vs subgroup, patient vs
    control) are acceptable if they compare the target within group contrast to another
    group (e.g., patient drug cues>neutral cues vs control drug cues>neutral cues).
  - Contrast or analysis must be relevant to reward-related cue-reactivity using visual
    stimuli.
  exclusion_criteria:
  - Region-of-interest (ROI) analyses
  - Seed-based connectivity, effective connectivity (e.g., PPI, DCM), or resting-state
    analyses (e.g., ICA, PLE, Hurst exponents)
  - Analyses on non-appetitive cue contrasts
  - Analyses correlating brain activation with behavioral or clinical measures (e.g.,
    craving ratings, dependence severity, etc.)
  annotations:
  - name: pooled_cue_reactivity
    description: Appetitive cue reactivity across reward-related cues
    inclusion_criteria:
    - 'Analyses must be on a task measuring drug OR natural reward-related cue-reactivity
      using visual stimuli (example tasks: Drug cue reactivity; Food cue reactivity;
      Sexual cue reactivity)'
    - 'The analysis/contrast must measure drug or natural reward-related cue reactivity
      compared to control stimuli (example contrast: Drug cues>neutral cues; Food
      cues>neutral cues; Sexual cues>neutral cues)'
    exclusion_criteria: []
  - name: natural_reward_cue_reactivity
    description: Natural reward cue reactivity is characterized by the detection of
      and attention to natural reward-related cues, such as food or social stimuli.
    inclusion_criteria:
    - 'Analyses must be on a task measuring NATURAL reward-related cue-reactivity
      (example tasks: Food cue reactivity; Social cue reactivity, Sexual cue reactivity)'
    - 'The analysis/contrast must measure natural reward-related cue reactivity compared
      to control stimuli (example contrast: Food cues>neutral cues; Social cues>neutral
      cues; Sexual cues>neutral cues)'
    exclusion_criteria:
    - Drug cue contrasts (e.g., Drug cues>neutral cues) should not be included in
      this annotation
  - name: drug_cue_reactivity
    description: Drug cue reactivity as characterized by the detection of and attention
      to drug-related cues.
    inclusion_criteria:
    - 'Analyses must be on a task measuring drug-related cue-reactivity (example tasks:
      Drug cue reactivity)'
    - 'The analysis/contrast must measure drug-related cue reactivity compared to
      control stimuli (example contrast: Drug cues>neutral cues)'
    exclusion_criteria:
    - Analyses on natural reward-related cue contrasts (e.g., Food cues>neutral cues)
      should not be included in this annotation
  enabled: true
output:
  directory: projects/cue_reactivity/v3
  prisma_diagram: true
  formats:
  - csv
  nimads: true
  export_excluded_studies: true
