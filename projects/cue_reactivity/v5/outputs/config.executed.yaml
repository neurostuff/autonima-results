screening:
  abstract:
    model: gpt-5-mini-2025-08-07
    threshold: null
    confidence_reporting: true
    objective: Meta-analysis of fMRI studies of drug and natural reward-related cue-reactivity
      using visual stimuli.
    inclusion_criteria:
    - English language empirical studies with original data
    - Functional MRI study in humans assessing drug or natural reward-related cue-reactivity
      with a clear visual cue component (visual-only or multimodal designs that include
      visual cues)
    exclusion_criteria:
    - Systematic reviews or meta-analyses
    - Cue-reactivity paradigms with no visual cue component (e.g., purely gustatory,
      olfactory, or tactile designs)
    additional_instructions: null
    criteria_mapping:
      inclusion:
        I1: English language empirical studies with original data
        I2: Functional MRI study in humans assessing drug or natural reward-related
          cue-reactivity with a clear visual cue component (visual-only or multimodal
          designs that include visual cues)
      exclusion:
        E1: Systematic reviews or meta-analyses
        E2: Cue-reactivity paradigms with no visual cue component (e.g., purely gustatory,
          olfactory, or tactile designs)
  fulltext:
    model: gpt-5-mini-2025-08-07
    threshold: null
    confidence_reporting: true
    objective: Meta-analysis of fMRI studies of drug and natural reward-related cue-reactivity
      using visual stimuli.
    inclusion_criteria:
    - Functional MRI study assessing drug or natural reward-related cue-reactivity
      with a clear visual cue component (visual-only or multimodal designs that include
      visual cues)
    - At least one analysis involving a within-participant contrast of drug cues>control
      stimuli or natural reward-related cues>control stimuli
    - &id001
      Whole-brain or small-volume-corrected evidence: at least one qualifying analysis
        must be a group-level voxelwise task-evoked statistical result, reported as
        either whole-brain or small-volume-corrected.
    - It is acceptable for qualifying voxelwise results to be reported in tables of
      coordinates, figures, or supplementary materials when the main text clearly
      indicates those results are available.
    - Reporting of participant age/sex, cue type, MRI field strength, and preprocessing/statistical
      software is preferred; missing one or more of these details alone should not
      exclude an otherwise qualifying study.
    exclusion_criteria:
    - Studies that report only region-of-interest (ROI) analyses with no qualifying
      voxelwise whole-brain or small-volume-corrected result.
    - Studies that report only seed-based connectivity, effective connectivity (e.g.,
      PPI, DCM), or resting-state analyses (e.g., ICA, PLE, Hurst exponents) without
      also reporting a qualifying task-evoked voxelwise result (whole-brain or small-volume-corrected).
    - Studies that report only between-group contrasts or interactions (e.g., subgroup
      vs subgroup, patient vs control) without an accompanying qualifying within-participant
      cue>control contrast.
    - Non-empirical papers (e.g., reviews, meta-analyses, methods-only, simulations)
      without original human fMRI data.
    additional_instructions: null
    criteria_mapping:
      inclusion:
        I3: Functional MRI study assessing drug or natural reward-related cue-reactivity
          with a clear visual cue component (visual-only or multimodal designs that
          include visual cues)
        I4: At least one analysis involving a within-participant contrast of drug
          cues>control stimuli or natural reward-related cues>control stimuli
        I5: *id001
        I6: It is acceptable for qualifying voxelwise results to be reported in tables
          of coordinates, figures, or supplementary materials when the main text clearly
          indicates those results are available.
        I7: Reporting of participant age/sex, cue type, MRI field strength, and preprocessing/statistical
          software is preferred; missing one or more of these details alone should
          not exclude an otherwise qualifying study.
      exclusion:
        E3: Studies that report only region-of-interest (ROI) analyses with no qualifying
          voxelwise whole-brain or small-volume-corrected result.
        E4: Studies that report only seed-based connectivity, effective connectivity
          (e.g., PPI, DCM), or resting-state analyses (e.g., ICA, PLE, Hurst exponents)
          without also reporting a qualifying task-evoked voxelwise result (whole-brain
          or small-volume-corrected).
        E5: Studies that report only between-group contrasts or interactions (e.g.,
          subgroup vs subgroup, patient vs control) without an accompanying qualifying
          within-participant cue>control contrast.
        E6: Non-empirical papers (e.g., reviews, meta-analyses, methods-only, simulations)
          without original human fMRI data.
retrieval:
  sources:
  - pubget
  timeout: 30
  max_retries: 3
  download_directory: downloads
  n_jobs: 1
  load_excluded: true
  full_text_sources:
  - root_path: /home/zorro/repos/autonima-results/articles/elsevier_output/
    pmid_source: folder_name
    text_path_templates:
    - text.txt
    coordinates_path_templates:
    - coordinates.json
  - root_path: /home/zorro/repos/autonima-results/articles/ace_outputs
    pmid_source: file_name
    allowed_extensions:
    - .html
    processed_data_path: /home/zorro/repos/autonima-results/articles/ace_outputs/processed/
  parse_coordinates: false
  coordinate_model: gpt-4o-mini
parsing:
  parse_coordinates: true
  coordinate_model: gpt-5-mini-2025-08-07
annotation:
  model: gpt-5-mini-2025-08-07
  create_all_included_annotations: true
  metadata_fields:
  - analysis_name
  - analysis_description
  - table_caption
  - study_title
  - study_fulltext
  prompt_type: multi_analysis
  inclusion_criteria: []
  exclusion_criteria: []
  annotations:
  - name: pooled_cue_reactivity
    description: Appetitive cue reactivity across reward-related cues
    inclusion_criteria:
    - 'Analyses must be on a task measuring drug OR natural reward-related cue-reactivity
      using visual stimuli (example tasks: Drug cue reactivity; Food cue reactivity;
      Sexual cue reactivity; monetary reward cue tasks).'
    - 'The analysis/contrast must index appetitive cue reactivity versus a valid comparator
      condition (e.g., neutral, non-reward/non-drug, low-level baseline, or matched
      control cues; examples: Drug cues>neutral cues, Alcohol cues>non-alcoholic beverage
      cues, Food cues>neutral/non-food cues).'
    exclusion_criteria:
    - Exclude analyses where cue-reactivity cannot be identified at the analysis/contrast
      level (e.g., generic pooled group maps with no explicit qualifying cue contrast).
  - name: natural_reward_cue_reactivity
    description: Natural reward cue reactivity is characterized by the detection of
      and attention to natural reward-related cues, such as food or social stimuli.
    inclusion_criteria:
    - Analyses must explicitly involve NATURAL reward-related visual cue-reactivity
      at the analysis/contrast level (e.g., food, sexual/erotic, social, monetary/gaming
      reward cues).
    - The analysis/contrast must measure natural reward-related cue reactivity versus
      a valid comparator condition (e.g., neutral, non-reward, low-level baseline,
      or matched control cues).
    exclusion_criteria:
    - Drug cue contrasts (e.g., Drug cues>neutral cues) should not be included in
      this annotation
    - Exclude mixed or ambiguous analyses where natural-reward and drug-cue effects
      are not separable at the reported contrast/map level (e.g., generic group maps
      in mixed-task studies without an explicit natural-reward contrast).
  - name: drug_cue_reactivity
    description: Drug cue reactivity as characterized by the detection of and attention
      to drug-related cues.
    inclusion_criteria:
    - 'Analyses must explicitly involve drug-related visual cue-reactivity at the
      analysis/contrast level (example tasks: smoking, alcohol, cannabis, cocaine
      cue reactivity).'
    - 'The analysis/contrast must measure drug-related cue reactivity versus a valid
      comparator condition (e.g., neutral, non-drug, low-level baseline, or matched
      control cues; examples: Drug cues>neutral cues, Alcohol cues>non-alcoholic beverage
      cues).'
    exclusion_criteria:
    - Analyses on natural reward-related cue contrasts (e.g., Food cues>neutral cues)
      should not be included in this annotation
    - Exclude mixed or ambiguous analyses where drug-cue effects are not separable
      at the reported contrast/map level.
  enabled: true
output:
  directory: /home/zorro/repos/autonima-results/projects/cue_reactivity/v5
  prisma_diagram: true
  formats:
  - csv
  nimads: true
  export_excluded_studies: true
