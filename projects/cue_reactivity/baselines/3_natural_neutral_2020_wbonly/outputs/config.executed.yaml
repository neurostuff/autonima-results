search:
  database: pubmed
  query: '(((((cue reactiv*[tiab] OR cue-induced*[tiab] OR cue-induc*[tiab] OR cue-related*[tiab]
    OR "drug cue*"[tiab] OR "smoking cue*"[tiab] OR "alcohol cue*"[tiab] OR "food
    cue*"[tiab] OR "sexual cue*"[tiab] OR "erotic cue*"[tiab] OR "reward cue*"[tiab]
    OR "appetitive cue*"[tiab] OR "incentive salience"[tiab] OR craving[tiab] OR cravings[tiab]
    OR urge[tiab] OR urges[tiab]) OR ((cue[tiab] OR cues[tiab] OR cued[tiab] OR cueing[tiab])
    AND (crav*[tiab] OR urge*[tiab] OR induc*[tiab] OR react*[tiab] OR reward*[tiab]
    OR appetit*[tiab]))) AND Humans[mh] AND (Magnetic Resonance Imaging, Functional[mh]
    OR fMRI[tiab] OR "functional MRI"[tiab] OR "functional magnetic resonance imaging"[tiab]
    OR BOLD[tiab] OR "blood oxygenation level dependent"[tiab] OR neuroimaging[tiab]))
    AND ("Feeding Behavior"[mh] OR appetite[mh] OR "food craving*"[tiab] OR "food
    cue*"[tiab] OR food[tiab] OR eating[tiab] OR palatable[tiab] OR "Sexual Behavior"[mh]
    OR erotica[tiab] OR erotic[tiab] OR sexual[tiab] OR "monetary reward*"[tiab] OR
    "natural reward*"[tiab])) AND ("1995/01/01"[Date - Publication] : "2020/08/31"[Date
    - Publication])) NOT (review[pt] OR "systematic review"[tiab] OR meta-analysis[pt])'
  max_results: null
  date_from: 1995/01/01
  date_to: 2020/08/31
  email: null
  pmids_file: null
  pmids_list: null
screening:
  abstract:
    skip_stage: true
  fulltext:
    skip_stage: true
retrieval:
  sources:
  - pubget
  timeout: 30
  max_retries: 3
  download_directory: downloads
  n_jobs: 1
  load_excluded: false
  full_text_sources:
  - root_path: /home/zorro/repos/autonima-results/articles/elsevier_output/
    pmid_source: folder_name
    text_path_templates:
    - text.txt
    coordinates_path_templates:
    - coordinates.json
  - root_path: /home/zorro/repos/autonima-results/articles/ace_outputs
    pmid_source: file_name
    allowed_extensions:
    - .html
    processed_data_path: /home/zorro/repos/autonima-results/articles/ace_outputs/processed/
  parse_coordinates: false
  coordinate_model: gpt-4o-mini
parsing:
  parse_coordinates: false
  coordinate_model: gpt-4o-mini
annotation:
  model: gpt-5-mini-2025-08-07
  create_all_included_annotations: true
  metadata_fields:
  - analysis_name
  - analysis_description
  - table_caption
  - study_title
  prompt_type: multi_analysis
  inclusion_criteria: []
  exclusion_criteria: []
  annotations: []
  enabled: true
output:
  directory: projects/cue_reactivity/baselines/3_natural_neutral_2020_wbonly
  prisma_diagram: true
  formats:
  - csv
  nimads: true
  export_excluded_studies: false
