# v4 -- AUTOMATICALLY GENERATED by Claude (Opus 5) on 2026-11-03.
#
# NOT THE SAME FAMILY AS v4-allstudies / v5-allstudies. Those are the all-studies arm and share
# no lineage with this file. This is the CANONICAL v3 -> v4 criteria bump.
#
# PROVENANCE, STATED PLAINLY
#
# Written by an LLM agent, not a human expert. No human domain expert reviewed these criteria
# before the run. It is tuned against the benchmark and must be reported as an ITERATED version,
# never as held-out.
#
# Its inputs were, specifically:
#   - v3/evaluation/performance_metrics.json, REGENERATED on 2026-11-03 (see below)
#   - v3/reports/qualitative/false_positives_fulltext.html  (94 papers)
#   - v3/reports/qualitative/false_negatives_fulltext.html  (3 papers)
#   - v3/outputs/fulltext_screening_results.json, read directly so that false-positive and
#     true-positive reasoning could be counted against each other rather than sampled by eye
#   - the source paper's stated criteria as recorded in the benchmark's own registry,
#     ../neurometabench/data/meta_datasets.csv, row pmid=35664889 (Kamalian et al. 2022)
#
# THE COMMITTED v3 METRICS WERE STALE AND WERE NOT USED
#
# projects/dementia/v3/evaluation/performance_metrics.json as committed contains ONLY a search
# stage, and its gold denominator is 20 studies. The current benchmark gold for meta_pmid
# 35664889 is 74 studies. Every number quoted below comes from a regeneration run on 2026-11-03
# against ../neurometabench/data/included_studies.csv. Anyone comparing v4 to v3 must regenerate
# v3's metrics too, or they will read a gold-list change as a tuning effect.
#
# WHAT IS UNCHANGED -- AND WHY THIS RUN IS CHEAP
#
# search, retrieval, parsing, annotation and output are byte-identical to v3. ONLY
# `screening.fulltext` differs. Abstract screening is untouched, so search results and abstract
# decisions both come from cache; only full-text screening and the stages after it re-run.
# v3 -> v4 isolates full-text screening exactly.
#
# WHY PRECISION, AND WHY THE EXPECTED GAIN IS SMALL
#
# v3's funnel, regenerated:
#
#     stage                 gold kept             precision   lost here
#     search                 71 / 74  (0.959)      0.035       3 gold never retrieved
#     abstract               70 / 71  (0.986)      0.135       1 gold
#     fulltext               63 / 66  (0.955)      0.401       3 gold
#     fulltext_with_coords   33 / 66  (0.500)      0.532       30 more gold lost at parsing
#
# Recall is near ceiling at all three screening stages. The project's real haemorrhage is the
# last line: THIRTY of the sixty-three correctly included gold papers yield no parsed
# coordinates. That is retrieval and parsing, not criteria, and it is deliberately out of scope
# -- editing `parsing` would stop v3 -> v4 from isolating criteria.
#
# So precision at full text is the only target, and an honest reading of the evidence says the
# available gain is SMALL. All 94 false positives were cross-tabulated against the 63 true
# positives by the phrases in the model's own reasoning. Almost nothing separates them:
#
#     feature mentioned            true positives     false positives
#     DTI / TBSS                      35%                32%
#     seed-based connectivity         17%                15%
#     cortical thickness              21%                 9%
#     structural covariance/ICA/PCA    3%                 6%
#     genetic cohort                   2%                 3%
#     explicit coordinates            95%                84%
#
# Only the last row separates at all. The false positives are, overwhelmingly, genuine bvFTD
# whole-brain studies. See the caveat below.
#
# THE DEFECT: I8 LICENSES PAPERS THAT REPORT NO COORDINATES
#
# Kamalian et al.'s stated inclusion criterion (4) is that a study "reported the COORDINATES of
# between-group contrasts in a defined stochastic space (i.e., MNI or Talairach)". v3's I8 says
# instead that results may be "in tables of coordinates, FIGURES, or supplementary materials, as
# long as they are clearly described in the text" -- which licenses a paper that shows a
# thresholded map and no coordinates at all. Fifteen false positives were admitted without the
# model's reasoning ever mentioning a coordinate, against three true positives. The reasoning is
# explicit about what was accepted instead:
#
#   "provides whole-brain, group-level voxelwise results (FWE-corrected whole-brain VBM MAPS)"
#       -- PMID 27429218
#   "reports group-level, whole-brain results (FDR-corrected MAPS presented; FIGURE 1)"
#       -- PMID 22284815
#   "reports between-group voxelwise contrasts using SPM normalization and voxel-level T-MAPS"
#       -- PMID 31493687
#
# I8 is NOT removed -- supplementary tables are a legitimate place for coordinates and several
# gold papers use them. It is narrowed to say that what must exist somewhere is actual peak
# coordinates, and that a statistical map or figure alone does not qualify.
#
# Second, smaller: a voxelwise analysis confined to a MASK is an ROI analysis, and the paper's
# stated exclusions are exactly "1) ROI 2) No Control". v3's E6 only catches a paper that is
# ROI-only in name. PMID 29423814 was admitted on "FWE-corrected voxelwise results WITHIN A
# SUBCORTICAL MASK". Three false positives, no true positives. E6 widened.
#
# THE ONE RECALL FIX: THE COMORBIDITY RULE CONTRADICTS THE BENCHMARK
#
# The paper's inclusion (1) demands bvFTD patients "with no concurrent psychiatric diagnosis ...
# other forms of dementia or NEUROLOGICAL SYMPTOMS". v3 encoded that as E7, and E7 cost a gold
# paper. From the false negatives:
#
#   "multiple participants across bvFTD groups had coexisting MOTOR NEURON DISEASE ... This
#    violates exclusion criterion E7 ... the study is excluded"   -- PMID 18268196, which is IN
#    the gold set.
#
# This is the same shape of defect already diagnosed in executive_function v2: a stated
# restriction the benchmark's own inclusions do not honour. E7 is narrowed so that comorbid
# motor neuron disease, or a genetic/familial bvFTD cohort, is not by itself disqualifying when
# the reported contrast is a bvFTD group against controls. It still excludes a patient group
# that is predominantly some other diagnosis.
#
# The other two false negatives (29748771, 30718430) are genuine I6/I7 failures -- no unpooled
# whole-brain bvFTD-vs-control contrast, and in 30718430's case the group comparison lives in an
# SI Appendix we never retrieved. Neither is fixable by a criteria edit.
#
# A CAVEAT ON WHAT "PRECISION" MEANS HERE
#
# Sampling the 94 false positives shows bvFTD-versus-healthy-control whole-brain VBM, rs-fMRI and
# FDG-PET studies with MNI coordinates and corrected statistics -- papers that look includable and
# that this meta-analysis simply did not include. Kamalian et al. kept 73 studies; our search
# returned 2027 and our search precision is 0.035. The two candidate pools overlap only partly.
# Treat dementia precision as a FLOOR rather than a measurement, as with executive_function.
#
# RISK
#
# The coordinate requirement is the change that could cost recall. A gold paper whose coordinates
# sit in a supplementary table we did not retrieve now looks, to the screener, like a paper with
# no coordinates -- and dementia already loses 30 gold papers downstream to exactly that kind of
# retrieval gap. If v4's fulltext recall_in_search drops below ~0.91 (60/66) the coordinate rule
# is being read too strictly and should be relaxed to exclude only papers that state no
# coordinates were obtained, or whose sole whole-brain result is explicitly null.
#
# The widened E6 could also catch a legitimate whole-brain analysis that merely mentions an
# explicit-mask preprocessing step; this would show up in the same recall number.
#
# The relaxed E7 cuts the other way and could ADMIT more ALS-FTD and mixed-dementia papers,
# costing precision. If precision falls while recall does not rise, E7 was relaxed too far.
#
# Watch both in v4/evaluation/performance_metrics.json, fulltext stage.

search:
  database: "pubmed"
  query: "(behavioral variant frontotemporal dementia OR bvFTD OR frontal variant frontotemporal dementia OR frontotemporal dementia OR picks disease) AND (functional magnetic resonance imaging OR fMRI OR voxel-based morphometry OR VBM OR positron emission tomography OR PET)"
  max_results: 5000
  email: "riyalouis2@gmail.com"  
  date_from: "1995/01/01"
  date_to: "2020/06/01"
  
retrieval:
  load_excluded: true
  sources:
    - pubget
  full_text_sources:
    - root_path: "articles/elsevier_output"
      pmid_source: "folder_name"
      text_path_templates:
        - 'text.txt'
      coordinates_path_templates:
        - 'coordinates.json'
    - root_path: "articles/ace_outputs"
      pmid_source: "file_name"
      allowed_extensions: [".html"]
      processed_data_path: "articles/ace_outputs/processed"
      
screening:
  abstract:
    model: "gpt-5-mini-2025-08-07"
    objective: "identify studies related to behavioral variant frontotemporal dementia (bvFTD) by their abstract"
    inclusion_criteria:
      - Study uses Voxel-Based Morphometry (VBM), fMRI (resting‐state or task based), or FDG‐PET as the imaging modality to analyze whole brain
      - Sample- participants included at least 6 human, clinically diagnosed behavioral variant frontotemporal dementia (bvFTD) patients 
    exclusion_criteria:
      - Systematic reviews or meta-analyses
      - Study should not focus on Parkinson's disease
      - Study does not use neuroimaging
      - studies with less than 6 participants
    confidence_reporting: true

  fulltext:
    model: "gpt-5-mini-2025-08-07"
    confidence_reporting: true
    objective: "identify studies related to behavioral variant frontotemporal dementia (bvFTD)"
    inclusion_criteria:
      - Study uses Voxel-Based Morphometry (VBM), fMRI (resting‐state or task based), or FDG‐PET as the imaging modality
      - Sample- participants included clinically diagnosed behavioral variant frontotemporal dementia (bvFTD) or picks disease patients 
      - Sample- At least 6 participants in the patient group, and if there is a healthy/control group, at least 6 particpants in the control group
      - Studies that reported at least one result of a between‐group contrast in a defined stochastic space (i.e., Montreal Neurological Institute [MNI] or Talairach) comparing bvFTD group to controls, where bvFTD group is not pooled with other patient groups in this result.
      - Whole-brain evidence- The paper must report at least one group-level, whole-brain (voxelwise) result that is clearly identified as coming from the target sample group.
      - >-
        Coordinates must exist- the paper must report actual PEAK COORDINATES (x, y, z values in
        MNI or Talairach space) for at least one whole-brain bvFTD-versus-control contrast. Those
        coordinates may live in a main-text table, a supplementary table, or a figure caption,
        and it is acceptable that they are referenced rather than reproduced in the body text. A
        thresholded statistical map, a t-map, or a rendered figure WITHOUT any accompanying peak
        coordinates does not satisfy this criterion.
    exclusion_criteria:
      - systematic reviews or meta-analyses
      - >-
        Studies whose qualifying result comes from a region-of-interest analysis- this includes
        voxelwise analyses confined to an anatomical MASK, small-volume-corrected (SVC) results,
        and analyses that only report per-region averages from a predefined atlas parcellation.
        Exclude when no unrestricted whole-brain voxelwise result is also reported.
      - >-
        Sample- the bvFTD patient group is predominantly some other diagnosis (e.g. a group that
        is mainly Alzheimer's disease, another dementia, or amyotrophic lateral sclerosis without
        a behavioural-variant FTD syndrome), or the bvFTD cases are not separable from a concurrent
        psychiatric diagnosis or a history of alcohol or substance abuse in the reported contrast.
        Do NOT exclude on comorbidity alone- a bvFTD cohort in which some patients also have motor
        neuron disease, or a genetic/familial bvFTD cohort, still qualifies provided the reported
        contrast is that bvFTD group against controls.
      - Non-empirical papers (e.g., reviews, meta-analyses, methods-only, simulations) without original data.
      - only reports seed‐based functional connectivity (FC), diffusion tensor imaging (DTI), or cortical thickness methods

parsing:
  parse_coordinates: true
  coordinate_model: "gpt-5-mini-2025-08-07"  

annotation:
  enabled: true
  model: "gpt-5-mini-2025-08-07"
  create_all_included_annotations: true
  prompt_type: "multi_analysis"  # explicit: this is the loader default, and what this run used
  metadata_fields:
    - "analysis_name"
    - "analysis_description"
    - "table_caption"
    - "study_title"
    - "study_fulltext"
  inclusion_criteria:
    - Whole-brain evidence- The analysis must be from a whole-brain (voxelwise) map
    - Sample- analysis includes clinically diagnosed behavioral variant frontotemporal dementia (bvFTD) or picks disease patients 
    - Analysis must compare the target bvFTD group to healthy controls
  exclusion_criteria:
    - Region-of-interest (ROI) analyses
    - Seed‐based functional connectivity (FC), diffusion tensor imaging (DTI), and cortical thickness methods
    - Explicit evidence of pooling bvFTD group with other patient groups in the analysis (e.g. bvFTD + other dementia group vs controls)
  annotations:
    - name: "dementia_all"
      description: "All analyses"
      inclusion_criteria:
        - Uses Voxel-Based Morphometry, fMRI (resting‐state or task based), and FDG-PET (Fluorodeoxyglucose Positron Emission Tomography) as the imaging modality

    - name: "dementia_decreasing_activity"
      description: "Analyses reporting decreases for bvFTD group"
      inclusion_criteria:
        - Analyses reporting any decreases in activity/connectivity, metabolism, or gray matter volume for bvFTD group (e.g. Control > bvFTD or bvFTD < Control)
        - Uses Voxel-Based Morphometry, fMRI (resting‐state or task based), and FDG-PET (Fluorodeoxyglucose Positron Emission Tomography) as the imaging modality

    - name: "structural"
      description: "VBM experiments"
      inclusion_criteria:
        - Uses Voxel-based morphometry (VBM) as the imaging modality
         
    - name: "functional"
      description: "fdg pet & fmri"
      inclusion_criteria:
        - Uses fMRI (resting‐state or task based), and FDG-PET (Fluorodeoxyglucose Positron Emission Tomography) as the imaging modality

output:
  formats:
    - csv
  nimads: true
  export_excluded_studies: true