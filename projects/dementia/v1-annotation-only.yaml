search:
  database: "pubmed"
  pmids_file: "./projects/dementia/annotation-only-studies.txt"
  
retrieval:
  load_excluded: false
  sources:
    - pubget
  full_text_sources:
    - root_path: "/Users/riyalouis/Documents/GitHub/autonima-results/projects/dementia/elsevier_output_dementia"
      pmid_source: "folder_name"
      text_path_templates:
        - 'text.txt'
      coordinates_path_templates:
        - 'coordinates.json'
    - root_path: "/Users/riyalouis/Documents/GitHub/autonima-results/projects/dementia/ace_outputs/html"
      pmid_source: "file_name"
      allowed_extensions: [".html"]
      processed_data_path: "/Users/riyalouis/Documents/GitHub/autonima-results/projects/dementia/ace_outputs/processed"

screening:
  abstract:
    skip_stage: true
  fulltext:
    skip_stage: true

parsing:
  parse_coordinates: true
  coordinate_model: "gpt-5-mini-2025-08-07"  

annotation:
  enabled: true
  model: "gpt-5-mini-2025-08-07"
  create_all_included_annotations: true
  metadata_fields:
    - "analysis_name"
    - "analysis_description"
    - "table_caption"
    - "study_title"
    - "study_abstract"
  inclusion_criteria:
    # - Sample- The analysis must be on a healthy adult participants (alone, not a clinical or special group, or a comparison between healthy and clinical/special groups).
    - uses Voxel-Based Morphometry, fMRI (resting‐state or task based), and FDG-PET (Fluorodeoxyglucose Positron Emission Tomography) as the imaging modality
    - Sample- participants included clinically diagnosed behavioral variant frontotemporal dementia (bvFTD) patients with no concurrent psychiatric diagnosis (e.g., major depressive disorder and bipolar mood disorder), other forms of dementia or neurological symptoms, and no history of alcohol and substance abuse
    - Whole-brain evidence- The analysis must be from a group-level, whole-brain (voxelwise) map
  exclusion_criteria:
    - Region-of-interest (ROI) analyses
    - Seed-based connectivity, effective connectivity (e.g., PPI, DCM), or resting-state analyses
    - Between-group contrasts or interactions (e.g., subgroup vs subgroup, patient vs control)
  
  annotations:
    - name: "dementia_all"
      description: "All experiments"

    - name: "dementia_decreasing_activity"
      description: "Experiments reporting decreases in activity/connectivity, metabolism, or gray matter volume for bvFTD group (e.g. Control > bvFTD or bvFTD < Control)"
      inclusion_criteria:
        - Analyses on experiments reporting any decreases in activity/connectivity, metabolism, or gray matter volume for bvFTD group (e.g. Control > bvFTD or bvFTD < Control)
      exclusion_criteria:
        - Analyses that show control group has decreases in activity, connectivity, metabolism, or in gray matter volume relative to bvFTD group

    - name: "structural"
      description: "VBM experiments"
      inclusion_criteria:
        - Analses using Voxel-based morphometry (VBM) for imaging
         
    - name: "functional"
      description: "fdg pet & fmri"
      inclusion_criteria:
        - Analyses that use one or more of the following imaging modalities- functional imaging (FDG-PET, resting-state fMRI (rs-fMRI), task-based fMRI (t-fMRI)) imaging

output:
  formats:
    - csv
  nimads: true
  export_excluded_studies: true