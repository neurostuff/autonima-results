# GENERATED by scripts/run_baseline_searches.py from baselines.yaml -- do not
# hand-edit; edit the spec instead. Search baseline for manual annotation
# 'structural'. Screening is skipped, so this is a Neurosynth-style pool over a
# topic-targeted search: every hit whose coordinates we could parse. The
# comparison column is 'all_analyses'.
search:
  database: pubmed
  query: '((behavioral variant frontotemporal dementia OR bvFTD OR frontal variant frontotemporal dementia
    OR frontotemporal dementia OR picks disease) AND (voxel-based morphometry OR VBM OR gray matter OR
    grey matter OR cortical thickness OR atrophy OR morphometr* OR brain volume OR structural MRI)) AND
    ("1995/01/01"[Date - Publication] : "2020/06/01"[Date - Publication])'
  max_results: 5000
  email: riyalouis2@gmail.com
  date_from: 1995/01/01
  date_to: 2020/06/01
retrieval:
  load_excluded: false
  sources:
  - pubget
  full_text_sources:
  - root_path: /home/zorro/repos/autonima-results/articles/elsevier_output
    pmid_source: folder_name
    text_path_templates:
    - text.txt
    coordinates_path_templates:
    - coordinates.json
  - root_path: /home/zorro/repos/autonima-results/articles/ace_outputs
    pmid_source: file_name
    allowed_extensions:
    - .html
    processed_data_path: /home/zorro/repos/autonima-results/articles/ace_outputs/processed
screening:
  abstract:
    skip_stage: true
  fulltext:
    skip_stage: true
parsing:
  parse_coordinates: false
annotation:
  enabled: true
  model: gpt-5-mini-2025-08-07
  create_all_included_annotations: true
  annotations: []
output:
  formats:
  - csv
  nimads: true
