#v2: changes in inclusion
search:
  database: "pubmed"
  query: "(behavioral variant frontotemporal dementia OR bvFTD OR frontal variant frontotemporal dementia OR frontotemporal dementia OR picks disease) AND (functional magnetic resonance imaging OR fMRI OR voxel-based morphometry OR VBM OR positron emission tomography OR PET)"
  max_results: 5000
  email: "riyalouis2@gmail.com"  
  date_from: "1995/01/01"
  date_to: "2020/06/01"
  
retrieval:
  load_excluded: false
  sources:
    - pubget
  full_text_sources:
    - root_path: "/home/zorro/repos/autonima-results/projects/dementia/elsevier_output"
      pmid_source: "folder_name"
      text_path_templates:
        - 'text.txt'
      coordinates_path_templates:
        - 'coordinates.json'
    - root_path: "/home/zorro/repos/autonima-results/projects/dementia/ace_outputs/html"
      pmid_source: "file_name"
      allowed_extensions: [".html"]
      processed_data_path: "/home/zorro/repos/autonima-results/projects/dementia/ace_outputs/processed"
      
screening:
  abstract:
    model: "gpt-5-mini-2025-08-07"
    objective: "identify studies related to behavioral variant frontotemporal dementia (bvFTD) by their abstract"
    inclusion_criteria:
      - Study uses Voxel-Based Morphometry (VBM), fMRI (resting‐state or task based), or FDG‐PET as the imaging modality to analyze whole brain
      - Sample- participants included at least 6 human, clinically diagnosed behavioral variant frontotemporal dementia (bvFTD) patients 
    exclusion_criteria:
      - Systematic reviews or meta-analyses
      - Study should not focus on Parkinson's disease
      - Study does not use neuroimaging
      - studies with less than 6 participants
    confidence_reporting: true

  fulltext:
    model: "gpt-5-mini-2025-08-07"
    confidence_reporting: true
    objective: "identify studies related to behavioral variant frontotemporal dementia (bvFTD)"
    inclusion_criteria:
      - Study uses Voxel-Based Morphometry (VBM), fMRI (resting‐state or task based), or FDG‐PET as the imaging modality
      - Sample- participants included clinically diagnosed behavioral variant frontotemporal dementia (bvFTD) or picks disease patients 
      - Sample- At least 6 participants in the patient group, and if there is a healthy/control group, at least 6 particpants in the control group
      - Studies that reported at least one result of a between‐group contrast in a defined stochastic space (i.e., Montreal Neurological Institute [MNI] or Talairach) comparing bvFTD group to controls, where bvFTD group is not pooled with other patient groups in this result.
      - Whole-brain evidence- The paper must report at least one group-level, whole-brain (voxelwise) result that is clearly identified as coming from the target sample group.
      - It is acceptable for qualifying whole-brain results to be reported in tables of coordinates, figures, or supplementary materials, as long as they are clearly described in the text.
    exclusion_criteria:
      - systematic reviews or meta-analyses
      - Studies that report only region-of-interest (ROI) analyses with no whole-brain results.
      - Sample- with no concurrent psychiatric diagnosis (e.g., major depressive disorder and bipolar mood disorder), other forms of dementia or neurological symptoms, and no history of alcohol or substance abuse
      - Non-empirical papers (e.g., reviews, meta-analyses, methods-only, simulations) without original data.
      - only reports seed‐based functional connectivity (FC), diffusion tensor imaging (DTI), or cortical thickness methods

parsing:
  parse_coordinates: false
  coordinate_model: "gpt-5-mini-2025-08-07"  

annotation:
  enabled: false
  model: "gpt-5-mini-2025-08-07"
  create_all_included_annotations: true
  metadata_fields:
    - "analysis_name"
    - "analysis_description"
    - "table_caption"
    - "study_title"
    - "study_abstract"
  inclusion_criteria:
    # - Sample- The analysis must be on a healthy adult participants (alone, not a clinical or special group, or a comparison between healthy and clinical/special groups).
    - uses Voxel-Based Morphometry, fMRI (resting‐state or task based), and  (Fluorodeoxyglucose Positron Emission Tomography) as the imaging modality
    - Sample- At least 6 participants
    - Sample- particpants included clinically diagnosed behavioral variant frontotemporal dementia patients with no concurrent psychiatric diagnosis (e.g., major depressive disorder and bipolar mood disorder),other forms of dementia or neurological symptoms, and no history of alcohol and substance abuse
    - Whole-brain evidence- The analysis must be from a group-level, univariate whole-brain (voxelwise) task-evoked statistical map (e.g., main effect or within-group contrast) that is from the healthy/control group and is generalizable to the healthy adult population.
  exclusion_criteria:
    - Region-of-interest (ROI) analyses
    - Seed-based connectivity, effective connectivity (e.g., PPI, DCM), or resting-state analyses (e.g., ICA, PLE, Hurst exponents) 
    - Between-group contrasts or interactions (e.g., subgroup vs subgroup, patient vs control)
  annotations:
    - name: "dementia_all"
      description: "???"
      inclusion_criteria:
        - Analyses performed a XXXX

output:
  formats:
    - csv
  nimads: true
  export_excluded_studies: true