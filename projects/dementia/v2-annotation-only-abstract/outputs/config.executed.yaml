search:
  database: pubmed
  query: ''
  max_results: null
  date_from: null
  date_to: null
  email: null
  pmids_file: /home/zorro/repos/autonima-results/projects/dementia/annotation-only-ids.txt
  pmids_list: null
screening:
  abstract:
    skip_stage: true
  fulltext:
    skip_stage: true
retrieval:
  sources:
  - pubget
  timeout: 30
  max_retries: 3
  download_directory: downloads
  n_jobs: 1
  load_excluded: false
  full_text_sources:
  - root_path: /home/zorro/repos/autonima-results/projects/dementia/elsevier_output
    pmid_source: folder_name
    text_path_templates:
    - text.txt
    coordinates_path_templates:
    - coordinates.json
  - root_path: /home/zorro/repos/autonima-results/projects/dementia/ace_outputs/html
    pmid_source: file_name
    allowed_extensions:
    - .html
    processed_data_path: /home/zorro/repos/autonima-results/projects/dementia/ace_outputs/processed
  parse_coordinates: false
  coordinate_model: gpt-4o-mini
parsing:
  parse_coordinates: true
  coordinate_model: gpt-5-mini-2025-08-07
annotation:
  model: gpt-5-mini-2025-08-07
  create_all_included_annotations: true
  metadata_fields:
  - analysis_name
  - analysis_description
  - table_caption
  - study_title
  - study_abstract
  prompt_type: multi_analysis
  inclusion_criteria: []
  exclusion_criteria: []
  annotations:
  - name: dementia_all
    description: All analyses
    inclusion_criteria:
    - "Uses Voxel-Based Morphometry, fMRI (resting\u2010state or task based), and\
      \ FDG-PET (Fluorodeoxyglucose Positron Emission Tomography) as the imaging modality"
    exclusion_criteria: []
  - name: dementia_decreasing_activity
    description: Analyses reporting decreases for bvFTD group
    inclusion_criteria:
    - Analyses reporting any decreases in activity/connectivity, metabolism, or gray
      matter volume for bvFTD group (e.g. Control > bvFTD or bvFTD < Control)
    - "Uses Voxel-Based Morphometry, fMRI (resting\u2010state or task based), and\
      \ FDG-PET (Fluorodeoxyglucose Positron Emission Tomography) as the imaging modality"
    exclusion_criteria: []
  - name: structural
    description: VBM experiments
    inclusion_criteria:
    - Uses Voxel-based morphometry (VBM) as the imaging modality
    exclusion_criteria: []
  - name: functional
    description: fdg pet & fmri
    inclusion_criteria:
    - "Uses fMRI (resting\u2010state or task based), and FDG-PET (Fluorodeoxyglucose\
      \ Positron Emission Tomography) as the imaging modality"
    exclusion_criteria: []
  enabled: true
output:
  directory: /home/zorro/repos/autonima-results/projects/dementia/v2-annotation-only-abstract
  prisma_diagram: true
  formats:
  - csv
  nimads: true
  export_excluded_studies: true
