search:
  database: pubmed
  query: ''
  max_results: null
  date_from: null
  date_to: null
  email: null
  pmids_file: /home/zorro/repos/autonima-results/projects/executive_function/annotation-only-ids.txt
  pmids_list: null
screening:
  abstract:
    skip_stage: true
  fulltext:
    skip_stage: true
retrieval:
  sources:
  - pubget
  timeout: 30
  max_retries: 3
  download_directory: downloads
  n_jobs: 1
  load_excluded: false
  full_text_sources:
  - root_path: /home/zorro/repos/autonima-results/articles/elsevier_output/
    pmid_source: folder_name
    text_path_templates:
    - text.txt
    coordinates_path_templates:
    - coordinates.json
  - root_path: /home/zorro/repos/autonima-results/articles/ace_outputs
    pmid_source: file_name
    allowed_extensions:
    - .html
    processed_data_path: /home/zorro/repos/autonima-results/articles/ace_outputs/processed/
  parse_coordinates: false
  coordinate_model: gpt-4o-mini
parsing:
  parse_coordinates: true
  coordinate_model: gpt-5-mini-2025-08-07
annotation:
  model: gpt-5-mini-2025-08-07
  create_all_included_annotations: true
  metadata_fields:
  - analysis_name
  - analysis_description
  - table_caption
  - study_title
  - study_fulltext
  prompt_type: multi_analysis
  inclusion_criteria:
  - Scope- You are judging ONE analysis, not the paper. The study text is provided
    only to interpret this analysis. That the paper elsewhere reports a qualifying
    contrast is not by itself a reason to include this analysis.
  - How to read the analysis- Judge it from its name, its description and its table
    caption together. An empty or uninformative analysis name (e.g. "analysis_0")
    usually means the analysis is the only one in its table, in which case the caption
    describes it fully and you should judge from the caption. A blank name is never
    itself a reason to exclude.
  - The analysis must be a within-group, group-level, whole-brain (voxelwise) task
    activation contrast.
  - Sample- Any participant group qualifies, including clinical samples (e.g. schizophrenia,
    depression) and developmental samples (e.g. adolescents), so long as the contrast
    is computed WITHIN a group rather than between groups. Do not exclude an analysis
    because of who the participants were.
  - Baseline- The comparison condition may be an active control task, or an implicit
    baseline, rest or fixation. A main effect of task against implicit baseline qualifies.
    Do not require an active control condition.
  - Response mode- The task may require an overt behavioral response (e.g. a button
    press) or a covert one (e.g. silent naming or counting). Do not require an overt
    response.
  exclusion_criteria:
  - 'Group-comparison contrasts- an analysis whose contrast is between two participant
    groups (e.g. patients vs controls, adults vs adolescents) or a group x condition
    interaction. Note this is about the CONTRAST, not the sample: a within-group contrast
    computed in a patient or adolescent sample is eligible.'
  - Region-of-interest (ROI) or small-volume-corrected (SVC) analyses
  - Connectivity or resting-state analyses (functional connectivity, PPI, DCM, ICA)
  - The analysis does not reflect an executive function task contrast at all (e.g.
    a motor or sensory localiser, a physiological or artefact regressor, or a purely
    structural result).
  annotations:
  - name: pooled_executive_function
    description: Executive function task activation pooled across all six domains
      (flexibility, inhibition, working memory, initiation, planning, vigilance).
    inclusion_criteria:
    - 'The task belongs to any of the six executive function domains: flexibility,
      inhibition, working memory, initiation, planning, or vigilance'
    - The contrast reflects the executive demand of that task (this includes a main
      effect of the task against implicit baseline, not only task-versus-active-control
      contrasts)
    exclusion_criteria: []
  - name: working_memory
    description: Maintain information, context, or temporal/spatial relationships
      online and manipulate or use that information to guide response selection.
    inclusion_criteria:
    - 'Task is a WORKING MEMORY paradigm: n-back, AX-CPT, Sternberg task, delayed
      match-to-sample, spatial span or sequence recall, or complex calculation/PASAT'
    - The contrast reflects memory load, maintenance or manipulation (e.g. 2-back
      > 0-back, high load > low load, main effect of delay, a linear regression on
      load, or an encoding or retrieval main effect)
    exclusion_criteria:
    - 'The contrast being annotated isolates a different executive function domain
      (e.g., Go/No-Go, Stroop, task switching, Tower tasks, word generation, oddball).
      Other tasks reported elsewhere in the same paper are irrelevant: judge only
      the contrast described by this analysis.'
  - name: inhibition
    description: Inhibit a prepotent response in order to make a correct but less
      common response.
    inclusion_criteria:
    - 'Task is an INHIBITION paradigm: Go/No-Go, Stroop, Flanker, Simon task, or antisaccade'
    - The contrast reflects the inhibitory demand (e.g. No-Go > Go, incongruent >
      congruent, antisaccade > prosaccade, or a No-Go or Stroop main effect against
      implicit baseline)
    exclusion_criteria:
    - 'The contrast being annotated isolates a different executive function domain
      (e.g., n-back, Sternberg, task switching, Tower tasks, word generation, oddball).
      Other tasks reported elsewhere in the same paper are irrelevant: judge only
      the contrast described by this analysis.'
  - name: cognitive_flexibility
    description: Switch from one task or rule to another.
    inclusion_criteria:
    - 'Task is a FLEXIBILITY paradigm: task switching or the Wisconsin Card Sorting
      Test'
    - The contrast reflects the switching demand (e.g. switch trials > repeat trials,
      set-shifting > maintenance, or a switching main effect)
    exclusion_criteria:
    - 'The contrast being annotated isolates a different executive function domain
      (e.g., n-back, Go/No-Go, Stroop, Tower tasks, word generation, oddball). Other
      tasks reported elsewhere in the same paper are irrelevant: judge only the contrast
      described by this analysis.'
  - name: planning
    description: Identify and organize the steps and elements needed to carry out
      an intention or achieve a goal.
    inclusion_criteria:
    - 'Task is a PLANNING paradigm: Tower Maze test, Tower of London, or Tower of
      Hanoi'
    - The contrast reflects planning demand (e.g. high-move > low-move planning problems,
      or a planning main effect)
    exclusion_criteria:
    - 'The contrast being annotated isolates a different executive function domain
      (e.g., n-back, Go/No-Go, Stroop, task switching, word generation, oddball).
      Other tasks reported elsewhere in the same paper are irrelevant: judge only
      the contrast described by this analysis.'
  - name: vigilance
    description: Maintaining set in the face of interference.
    inclusion_criteria:
    - 'Task is a VIGILANCE paradigm: oddball discrimination, or an equivalent task
      requiring set maintenance while resisting interference'
    - The contrast reflects the demand to maintain set (e.g. target > standard stimuli,
      or a target-detection main effect)
    exclusion_criteria:
    - 'The contrast being annotated isolates a different executive function domain
      (e.g., n-back, Go/No-Go, Stroop, task switching, Tower tasks, word generation).
      Other tasks reported elsewhere in the same paper are irrelevant: judge only
      the contrast described by this analysis.'
  - name: initiation
    description: Initiate a sequence of complex behaviors.
    inclusion_criteria:
    - 'Task is an INITIATION paradigm: word generation or verbal fluency'
    - The contrast reflects self-initiated generation (e.g. word generation > word
      repetition, or a generation main effect). Covert or silent generation qualifies.
    exclusion_criteria:
    - 'The contrast being annotated isolates a different executive function domain
      (e.g., n-back, Go/No-Go, Stroop, task switching, Tower tasks, oddball). Other
      tasks reported elsewhere in the same paper are irrelevant: judge only the contrast
      described by this analysis.'
  enabled: true
output:
  directory: projects/executive_function/v3-annotation-only
  prisma_diagram: true
  formats:
  - csv
  - json
  nimads: true
  export_excluded_studies: true
