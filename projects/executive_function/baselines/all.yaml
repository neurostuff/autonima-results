# GENERATED by scripts/run_baseline_searches.py from baselines.yaml -- do not
# hand-edit; edit the spec instead. Search baseline for manual annotation
# 'all'. Screening is skipped, so this is a Neurosynth-style pool over a
# topic-targeted search: every hit whose coordinates we could parse. The
# comparison column is 'all_analyses'.
#
# Reproduces v1.yaml's executive-domain clause.
search:
  database: pubmed
  query: '(((("functional magnetic resonance imaging"[Mesh] OR fMRI[tiab] OR "magnetic resonance imaging"[tiab]
    OR "positron emission tomography"[Mesh] OR PET[tiab]) AND Humans[mh] AND English[lang]) AND ("executive
    function"[Mesh] OR "executive function*"[tiab] OR "cognitive control"[tiab] OR "working memory"[Mesh]
    OR "working memory"[tiab] OR inhibition[tiab] OR inhibitory[tiab] OR "cognitive flexibility"[tiab]
    OR "set shifting"[tiab] OR "task switching"[tiab] OR planning[tiab] OR vigilance[tiab] OR "sustained
    attention"[tiab] OR initiation[tiab] OR "go/no-go"[tiab] OR "go no go"[tiab] OR "stop signal"[tiab]
    OR stroop[tiab] OR "n-back"[tiab] OR "tower of london"[tiab] OR "tower of hanoi"[tiab] OR "wisconsin
    card sorting"[tiab] OR "continuous performance task"[tiab])) AND ("1988/01/01"[Date - Publication]
    : "2008/12/31"[Date - Publication])) NOT (review[pt] OR "systematic review"[tiab] OR meta-analysis[pt])'
  date_from: 1988/01/01
  date_to: 2008/12/31
  max_results: 20000
  email: aid338@eid.utexas.edu
retrieval:
  load_excluded: false
  sources:
  - pubget
  full_text_sources:
  - root_path: /home/zorro/repos/autonima-results/articles/elsevier_output/
    pmid_source: folder_name
    text_path_templates:
    - text.txt
    coordinates_path_templates:
    - coordinates.json
  - root_path: /home/zorro/repos/autonima-results/articles/ace_outputs
    pmid_source: file_name
    allowed_extensions:
    - .html
    processed_data_path: /home/zorro/repos/autonima-results/articles/ace_outputs/processed/
screening:
  abstract:
    skip_stage: true
  fulltext:
    skip_stage: true
parsing:
  parse_coordinates: false
annotation:
  enabled: true
  model: gpt-5-mini-2025-08-07
  create_all_included_annotations: true
  annotations: []
output:
  formats:
  - csv
  nimads: true
