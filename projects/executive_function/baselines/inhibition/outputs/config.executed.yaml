search:
  database: pubmed
  query: '(((("functional magnetic resonance imaging"[Mesh] OR fMRI[tiab] OR "magnetic
    resonance imaging"[tiab] OR "positron emission tomography"[Mesh] OR PET[tiab])
    AND Humans[mh] AND English[lang]) AND (inhibition[tiab] OR inhibitory[tiab] OR
    "response inhibition"[tiab] OR "go/no-go"[tiab] OR "go no go"[tiab] OR "no-go"[tiab]
    OR "stop signal"[tiab] OR "stop-signal"[tiab] OR stroop[tiab] OR flanker[tiab]
    OR "simon task"[tiab] OR antisaccade[tiab] OR "interference control"[tiab])) AND
    ("1988/01/01"[Date - Publication] : "2008/12/31"[Date - Publication])) NOT (review[pt]
    OR "systematic review"[tiab] OR meta-analysis[pt])'
  max_results: 20000
  date_from: 1988/01/01
  date_to: 2008/12/31
  email: aid338@eid.utexas.edu
  pmids_file: null
  pmids_list: null
screening:
  abstract:
    skip_stage: true
  fulltext:
    skip_stage: true
retrieval:
  sources:
  - pubget
  timeout: 30
  max_retries: 3
  download_directory: downloads
  n_jobs: 1
  load_excluded: false
  full_text_sources:
  - root_path: /home/zorro/repos/autonima-results/articles/elsevier_output/
    pmid_source: folder_name
    text_path_templates:
    - text.txt
    coordinates_path_templates:
    - coordinates.json
  - root_path: /home/zorro/repos/autonima-results/articles/ace_outputs
    pmid_source: file_name
    allowed_extensions:
    - .html
    processed_data_path: /home/zorro/repos/autonima-results/articles/ace_outputs/processed/
  parse_coordinates: false
  coordinate_model: gpt-4o-mini
parsing:
  parse_coordinates: false
  coordinate_model: gpt-4o-mini
annotation:
  model: gpt-5-mini-2025-08-07
  create_all_included_annotations: true
  metadata_fields:
  - analysis_name
  - analysis_description
  - table_caption
  - study_title
  prompt_type: multi_analysis
  inclusion_criteria: []
  exclusion_criteria: []
  annotations: []
  enabled: true
output:
  directory: projects/executive_function/baselines/inhibition
  prisma_diagram: true
  formats:
  - csv
  nimads: true
  export_excluded_studies: false
