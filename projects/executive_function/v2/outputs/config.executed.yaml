search:
  database: pubmed
  query: '(((("functional magnetic resonance imaging"[Mesh] OR fMRI[tiab] OR "magnetic
    resonance imaging"[tiab] OR "positron emission tomography"[Mesh] OR PET[tiab]))
    AND (("executive function"[Mesh] OR "executive function*"[tiab] OR "cognitive
    control"[tiab] OR "working memory"[Mesh] OR "working memory"[tiab] OR inhibition[tiab]
    OR inhibitory[tiab] OR "cognitive flexibility"[tiab] OR "set shifting"[tiab] OR
    "task switching"[tiab] OR planning[tiab] OR vigilance[tiab] OR "sustained attention"[tiab]
    OR initiation[tiab] OR "go/no-go"[tiab] OR "go no go"[tiab] OR "stop signal"[tiab]
    OR stroop[tiab] OR "n-back"[tiab] OR "tower of london"[tiab] OR "tower of hanoi"[tiab]
    OR "wisconsin card sorting"[tiab] OR "continuous performance task"[tiab]))) AND
    Humans[mh] AND English[lang]) NOT (review[pt] OR "systematic review"[tiab] OR
    meta-analysis[pt]))

    '
  max_results: 20000
  date_from: 1988/01/01
  date_to: 2008/12/31
  email: aid338@eid.utexas.edu
  pmids_file: null
  pmids_list: null
screening:
  abstract:
    model: gpt-5-mini-2025-08-07
    threshold: null
    confidence_reporting: true
    objective: Meta-analysis of executive function task activations in healthy adults
    inclusion_criteria:
    - English-language peer-reviewed neuroimaging studies
    - Healthy human participants
    - Functional MRI (fMRI) or positron emission tomography (PET) studies
    - Studies examining executive function or cognitive control tasks
    exclusion_criteria:
    - Non-human studies
    - Non-English studies
    additional_instructions: null
    criteria_mapping:
      inclusion:
        I1: English-language peer-reviewed neuroimaging studies
        I2: Healthy human participants
        I3: Functional MRI (fMRI) or positron emission tomography (PET) studies
        I4: Studies examining executive function or cognitive control tasks
      exclusion:
        E1: Non-human studies
        E2: Non-English studies
  fulltext:
    model: gpt-5-mini-2025-08-07
    threshold: null
    confidence_reporting: true
    objective: Meta-analysis of executive function task activations, pooled across
      participant groups
    inclusion_criteria:
    - Functional MRI (fMRI) or positron emission tomography (PET) study assessing
      executive function or cognitive control using a task-based paradigm
    - Tasks must fall within established executive function domains (working memory,
      inhibition, cognitive flexibility, planning, vigilance, initiation)
    - Whole-brain evidence- at least one analysis must be a group-level, voxelwise
      task-evoked statistical map. Partial-brain acquisition (e.g. limited slice coverage)
      still qualifies, so long as the analysis was voxelwise rather than confined
      to a priori regions.
    - At least one analysis must be a WITHIN-GROUP task contrast. The comparison condition
      may be an active control task, or an implicit baseline, rest or fixation- a
      main effect of task against implicit baseline qualifies.
    - Any participant group qualifies, including clinical samples (e.g. schizophrenia,
      depression) and developmental samples (e.g. adolescents), provided a within-group
      task contrast is reported for at least one group. Do not exclude a study because
      of who its participants were, or because it does not state their ages.
    - It is acceptable for qualifying whole-brain results to be reported in tables
      of coordinates, figures, or supplementary materials, as long as they are clearly
      described in the text.
    exclusion_criteria:
    - Studies that report only region-of-interest (ROI) or small-volume-corrected
      analyses with no voxelwise results.
    - Studies that report only connectivity analyses (e.g., functional connectivity,
      PPI, DCM) or resting-state analyses without also reporting a task activation
      map.
    - Studies that report ONLY between-group contrasts (e.g., patient vs control,
      adults vs adolescents) or group x condition interactions, with no within-group
      task activation contrast for any group. Note this is about the contrast, not
      the sample- a within-group contrast computed in a patient or adolescent sample
      qualifies.
    - Non-empirical papers (e.g., reviews, meta-analyses, methods-only, simulations)
      without original human neuroimaging data.
    additional_instructions: null
    criteria_mapping:
      inclusion:
        I5: Functional MRI (fMRI) or positron emission tomography (PET) study assessing
          executive function or cognitive control using a task-based paradigm
        I6: Tasks must fall within established executive function domains (working
          memory, inhibition, cognitive flexibility, planning, vigilance, initiation)
        I7: Whole-brain evidence- at least one analysis must be a group-level, voxelwise
          task-evoked statistical map. Partial-brain acquisition (e.g. limited slice
          coverage) still qualifies, so long as the analysis was voxelwise rather
          than confined to a priori regions.
        I8: At least one analysis must be a WITHIN-GROUP task contrast. The comparison
          condition may be an active control task, or an implicit baseline, rest or
          fixation- a main effect of task against implicit baseline qualifies.
        I9: Any participant group qualifies, including clinical samples (e.g. schizophrenia,
          depression) and developmental samples (e.g. adolescents), provided a within-group
          task contrast is reported for at least one group. Do not exclude a study
          because of who its participants were, or because it does not state their
          ages.
        I10: It is acceptable for qualifying whole-brain results to be reported in
          tables of coordinates, figures, or supplementary materials, as long as they
          are clearly described in the text.
      exclusion:
        E3: Studies that report only region-of-interest (ROI) or small-volume-corrected
          analyses with no voxelwise results.
        E4: Studies that report only connectivity analyses (e.g., functional connectivity,
          PPI, DCM) or resting-state analyses without also reporting a task activation
          map.
        E5: Studies that report ONLY between-group contrasts (e.g., patient vs control,
          adults vs adolescents) or group x condition interactions, with no within-group
          task activation contrast for any group. Note this is about the contrast,
          not the sample- a within-group contrast computed in a patient or adolescent
          sample qualifies.
        E6: Non-empirical papers (e.g., reviews, meta-analyses, methods-only, simulations)
          without original human neuroimaging data.
retrieval:
  sources:
  - pubget
  timeout: 30
  max_retries: 3
  download_directory: downloads
  n_jobs: 1
  load_excluded: true
  full_text_sources:
  - root_path: /home/zorro/repos/autonima-results/articles/elsevier_output/
    pmid_source: folder_name
    text_path_templates:
    - text.txt
    coordinates_path_templates:
    - coordinates.json
  - root_path: /home/zorro/repos/autonima-results/articles/ace_outputs
    pmid_source: file_name
    allowed_extensions:
    - .html
    processed_data_path: /home/zorro/repos/autonima-results/articles/ace_outputs/processed/
  parse_coordinates: false
  coordinate_model: gpt-4o-mini
parsing:
  parse_coordinates: true
  coordinate_model: gpt-5-mini-2025-08-07
annotation:
  model: gpt-5-mini-2025-08-07
  create_all_included_annotations: true
  metadata_fields:
  - analysis_name
  - analysis_description
  - table_caption
  - study_title
  - study_abstract
  prompt_type: multi_analysis
  inclusion_criteria:
  - Whole-brain evidence- The analysis must be from a group-level, univariate whole-brain
    (voxelwise) task-evoked statistical map (e.g., main effect or within-group contrast).
    Between-group contrasts are acceptable only if they include or clearly reflect
    a within-group task activation effect in healthy participants.
  - Contrast or analysis must be relevant to executive function or cognitive control
    task performance.
  exclusion_criteria:
  - Region-of-interest (ROI) analyses
  - Seed-based connectivity, effective connectivity (e.g., PPI, DCM), or resting-state
    analyses (e.g., ICA, PLE, Hurst exponents)
  - Analyses not involving executive function or cognitive control processes
  annotations:
  - name: pooled_executive_function
    description: Executive function task activation across all domains
    inclusion_criteria:
    - 'Analyses must be on a task measuring executive function or cognitive control
      (example tasks: Working memory tasks, Go/No-Go, Stroop, Task switching, Planning
      tasks)'
    - 'The analysis/contrast must measure task-related activation compared to an active
      control condition (example contrast: Task>control condition)'
    exclusion_criteria: []
  - name: working_memory
    description: Working memory involves the temporary maintenance and manipulation
      of information to guide behavior.
    inclusion_criteria:
    - 'Analyses must be on a task measuring WORKING MEMORY (example tasks: n-back,
      delayed match-to-sample)'
    - 'The analysis/contrast must measure working memory-related activation compared
      to a control condition (example contrast: 2-back>0-back)'
    exclusion_criteria: []
  - name: inhibition
    description: Inhibition refers to the ability to suppress prepotent or automatic
      responses.
    inclusion_criteria:
    - 'Analyses must be on a task measuring INHIBITORY CONTROL (example tasks: Go/No-Go,
      Stop-signal, Stroop)'
    - 'The analysis/contrast must measure inhibition-related activation compared to
      a control condition (example contrast: No-Go>Go, Incongruent>Congruent)'
    exclusion_criteria: []
  - name: cognitive_flexibility
    description: Cognitive flexibility involves the ability to shift between tasks,
      rules, or mental sets.
    inclusion_criteria:
    - 'Analyses must be on a task measuring COGNITIVE FLEXIBILITY (example tasks:
      Task switching, Wisconsin Card Sorting Test)'
    - 'The analysis/contrast must measure flexibility-related activation compared
      to a control condition (example contrast: Switch>Repeat)'
    exclusion_criteria: []
  - name: planning
    description: Planning involves the ability to organize and sequence goal-directed
      actions.
    inclusion_criteria:
    - 'Analyses must be on a task measuring PLANNING (example tasks: Tower of London,
      Tower of Hanoi)'
    - The analysis/contrast must measure planning-related activation compared to a
      control condition
    exclusion_criteria: []
  - name: vigilance
    description: Vigilance refers to sustained attention over prolonged periods.
    inclusion_criteria:
    - 'Analyses must be on a task measuring VIGILANCE or sustained attention (example
      tasks: Continuous Performance Task)'
    - The analysis/contrast must measure vigilance-related activation compared to
      a control condition
    exclusion_criteria: []
  - name: initiation
    description: Initiation involves the ability to begin or generate goal-directed
      behavior.
    inclusion_criteria:
    - 'Analyses must be on a task measuring INITIATION (example tasks: verbal fluency,
      action generation tasks)'
    - The analysis/contrast must measure initiation-related activation compared to
      a control condition
    exclusion_criteria: []
  enabled: true
output:
  directory: projects/executive_function/v2
  prisma_diagram: true
  formats:
  - csv
  - json
  nimads: true
  export_excluded_studies: true
