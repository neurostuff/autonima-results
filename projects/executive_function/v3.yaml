# v3 -- AUTOMATICALLY GENERATED by Claude (Opus 5) on 2026-08-26.
#
# PROVENANCE: written by an LLM agent, not a human expert, from the source paper
# (PMC3660731, Niendam et al. 2012, PMID 22282036) and this project's own error reports.
# Benchmark-tuned -- report as an iterated version, never as held-out.
#
# WHAT THIS IS: the combination of the two v1->later criteria changes that were previously
# split across two files asserting the same version number.
#
#   v2.yaml               relaxed FULL-TEXT SCREENING, kept v1's annotation
#   v3-annotation-only    relaxed ANNOTATION (formerly v2-annotation-only)
#   v3.yaml (this file)   v2's screening block + v3-annotation-only's annotation block
#
# Under this repo's convention the version number tracks the CRITERIA, so v3.yaml and
# v3-annotation-only share annotation criteria exactly and differ only in run mode: this is a
# full run with search and screening, that one is a fixed PMID list with screening skipped.
#
# WHY BOTH CHANGES BELONG TOGETHER
#
# They are the same defect at two stages. Niendam et al. state three restrictions that their
# realized inclusions violate -- contrasts must be against an active control, participants must
# be healthy adults aged 18-60, and (at annotation) responses must be overt. v2 removed the
# first two where they rejected whole PAPERS at full-text screening; v3-annotation-only removes
# all three where they reject individual ANALYSES. Fixing only one leaves the pipeline
# internally inconsistent: screening admits clinical and adolescent samples that annotation then
# discards, or vice versa.
#
# MEASURED EFFECT OF EACH HALF, SEPARATELY
#
#   v1 -> v2 (screening only): fulltext recall_in_search 0.821 -> 0.971, recall_all_meta
#   0.322 -> 0.386 (11 more gold papers), precision 0.110 -> 0.094. On the corpus F1 metric that
#   is a small net loss (0.163 -> 0.152), because EF precision is measured against a
#   BrainMap-curated pool and its "false positives" are largely genuine EF papers BrainMap never
#   coded. Read the recall gain as the real effect.
#
#   v1 -> v3-annotation-only (annotation only): reported at fair-comparison level as dice 0.566
#   -> 0.556, i.e. slightly worse at map level despite better per-criterion behaviour. That is
#   the recurring pattern in this corpus -- map quality tracks annotation PRECISION, and these
#   relaxations trade precision for recall.
#
# RISK, STATED UP FRONT
#
# Because both halves trade precision for recall, v3 may well be worse at map level than either
# v1 or v2 even while recovering more gold papers. If v3's fair-comparison dice falls below v1's
# 0.566 while its screening recall stays above v2's 0.971, that is the expected outcome rather
# than a bug, and the honest conclusion is that EF's stated criteria cannot be repaired by
# relaxation alone. Do not present v3 as an improvement without checking the map-level number.
#
# COST: search and abstract screening are byte-identical to v2, so both come from cache. Only
# full-text screening onward re-runs -- and full-text screening is itself identical to v2's, so
# in practice this run reuses v2's screening decisions and differs only from annotation onward.

# v2 -- AUTOMATICALLY GENERATED by Claude (Opus 5) on 2026-08-25.
#
# PROVENANCE, STATED PLAINLY
#
# This schema was written by an LLM agent, not a human expert. Its inputs were the source
# paper's full text (PMC3660731, Niendam et al. 2012, PMID 22282036) and this project's own v1
# error reports (v1/reports/qualitative/false_negatives_fulltext.html and
# v1/evaluation/performance_metrics.json). No human domain expert reviewed the criteria below
# before the run. It is tuned against the benchmark and must be reported as an iterated
# version, never as a held-out one.
#
# WHAT IS UNCHANGED -- AND WHY THIS RUN IS CHEAP
#
# search, retrieval, parsing, annotation and output are byte-identical to v1. ONLY the
# `screening.fulltext` block differs. Abstract screening is untouched, so the search results and
# the abstract-screening decisions both come from cache; only full-text screening and the stages
# downstream of it need to re-run. v1 -> v2 isolates full-text screening exactly.
#
# WHY FULL-TEXT SCREENING AND NOT SEARCH
#
# v1's funnel, from v1/evaluation/performance_metrics.json:
#
#     stage       gold kept              precision    lost here
#     search      127 / 171  (0.743)       0.026        44 gold never retrieved
#     abstract    111 / 127  (0.874)       0.084        16 gold
#     fulltext     55 /  67  (0.821)       0.110        12 gold screened out
#     (of the 127 gold in search, only 67 had usable full text: 30 missing + 21 incomplete)
#
# Full-text screening is NOT where most recall is lost -- retrieval is (51 papers), then search
# (44). But full-text screening is the only one of those fixable by a schema edit, and its 447
# false positives dominate the project's headline F1 of 0.163. Recall gains here are bounded at
# +12 papers; the real target is precision plus the handful of gold papers rejected on criteria
# the benchmark itself does not honour.
#
# THE DEFECT: v1's FULL-TEXT CRITERIA CONTRADICT THE BENCHMARK'S OWN INCLUSIONS
#
# This is the same defect already diagnosed at the annotation stage in v2-annotation-only, but
# operating at full-text screening, where it rejects whole PAPERS rather than single analyses.
# Niendam et al. state three restrictions that their realized inclusions violate:
#
#   1. ACTIVE CONTROL. Stated: contrasts must be "compared to an active control task, rather
#      than to rest or fixation". v1 encoded this as an inclusion AND an exclusion. Observed in
#      v1's own false negatives: "its control condition is a passive fixation/rest baseline
#      (subjects in total darkness maintaining fixation), which meets exclusion criterion E6",
#      and "the reported contrasts are task phases versus an implicit baseline". Yet the manual
#      includes PMID 12880912's "Primary Counting No-Go Effects", a main effect against implicit
#      baseline. REMOVED.
#
#   2. AGE 18-60 AND HEALTHY-ONLY. Stated as an exclusion; v1 encoded it as E8. Observed in v1's
#      false negatives: "the study includes a clinical schizophrenia patient group", "the sample
#      includes participants outside the 18-60 year range (adolescents aged 10-17)", "the
#      article title explicitly states the sample are patients with schizophrenia". Yet the
#      manual includes analyses from PMID 11231835 (schizophrenia), 16983390 (MDD patients) and
#      17885578 (adolescents 11-17). The benchmark pools across clinical and developmental
#      samples so long as the CONTRAST is within-group. REPLACED with a contrast-type rule.
#
#   3. REPORTING COMPLETENESS. v1's I10 required that age, health status, modality and paradigm
#      all be reported. Observed: "the full text does not report participant ages (it notes
#      seven healthy right-handed male subjects but gives no age information)" -- a gold paper
#      rejected for what it failed to state. The benchmark drew its metadata from BrainMap, not
#      from the paper, so a paper omitting its age range was still includable. REMOVED.
#
# Also softened: v1's whole-brain criterion rejected a gold paper because "the imaging covered
# limited transverse slices (not whole-brain coverage)". The requirement is that the analysis be
# voxelwise rather than confined to a priori ROIs, not that the acquisition covered the whole
# head. Retained as an ROI exclusion only.
#
# KEPT UNCHANGED: the ROI-only, connectivity-only and non-empirical exclusions. Each is a
# genuine methodological restriction the benchmark does honour.
#
# A CAVEAT THAT NO SCHEMA CAN FIX
#
# Niendam et al. searched the BrainMap database, not PubMed. Their pool was BrainMap's curated
# contents circa 2011 -- a subset of the literature that had already been coded by hand. Many of
# our 447 "false positives" are genuine executive-function fMRI papers that BrainMap simply had
# not coded, so they were never candidates for the manual screen. EF precision is a floor, not a
# measurement, and a precision gain here is worth less than the same gain elsewhere. Do not read
# v1 -> v2 precision as if it were measured against an exhaustive gold standard.
#
# RISK
#
# Dropping the age and active-control gates admits clinical, developmental and
# implicit-baseline papers, which will increase full-text includes and therefore parsing and
# annotation cost. v1's annotation block is already permissive on all three axes (it has no age,
# sample or baseline criteria), so nothing downstream will re-reject what screening now admits
# -- but the annotation stage will see more analyses per run.

# v1 — search window narrowed to the gold standard's actual publication range.
#
# The benchmark (Niendam et al. 2012, PMC3660731) states no search dates and searched
# the BrainMap database rather than PubMed, so no cutoff can be taken from the paper.
# Its 178 studies span 1988-2008, and that range is used here as the best available
# proxy for what was screenable.
#
# CHANGES vs the archived v1-2010:
#   date_to   2010/12/31 -> 2008/12/31   the previous window admitted ~223 studies
#                                        published after the newest gold study, which
#                                        the meta-analysis could not have screened yet
#                                        were scored as screening false positives.
#   date_from 1990/01/01 -> 1988/01/01   the previous window EXCLUDED two gold studies
#                                        outright (Petersen 1988, Petersen 1989), a
#                                        guaranteed and unrecoverable recall loss.
#
# Caveat: this is an inference from the gold set's observed range, not a stated method.
# The manual's true pool was BrainMap's contents circa 2011, which is a curated subset
# of the literature -- so even within this window, some of our includes were never
# candidates for the manual screen. EF precision remains a floor, not a measurement.
#
# Inital version
# Used GPT to help draft inital draft, based on previously examples.
search:
  database: "pubmed"
  query: >
    (((("functional magnetic resonance imaging"[Mesh] OR fMRI[tiab] OR "magnetic resonance imaging"[tiab]
    OR "positron emission tomography"[Mesh] OR PET[tiab]))
    AND
    (("executive function"[Mesh] OR "executive function*"[tiab] OR "cognitive control"[tiab]
    OR "working memory"[Mesh] OR "working memory"[tiab]
    OR inhibition[tiab] OR inhibitory[tiab]
    OR "cognitive flexibility"[tiab] OR "set shifting"[tiab] OR "task switching"[tiab]
    OR planning[tiab] OR vigilance[tiab] OR "sustained attention"[tiab]
    OR initiation[tiab]
    OR "go/no-go"[tiab] OR "go no go"[tiab] OR "stop signal"[tiab]
    OR stroop[tiab] OR "n-back"[tiab] OR "tower of london"[tiab]
    OR "tower of hanoi"[tiab] OR "wisconsin card sorting"[tiab]
    OR "continuous performance task"[tiab])))
    AND Humans[mh] AND English[lang])
    NOT (review[pt] OR "systematic review"[tiab] OR meta-analysis[pt]))
  date_from: 1988/01/01
  date_to: 2008/12/31
  max_results: 20000
  email: "aid338@eid.utexas.edu"

retrieval:
  load_excluded: true
  sources:
    - pubget
  full_text_sources:
    - root_path: "/home/zorro/repos/autonima-results/articles/elsevier_output/"
      pmid_source: "folder_name"
      text_path_templates:
        - 'text.txt'
      coordinates_path_templates:
        - 'coordinates.json'
    - root_path: "/home/zorro/repos/autonima-results/articles/ace_outputs"
      pmid_source: "file_name"
      allowed_extensions: [".html"]
      processed_data_path: "/home/zorro/repos/autonima-results/articles/ace_outputs/processed/"

screening:
  abstract:
    model: "gpt-5-mini-2025-08-07"
    objective: "Meta-analysis of executive function task activations in healthy adults"
    inclusion_criteria:
      - English-language peer-reviewed neuroimaging studies
      - Healthy human participants
      - Functional MRI (fMRI) or positron emission tomography (PET) studies
      - Studies examining executive function or cognitive control tasks
    exclusion_criteria:
      - Non-human studies
      - Non-English studies
    confidence_reporting: true

  fulltext:
    model: "gpt-5-mini-2025-08-07"
    confidence_reporting: true
    objective: "Meta-analysis of executive function task activations, pooled across participant groups"
    inclusion_criteria:
      - Functional MRI (fMRI) or positron emission tomography (PET) study assessing executive function or cognitive control using a task-based paradigm
      - Tasks must fall within established executive function domains (working memory, inhibition, cognitive flexibility, planning, vigilance, initiation)
      - Whole-brain evidence- at least one analysis must be a group-level, voxelwise task-evoked statistical map. Partial-brain acquisition (e.g. limited slice coverage) still qualifies, so long as the analysis was voxelwise rather than confined to a priori regions.
      - At least one analysis must be a WITHIN-GROUP task contrast. The comparison condition may be an active control task, or an implicit baseline, rest or fixation- a main effect of task against implicit baseline qualifies.
      - Any participant group qualifies, including clinical samples (e.g. schizophrenia, depression) and developmental samples (e.g. adolescents), provided a within-group task contrast is reported for at least one group. Do not exclude a study because of who its participants were, or because it does not state their ages.
      - It is acceptable for qualifying whole-brain results to be reported in tables of coordinates, figures, or supplementary materials, as long as they are clearly described in the text.
    exclusion_criteria:
      - Studies that report only region-of-interest (ROI) or small-volume-corrected analyses with no voxelwise results.
      - Studies that report only connectivity analyses (e.g., functional connectivity, PPI, DCM) or resting-state analyses without also reporting a task activation map.
      - Studies that report ONLY between-group contrasts (e.g., patient vs control, adults vs adolescents) or group x condition interactions, with no within-group task activation contrast for any group. Note this is about the contrast, not the sample- a within-group contrast computed in a patient or adolescent sample qualifies.
      - Non-empirical papers (e.g., reviews, meta-analyses, methods-only, simulations) without original human neuroimaging data.

parsing:
  parse_coordinates: true
  coordinate_model: "gpt-5-mini-2025-08-07"  

annotation:
  enabled: true
  model: "gpt-5-mini-2025-08-07"
  prompt_type: "multi_analysis"
  create_all_included_annotations: true
  metadata_fields:
    - "analysis_name"
    - "analysis_description"
    - "table_caption"
    - "study_title"
    - "study_fulltext"

  inclusion_criteria:
    - >-
      Scope- You are judging ONE analysis, not the paper. The study text is provided only
      to interpret this analysis. That the paper elsewhere reports a qualifying contrast
      is not by itself a reason to include this analysis.
    - >-
      How to read the analysis- Judge it from its name, its description and its table
      caption together. An empty or uninformative analysis name (e.g. "analysis_0")
      usually means the analysis is the only one in its table, in which case the caption
      describes it fully and you should judge from the caption. A blank name is never
      itself a reason to exclude.
    - >-
      The analysis must be a within-group, group-level, whole-brain (voxelwise) task
      activation contrast.
    - >-
      Sample- Any participant group qualifies, including clinical samples (e.g.
      schizophrenia, depression) and developmental samples (e.g. adolescents), so long as
      the contrast is computed WITHIN a group rather than between groups. Do not exclude
      an analysis because of who the participants were.
    - >-
      Baseline- The comparison condition may be an active control task, or an implicit
      baseline, rest or fixation. A main effect of task against implicit baseline
      qualifies. Do not require an active control condition.
    - >-
      Response mode- The task may require an overt behavioral response (e.g. a button
      press) or a covert one (e.g. silent naming or counting). Do not require an overt
      response.
  exclusion_criteria:
    - >-
      Group-comparison contrasts- an analysis whose contrast is between two participant
      groups (e.g. patients vs controls, adults vs adolescents) or a group x condition
      interaction. Note this is about the CONTRAST, not the sample: a within-group
      contrast computed in a patient or adolescent sample is eligible.
    - Region-of-interest (ROI) or small-volume-corrected (SVC) analyses
    - Connectivity or resting-state analyses (functional connectivity, PPI, DCM, ICA)
    - >-
      The analysis does not reflect an executive function task contrast at all (e.g. a
      motor or sensory localiser, a physiological or artefact regressor, or a purely
      structural result).

  annotations:
    - name: "pooled_executive_function"
      description: "Executive function task activation pooled across all six domains (flexibility, inhibition, working memory, initiation, planning, vigilance)."
      inclusion_criteria:
        - "The task belongs to any of the six executive function domains: flexibility, inhibition, working memory, initiation, planning, or vigilance"
        - "The contrast reflects the executive demand of that task (this includes a main effect of the task against implicit baseline, not only task-versus-active-control contrasts)"

    - name: "working_memory"
      description: "Maintain information, context, or temporal/spatial relationships online and manipulate or use that information to guide response selection."
      inclusion_criteria:
        - "Task is a WORKING MEMORY paradigm: n-back, AX-CPT, Sternberg task, delayed match-to-sample, spatial span or sequence recall, or complex calculation/PASAT"
        - "The contrast reflects memory load, maintenance or manipulation (e.g. 2-back > 0-back, high load > low load, main effect of delay, a linear regression on load, or an encoding or retrieval main effect)"
      exclusion_criteria:
        - "The contrast being annotated isolates a different executive function domain (e.g., Go/No-Go, Stroop, task switching, Tower tasks, word generation, oddball). Other tasks reported elsewhere in the same paper are irrelevant: judge only the contrast described by this analysis."

    - name: "inhibition"
      description: "Inhibit a prepotent response in order to make a correct but less common response."
      inclusion_criteria:
        - "Task is an INHIBITION paradigm: Go/No-Go, Stroop, Flanker, Simon task, or antisaccade"
        - "The contrast reflects the inhibitory demand (e.g. No-Go > Go, incongruent > congruent, antisaccade > prosaccade, or a No-Go or Stroop main effect against implicit baseline)"
      exclusion_criteria:
        - "The contrast being annotated isolates a different executive function domain (e.g., n-back, Sternberg, task switching, Tower tasks, word generation, oddball). Other tasks reported elsewhere in the same paper are irrelevant: judge only the contrast described by this analysis."

    - name: "cognitive_flexibility"
      description: "Switch from one task or rule to another."
      inclusion_criteria:
        - "Task is a FLEXIBILITY paradigm: task switching or the Wisconsin Card Sorting Test"
        - "The contrast reflects the switching demand (e.g. switch trials > repeat trials, set-shifting > maintenance, or a switching main effect)"
      exclusion_criteria:
        - "The contrast being annotated isolates a different executive function domain (e.g., n-back, Go/No-Go, Stroop, Tower tasks, word generation, oddball). Other tasks reported elsewhere in the same paper are irrelevant: judge only the contrast described by this analysis."

    - name: "planning"
      description: "Identify and organize the steps and elements needed to carry out an intention or achieve a goal."
      inclusion_criteria:
        - "Task is a PLANNING paradigm: Tower Maze test, Tower of London, or Tower of Hanoi"
        - "The contrast reflects planning demand (e.g. high-move > low-move planning problems, or a planning main effect)"
      exclusion_criteria:
        - "The contrast being annotated isolates a different executive function domain (e.g., n-back, Go/No-Go, Stroop, task switching, word generation, oddball). Other tasks reported elsewhere in the same paper are irrelevant: judge only the contrast described by this analysis."

    - name: "vigilance"
      description: "Maintaining set in the face of interference."
      inclusion_criteria:
        - "Task is a VIGILANCE paradigm: oddball discrimination, or an equivalent task requiring set maintenance while resisting interference"
        - "The contrast reflects the demand to maintain set (e.g. target > standard stimuli, or a target-detection main effect)"
      exclusion_criteria:
        - "The contrast being annotated isolates a different executive function domain (e.g., n-back, Go/No-Go, Stroop, task switching, Tower tasks, word generation). Other tasks reported elsewhere in the same paper are irrelevant: judge only the contrast described by this analysis."

    - name: "initiation"
      description: "Initiate a sequence of complex behaviors."
      inclusion_criteria:
        - "Task is an INITIATION paradigm: word generation or verbal fluency"
        - "The contrast reflects self-initiated generation (e.g. word generation > word repetition, or a generation main effect). Covert or silent generation qualifies."
      exclusion_criteria:
        - "The contrast being annotated isolates a different executive function domain (e.g., n-back, Go/No-Go, Stroop, task switching, Tower tasks, oddball). Other tasks reported elsewhere in the same paper are irrelevant: judge only the contrast described by this analysis."

output:
  nimads: true
  export_excluded_studies: true

