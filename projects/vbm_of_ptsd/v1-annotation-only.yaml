search:
  database: "pubmed"
  pmids_file: "/home/zorro/repos/autonima-results/projects/vbm_of_ptsd/annotation-only-ids.txt"
  

retrieval:
  load_excluded: true
  sources:
    - pubget
  full_text_sources:
    - root_path: "/home/zorro/repos/autonima-results/articles/elsevier_output/"
      pmid_source: "folder_name"
      text_path_templates:
        - 'text.txt'
      coordinates_path_templates:
        - 'coordinates.json'
    - root_path: "/home/zorro/repos/autonima-results/articles/ace_outputs"
      pmid_source: "file_name"
      allowed_extensions: [".html"]
      processed_data_path: "/home/zorro/repos/autonima-results/articles/ace_outputs/processed/"

screening:
  abstract:
    skip_stage: true
  fulltext:
    skip_stage: true

parsing:
  parse_coordinates: true
  coordinate_model: "gpt-5-mini-2025-08-07"  

annotation:
  enabled: true
  model: "gpt-5-mini-2025-08-07"
  prompt_type: "multi_analysis"
  create_all_included_annotations: true
  metadata_fields:
    - "analysis_name"
    - "analysis_description"
    - "table_caption"
    - "study_title"
    - "study_fulltext"
  inclusion_criteria:
    - Must be a voxelwise whole brain analysis of grey matter volume
  exclusion_criteria:
    - Region of interest (ROI) or small volume correction (SVC) analyses 
    - Analyses of other modalities (e.g., functional MRI, diffusion tensor imaging) or other structural measures 
    - Within group analyses that do not compare PTSD patients to controls
    - Analyses of treatment effects or longitudinal changes
  annotations:
    - name: increased_gm
      description: Increased grey matter volume in PTSD patients relative to controls
      inclusion_criteria:
        - Voxelwise whole-brain grey matter comparison between PTSD patients and controls, with a patients > controls contrast indicating increased grey matter in PTSD patients.
    - name: decreased_gm
      description: Decreased grey matter volume in PTSD patients relative to controls
      inclusion_criteria:
        - Voxelwise whole-brain grey matter comparison between PTSD patients and controls, with a patients < controls contrast indicating reduced grey matter in PTSD patients.

output:
  nimads: true
  export_excluded_studies: true

