# GENERATED by scripts/run_baseline_searches.py from baselines.yaml -- do not
# hand-edit; edit the spec instead. Search baseline for manual annotation
# 'nonptsdgtptsd_merged'. Screening is skipped, so this is a Neurosynth-style pool over a
# topic-targeted search: every hit whose coordinates we could parse. The
# comparison column is 'all_analyses'.
#
# The project has one sub-annotation, so this is simultaneously the targeted baseline and the broad control. Reproduces v1.yaml's search.
search:
  database: pubmed
  query: '(((("voxel-based morphometr*"[tiab] OR VBM[tiab] OR "gray matter volum*"[tiab] OR "grey mattr
    volum*"[tiab] OR "gray matter densit*"[tiab] OR "grey matter densit*"[tiab]) AND ("magnetic resonance
    imaging"[Mesh] OR MRI[tiab] OR "structural MRI"[tiab]) AND Humans[mh] AND English[lang]) AND (PTSD[tiab]
    OR "post-traumatic stress disorder"[tiab] OR "posttraumatic stress disorder"[tiab])) AND ("1990/01/01"[Date
    - Publication] : "2020/12/31"[Date - Publication])) NOT (review[pt] OR "systematic review"[tiab] OR
    meta-analysis[pt])'
  date_from: 1990/01/01
  date_to: 2020/12/31
  max_results: 15000
  email: delavega@utexas.edu
retrieval:
  load_excluded: false
  sources:
  - pubget
  full_text_sources:
  - root_path: /home/zorro/repos/autonima-results/articles/elsevier_output/
    pmid_source: folder_name
    text_path_templates:
    - text.txt
    coordinates_path_templates:
    - coordinates.json
  - root_path: /home/zorro/repos/autonima-results/articles/ace_outputs
    pmid_source: file_name
    allowed_extensions:
    - .html
    processed_data_path: /home/zorro/repos/autonima-results/articles/ace_outputs/processed/
screening:
  abstract:
    skip_stage: true
  fulltext:
    skip_stage: true
parsing:
  parse_coordinates: false
annotation:
  enabled: true
  model: gpt-5-mini-2025-08-07
  create_all_included_annotations: true
  annotations: []
output:
  formats:
  - csv
  nimads: true
