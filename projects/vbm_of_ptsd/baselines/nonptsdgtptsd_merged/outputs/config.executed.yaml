search:
  database: pubmed
  query: '(((("voxel-based morphometr*"[tiab] OR VBM[tiab] OR "gray matter volum*"[tiab]
    OR "grey mattr volum*"[tiab] OR "gray matter densit*"[tiab] OR "grey matter densit*"[tiab])
    AND ("magnetic resonance imaging"[Mesh] OR MRI[tiab] OR "structural MRI"[tiab])
    AND Humans[mh] AND English[lang]) AND (PTSD[tiab] OR "post-traumatic stress disorder"[tiab]
    OR "posttraumatic stress disorder"[tiab])) AND ("1990/01/01"[Date - Publication]
    : "2020/12/31"[Date - Publication])) NOT (review[pt] OR "systematic review"[tiab]
    OR meta-analysis[pt])'
  max_results: 15000
  date_from: 1990/01/01
  date_to: 2020/12/31
  email: delavega@utexas.edu
  pmids_file: null
  pmids_list: null
screening:
  abstract:
    skip_stage: true
  fulltext:
    skip_stage: true
retrieval:
  sources:
  - pubget
  timeout: 30
  max_retries: 3
  download_directory: downloads
  n_jobs: 1
  load_excluded: false
  full_text_sources:
  - root_path: /home/zorro/repos/autonima-results/articles/elsevier_output/
    pmid_source: folder_name
    text_path_templates:
    - text.txt
    coordinates_path_templates:
    - coordinates.json
  - root_path: /home/zorro/repos/autonima-results/articles/ace_outputs
    pmid_source: file_name
    allowed_extensions:
    - .html
    processed_data_path: /home/zorro/repos/autonima-results/articles/ace_outputs/processed/
  parse_coordinates: false
  coordinate_model: gpt-4o-mini
parsing:
  parse_coordinates: false
  coordinate_model: gpt-4o-mini
annotation:
  model: gpt-5-mini-2025-08-07
  create_all_included_annotations: true
  metadata_fields:
  - analysis_name
  - analysis_description
  - table_caption
  - study_title
  prompt_type: multi_analysis
  inclusion_criteria: []
  exclusion_criteria: []
  annotations: []
  enabled: true
output:
  directory: projects/vbm_of_ptsd/baselines/nonptsdgtptsd_merged
  prisma_diagram: true
  formats:
  - csv
  nimads: true
  export_excluded_studies: false
