  full_text_sources:
  - root_path: /home/zorro/repos/autonima-results/articles/elsevier_output/
    pmid_source: folder_name
    text_path_templates:
    - text.txt
    coordinates_path_templates:
    - coordinates.json
  - root_path: /home/zorro/repos/autonima-results/articles/ace_outputs
    pmid_source: file_name
    allowed_extensions:
    - .html
    processed_data_path: /home/zorro/repos/autonima-results/articles/ace_outputs/processed/
  parse_coordinates: false
  coordinate_model: gpt-4o-mini
parsing:
  parse_coordinates: true
  coordinate_model: gpt-5-mini-2025-08-07
annotation:
  model: gpt-5-mini-2025-08-07
  create_all_included_annotations: true
  metadata_fields:
  - analysis_name
  - analysis_description
  - table_caption
  - study_title
  - study_fulltext
  prompt_type: multi_analysis
  inclusion_criteria: []
  exclusion_criteria: []
  annotations:
  - name: increased_gm
    description: Increased grey matter volume in PTSD patients relative to controls
    inclusion_criteria:
    - Voxelwise whole-brain grey matter comparison between PTSD patients and controls,
      with a patients > controls contrast indicating increased grey matter in PTSD
      patients.
    exclusion_criteria: []
  - name: decreased_gm
    description: Decreased grey matter volume in PTSD patients relative to controls
    inclusion_criteria:
    - Voxelwise whole-brain grey matter comparison between PTSD patients and controls,
      with a patients < controls contrast indicating reduced grey matter in PTSD patients.
    exclusion_criteria: []
  enabled: true
output:
  directory: /home/zorro/repos/autonima-results/projects/vbm_of_ptsd/v1-annotation-only
  prisma_diagram: true
  formats:
  - csv
  - json
  nimads: true
  export_excluded_studies: true
