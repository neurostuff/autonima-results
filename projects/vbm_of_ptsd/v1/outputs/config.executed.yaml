search:
  database: pubmed
  query: (((("voxel-based morphometr*"[tiab] OR VBM[tiab] OR "gray matter volum*"[tiab]
    OR "grey mattr volum*"[tiab] OR "gray matter densit*"[tiab] OR "grey matter densit*"[tiab])
    AND ("magnetic resonance imaging"[Mesh] OR MRI[tiab] OR "structural MRI"[tiab]))
    AND (PTSD[tiab] OR "post-traumatic stress disorder"[tiab]) AND Humans[mh] AND
    English[lang] NOT (review[pt] OR "systematic review"[tiab] OR meta-analysis[pt]))
  max_results: 15000
  date_from: 1990/01/01
  date_to: 2020/12/31
  email: delavega@utexas.edu
  pmids_file: null
  pmids_list: null
screening:
  abstract:
    model: gpt-5-mini-2025-08-07
    threshold: null
    confidence_reporting: true
    objective: Meta-analysis of morphometry studies of structural alterations associated
      with PTSD
    inclusion_criteria:
    - Empirical English language MRI studies assessing grey matter (GM) volume differences
      between PTSD patients and controls
    - Control populations may be healthy individuals or trauma-exposed individuals
      without PTSD
    exclusion_criteria:
    - Studies using pharmacological manipulations
    - Brain lesion studies
    - Systematic reviews or meta-analyses
    additional_instructions: null
    criteria_mapping:
      inclusion:
        I1: Empirical English language MRI studies assessing grey matter (GM) volume
          differences between PTSD patients and controls
        I2: Control populations may be healthy individuals or trauma-exposed individuals
          without PTSD
      exclusion:
        E1: Studies using pharmacological manipulations
        E2: Brain lesion studies
        E3: Systematic reviews or meta-analyses
  fulltext:
    model: gpt-5-mini-2025-08-07
    threshold: null
    confidence_reporting: true
    objective: Meta-analysis of morphometry studies of structural alterations associated
      with PTSD
    inclusion_criteria:
    - Empirical English language MRI studies assessing grey matter (GM) volume differences
      between PTSD patients and controls
    - Whole-brain evidence- The paper must report at least one whole-brain voxel-wise
      between-group contrast of PTSD patients vs controls comparing GM volume
    - It is acceptable for qualifying results to be reported in tables of coordinates,
      figures, or supplementary materials when the main text clearly indicates those
      results are available.
    - Control populations may be healthy individuals or trauma-exposed individuals
      without PTS
    exclusion_criteria:
    - Studies that report only region-of-interest (ROI) analyses with no qualifying
      whole-brain results.
    - Non-empirical papers (e.g., reviews, meta-analyses, methods-only, simulations)
      without original human structural MRI data.
    - Studies about trauma or stressful life event studies not specifically measuring
      PTSD
    - Treatment and longitudinal studies without a qualifying between-group contrast
      of PTSD patients vs controls
    - Studies that report only within group results in PTSD patients without a qualifying
      between-group contrast of PTSD patients vs controls
    - Studies report only null results (i.e., no significant differences between PTSD
      patients and controls)
    additional_instructions: null
    criteria_mapping:
      inclusion:
        I3: Empirical English language MRI studies assessing grey matter (GM) volume
          differences between PTSD patients and controls
        I4: Whole-brain evidence- The paper must report at least one whole-brain voxel-wise
          between-group contrast of PTSD patients vs controls comparing GM volume
        I5: It is acceptable for qualifying results to be reported in tables of coordinates,
          figures, or supplementary materials when the main text clearly indicates
          those results are available.
        I6: Control populations may be healthy individuals or trauma-exposed individuals
          without PTS
      exclusion:
        E4: Studies that report only region-of-interest (ROI) analyses with no qualifying
          whole-brain results.
        E5: Non-empirical papers (e.g., reviews, meta-analyses, methods-only, simulations)
          without original human structural MRI data.
        E6: Studies about trauma or stressful life event studies not specifically
          measuring PTSD
        E7: Treatment and longitudinal studies without a qualifying between-group
          contrast of PTSD patients vs controls
        E8: Studies that report only within group results in PTSD patients without
          a qualifying between-group contrast of PTSD patients vs controls
        E9: Studies report only null results (i.e., no significant differences between
          PTSD patients and controls)
retrieval:
  sources:
  - pubget
  timeout: 30
  max_retries: 3
  download_directory: downloads
  n_jobs: 1
  load_excluded: true
  full_text_sources:
  - root_path: /home/zorro/repos/autonima-results/articles/elsevier_output/
    pmid_source: folder_name
    text_path_templates:
    - text.txt
    coordinates_path_templates:
    - coordinates.json
  - root_path: /home/zorro/repos/autonima-results/articles/ace_outputs
    pmid_source: file_name
    allowed_extensions:
    - .html
    processed_data_path: /home/zorro/repos/autonima-results/articles/ace_outputs/processed/
  parse_coordinates: false
  coordinate_model: gpt-4o-mini
parsing:
  parse_coordinates: true
  coordinate_model: gpt-5-mini-2025-08-07
annotation:
  model: gpt-5-mini-2025-08-07
  create_all_included_annotations: true
  metadata_fields:
  - analysis_name
  - analysis_description
  - table_caption
  - study_title
  - study_abstract
  prompt_type: multi_analysis
  inclusion_criteria:
  - Must be a voxelwise whole brain analysis of grey matter volume
  exclusion_criteria:
  - Region of interest (ROI) or small volume correction (SVC) analyses
  - Analyses of other modalities (e.g., functional MRI, diffusion tensor imaging)
    or other structural measures
  - Within group analyses that do not compare PTSD patients to controls
  - Analyses of treatment effects or longitudinal changes
  annotations:
  - name: increased_gm
    description: Increased grey matter volume in PTSD patients relative to controls
    inclusion_criteria:
    - Voxelwise whole-brain grey matter comparison between PTSD patients and controls,
      with a patients > controls contrast indicating increased grey matter in PTSD
      patients.
    exclusion_criteria: []
  - name: decreased_gm
    description: Decreased grey matter volume in PTSD patients relative to controls
    inclusion_criteria:
    - Voxelwise whole-brain grey matter comparison between PTSD patients and controls,
      with a patients < controls contrast indicating reduced grey matter in PTSD patients.
    exclusion_criteria: []
  enabled: true
output:
  directory: projects/vbm_of_ptsd/v1
  prisma_diagram: true
  formats:
  - csv
  - json
  nimads: true
  export_excluded_studies: true
