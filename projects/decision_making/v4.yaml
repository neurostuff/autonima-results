# v4 -- AUTOMATICALLY GENERATED by Claude (Opus 5.5) on 2026-11-12, at the project author's request
# ("tweak config for decision making project to increase performance in ambiguous target").
#
# PROVENANCE, STATED PLAINLY
# Written by an LLM agent, not a human expert. BENCHMARK-TUNED: the changes were chosen by
# tracing v3's ambiguous-DM gold studies (neurometabench ADM_July2019, 41 studies, corrected gold
# of neurostuff/neurometabench#39) through v3's stages and by refitting MKDA maps on subsets of
# them. Report as an iterated version, never as held-out. The criteria TEXT comes from the source
# paper (PMC7127964 Methods and Supplement Table S2 task descriptions), not from study names.
#
# BASE: v3 (the registered best run). Retrieval, screening and parsing are byte-identical to v3.
# Two blocks change: search.query and the annotation block.
#
# WHY SEARCH. v3's funnel on the 41 ambiguous gold studies:
#     lost at search 20 | full text missing 3 | no coordinates parsed 3 | mis-subtyped 4 | correct 11
# Refitting maps (same MKDA as the paper's null) showed the search is the binding limit:
#     gold coordinates, 21 studies v3's search finds ........ R2 0.776 against the reference
#     v3's ambiguous_dm column as run .......................... R2 0.250
#     v3, perfect choice of gold-matched contrasts only ........ R2 0.318
#     contrast-level filters on v3's pool (direction, etc.) .... R2 0.229 - 0.254
# Of the 20 lost: 12 miss the topic terms (two-choice prediction, guessing, bandit, gambling and
# exploration tasks that the paper counts as ambiguous), 6 miss the imaging clause, 5 are dropped
# by Humans[mh] (not yet MeSH-indexed). The query below keeps v3's terms and adds:
#   - (ambigu* | uncertain* | probabilit* | predict* | guess* | gambl* | bandit | explor* | lotter*)
#     AND (decision* | choice) -- the paper's ambiguous task families
#   - imaging: "functional magnetic resonance", "magnetic resonance imaging", "blood oxygen*",
#     neuroimaging, Magnetic Resonance Imaging[mh]
#   - Humans[mh] replaced by NOT (animals[mh] NOT humans[mh]), so unindexed records survive
# Checked 2026-11-12 with E-utilities: 769 -> 4,977 records; ambiguous gold 21 -> 37 of 41; all
# decision-making gold 85 -> 113 of 136. This also changes the risky and perceptual columns.
#
# WHY THE ANNOTATION CHANGES (paper text, not error lists)
#   1. The paper's definition: ambiguous-DM is DM "where the outcome probabilities are generally
#      not known or are the same for all possible choice options" (coin toss, two-choice
#      prediction task). Table S2's task notes add hidden/occluded proportions and probabilities
#      that reverse during the task. v3 said only "uncertainty/ambiguity in contingencies", and
#      sent equal-probability and prediction tasks (Hosseini 2010, Cservenka 2012 chance-50) to
#      risky_dm.
#   2. Direction: every ambiguous example in the paper's Methods puts the more uncertain condition
#      (or the ambiguous task) on the positive side. v3 admitted reversed contrasts
#      (certain > uncertain, risk > ambiguity).
#   3. Subtype per contrast, not per study: four gold studies (risk-vs-ambiguity designs) appear
#      in BOTH the risky and the ambiguous gold, which v3's strict one-subtype-per-PMID rule cannot
#      produce. Exclusivity stays the default; a study that manipulates both may split.
# Deliberately NOT added: exclusions for brain-behaviour correlations and group contrasts. The
# paper states neither for ambiguous-DM, and simulating them on v3's pool lowered R2.
# non_using_risky / using_risky keep v3's text exactly. A first run reworded their first line to
# "only apply to contrasts annotated risky_dm"; the model then cited RISKY_DM_* criterion IDs
# under them, validation failed 3/3 for 72 of 328 studies (53 of which v3 annotated cleanly),
# and those studies went unannotated. Reverted 2026-11-12; annotation re-run.
#
# RUN: seed caches from v3 (first run only, see copy_valid_cache_from):
#   autonima run projects/decision_making/v4.yaml projects/decision_making/v4 \
#       --copy-valid-cache-from projects/decision_making/v3

search:
  database: "pubmed"
  query: '(((((risk*[tiab] OR "risk taking"[tiab] OR "risk-taking"[tiab]) AND (decision-making[tiab] OR "decision making"[tiab] OR choice[tiab] OR choices[tiab])) OR ((ambigu*[tiab] OR uncertainty[tiab] OR probabilistic[tiab]) AND (decision-making[tiab] OR "decision making"[tiab] OR choice[tiab] OR choices[tiab])) OR ("perceptual decision-making"[tiab] OR "perceptual decision making"[tiab]) OR (((ambigu*[tiab] OR uncertainty[tiab] OR probabilistic[tiab]) AND (reward*[tiab] OR learning[tiab])))) OR ((ambigu*[tiab] OR uncertain*[tiab] OR probabilit*[tiab] OR predict*[tiab] OR guess*[tiab] OR gambl*[tiab] OR bandit[tiab] OR explor*[tiab] OR lotter*[tiab]) AND (decision-making[tiab] OR "decision making"[tiab] OR decision*[tiab] OR choice[tiab] OR choices[tiab]))) AND (fMRI[tiab] OR "functional MRI"[tiab] OR "functional magnetic resonance"[tiab] OR "magnetic resonance imaging"[tiab] OR BOLD[tiab] OR "blood oxygen*"[tiab] OR neuroimaging[tiab] OR "Magnetic Resonance Imaging"[mh]) AND English[lang] NOT (animals[mh] NOT humans[mh]) NOT (review[pt] OR "systematic review"[tiab] OR meta-analysis[pt])'
  date_from: "1995/01/01"
  date_to: "2019/03/31"
  max_results: 15000
  email: delavega@utexas.edu
  
retrieval:
  load_excluded: true
  sources:
    - pubget
  full_text_sources:
    - root_path: "articles/elsevier_output/"
      pmid_source: "folder_name"
      text_path_templates:
        - 'text.txt'
      coordinates_path_templates:
        - 'coordinates.json'
    - root_path: "articles/ace_outputs"
      pmid_source: "file_name"
      allowed_extensions: [".html"]
      processed_data_path: "articles/ace_outputs/processed/"

screening:
  abstract:
    model: "gpt-5-mini-2025-08-07"
    objective: "Meta-analysis of fMRI studies of risky, ambiguous, and perceptual decision-making."
    inclusion_criteria:
      - English language empirical studies with original data
      - Functional MRI scan conducted while human participants performed a risky, ambiguous, or perceptual decision-making task
      - Sample- humans of any age that were either healthy participants, substance users, as well as groups with other neuropsychiatric conditions 
    exclusion_criteria:
      - Studies using only PET or other non-fMRI neuroimaging methods
      - Systematic reviews or meta-analyses
    confidence_reporting: true

  fulltext:
    model: "gpt-5-mini-2025-08-07"
    confidence_reporting: true
    objective: "Meta-analysis of fMRI studies of risky, ambiguous, and perceptual decision-making."
    inclusion_criteria:
      - Functional MRI (fMRI) scan conducted while human participants performed a risky, ambiguous, or perceptual decision-making task
      - >-
        At least one contrast comparing two decision-making conditions, or a decision-making task
        against an active CONTROL TASK. The admitted forms are- for risky-DM "risky > safe",
        "high-risk > low-risk", "risk > certainty", "riskier > surer", or "experimental task
        (risk) > control task"; for ambiguous-DM "high uncertainty > low uncertainty", "ambiguity
        > ignorance", "ambiguous > non-ambiguous", or "ambiguous task > control task"; for
        perceptual-DM "hard > easy", "low coherence > high coherence", or "perceptual task >
        control task". Both within-task and between-task comparisons qualify.
      - Whole-brain evidence- The target analysis must be a group-level, whole-brain (voxelwise) task-evoked statistical map
      - >-
        Any participant group qualifies- healthy participants, substance users, and participants
        with other neuropsychiatric conditions (internet addiction, gambling disorder, internet
        gaming disorder, obesity, depressive, anxiety or conduct disorders, antisocial
        personality disorder, schizophrenia). All age groups from roughly 10 to 69 years qualify.
        Do not exclude a study because of who its participants were.
      - It is acceptable for qualifying whole-brain results to be reported in tables of coordinates, figures, or supplementary materials, as long as they are clearly described in the text.
    exclusion_criteria:
      - >-
        Studies whose only decision-making contrasts are against an implicit baseline, rest or
        fixation (e.g. "50% probability condition > implicit baseline", "task > rest"). This
        benchmark admits only condition-versus-condition and task-versus-control-task contrasts.
      - >-
        Positron emission tomography (PET) studies. The source meta-analysis excluded PET
        deliberately, to remove heterogeneity across imaging modalities.
      - >-
        Studies whose decision-making task is not risky, ambiguous or perceptual DM- for example
        delay discounting or intertemporal choice, moral or social decision-making, reward
        receipt or consumption without an uncertainty manipulation, and effort-based choice.
      - Studies that report only region-of-interest (ROI) analyses with no whole-brain results.
      - Studies that report only seed-based connectivity, effective connectivity (e.g., PPI, DCM), or resting-state analyses (e.g., ICA, PLE, Hurst exponents) without also reporting a whole-brain task activation map.
      - >-
        Studies that report ONLY between-group contrasts or interactions (e.g. substance users vs
        non-users, patient vs control) with no accompanying unmasked, whole-brain within-group
        task effect. Note this is about the contrast, not the sample- a within-group contrast in
        a patient or substance-using sample qualifies.
      - Non-empirical papers (e.g., reviews, meta-analyses, methods-only, simulations) without original fMRI data.

parsing:
  parse_coordinates: true 
  coordinate_model: "gpt-5-mini-2025-08-07"  

annotation:
  enabled: true
  model: "gpt-5-mini-2025-08-07"
  create_all_included_annotations: true
  prompt_type: "multi_analysis"
  metadata_fields:
    - "analysis_name"
    - "analysis_description"
    - "table_caption"
    - "study_title"
    - "study_fulltext"
  inclusion_criteria:
    - Task-evoked contrasts related to decision-making
    - Whole-brain evidence- Must be a group-level, whole-brain (voxelwise) task-evoked statistical map 
    - If an analysis label is generic/truncated (e.g., analysis_0), use table caption, neighboring contrasts, and study_fulltext to infer eligibility; do not fail only because the label text is sparse.
    - >-
      Assign the subtype from the task's outcome probabilities, as the source meta-analysis does.
      risky_dm- outcome probabilities are known or easily inferred and differ between options
      (an explicit risky vs safe choice). ambiguous_dm- outcome probabilities are not known, are
      hidden or occluded, cannot be inferred from the information given, change during the task
      (e.g. reversals), or are the same for every choice option (e.g. 50/50 guesses, two-choice
      prediction tasks with fixed error rates, slot or bandit choices with equal payoffs).
      perceptual_dm- the choice is made on the basis of available sensory evidence.
    - >-
      Subtypes are mutually exclusive per contrast. A study normally has one subtype and all its
      included analyses follow it. The exception is a study that manipulates both known and
      unknown (or equal) probabilities, such as a risk-versus-ambiguity design- its risk contrasts
      go to risky_dm and its ambiguity contrasts to ambiguous_dm.
  exclusion_criteria:
    - Region-of-interest (ROI) analyses
    - Seed-based connectivity, effective connectivity (e.g., PPI, DCM), or resting-state analyses (e.g., ICA, PLE, Hurst exponents) 
  annotations:
    - name: "common_dm"
      description: "decision making contrasts that are common across risky, ambiguous, and perceptual decision-making studies"
      inclusion_criteria:
        - "contrasts related to risky, ambiguous, or perceptual decision-making"
        - "all populations (e.g., healthy controls, non-users, drug users, patients with substance use disorders, or other neuropsychiatric conditions)"
    - name: "ambiguous_dm"
      description: "ambiguous decision-making contrasts- choices whose outcome probabilities are unknown, hidden, changing, or equal for every option"
      inclusion_criteria:
        - "assign this annotation only to contrasts whose subtype is ambiguous_dm under the subtype rule."
        - "contrasts from tasks whose outcome probabilities are not known, hidden or not inferable, change during the task, or are equal for every option (e.g. ambiguous lottery or wheel tasks, two-choice prediction or guessing tasks, card or casino tasks with equal odds, bandit tasks)."
        - "the more uncertain or ambiguous condition, or the ambiguous task, is on the positive side of the contrast- e.g. “high uncertainty > low uncertainty”, “ambiguous > non-ambiguous”, “ambiguity > risk”, “ambiguity > ignorance”, “uncertain > certain decisions”, “ambiguous task > control task”, task by error-rate (uncertainty level) effects."
        - "include uncertainty-based choice contrasts even when labels are generic (analysis_0/analysis_1) if study/table context shows they are uncertainty decision maps."
        - "all populations (e.g., healthy controls, non-users, drug users, patients with substance use disorders, or other neuropsychiatric conditions)"
      exclusion_criteria:
        - "exclude reversed contrasts whose positive side is the less uncertain condition (e.g. certain > uncertain, risk > ambiguity, non-ambiguous > ambiguous, low > high uncertainty)."
        - "exclude sensory-perceptual difficulty contrasts (e.g., low coherence > high coherence, noisy > clear, hard > easy perceptual discrimination); those belong in perceptual_dm."
        - "exclude purely outcome/feedback contrasts unless the contrast directly indexes uncertainty during the decision phase."
    - name: "perceptual_dm"
      description: "perceptual decision-making contrasts"
      inclusion_criteria:
        - "assign this annotation only to contrasts whose subtype is perceptual_dm under the subtype rule."
        - "contrasts where decisions are based on sensory/perceptual evidence (e.g., coherence/noise/category discrimination, hard > easy perceptual judgments, perceptual task > control)."
        - "include low-coherence/noisy > high-coherence/clear contrasts as perceptual_dm, not ambiguous_dm."
        - "all populations (e.g., healthy controls, non-users, drug users, patients with substance use disorders, or other neuropsychiatric conditions)"
      exclusion_criteria:
        - "exclude economic/probability uncertainty, reward prediction, or gambling ambiguity/risk contrasts even if stimuli are visual."
    - name: "risky_dm"
      description: "risky decision-making contrasts"
      inclusion_criteria:
        - "assign this annotation only to contrasts whose subtype is risky_dm under the subtype rule."
        - "contrasts with explicit known-risk manipulation focused on risky vs safe/certain choice (e.g., risky > safe, high-risk > low-risk, risk > certainty, riskier > surer, risk task > control)."
        - "all populations (e.g., healthy controls, non-users, drug users, patients with substance use disorders, or other neuropsychiatric conditions)"
      exclusion_criteria:
        - "exclude ambiguity-dominant contrasts (e.g., ambiguity > risk, mixed risk-vs-ambiguity contrasts where ambiguity is the target); route these to ambiguous_dm."
        - "exclude choices whose options all have the same outcome probability (e.g. 50/50 guesses, two-choice prediction tasks); route these to ambiguous_dm."
        - "exclude generic uncertainty/prediction contrasts without a clear risky-vs-safe decision manipulation."
    - name: "non_using_risky"
      description: "contrasts related to risky decision-making in non-substance using populations (e.g., healthy controls, non-users, or other neuropsychiatric conditions)"
      inclusion_criteria:
        - "only apply when the study-level subtype for that PMID is risky_dm."
        - "same risky_dm contrast rules: explicit known-risk vs safe/certain choice contrasts; exclude ambiguity-dominant or generic uncertainty-only contrasts."
        - "non-substance using populations (e.g., healthy controls, non-users, or other neuropsychiatric conditions) compared to substance using populations (e.g., drug users, patients with substance use disorders)"
    - name: "using_risky"
      description: "contrasts related to risky decision-making in substance using populations (e.g., drug users, patients with substance use disorders)"
      inclusion_criteria:
        - "only apply when the study-level subtype for that PMID is risky_dm."
        - "same risky_dm contrast rules: explicit known-risk vs safe/certain choice contrasts; exclude ambiguity-dominant or generic uncertainty-only contrasts."
        - "substance using populations (e.g., drug users, patients with substance use disorders) compared to non-substance using populations (e.g., healthy controls, non-users, or other neuropsychiatric conditions)"

output:
  nimads: true
  export_excluded_studies: true
