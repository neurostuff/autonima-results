# v2 -- annotation criteria refined by the project author, using ChatGPT as an editing tool.
#
# PROVENANCE. Edited by the author (Apr 2026) with ChatGPT helping to phrase the additions. This
# is NOT one of the agent-written schemas: those date from 2026-08-25/26 and carry an
# "AUTOMATICALLY GENERATED by Claude (Opus 5)" banner. In this project that is v3.yaml.
#
# NOT BENCHMARK-TUNED. This header previously read "Used ChatGPT to refine annotations using
# reports", which the 2026-08/09 cleanup took to mean the criteria had been fitted to this
# project's error reports; on that reading v2 was classed as benchmark-tuned. The diff does not
# support it and the claim is withdrawn -- see the commit that corrected this header.
#
#
# SEARCH PROVENANCE, INHERITED. The search block is byte-identical to v1's, whose header records
# "Used ChatGPT to refine query in an evaluation loop" -- i.e. the query was selected against
# measured performance, not transcribed from the paper. That is a SEARCH-level use of benchmark
# information, which the `untuned` tier permits and the `verbatim` tier does not speak to. Noted
# here because this file is the registered `untuned` run and the fact otherwise lives only in v1.
# WHAT ACTUALLY CHANGED vs v1. Screening, search, retrieval, parsing and output are byte-identical;
# only the annotation block moves, and only by addition:
#
#     exclusion_criteria   2 -> 2   unchanged
#     inclusion_criteria   2 -> 6   four added, none removed
#
#   1. a generic or truncated analysis label (e.g. analysis_0) should be resolved from the table
#      caption and neighbouring contrasts rather than failing outright -- a parsing-robustness
#      rule, not a scope criterion
#   2. subtype follows the primary uncertainty source: sensory evidence -> perceptual_dm,
#      contingency/information -> ambiguous_dm, explicit known-risk choice -> risky_dm. This is
#      the source paper's own taxonomy, not something read off our results.
#   3-4. study-level mutual exclusivity: exactly one subtype per PMID, and every included analysis
#      from that study carries it. A structural property of how the benchmark is organised.
#
# None of the four names a study, cites a false positive or negative, or narrows scope. Tuning for
# precision against a benchmark adds EXCLUSIONS; this edit added none. Contrast v3.yaml, which does
# fit the benchmark -- it quotes one wrongly accepted study ("50% probability condition vs implicit
# baseline") and adds an exclusion to reject it.
search:
  database: "pubmed"
  query: ((((risk*[tiab] OR "risk taking"[tiab] OR "risk-taking"[tiab]) AND (decision-making[tiab] OR "decision making"[tiab] OR choice[tiab] OR choices[tiab])) OR ((ambigu*[tiab] OR uncertainty[tiab] OR probabilistic[tiab]) AND (decision-making[tiab] OR "decision making"[tiab] OR choice[tiab] OR choices[tiab])) OR ("perceptual decision-making"[tiab] OR "perceptual decision making"[tiab]) OR (((ambigu*[tiab] OR uncertainty[tiab] OR probabilistic[tiab]) AND (reward*[tiab] OR learning[tiab])))) AND (fMRI[tiab] OR "functional MRI"[tiab] OR "functional magnetic resonance imaging"[tiab] OR BOLD[tiab] OR "blood oxygenation level dependent"[tiab]) AND Humans[mh] AND English[lang] NOT (review[pt] OR "systematic review"[tiab] OR meta-analysis[pt]))
  date_from: "1995/01/01"
  date_to: "2019/03/31"
  max_results: 15000
  email: delavega@utexas.edu
  
retrieval:
  load_excluded: true
  sources:
    - pubget
  full_text_sources:
    - root_path: "articles/elsevier_output/"
      pmid_source: "folder_name"
      text_path_templates:
        - 'text.txt'
      coordinates_path_templates:
        - 'coordinates.json'
    - root_path: "articles/ace_outputs"
      pmid_source: "file_name"
      allowed_extensions: [".html"]
      processed_data_path: "articles/ace_outputs/processed/"

screening:
  abstract:
    model: "gpt-5-mini-2025-08-07"
    objective: "Meta-analysis of fMRI studies of risky, ambiguous, and perceptual decision-making."
    inclusion_criteria:
      - English language empirical studies with original data
      - Functional MRI scan conducted while human participants performed a risky, ambiguous, or perceptual decision-making task
      - Sample- humans of any age that were either healthy participants, substance users, as well as groups with other neuropsychiatric conditions 
    exclusion_criteria:
      - Studies using only PET or other non-fMRI neuroimaging methods
      - Systematic reviews or meta-analyses
    confidence_reporting: true

  fulltext:
    model: "gpt-5-mini-2025-08-07"
    confidence_reporting: true
    objective: "Meta-analysis of fMRI studies of risky, ambiguous, and perceptual decision-making."
    inclusion_criteria:
      - Functional MRI scan conducted while human participants performed a risky, ambiguous, or perceptual decision-making task
      - At least one within-task or between-task contrast related to risky, ambiguous, or perceptual decision-making (e.g., “risky > safe”, “high-risk > low-risk”, “risk > certainty”, “riskier > surer” or “experimental task (risk) > control task” for risky-DM studies; “high uncertainty > low uncertainty”, “ambiguity > ignorance”, “ambiguous > non-ambiguous” or “ambiguous task > control task” for ambiguous-DM studies; and “hard > easy”, “low coherence > high coherence”, or “perceptual task > control task” for perceptual-DM studies.
      - Whole-brain evidence- The target analysis must be a group-level, whole-brain (voxelwise) task-evoked statistical map 
      - It is acceptable for qualifying whole-brain results to be reported in tables of coordinates, figures, or supplementary materials, as long as they are clearly described in the text.
    exclusion_criteria:
      - Studies that report only region-of-interest (ROI) analyses with no whole-brain results.
      - Studies that report only seed-based connectivity, effective connectivity (e.g., PPI, DCM), or resting-state analyses (e.g., ICA, PLE, Hurst exponents) without also reporting a whole-brain task activation map.
      - Studies that report only between-group contrasts or interactions (e.g., subgroup vs subgroup, patient vs control) without an accompanying unmasked, whole-brain task effect.
      - Non-empirical papers (e.g., reviews, meta-analyses, methods-only, simulations) without original fMRI data in healthy adults.

parsing:
  parse_coordinates: true 
  coordinate_model: "gpt-5-mini-2025-08-07"  

annotation:
  enabled: true
  model: "gpt-5-mini-2025-08-07"
  create_all_included_annotations: true
  prompt_type: "multi_analysis"
  metadata_fields:
    - "analysis_name"
    - "analysis_description"
    - "table_caption"
    - "study_title"
    - "study_fulltext"
  inclusion_criteria:
    - Task-evoked contrasts related to decision-making
    - Whole-brain evidence- Must be a group-level, whole-brain (voxelwise) task-evoked statistical map 
    - If an analysis label is generic/truncated (e.g., analysis_0), use table caption, neighboring contrasts, and study_fulltext to infer eligibility; do not fail only because the label text is sparse.
    - Resolve subtype overlaps by primary uncertainty source- sensory evidence uncertainty -> perceptual_dm; uncertainty/ambiguity in contingencies or information -> ambiguous_dm; explicit known-risk vs safe/certain choice -> risky_dm.
    - Study-level subtype mutual exclusivity is required- for each study/PMID, assign exactly one subtype among ambiguous_dm, perceptual_dm, and risky_dm.
    - Once a study-level subtype is chosen, all included analyses from that study must follow that same subtype; do not split analyses from one study across multiple subtypes.
  exclusion_criteria:
    - Region-of-interest (ROI) analyses
    - Seed-based connectivity, effective connectivity (e.g., PPI, DCM), or resting-state analyses (e.g., ICA, PLE, Hurst exponents) 
  annotations:
    - name: "common_dm"
      description: "decision making contrasts that are common across risky, ambiguous, and perceptual decision-making studies"
      inclusion_criteria:
        - "contrasts related to risky, ambiguous, or perceptual decision-making"
        - "all populations (e.g., healthy controls, non-users, drug users, patients with substance use disorders, or other neuropsychiatric conditions)"
    - name: "ambiguous_dm"
      description: "ambiguous decision-making contrasts"
      inclusion_criteria:
        - "assign this annotation only if ambiguous_dm is the single study-level subtype for that PMID."
        - "contrasts where uncertainty/ambiguity is central to the decision (e.g., “ambiguous > certain”, “high uncertainty > low uncertainty”, “ambiguity > risk”, uncertainty-driven information sampling/decision contrasts)."
        - "include uncertainty-based choice contrasts even when labels are generic (analysis_0/analysis_1) if study/table context shows they are uncertainty decision maps."
        - "all populations (e.g., healthy controls, non-users, drug users, patients with substance use disorders, or other neuropsychiatric conditions)"
      exclusion_criteria:
        - "exclude sensory-perceptual difficulty contrasts (e.g., low coherence > high coherence, noisy > clear, hard > easy perceptual discrimination); those belong in perceptual_dm."
        - "exclude purely outcome/feedback contrasts unless the contrast directly indexes uncertainty during the decision phase."
    - name: "perceptual_dm"
      description: "perceptual decision-making contrasts"
      inclusion_criteria:
        - "assign this annotation only if perceptual_dm is the single study-level subtype for that PMID."
        - "contrasts where decisions are based on sensory/perceptual evidence (e.g., coherence/noise/category discrimination, hard > easy perceptual judgments, perceptual task > control)."
        - "include low-coherence/noisy > high-coherence/clear contrasts as perceptual_dm, not ambiguous_dm."
        - "all populations (e.g., healthy controls, non-users, drug users, patients with substance use disorders, or other neuropsychiatric conditions)"
      exclusion_criteria:
        - "exclude economic/probability uncertainty, reward prediction, or gambling ambiguity/risk contrasts even if stimuli are visual."
    - name: "risky_dm"
      description: "risky decision-making contrasts"
      inclusion_criteria:
        - "assign this annotation only if risky_dm is the single study-level subtype for that PMID."
        - "contrasts with explicit known-risk manipulation focused on risky vs safe/certain choice (e.g., risky > safe, high-risk > low-risk, risk > certainty, riskier > surer, risk task > control)."
        - "all populations (e.g., healthy controls, non-users, drug users, patients with substance use disorders, or other neuropsychiatric conditions)"
      exclusion_criteria:
        - "exclude ambiguity-dominant contrasts (e.g., ambiguity > risk, mixed risk-vs-ambiguity contrasts where ambiguity is the target); route these to ambiguous_dm."
        - "exclude generic uncertainty/prediction contrasts without a clear risky-vs-safe decision manipulation."
    - name: "non_using_risky"
      description: "contrasts related to risky decision-making in non-substance using populations (e.g., healthy controls, non-users, or other neuropsychiatric conditions)"
      inclusion_criteria:
        - "only apply when the study-level subtype for that PMID is risky_dm."
        - "same risky_dm contrast rules: explicit known-risk vs safe/certain choice contrasts; exclude ambiguity-dominant or generic uncertainty-only contrasts."
        - "non-substance using populations (e.g., healthy controls, non-users, or other neuropsychiatric conditions) compared to substance using populations (e.g., drug users, patients with substance use disorders)"
    - name: "using_risky"
      description: "contrasts related to risky decision-making in substance using populations (e.g., drug users, patients with substance use disorders)"
      inclusion_criteria:
        - "only apply when the study-level subtype for that PMID is risky_dm."
        - "same risky_dm contrast rules: explicit known-risk vs safe/certain choice contrasts; exclude ambiguity-dominant or generic uncertainty-only contrasts."
        - "substance using populations (e.g., drug users, patients with substance use disorders) compared to non-substance using populations (e.g., healthy controls, non-users, or other neuropsychiatric conditions)"

output:
  nimads: true
  export_excluded_studies: true
