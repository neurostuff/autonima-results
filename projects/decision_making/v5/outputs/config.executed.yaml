search:
  database: pubmed
  query: (((((risk*[tiab] OR "risk taking"[tiab] OR "risk-taking"[tiab]) AND (decision-making[tiab]
    OR "decision making"[tiab] OR choice[tiab] OR choices[tiab])) OR ((ambigu*[tiab]
    OR uncertainty[tiab] OR probabilistic[tiab]) AND (decision-making[tiab] OR "decision
    making"[tiab] OR choice[tiab] OR choices[tiab])) OR ("perceptual decision-making"[tiab]
    OR "perceptual decision making"[tiab]) OR (((ambigu*[tiab] OR uncertainty[tiab]
    OR probabilistic[tiab]) AND (reward*[tiab] OR learning[tiab])))) OR ((ambigu*[tiab]
    OR uncertain*[tiab] OR probabilit*[tiab] OR predict*[tiab] OR guess*[tiab] OR
    gambl*[tiab] OR bandit[tiab] OR explor*[tiab] OR lotter*[tiab]) AND (decision-making[tiab]
    OR "decision making"[tiab] OR decision*[tiab] OR choice[tiab] OR choices[tiab])))
    AND (fMRI[tiab] OR "functional MRI"[tiab] OR "functional magnetic resonance"[tiab]
    OR "magnetic resonance imaging"[tiab] OR BOLD[tiab] OR "blood oxygen*"[tiab] OR
    neuroimaging[tiab] OR "Magnetic Resonance Imaging"[mh]) AND English[lang] NOT
    (animals[mh] NOT humans[mh]) NOT (review[pt] OR "systematic review"[tiab] OR meta-analysis[pt])
  max_results: 15000
  date_from: 1995/01/01
  date_to: 2019/03/31
  email: delavega@utexas.edu
  pmids_file: null
  pmids_list: null
screening:
  abstract:
    model: gpt-5-mini-2025-08-07
    threshold: null
    confidence_reporting: true
    objective: Meta-analysis of fMRI studies of risky, ambiguous, and perceptual decision-making.
    inclusion_criteria:
    - English language empirical studies with original data
    - Functional MRI scan conducted while human participants performed a risky, ambiguous,
      or perceptual decision-making task
    - Sample- humans of any age that were either healthy participants, substance users,
      as well as groups with other neuropsychiatric conditions
    exclusion_criteria:
    - Studies using only PET or other non-fMRI neuroimaging methods
    - Systematic reviews or meta-analyses
    additional_instructions: null
    criteria_mapping:
      inclusion:
        I1: English language empirical studies with original data
        I2: Functional MRI scan conducted while human participants performed a risky,
          ambiguous, or perceptual decision-making task
        I3: Sample- humans of any age that were either healthy participants, substance
          users, as well as groups with other neuropsychiatric conditions
      exclusion:
        E1: Studies using only PET or other non-fMRI neuroimaging methods
        E2: Systematic reviews or meta-analyses
  fulltext:
    model: gpt-5-mini-2025-08-07
    threshold: null
    confidence_reporting: true
    objective: Meta-analysis of fMRI studies of risky, ambiguous, and perceptual decision-making.
    inclusion_criteria:
    - Functional MRI (fMRI) scan conducted while human participants performed a risky,
      ambiguous, or perceptual decision-making task
    - At least one contrast comparing two decision-making conditions, or a decision-making
      task against an active CONTROL TASK. The admitted forms are- for risky-DM "risky
      > safe", "high-risk > low-risk", "risk > certainty", "riskier > surer", or "experimental
      task (risk) > control task"; for ambiguous-DM "high uncertainty > low uncertainty",
      "ambiguity > ignorance", "ambiguous > non-ambiguous", or "ambiguous task > control
      task"; for perceptual-DM "hard > easy", "low coherence > high coherence", or
      "perceptual task > control task". Both within-task and between-task comparisons
      qualify.
    - Whole-brain evidence- The target analysis must be a group-level, whole-brain
      (voxelwise) task-evoked statistical map
    - Any participant group qualifies- healthy participants, substance users, and
      participants with other neuropsychiatric conditions (internet addiction, gambling
      disorder, internet gaming disorder, obesity, depressive, anxiety or conduct
      disorders, antisocial personality disorder, schizophrenia). All age groups from
      roughly 10 to 69 years qualify. Do not exclude a study because of who its participants
      were.
    - It is acceptable for qualifying whole-brain results to be reported in tables
      of coordinates, figures, or supplementary materials, as long as they are clearly
      described in the text.
    exclusion_criteria:
    - Studies whose only decision-making contrasts are against an implicit baseline,
      rest or fixation (e.g. "50% probability condition > implicit baseline", "task
      > rest"). This benchmark admits only condition-versus-condition and task-versus-control-task
      contrasts.
    - Positron emission tomography (PET) studies. The source meta-analysis excluded
      PET deliberately, to remove heterogeneity across imaging modalities.
    - Studies whose decision-making task is not risky, ambiguous or perceptual DM-
      for example delay discounting or intertemporal choice, moral or social decision-making,
      reward receipt or consumption without an uncertainty manipulation, and effort-based
      choice.
    - Studies that report only region-of-interest (ROI) analyses with no whole-brain
      results.
    - Studies that report only seed-based connectivity, effective connectivity (e.g.,
      PPI, DCM), or resting-state analyses (e.g., ICA, PLE, Hurst exponents) without
      also reporting a whole-brain task activation map.
    - Studies that report ONLY between-group contrasts or interactions (e.g. substance
      users vs non-users, patient vs control) with no accompanying unmasked, whole-brain
      within-group task effect. Note this is about the contrast, not the sample- a
      within-group contrast in a patient or substance-using sample qualifies.
    - Non-empirical papers (e.g., reviews, meta-analyses, methods-only, simulations)
      without original fMRI data.
    additional_instructions: null
    criteria_mapping:
      inclusion:
        I4: Functional MRI (fMRI) scan conducted while human participants performed
          a risky, ambiguous, or perceptual decision-making task
        I5: At least one contrast comparing two decision-making conditions, or a decision-making
          task against an active CONTROL TASK. The admitted forms are- for risky-DM
          "risky > safe", "high-risk > low-risk", "risk > certainty", "riskier > surer",
          or "experimental task (risk) > control task"; for ambiguous-DM "high uncertainty
          > low uncertainty", "ambiguity > ignorance", "ambiguous > non-ambiguous",
          or "ambiguous task > control task"; for perceptual-DM "hard > easy", "low
          coherence > high coherence", or "perceptual task > control task". Both within-task
          and between-task comparisons qualify.
        I6: Whole-brain evidence- The target analysis must be a group-level, whole-brain
          (voxelwise) task-evoked statistical map
        I7: Any participant group qualifies- healthy participants, substance users,
          and participants with other neuropsychiatric conditions (internet addiction,
          gambling disorder, internet gaming disorder, obesity, depressive, anxiety
          or conduct disorders, antisocial personality disorder, schizophrenia). All
          age groups from roughly 10 to 69 years qualify. Do not exclude a study because
          of who its participants were.
        I8: It is acceptable for qualifying whole-brain results to be reported in
          tables of coordinates, figures, or supplementary materials, as long as they
          are clearly described in the text.
      exclusion:
        E3: Studies whose only decision-making contrasts are against an implicit baseline,
          rest or fixation (e.g. "50% probability condition > implicit baseline",
          "task > rest"). This benchmark admits only condition-versus-condition and
          task-versus-control-task contrasts.
        E4: Positron emission tomography (PET) studies. The source meta-analysis excluded
          PET deliberately, to remove heterogeneity across imaging modalities.
        E5: Studies whose decision-making task is not risky, ambiguous or perceptual
          DM- for example delay discounting or intertemporal choice, moral or social
          decision-making, reward receipt or consumption without an uncertainty manipulation,
          and effort-based choice.
        E6: Studies that report only region-of-interest (ROI) analyses with no whole-brain
          results.
        E7: Studies that report only seed-based connectivity, effective connectivity
          (e.g., PPI, DCM), or resting-state analyses (e.g., ICA, PLE, Hurst exponents)
          without also reporting a whole-brain task activation map.
        E8: Studies that report ONLY between-group contrasts or interactions (e.g.
          substance users vs non-users, patient vs control) with no accompanying unmasked,
          whole-brain within-group task effect. Note this is about the contrast, not
          the sample- a within-group contrast in a patient or substance-using sample
          qualifies.
        E9: Non-empirical papers (e.g., reviews, meta-analyses, methods-only, simulations)
          without original fMRI data.
retrieval:
  sources:
  - pubget
  timeout: 30
  max_retries: 3
  download_directory: downloads
  n_jobs: 1
  load_excluded: true
  full_text_sources:
  - root_path: articles/elsevier_output/
    pmid_source: folder_name
    text_path_templates:
    - text.txt
    coordinates_path_templates:
    - coordinates.json
  - root_path: articles/ace_outputs
    pmid_source: file_name
    allowed_extensions:
    - .html
    processed_data_path: articles/ace_outputs/processed/
  parse_coordinates: false
  coordinate_model: gpt-4o-mini
parsing:
  parse_coordinates: true
  coordinate_model: gpt-5-mini-2025-08-07
annotation:
  model: gpt-5-mini-2025-08-07
  create_all_included_annotations: true
  metadata_fields:
  - analysis_name
  - analysis_description
  - table_caption
  - study_title
  - study_fulltext
  prompt_type: multi_analysis
  inclusion_criteria:
  - Task-evoked contrasts related to decision-making
  - Whole-brain evidence- Must be a group-level, whole-brain (voxelwise) task-evoked
    statistical map
  - If an analysis label is generic/truncated (e.g., analysis_0), use table caption,
    neighboring contrasts, and study_fulltext to infer eligibility; do not fail only
    because the label text is sparse.
  - Assign the subtype from the task's outcome probabilities, as the source meta-analysis
    does. risky_dm- outcome probabilities are known or easily inferred and differ
    between options (an explicit risky vs safe choice). ambiguous_dm- outcome probabilities
    are not known, are hidden or occluded, cannot be inferred from the information
    given, change during the task (e.g. reversals), or are the same for every choice
    option (e.g. 50/50 guesses, two-choice prediction tasks with fixed error rates,
    slot or bandit choices with equal payoffs). perceptual_dm- the choice is made
    on the basis of available sensory evidence.
  - Subtypes are mutually exclusive per contrast. A study normally has one subtype
    and all its included analyses follow it. The exception is a study that manipulates
    both known and unknown (or equal) probabilities, such as a risk-versus-ambiguity
    design- its risk contrasts go to risky_dm and its ambiguity contrasts to ambiguous_dm.
  exclusion_criteria:
  - Region-of-interest (ROI) analyses
  - Seed-based connectivity, effective connectivity (e.g., PPI, DCM), or resting-state
    analyses (e.g., ICA, PLE, Hurst exponents)
  - For ambiguous_dm, risky_dm and perceptual_dm only (not common_dm)- a secondary
    contrast of the study. Each study contributes its main contrast for the subtype,
    normally ONE- the decision-phase effect of the subtype's manipulation in the whole
    sample (e.g. ambiguous > non-ambiguous, high > low uncertainty, risky > safe,
    hard > easy, task > control). Keep a second or third only when the study reports
    that same main effect separately for distinct groups, samples or tasks. Exclude
    the rest of the study's contrasts- reversed directions, parametric or brain-behaviour
    correlation maps, group differences and interactions, sub-condition or single-condition
    maps, outcome/feedback-phase maps, and duplicates of the main effect at another
    threshold or model. If the study's main effect is not reported as its own map,
    keep the single contrast closest to it.
  annotations:
  - name: common_dm
    description: decision making contrasts that are common across risky, ambiguous,
      and perceptual decision-making studies
    inclusion_criteria:
    - contrasts related to risky, ambiguous, or perceptual decision-making
    - all populations (e.g., healthy controls, non-users, drug users, patients with
      substance use disorders, or other neuropsychiatric conditions)
    exclusion_criteria: []
  - name: ambiguous_dm
    description: ambiguous decision-making contrasts- choices whose outcome probabilities
      are unknown, hidden, changing, or equal for every option
    inclusion_criteria:
    - assign this annotation only to contrasts whose subtype is ambiguous_dm under
      the subtype rule.
    - contrasts from tasks whose outcome probabilities are not known, hidden or not
      inferable, change during the task, or are equal for every option (e.g. ambiguous
      lottery or wheel tasks, two-choice prediction or guessing tasks, card or casino
      tasks with equal odds, bandit tasks).
    - "the more uncertain or ambiguous condition, or the ambiguous task, is on the\
      \ positive side of the contrast- e.g. \u201Chigh uncertainty > low uncertainty\u201D\
      , \u201Cambiguous > non-ambiguous\u201D, \u201Cambiguity > risk\u201D, \u201C\
      ambiguity > ignorance\u201D, \u201Cuncertain > certain decisions\u201D, \u201C\
      ambiguous task > control task\u201D, task by error-rate (uncertainty level)\
      \ effects."
    - include uncertainty-based choice contrasts even when labels are generic (analysis_0/analysis_1)
      if study/table context shows they are uncertainty decision maps.
    - all populations (e.g., healthy controls, non-users, drug users, patients with
      substance use disorders, or other neuropsychiatric conditions)
    exclusion_criteria:
    - exclude reversed contrasts whose positive side is the less uncertain condition
      (e.g. certain > uncertain, risk > ambiguity, non-ambiguous > ambiguous, low
      > high uncertainty).
    - exclude sensory-perceptual difficulty contrasts (e.g., low coherence > high
      coherence, noisy > clear, hard > easy perceptual discrimination); those belong
      in perceptual_dm.
    - exclude purely outcome/feedback contrasts unless the contrast directly indexes
      uncertainty during the decision phase.
  - name: perceptual_dm
    description: perceptual decision-making contrasts
    inclusion_criteria:
    - assign this annotation only to contrasts whose subtype is perceptual_dm under
      the subtype rule.
    - contrasts where decisions are based on sensory/perceptual evidence (e.g., coherence/noise/category
      discrimination, hard > easy perceptual judgments, perceptual task > control).
    - include low-coherence/noisy > high-coherence/clear contrasts as perceptual_dm,
      not ambiguous_dm.
    - all populations (e.g., healthy controls, non-users, drug users, patients with
      substance use disorders, or other neuropsychiatric conditions)
    exclusion_criteria:
    - exclude economic/probability uncertainty, reward prediction, or gambling ambiguity/risk
      contrasts even if stimuli are visual.
  - name: risky_dm
    description: risky decision-making contrasts
    inclusion_criteria:
    - assign this annotation only to contrasts whose subtype is risky_dm under the
      subtype rule.
    - contrasts with explicit known-risk manipulation focused on risky vs safe/certain
      choice (e.g., risky > safe, high-risk > low-risk, risk > certainty, riskier
      > surer, risk task > control).
    - all populations (e.g., healthy controls, non-users, drug users, patients with
      substance use disorders, or other neuropsychiatric conditions)
    exclusion_criteria:
    - exclude ambiguity-dominant contrasts (e.g., ambiguity > risk, mixed risk-vs-ambiguity
      contrasts where ambiguity is the target); route these to ambiguous_dm.
    - exclude choices whose options all have the same outcome probability (e.g. 50/50
      guesses, two-choice prediction tasks); route these to ambiguous_dm.
    - exclude generic uncertainty/prediction contrasts without a clear risky-vs-safe
      decision manipulation.
  - name: non_using_risky
    description: contrasts related to risky decision-making in non-substance using
      populations (e.g., healthy controls, non-users, or other neuropsychiatric conditions)
    inclusion_criteria:
    - only apply when the study-level subtype for that PMID is risky_dm.
    - 'same risky_dm contrast rules: explicit known-risk vs safe/certain choice contrasts;
      exclude ambiguity-dominant or generic uncertainty-only contrasts.'
    - non-substance using populations (e.g., healthy controls, non-users, or other
      neuropsychiatric conditions) compared to substance using populations (e.g.,
      drug users, patients with substance use disorders)
    exclusion_criteria: []
  - name: using_risky
    description: contrasts related to risky decision-making in substance using populations
      (e.g., drug users, patients with substance use disorders)
    inclusion_criteria:
    - only apply when the study-level subtype for that PMID is risky_dm.
    - 'same risky_dm contrast rules: explicit known-risk vs safe/certain choice contrasts;
      exclude ambiguity-dominant or generic uncertainty-only contrasts.'
    - substance using populations (e.g., drug users, patients with substance use disorders)
      compared to non-substance using populations (e.g., healthy controls, non-users,
      or other neuropsychiatric conditions)
    exclusion_criteria: []
  enabled: true
output:
  directory: projects/decision_making/v5
  prisma_diagram: true
  formats:
  - csv
  - json
  nimads: true
  export_excluded_studies: true
