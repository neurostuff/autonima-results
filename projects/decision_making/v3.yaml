# v3 -- AUTOMATICALLY GENERATED by Claude (Opus 5) on 2026-08-25.
#
# PROVENANCE, STATED PLAINLY
#
# Written by an LLM agent, not a human expert. Inputs were the source paper's full text
# (PMC7127964, PMID 32078973) and this project's own v2 error reports
# (v2/evaluation/performance_metrics.json and v2/reports/qualitative/false_positives_fulltext.html).
# No human expert reviewed these criteria before the run. Tuned against the benchmark; report as
# an iterated version, never as held-out.
#
# WHAT IS UNCHANGED -- AND WHY THIS RUN IS CHEAP
#
# search, retrieval, parsing, annotation and output are byte-identical to v2. ONLY
# `screening.fulltext` differs. Abstract screening is untouched, so search results and abstract
# decisions both come from cache; only full-text screening and the stages after it re-run.
#
# WHY PRECISION AND NOT RECALL
#
# v2's funnel, from v2/evaluation/performance_metrics.json:
#
#     stage       gold kept              precision    lost here
#     search       92 / 153  (0.601)       0.120        61 gold never retrieved
#     abstract     91 /  92  (0.989)       0.157         1 gold
#     fulltext     83 /  85  (0.976)       0.192         2 gold
#
# Screening recall is already near-ceiling at both stages -- full-text screening loses two
# papers out of 85. There is essentially nothing to gain on recall here. The project's F1 of
# 0.283 is driven entirely by 350 false positives against 83 true positives, so precision is the
# only target a schema edit can move.
#
# The recall that IS missing is lost at search (61 of 153 gold), and that is not fixable by a
# screening edit. It is also only partly fixable at all- the source paper searched PubMed,
# Google Scholar AND Web of Science, and additionally chased reference lists of matching papers.
# Our PubMed-only search cannot reach studies that were found by the other three routes. Our date
# window (1995/01/01 - 2019/03/31) already matches the paper's stated "published in English up
# until March 2019", so the gap is query coverage and source coverage, not the window.
#
# THE DEFECT: THE COMPARATOR IS UNCONSTRAINED
#
# The paper enumerates the contrasts it admits, and every one of them compares two
# decision-making conditions or a DM task against a CONTROL TASK:
#
#   risky-DM      "risky > safe", "high-risk > low-risk", "risk > certainty", "riskier > surer",
#                 "experimental task (risk) > control task"
#   ambiguous-DM  "high uncertainty > low uncertainty", "ambiguity > ignorance",
#                 "ambiguous > non-ambiguous", "ambiguous task > control task"
#   perceptual-DM "hard > easy", "low coherence > high coherence", "perceptual task > control task"
#
# A contrast against implicit baseline, rest or fixation appears nowhere in that list. v2's
# criteria did not exclude one, and the false-positive report shows the model admitting exactly
# that: one accepted study is justified as reporting "within-task contrasts related to ambiguous
# decision-making (50% probability condition vs implicit baseline)". ADDED as a requirement that
# the contrast be between two conditions or against an active control task.
#
# Two further corrections, both from the paper's own text:
#
#   - PET IS EXPLICITLY EXCLUDED. The paper- "We excluded PET studies to remove heterogeneity
#     associated with different neuroimaging modalities." v2 implied fMRI by naming it in an
#     inclusion criterion but never excluded PET. Now stated.
#
#   - THE "HEALTHY ADULTS" WORDING WAS WRONG. v2's final exclusion ended "...without original
#     fMRI data in healthy adults". The paper deliberately does the opposite- it includes
#     substance users and participants with internet addiction, gambling disorder, internet
#     gaming disorder, obesity, depressive, anxiety and conduct disorders, antisocial personality
#     disorder and schizophrenia, across "all age groups (range: 10-69 years)". This wording cost
#     little in practice (recall is 0.976) but it contradicted the benchmark and is now correct.
#
# A CAVEAT ON WHAT "PRECISION" MEANS HERE
#
# The false positives are not obviously wrong papers. Sampling their reasoning shows genuine
# risky-gambling, ambiguity and random-dot-motion coherence fMRI studies with whole-brain
# group-level maps -- studies that look includable and that this meta-analysis simply did not
# include. Since our own search recall is 0.601, the two corpora overlap only partially, and many
# of these were probably never in the authors' candidate pool. Treat decision_making precision as
# a floor rather than a measurement, as with executive_function.
#
# RISK
#
# Requiring a condition-vs-condition or task-vs-control-task comparison is the one change that
# could cost recall, because a table caption often does not state what the comparison condition
# was. Full-text screening recall is currently 0.976 (83/85); if v3 drops below ~0.93 the
# baseline requirement is being read too strictly and should be relaxed to exclude only
# contrasts that are EXPLICITLY against rest, fixation or implicit baseline.

# Used ChatGPT to refine annotations using reports
# Ensure annotations were mututally exclusive at the study level
search:
  database: "pubmed"
  query: ((((risk*[tiab] OR "risk taking"[tiab] OR "risk-taking"[tiab]) AND (decision-making[tiab] OR "decision making"[tiab] OR choice[tiab] OR choices[tiab])) OR ((ambigu*[tiab] OR uncertainty[tiab] OR probabilistic[tiab]) AND (decision-making[tiab] OR "decision making"[tiab] OR choice[tiab] OR choices[tiab])) OR ("perceptual decision-making"[tiab] OR "perceptual decision making"[tiab]) OR (((ambigu*[tiab] OR uncertainty[tiab] OR probabilistic[tiab]) AND (reward*[tiab] OR learning[tiab])))) AND (fMRI[tiab] OR "functional MRI"[tiab] OR "functional magnetic resonance imaging"[tiab] OR BOLD[tiab] OR "blood oxygenation level dependent"[tiab]) AND Humans[mh] AND English[lang] NOT (review[pt] OR "systematic review"[tiab] OR meta-analysis[pt]))
  date_from: "1995/01/01"
  date_to: "2019/03/31"
  max_results: 15000
  email: delavega@utexas.edu
  
retrieval:
  load_excluded: true
  sources:
    - pubget
  full_text_sources:
    - root_path: "/home/zorro/repos/autonima-results/articles/elsevier_output/"
      pmid_source: "folder_name"
      text_path_templates:
        - 'text.txt'
      coordinates_path_templates:
        - 'coordinates.json'
    - root_path: "/home/zorro/repos/autonima-results/articles/ace_outputs"
      pmid_source: "file_name"
      allowed_extensions: [".html"]
      processed_data_path: "/home/zorro/repos/autonima-results/articles/ace_outputs/processed/"

screening:
  abstract:
    model: "gpt-5-mini-2025-08-07"
    objective: "Meta-analysis of fMRI studies of risky, ambiguous, and perceptual decision-making."
    inclusion_criteria:
      - English language empirical studies with original data
      - Functional MRI scan conducted while human participants performed a risky, ambiguous, or perceptual decision-making task
      - Sample- humans of any age that were either healthy participants, substance users, as well as groups with other neuropsychiatric conditions 
    exclusion_criteria:
      - Studies using only PET or other non-fMRI neuroimaging methods
      - Systematic reviews or meta-analyses
    confidence_reporting: true

  fulltext:
    model: "gpt-5-mini-2025-08-07"
    confidence_reporting: true
    objective: "Meta-analysis of fMRI studies of risky, ambiguous, and perceptual decision-making."
    inclusion_criteria:
      - Functional MRI (fMRI) scan conducted while human participants performed a risky, ambiguous, or perceptual decision-making task
      - >-
        At least one contrast comparing two decision-making conditions, or a decision-making task
        against an active CONTROL TASK. The admitted forms are- for risky-DM "risky > safe",
        "high-risk > low-risk", "risk > certainty", "riskier > surer", or "experimental task
        (risk) > control task"; for ambiguous-DM "high uncertainty > low uncertainty", "ambiguity
        > ignorance", "ambiguous > non-ambiguous", or "ambiguous task > control task"; for
        perceptual-DM "hard > easy", "low coherence > high coherence", or "perceptual task >
        control task". Both within-task and between-task comparisons qualify.
      - Whole-brain evidence- The target analysis must be a group-level, whole-brain (voxelwise) task-evoked statistical map
      - >-
        Any participant group qualifies- healthy participants, substance users, and participants
        with other neuropsychiatric conditions (internet addiction, gambling disorder, internet
        gaming disorder, obesity, depressive, anxiety or conduct disorders, antisocial
        personality disorder, schizophrenia). All age groups from roughly 10 to 69 years qualify.
        Do not exclude a study because of who its participants were.
      - It is acceptable for qualifying whole-brain results to be reported in tables of coordinates, figures, or supplementary materials, as long as they are clearly described in the text.
    exclusion_criteria:
      - >-
        Studies whose only decision-making contrasts are against an implicit baseline, rest or
        fixation (e.g. "50% probability condition > implicit baseline", "task > rest"). This
        benchmark admits only condition-versus-condition and task-versus-control-task contrasts.
      - >-
        Positron emission tomography (PET) studies. The source meta-analysis excluded PET
        deliberately, to remove heterogeneity across imaging modalities.
      - >-
        Studies whose decision-making task is not risky, ambiguous or perceptual DM- for example
        delay discounting or intertemporal choice, moral or social decision-making, reward
        receipt or consumption without an uncertainty manipulation, and effort-based choice.
      - Studies that report only region-of-interest (ROI) analyses with no whole-brain results.
      - Studies that report only seed-based connectivity, effective connectivity (e.g., PPI, DCM), or resting-state analyses (e.g., ICA, PLE, Hurst exponents) without also reporting a whole-brain task activation map.
      - >-
        Studies that report ONLY between-group contrasts or interactions (e.g. substance users vs
        non-users, patient vs control) with no accompanying unmasked, whole-brain within-group
        task effect. Note this is about the contrast, not the sample- a within-group contrast in
        a patient or substance-using sample qualifies.
      - Non-empirical papers (e.g., reviews, meta-analyses, methods-only, simulations) without original fMRI data.

parsing:
  parse_coordinates: true 
  coordinate_model: "gpt-5-mini-2025-08-07"  

annotation:
  enabled: true
  model: "gpt-5-mini-2025-08-07"
  create_all_included_annotations: true
  prompt_type: "multi_analysis"
  metadata_fields:
    - "analysis_name"
    - "analysis_description"
    - "table_caption"
    - "study_title"
    - "study_fulltext"
  inclusion_criteria:
    - Task-evoked contrasts related to decision-making
    - Whole-brain evidence- Must be a group-level, whole-brain (voxelwise) task-evoked statistical map 
    - If an analysis label is generic/truncated (e.g., analysis_0), use table caption, neighboring contrasts, and study_fulltext to infer eligibility; do not fail only because the label text is sparse.
    - Resolve subtype overlaps by primary uncertainty source- sensory evidence uncertainty -> perceptual_dm; uncertainty/ambiguity in contingencies or information -> ambiguous_dm; explicit known-risk vs safe/certain choice -> risky_dm.
    - Study-level subtype mutual exclusivity is required- for each study/PMID, assign exactly one subtype among ambiguous_dm, perceptual_dm, and risky_dm.
    - Once a study-level subtype is chosen, all included analyses from that study must follow that same subtype; do not split analyses from one study across multiple subtypes.
  exclusion_criteria/home/zorro/repos/autonima-results/projects/decision_making/v1.yaml:
    - Region-of-interest (ROI) analyses
    - Seed-based connectivity, effective connectivity (e.g., PPI, DCM), or resting-state analyses (e.g., ICA, PLE, Hurst exponents) 
  annotations:
    - name: "common_dm"
      description: "decision making contrasts that are common across risky, ambiguous, and perceptual decision-making studies"
      inclusion_criteria:
        - "contrasts related to risky, ambiguous, or perceptual decision-making"
        - "all populations (e.g., healthy controls, non-users, drug users, patients with substance use disorders, or other neuropsychiatric conditions)"
    - name: "ambiguous_dm"
      description: "ambiguous decision-making contrasts"
      inclusion_criteria:
        - "assign this annotation only if ambiguous_dm is the single study-level subtype for that PMID."
        - "contrasts where uncertainty/ambiguity is central to the decision (e.g., “ambiguous > certain”, “high uncertainty > low uncertainty”, “ambiguity > risk”, uncertainty-driven information sampling/decision contrasts)."
        - "include uncertainty-based choice contrasts even when labels are generic (analysis_0/analysis_1) if study/table context shows they are uncertainty decision maps."
        - "all populations (e.g., healthy controls, non-users, drug users, patients with substance use disorders, or other neuropsychiatric conditions)"
      exclusion_criteria:
        - "exclude sensory-perceptual difficulty contrasts (e.g., low coherence > high coherence, noisy > clear, hard > easy perceptual discrimination); those belong in perceptual_dm."
        - "exclude purely outcome/feedback contrasts unless the contrast directly indexes uncertainty during the decision phase."
    - name: "perceptual_dm"
      description: "perceptual decision-making contrasts"
      inclusion_criteria:
        - "assign this annotation only if perceptual_dm is the single study-level subtype for that PMID."
        - "contrasts where decisions are based on sensory/perceptual evidence (e.g., coherence/noise/category discrimination, hard > easy perceptual judgments, perceptual task > control)."
        - "include low-coherence/noisy > high-coherence/clear contrasts as perceptual_dm, not ambiguous_dm."
        - "all populations (e.g., healthy controls, non-users, drug users, patients with substance use disorders, or other neuropsychiatric conditions)"
      exclusion_criteria:
        - "exclude economic/probability uncertainty, reward prediction, or gambling ambiguity/risk contrasts even if stimuli are visual."
    - name: "risky_dm"
      description: "risky decision-making contrasts"
      inclusion_criteria:
        - "assign this annotation only if risky_dm is the single study-level subtype for that PMID."
        - "contrasts with explicit known-risk manipulation focused on risky vs safe/certain choice (e.g., risky > safe, high-risk > low-risk, risk > certainty, riskier > surer, risk task > control)."
        - "all populations (e.g., healthy controls, non-users, drug users, patients with substance use disorders, or other neuropsychiatric conditions)"
      exclusion_criteria:
        - "exclude ambiguity-dominant contrasts (e.g., ambiguity > risk, mixed risk-vs-ambiguity contrasts where ambiguity is the target); route these to ambiguous_dm."
        - "exclude generic uncertainty/prediction contrasts without a clear risky-vs-safe decision manipulation."
    - name: "non_using_risky"
      description: "contrasts related to risky decision-making in non-substance using populations (e.g., healthy controls, non-users, or other neuropsychiatric conditions)"
      inclusion_criteria:
        - "only apply when the study-level subtype for that PMID is risky_dm."
        - "same risky_dm contrast rules: explicit known-risk vs safe/certain choice contrasts; exclude ambiguity-dominant or generic uncertainty-only contrasts."
        - "non-substance using populations (e.g., healthy controls, non-users, or other neuropsychiatric conditions) compared to substance using populations (e.g., drug users, patients with substance use disorders)"
    - name: "using_risky"
      description: "contrasts related to risky decision-making in substance using populations (e.g., drug users, patients with substance use disorders)"
      inclusion_criteria:
        - "only apply when the study-level subtype for that PMID is risky_dm."
        - "same risky_dm contrast rules: explicit known-risk vs safe/certain choice contrasts; exclude ambiguity-dominant or generic uncertainty-only contrasts."
        - "substance using populations (e.g., drug users, patients with substance use disorders) compared to non-substance using populations (e.g., healthy controls, non-users, or other neuropsychiatric conditions)"

output:
  nimads: true
  export_excluded_studies: true
