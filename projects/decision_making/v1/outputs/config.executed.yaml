search:
  database: pubmed
  query: ((((risk*[tiab] OR "risk taking"[tiab] OR "risk-taking"[tiab]) AND (decision-making[tiab]
    OR "decision making"[tiab] OR choice[tiab] OR choices[tiab])) OR ((ambigu*[tiab]
    OR uncertainty[tiab] OR probabilistic[tiab]) AND (decision-making[tiab] OR "decision
    making"[tiab] OR choice[tiab] OR choices[tiab])) OR ("perceptual decision-making"[tiab]
    OR "perceptual decision making"[tiab]) OR (((ambigu*[tiab] OR uncertainty[tiab]
    OR probabilistic[tiab]) AND (reward*[tiab] OR learning[tiab])))) AND (fMRI[tiab]
    OR "functional MRI"[tiab] OR "functional magnetic resonance imaging"[tiab] OR
    BOLD[tiab] OR "blood oxygenation level dependent"[tiab]) AND Humans[mh] AND English[lang]
    NOT (review[pt] OR "systematic review"[tiab] OR meta-analysis[pt]))
  max_results: 15000
  date_from: 1995/01/01
  date_to: 2019/03/31
  email: delavega@utexas.edu
  pmids_file: null
  pmids_list: null
screening:
  abstract:
    model: gpt-5-mini-2025-08-07
    threshold: null
    confidence_reporting: true
    objective: Meta-analysis of fMRI studies of risky, ambiguous, and perceptual decision-making.
    inclusion_criteria:
    - English language empirical studies with original data
    - Functional MRI scan conducted while human participants performed a risky, ambiguous,
      or perceptual decision-making task
    - Sample- humans of any age that were either healthy participants, substance users,
      as well as groups with other neuropsychiatric conditions
    exclusion_criteria:
    - Studies using only PET or other non-fMRI neuroimaging methods
    - Systematic reviews or meta-analyses
    additional_instructions: null
    criteria_mapping:
      inclusion:
        I1: English language empirical studies with original data
        I2: Functional MRI scan conducted while human participants performed a risky,
          ambiguous, or perceptual decision-making task
        I3: Sample- humans of any age that were either healthy participants, substance
          users, as well as groups with other neuropsychiatric conditions
      exclusion:
        E1: Studies using only PET or other non-fMRI neuroimaging methods
        E2: Systematic reviews or meta-analyses
  fulltext:
    model: gpt-5-mini-2025-08-07
    threshold: null
    confidence_reporting: true
    objective: Meta-analysis of fMRI studies of risky, ambiguous, and perceptual decision-making.
    inclusion_criteria:
    - Functional MRI scan conducted while human participants performed a risky, ambiguous,
      or perceptual decision-making task
    - "At least one within-task or between-task contrast related to risky, ambiguous,\
      \ or perceptual decision-making (e.g., \u201Crisky > safe\u201D, \u201Chigh-risk\
      \ > low-risk\u201D, \u201Crisk > certainty\u201D, \u201Criskier > surer\u201D\
      \ or \u201Cexperimental task (risk) > control task\u201D for risky-DM studies;\
      \ \u201Chigh uncertainty > low uncertainty\u201D, \u201Cambiguity > ignorance\u201D\
      , \u201Cambiguous > non-ambiguous\u201D or \u201Cambiguous task > control task\u201D\
      \ for ambiguous-DM studies; and \u201Chard > easy\u201D, \u201Clow coherence\
      \ > high coherence\u201D, or \u201Cperceptual task > control task\u201D for\
      \ perceptual-DM studies."
    - Whole-brain evidence- The target analysis must be a group-level, whole-brain
      (voxelwise) task-evoked statistical map
    - It is acceptable for qualifying whole-brain results to be reported in tables
      of coordinates, figures, or supplementary materials, as long as they are clearly
      described in the text.
    exclusion_criteria:
    - Studies that report only region-of-interest (ROI) analyses with no whole-brain
      results.
    - Studies that report only seed-based connectivity, effective connectivity (e.g.,
      PPI, DCM), or resting-state analyses (e.g., ICA, PLE, Hurst exponents) without
      also reporting a whole-brain task activation map.
    - Studies that report only between-group contrasts or interactions (e.g., subgroup
      vs subgroup, patient vs control) without an accompanying unmasked, whole-brain
      task effect.
    - Non-empirical papers (e.g., reviews, meta-analyses, methods-only, simulations)
      without original fMRI data in healthy adults.
    additional_instructions: null
    criteria_mapping:
      inclusion:
        I4: Functional MRI scan conducted while human participants performed a risky,
          ambiguous, or perceptual decision-making task
        I5: "At least one within-task or between-task contrast related to risky, ambiguous,\
          \ or perceptual decision-making (e.g., \u201Crisky > safe\u201D, \u201C\
          high-risk > low-risk\u201D, \u201Crisk > certainty\u201D, \u201Criskier\
          \ > surer\u201D or \u201Cexperimental task (risk) > control task\u201D for\
          \ risky-DM studies; \u201Chigh uncertainty > low uncertainty\u201D, \u201C\
          ambiguity > ignorance\u201D, \u201Cambiguous > non-ambiguous\u201D or \u201C\
          ambiguous task > control task\u201D for ambiguous-DM studies; and \u201C\
          hard > easy\u201D, \u201Clow coherence > high coherence\u201D, or \u201C\
          perceptual task > control task\u201D for perceptual-DM studies."
        I6: Whole-brain evidence- The target analysis must be a group-level, whole-brain
          (voxelwise) task-evoked statistical map
        I7: It is acceptable for qualifying whole-brain results to be reported in
          tables of coordinates, figures, or supplementary materials, as long as they
          are clearly described in the text.
      exclusion:
        E3: Studies that report only region-of-interest (ROI) analyses with no whole-brain
          results.
        E4: Studies that report only seed-based connectivity, effective connectivity
          (e.g., PPI, DCM), or resting-state analyses (e.g., ICA, PLE, Hurst exponents)
          without also reporting a whole-brain task activation map.
        E5: Studies that report only between-group contrasts or interactions (e.g.,
          subgroup vs subgroup, patient vs control) without an accompanying unmasked,
          whole-brain task effect.
        E6: Non-empirical papers (e.g., reviews, meta-analyses, methods-only, simulations)
          without original fMRI data in healthy adults.
retrieval:
  sources:
  - pubget
  timeout: 30
  max_retries: 3
  download_directory: downloads
  n_jobs: 1
  load_excluded: true
  full_text_sources:
  - root_path: /home/zorro/repos/autonima-results/articles/elsevier_output/
    pmid_source: folder_name
    text_path_templates:
    - text.txt
    coordinates_path_templates:
    - coordinates.json
  - root_path: /home/zorro/repos/autonima-results/articles/ace_outputs
    pmid_source: file_name
    allowed_extensions:
    - .html
    processed_data_path: /home/zorro/repos/autonima-results/articles/ace_outputs/processed/
  parse_coordinates: false
  coordinate_model: gpt-4o-mini
parsing:
  parse_coordinates: true
  coordinate_model: gpt-5-mini-2025-08-07
annotation:
  model: gpt-5-mini-2025-08-07
  create_all_included_annotations: true
  metadata_fields:
  - analysis_name
  - analysis_description
  - table_caption
  - study_title
  - study_fulltext
  prompt_type: multi_analysis
  inclusion_criteria: []
  exclusion_criteria: []
  annotations:
  - name: common_dm
    description: decision making contrasts that are common across risky, ambiguous,
      and perceptual decision-making studies
    inclusion_criteria:
    - contrasts related to risky, ambiguous, or perceptual decision-making
    - all populations (e.g., healthy controls, non-users, drug users, patients with
      substance use disorders, or other neuropsychiatric conditions)
    exclusion_criteria: []
  - name: ambiguous_dm
    description: ambiguous decision-making contrasts
    inclusion_criteria:
    - "contrasts related to ambiguous decision-making (e.g., \u201Cambiguous > certain\u201D\
      , \u201Chigh-ambiguity > low-ambiguity\u201D, \u201Cuncertain > certain\u201D\
      \ or \u201Cexperimental task (ambiguity) > control task\u201D for ambiguous-DM\
      \ studies)"
    - all populations (e.g., healthy controls, non-users, drug users, patients with
      substance use disorders, or other neuropsychiatric conditions)
    exclusion_criteria: []
  - name: perceptual_dm
    description: perceptual decision-making contrasts
    inclusion_criteria:
    - "contrasts related to perceptual decision-making (e.g., \u201Cperceptual > control\u201D\
      , \u201Chigh-perceptual > low-perceptual\u201D or \u201Cexperimental task (perceptual)\
      \ > control task\u201D for perceptual-DM studies)"
    - all populations (e.g., healthy controls, non-users, drug users, patients with
      substance use disorders, or other neuropsychiatric conditions)
    exclusion_criteria: []
  - name: risky_dm
    description: risky decision-making contrasts
    inclusion_criteria:
    - "contrasts related to risky decision-making (e.g., \u201Crisky > safe\u201D\
      , \u201Chigh-risk > low-risk\u201D, \u201Crisk > certainty\u201D, \u201Criskier\
      \ > surer\u201D or \u201Cexperimental task (risk) > control task\u201D for risky-DM\
      \ studies)"
    - all populations (e.g., healthy controls, non-users, drug users, patients with
      substance use disorders, or other neuropsychiatric conditions)
    exclusion_criteria: []
  - name: non_using_risky
    description: contrasts related to risky decision-making in non-substance using
      populations (e.g., healthy controls, non-users, or other neuropsychiatric conditions)
    inclusion_criteria:
    - "contrasts related to risky decision-making (e.g., \u201Crisky > safe\u201D\
      , \u201Chigh-risk > low-risk\u201D, \u201Crisk > certainty\u201D, \u201Criskier\
      \ > surer\u201D or \u201Cexperimental task (risk) > control task\u201D for risky-DM\
      \ studies)"
    - non-substance using populations (e.g., healthy controls, non-users, or other
      neuropsychiatric conditions) compared to substance using populations (e.g.,
      drug users, patients with substance use disorders)
    exclusion_criteria: []
  - name: using_risky
    description: contrasts related to risky decision-making in substance using populations
      (e.g., drug users, patients with substance use disorders)
    inclusion_criteria:
    - "contrasts related to risky decision-making (e.g., \u201Crisky > safe\u201D\
      , \u201Chigh-risk > low-risk\u201D, \u201Crisk > certainty\u201D, \u201Criskier\
      \ > surer\u201D or \u201Cexperimental task (risk) > control task\u201D for risky-DM\
      \ studies)"
    - substance using populations (e.g., drug users, patients with substance use disorders)
      compared to non-substance using populations (e.g., healthy controls, non-users,
      or other neuropsychiatric conditions)
    exclusion_criteria: []
  enabled: true
output:
  directory: /home/zorro/repos/autonima-results/projects/decision_making/v1
  prisma_diagram: true
  formats:
  - csv
  - json
  nimads: true
  export_excluded_studies: true
