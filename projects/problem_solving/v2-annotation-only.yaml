# v2 annotation-only -- AUTOMATICALLY GENERATED by Claude (Opus 5) on 2026-08-25.
#
# RENUMBERED v3 -> v2 on 2026-08-26. The project was collapsed to two versions: v1 carries
# the manual (human-written) criteria and v2 the Claude-revised ones. The GPT-authored
# annotation-only variant that previously held the v2 number is in archive/ -- see
# archive/NOTES.md. This file shares its annotation criteria byte-for-byte with v2.yaml.
#
# PROVENANCE, STATED PLAINLY
#
# Written by an LLM agent, not a human expert. Inputs were the source paper's full text
# (PMC6425494, Bartley et al., PMID 29944961), this project's v1-annotation-only error reports,
# and the benchmark's own Sleuth files in neurometabench/raw/meta-datasets/11. Problem Solving -
# Bartley/. No human expert reviewed these criteria before the run. Tuned against the benchmark;
# report as an iterated version, never as held-out.
#
# UNCHANGED: search, retrieval, screening, parsing and output are byte-identical to
# v1-annotation-only. Annotation-only over a fixed PMID list with both screening stages skipped,
# so nothing is re-searched and nothing is re-screened.
#
# THE HEADLINE DEFECT: `logical_reasoning` WAS ANNOTATING THE WRONG THING ENTIRELY.
#
# nmb_mappings.json maps this project's `logical_reasoning` target to the benchmark file
# `Demand_MNI_final.txt`. Reading that file settles what it contains -- its 41 contrast labels
# are difficulty manipulations, not logic problems:
#
#     Fehr 2007: Addition, Complex > Simple          Christoff 2001: 2-relational vs 1-relational
#     Grabner 2007: Multi-Digit > Single-Digit       Wagner 2001: 4-target > 2-target
#     Duncan 2000: Verbal, High vs. Low g            Cho 2010: Main Effect of Relational Complexity
#     Wood 2008: Large Problem Size > Small          Gaeke 2005: positive linear trend of analogical depth
#
# "Demand" is the paper's contrast type (2) -- "problem solving questions parametrically compared
# across varying difficulty, abstraction, or complexity" -- POOLED ACROSS all three
# representational domains. v1 instead defined `logical_reasoning` as "problem solving involving
# formal logic or rule-based reasoning", i.e. deductive reasoning. That is a different construct,
# and in this paper deductive reasoning is not even a domain of its own: it is a sub-paradigm of
# VERBAL problem solving (section 3.1.2.1, "Deductive reasoning paradigms", nested under "Verbal
# problem solving paradigms").
#
# The measured consequence, from v1-annotation-only:
#
#     annotation                       F1    prec   recall   TP   FP   FN   manual
#     mathematical_problem_solving   1.000  1.000   1.000    30    0    0     30
#     domain_general_problem_solving 0.977  1.000   0.955    85    0    4     89
#     visuospatial_problem_solving   0.895  0.872   0.919    34    5    3     37
#     verbal_problem_solving         0.811  1.000   0.682    15    0    7     22
#     logical_reasoning              0.474  0.429   0.529     9   12    8     17
#
# logical_reasoning is the only weak column, and verbal's 7 false negatives are the expected
# side effect -- deductive-reasoning contrasts that belong to verbal were being spent on
# logical_reasoning instead.
#
# THE NAME IS KEPT DELIBERATELY. `logical_reasoning` is the key nmb_mappings.json matches on;
# renaming it to `cognitive_demand` would silently break the benchmark mapping. The name is a
# misnomer retained for compatibility, and the description and criteria below now say what it
# actually is.
#
# THE SECOND DEFECT: SYSTEMATIC OVER-SELECTION (~2x).
#
# Matched-only metrics look strong, but under the exhausted-manual assumption -- where auto
# analyses the manual never accepted count as false positives -- precision collapses:
#
#     annotation                      matched prec    exhausted prec    predicted   manual
#     domain_general_problem_solving      1.000            0.464           183        89
#     mathematical_problem_solving        1.000            0.476            63        30
#     visuospatial_problem_solving        0.872            0.410            83        37
#     verbal_problem_solving              1.000            0.441            34        22
#
# We agree with the humans on the analyses they judged, while selecting about twice as many
# overall. This is why the project's Delta-dice over its baseline is only +0.008 -- the extra
# analyses dilute every map. Three v1 criteria permit contrasts the paper explicitly excludes:
#
#   1. NO DIRECTION CONSTRAINT. The paper: "we selected only those contrasts reporting either
#      BOLD or rCBF signal increases; results associated with BOLD or rCBF decreases were
#      excluded." v1 has no such criterion, so deactivation contrasts (baseline > task,
#      simple > complex, trained > untrained) were annotated. Papers routinely report both
#      directions, so this alone can roughly double the selected set. ADDED as an exclusion.
#
#   2. SVC WAS ALLOWED. v1 said "small-volume-corrected maps are acceptable". The paper: "The
#      final set of experiments was constrained to include only whole-brain analyses and exclude
#      region of interest (ROI) results." REMOVED.
#
#   3. THE COMPARATOR WAS UNCONSTRAINED. v1 accepted any "appropriate baseline or control
#      condition". The paper admits exactly five contrast types. ENUMERATED below.
#
# THIRD FIX: DOMAINS ARE DEFINED BY STIMULUS MODALITY, NOT BY REASONING TYPE. The paper:
# "Representational domains were defined by the stimulus modality used: mathematical problems
# involved number manipulation, verbal problems presented questions with sentence, word, or
# letter stimuli, and visuospatial problems involved pictorial or spatial tasks." v1 defined
# them semantically ("language-based reasoning", "spatial reasoning"), which is what let
# deductive reasoning drift out of verbal.
#
# MULTI-LABELLING IS EXPECTED. A complexity contrast belongs to BOTH `logical_reasoning` and its
# representational domain -- "Duncan, 2000: Verbal, High vs. Low g" appears in both
# Demand_MNI_final.txt and WordProblems_MNI_final.txt. Likewise every included contrast feeds
# domain_general_problem_solving, which is the global pooled analysis.
#
# RISK
#
# The increases-only rule is the highest-leverage and highest-risk change. Contrast direction is
# often implicit in a table caption, and if the model cannot tell direction it may drop valid
# activations, costing recall on columns that are currently at 0.95-1.00. If recall on
# mathematical or domain_general falls below ~0.85 while precision gains little, the
# direction rule is being applied too aggressively and should be softened to apply only where
# direction is explicit.

search:
  database: "pubmed"
  pmids_file: '/home/zorro/repos/autonima-results/projects/problem_solving/annotation-only-ids.txt'
  
retrieval:
  load_excluded: true
  sources:
    - pubget
  full_text_sources:
    - root_path: '/home/zorro/repos/autonima-results/articles/elsevier_output'
      pmid_source: "folder_name"
      text_path_templates:
        - 'text.txt'
      coordinates_path_templates:
        - 'coordinates.json'
    - root_path: '/home/zorro/repos/autonima-results/articles/ace_outputs'
      pmid_source: "file_name"
      allowed_extensions: [".html"]
      processed_data_path: '/home/zorro/repos/autonima-results/articles/ace_outputs/processed'

screening:
  abstract:
    skip_stage: true
  fulltext:
    skip_stage: true

parsing:
  parse_coordinates: true 
  coordinate_model: "@psyc-aid338-ope-333f18/gpt-5-mini-2025-08-07"

annotation:
  enabled: true
  model: "@psyc-aid338-ope-333f18/gpt-5-mini-2025-08-07"
  create_all_included_annotations: true
  prompt_type: "multi_analysis"
  metadata_fields:
    - "analysis_name"
    - "analysis_description"
    - "table_caption"
    - "study_title"
    - "study_fulltext"
  inclusion_criteria:
    - >-
      Voxelwise task evidence- the analysis must be a group-level, univariate, WHOLE-BRAIN
      voxelwise task-evoked map. Small-volume-corrected and region-of-interest maps do NOT
      qualify.
    - >-
      Task-based problem solving- the task must fit the source definition- the participant has a
      goal and must work out a way to reach it, applying some rule set (semantic, algebraic,
      logical, mechanical or other) to arrive at a previously unknown solution.
    - >-
      Permitted contrast types- the analysis must be ONE of the following five, which are the
      only contrast types this benchmark admits-
      (1) a problem solving task minus a baseline or control condition;
      (2) a parametric or categorical comparison across difficulty, abstraction or complexity
          (e.g. complex > simple, multi-digit > single-digit, high > low load, 2-relational >
          1-relational, a positive linear trend with problem depth);
      (3) untrained, novel or previously unseen problems > trained, memorized or previously
          solved problems of the same type;
      (4) one type of problem solving > another type, across rule sets or representational
          modalities (e.g. multiplication > addition, word problems > number problems);
      (5) one problem solving phase > another, sequential phase (e.g. late > early, solution >
          preparation).
    - >-
      Group-level effects in healthy participants. Studies comparing patients or intellectually
      gifted individuals to controls are eligible ONLY through their separately reported
      within-group healthy-control result.
    - >-
      Stereotactic reporting- coordinates must be reported in MNI or Talairach space.
    - >-
      How to read a sparse label- an empty or generic analysis name usually means the analysis
      is the only one in its table, so judge from the caption and surrounding text. A blank name
      is never itself a reason to exclude.
  exclusion_criteria:
    - >-
      DEACTIVATIONS AND REVERSE CONTRASTS- the benchmark includes only BOLD or rCBF signal
      INCREASES. Exclude any analysis reporting decreases, deactivations, or the reverse of a
      qualifying contrast (e.g. baseline > problem solving, simple > complex, trained >
      untrained, low > high load, rest > task). Where a paper reports a contrast in both
      directions, annotate only the increase direction. If the table caption or analysis name
      makes the direction explicit, use it; if direction is genuinely indeterminate, treat the
      analysis as an activation.
    - ROI-only or small-volume-corrected analyses without whole-brain voxelwise results.
    - >-
      Connectivity analyses- seed-based connectivity, effective connectivity (PPI, DCM) or
      resting-state analyses.
    - >-
      Non-task or passive paradigms- passive viewing, simple perception, or tasks not requiring
      the participant to work out a solution.
    - Motor, response-only, or artefact/physiological-regressor contrasts.
    - >-
      Between-group contrasts and group x condition interactions (patients vs controls, gifted
      vs controls, age or gender group comparisons). Note this is about the CONTRAST- a
      within-group contrast computed in a control group qualifies.
  annotations:
    - name: "domain_general_problem_solving"
      description: "The global pooled analysis- problem solving convergence across all three representational domains (mathematical, verbal, visuospatial)."
      inclusion_criteria:
        - >-
          Any analysis that satisfies the global criteria above qualifies here, regardless of
          representational domain. This is the pooled global network, so it is the union of the
          three representational domains rather than a separate construct.

    - name: "mathematical_problem_solving"
      description: "Problem solving in the MATHEMATICAL representational domain, defined by stimulus modality: problems that involve number manipulation."
      inclusion_criteria:
        - >-
          The problem is posed with numerical stimuli and solved by manipulating numbers-
          arithmetic (addition, subtraction, multiplication, division), multi-digit or
          multi-step calculation, number bisection or number-line tasks, approximate or exact
          estimation, and the paced auditory or visual serial addition test (PASAT).
        - >-
          Domain is decided by the STIMULI, not by the reasoning involved. A complexity
          manipulation over arithmetic problems belongs here as well as to logical_reasoning.
      exclusion_criteria:
        - >-
          Simple number perception, digit matching, or magnitude comparison with no problem to
          solve.

    - name: "verbal_problem_solving"
      description: "Problem solving in the VERBAL representational domain, defined by stimulus modality: problems posed with sentence, word or letter stimuli."
      inclusion_criteria:
        - >-
          The problem is posed with letter, word or sentence stimuli and solved using logic or
          content knowledge. Paradigms the source paper places here- DEDUCTIVE REASONING
          (categorical, relational or propositional arguments; judging whether a conclusion
          follows from premises); verbal inductive and probabilistic reasoning; verbal analogy
          problems (word or letter-string analogies); riddles and insight problems; and
          paragraph-based word problems.
        - >-
          Deductive and logical reasoning over verbal material belongs HERE. It is a verbal
          paradigm in this benchmark, not a separate logical domain- do not divert it to
          logical_reasoning, which is a difficulty construct rather than a domain.
      exclusion_criteria:
        - Passive reading or language comprehension with no problem to solve.

    - name: "visuospatial_problem_solving"
      description: "Problem solving in the VISUOSPATIAL representational domain, defined by stimulus modality: problems posed with pictorial or spatial stimuli."
      inclusion_criteria:
        - >-
          The problem is posed with pictorial or spatial stimuli. Paradigms the source paper
          places here- visuospatial fluid reasoning (e.g. Raven's-style matrix problems); visual
          analogy problems; the Tower of London; and spatial navigation problem solving.
      exclusion_criteria:
        - Simple visual perception, mental rotation, or matching with no problem to solve.

    - name: "logical_reasoning"
      description: >-
        COGNITIVE DEMAND. Despite the name -- retained because nmb_mappings.json matches on it --
        this target is the benchmark's Demand set: contrasts that manipulate problem difficulty,
        complexity or abstraction, pooled across all three representational domains. It is NOT
        formal logic or deductive reasoning, which belong to verbal_problem_solving.
      inclusion_criteria:
        - >-
          The contrast varies the DEMAND of the problem while holding the problem type broadly
          constant- harder versus easier, more versus fewer steps or relations, more versus less
          abstract, or a parametric or linear trend across difficulty. Examples from the
          benchmark- "Addition, Complex > Simple"; "Multi-Digit > Single-Digit"; "Procedural >
          Retrieval"; "High vs. Low g"; "2-relational vs 1-relational"; "4-target > 2-target";
          "Large Problem Size > Small Problem Size"; "Main Effect of Relational Complexity";
          "positive linear trend of analogical depth"; "Complex - Simple Deductions".
        - >-
          Any representational domain qualifies- mathematical, verbal and visuospatial demand
          contrasts are pooled into this single target.
        - >-
          Assign this IN ADDITION to the contrast's representational domain, not instead of it.
          A complexity contrast over arithmetic is both mathematical_problem_solving and
          logical_reasoning.
      exclusion_criteria:
        - >-
          Contrasts of one problem TYPE against another (e.g. multiplication > addition, word >
          number problems) where difficulty is not what is being varied- those belong to their
          representational domain only.
        - >-
          Reverse-direction demand contrasts (simple > complex, low > high load), which are
          deactivations and are excluded benchmark-wide.

output:
  nimads: true
  export_excluded_studies: true
