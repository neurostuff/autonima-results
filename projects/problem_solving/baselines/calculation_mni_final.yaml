# GENERATED by scripts/run_baseline_searches.py from baselines.yaml -- do not
# hand-edit; edit the spec instead. Search baseline for manual annotation
# 'calculation_mni_final'. Screening is skipped, so this is a Neurosynth-style pool over a
# topic-targeted search: every hit whose coordinates we could parse. The
# comparison column is 'all_analyses'.
search:
  database: pubmed
  query: '((("fMRI"[Title/Abstract] OR "functional magnetic resonance imaging"[Title/Abstract] OR "PET"[Title/Abstract]
    OR "positron emission tomography"[Title/Abstract]) AND (calculation[tiab] OR arithmetic[tiab] OR math[tiab]
    OR mathematic*[tiab] OR numerical[tiab] OR "number processing"[tiab] OR "mental arithmetic"[tiab]
    OR subtraction[tiab] OR multiplication[tiab] OR "numeric*"[tiab])) AND ("1997/01/01"[Date - Publication]
    : "2015/03/14"[Date - Publication])) NOT (review[pt] OR "systematic review"[tiab] OR meta-analysis[pt])'
  max_results: 5000
  date_from: 1997/01/01
  date_to: 2015/03/14
  email: anthonyang2027@utexas.edu
retrieval:
  load_excluded: false
  sources:
  - pubget
  full_text_sources:
  - root_path: /home/zorro/repos/autonima-results/projects/problem_solving/elsevier_output
    pmid_source: folder_name
    text_path_templates:
    - text.txt
    coordinates_path_templates:
    - coordinates.json
  - root_path: /home/zorro/repos/autonima-results/articles/elsevier_output
    pmid_source: folder_name
    text_path_templates:
    - text.txt
    coordinates_path_templates:
    - coordinates.json
  - root_path: /home/zorro/repos/autonima-results/articles/ace_outputs
    pmid_source: file_name
    allowed_extensions:
    - .html
    processed_data_path: /home/zorro/repos/autonima-results/articles/ace_outputs/processed
