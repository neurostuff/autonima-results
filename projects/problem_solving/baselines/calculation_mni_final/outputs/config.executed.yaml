search:
  database: pubmed
  query: '((("fMRI"[Title/Abstract] OR "functional magnetic resonance imaging"[Title/Abstract]
    OR "PET"[Title/Abstract] OR "positron emission tomography"[Title/Abstract]) AND
    (calculation[tiab] OR arithmetic[tiab] OR math[tiab] OR mathematic*[tiab] OR numerical[tiab]
    OR "number processing"[tiab] OR "mental arithmetic"[tiab] OR subtraction[tiab]
    OR multiplication[tiab] OR "numeric*"[tiab])) AND ("1997/01/01"[Date - Publication]
    : "2015/03/14"[Date - Publication])) NOT (review[pt] OR "systematic review"[tiab]
    OR meta-analysis[pt])'
  max_results: 5000
  date_from: 1997/01/01
  date_to: 2015/03/14
  email: anthonyang2027@utexas.edu
  pmids_file: null
  pmids_list: null
screening:
  abstract:
    skip_stage: true
  fulltext:
    skip_stage: true
retrieval:
  sources:
  - pubget
  timeout: 30
  max_retries: 3
  download_directory: downloads
  n_jobs: 1
  load_excluded: false
  full_text_sources:
  - root_path: /home/zorro/repos/autonima-results/projects/problem_solving/elsevier_output
    pmid_source: folder_name
    text_path_templates:
    - text.txt
    coordinates_path_templates:
    - coordinates.json
  - root_path: /home/zorro/repos/autonima-results/articles/elsevier_output
    pmid_source: folder_name
    text_path_templates:
    - text.txt
    coordinates_path_templates:
    - coordinates.json
  - root_path: /home/zorro/repos/autonima-results/articles/ace_outputs
    pmid_source: file_name
    allowed_extensions:
    - .html
    processed_data_path: /home/zorro/repos/autonima-results/articles/ace_outputs/processed
  parse_coordinates: false
  coordinate_model: gpt-4o-mini
parsing:
  parse_coordinates: false
  coordinate_model: gpt-4o-mini
annotation:
  model: '@psyc-aid338-ope-333f18/gpt-5-mini-2025-08-07'
  create_all_included_annotations: true
  metadata_fields:
  - analysis_name
  - analysis_description
  - table_caption
  - study_title
  prompt_type: multi_analysis
  inclusion_criteria: []
  exclusion_criteria: []
  annotations: []
  enabled: true
output:
  directory: projects/problem_solving/baselines/calculation_mni_final
  prisma_diagram: true
  formats:
  - csv
  nimads: true
  export_excluded_studies: false
