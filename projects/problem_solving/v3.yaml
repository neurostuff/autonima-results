#
# PROVENANCE: written by an LLM agent from the source paper (PMC6425494, PMID 29944961), this
# project's v1 error reports, and the benchmark's Sleuth files. No human expert review before the
# run. Tuned against the benchmark -- report as an iterated version, never as held-out.
#
# CORRECTION (2026-08-26): an earlier version of this header claimed v1's config was missing
# from disk. It is not. projects/problem_solving/v1.yml exists -- with a .yml extension, which a
# `*.yaml` glob does not match. The search and fulltext-screening blocks below were rebuilt from
# v1/outputs/config.executed.yaml and have since been verified byte-equal to v1.yml's, so this
# file is still a faithful continuation and v1's search results and abstract decisions remain
# cache-valid. Only the "missing" claim was wrong.
#
# v1.yml also shows the retrieval roots were ORIGINALLY Windows paths:
#     C:\Users\antho\Neuroinformatics-Lab\autonima-results\projects\problem_solving\elsevier_output
# and config.executed.yaml shows them later as /data/alejandro/... . The config has been carried
# across three machines and its roots have never been portable on any of them, which is the
# same defect described below, older than it first appeared.
#
# CORRECTED 2026-08-26: THE PREMISE OF THIS RUN WAS WRONG.
#
# This file was written on the belief that v1's retrieval was broken and had starved it of full
# text. That belief came from projects/problem_solving/v1/evaluation/performance_metrics.json,
# which reports 4 true positives, 48 studies included at full text, and 69 gold papers with no
# text. Those numbers describe a run from 2026-05-04. v1's OUTPUTS are from 2026-08-14 -- its
