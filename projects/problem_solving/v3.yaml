#
# NUMBERED v3, NOT v2. Under this repo's convention the version number tracks the CRITERIA
# and a suffix tracks everything else (search, model, mode). This run's annotation criteria
# are byte-identical to v3-annotation-only, so it is a v3. It was first written as v2, which
