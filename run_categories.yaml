# Three-tier run registry for cross-project comparisons.
#
# WHY THIS FILE EXISTS
#
# The comparison scripts currently auto-pick the highest version number per project. That is a
# reasonable default -- it picks the latest iteration, usually the best performing -- but it
# collapses three genuinely different things, and the difference matters for the overfitting
# argument in the paper. The tiers:
#
#   initial          The FIRST manual attempt to transcribe the source paper's stated criteria,
#                    made before any results were seen. Held out by construction. A human or an
#                    LLM helping to DRAFT from the paper does not disqualify a schema here; what
#                    disqualifies it is having been revised against error reports.
#
#                    The name is `initial`, not `verbatim` (renamed 2026-11-04), because all it
#                    can honestly claim is "first pass, human, unreviewed" -- not that the config
#                    IS the paper's criteria. vbm_of_ptsd v1 proves the gap: it silently omits
#                    two criteria the source paper states outright.
#
#                    WHICH RUN QUALIFIES (rule set 2026-11-04): the earliest run that executed a
#                    FULL pipeline for that family. Variant runs that skip a stage do not count
#                    -- `-allstudies` screens a fixed PMID pool with no search, `-annotation-only`
#                    skips screening altogether -- so a project whose v1 exists only as such a
#                    variant takes its earliest full run instead. That is why ER canonical is v2
#                    (its v1 is allstudies-only) and social canonical is v2 (its v1 is
#                    annotation-only). Neither is null any more.
#
#   untuned          The highest version whose criteria were NEVER fitted to benchmark error
#                    reports. Permits LLM-authored criteria and LLM- or gold-tuned SEARCH. What
#                    it forbids is the one thing that makes a result circular: criteria edited
#                    after reading which studies this project got wrong.
#
#                    Absorbs the former `manual` tier (folded in 2026-11-04). A hand-revision
#                    made from a handful of papers is untuned-ELIGIBLE, so `untuned`, which takes
#                    the highest eligible version, already dominated it -- `manual` equalled
#                    `untuned` in 8 of the 10 rows where it was set and was unset in 12 of 22.
#                    Both apparent exceptions were social naming artifacts over byte-identical
#                    criteria, so no criteria information was lost by dropping it.
#
#                    QUALIFICATION, disclosed by the author 2026-11-03 and not derivable from the
#                    configs: in some of these runs the criteria WERE revised after looking at
#                    reports at the screening stage, typically under five papers. Those revisions
#                    were reviewed as consistent with the source report -- correcting an omission
#                    or an under-specification in it -- rather than fitting the benchmark's
#                    answers. `untuned` means "not systematically fitted to benchmark error
#                    reports". It does NOT mean "no benchmark output was ever looked at".
#
#   benchmark_tuned  The version whose criteria WERE iterated against the error reports, read in
#                    full. Overfitting is deep; never present these as held out. Curated per row
#                    (2026-11-04) from each config's own provenance header, NOT inferred from
#                    `latest`, which was a proxy and a wrong one in four rows.
#
#                    Null where no tuned run exists for that family.
#
#   best             Whichever of the three above performs best. A SELECTION over the rungs, not
#                    a further rung -- tuning does not always win. Three of the four tuned runs
#                    added 2026-11-04 made their project worse and were left unpromoted.
#
#   latest           Mechanical highest version number. Plumbing, not a tier: it exists so `best`
#                    has a fallback when unset. Do not read it as "the tuned one".
#
# The initial -> untuned -> benchmark_tuned progression is a gradient of how much gold-standard
# information reached the schema. That is the point of separating them.
#
# FAMILIES. A project can have parallel run families that the comparison scripts treat
# separately, so each is registered independently:
#   canonical        plain vN            -- what the screening roll-up selects
#   annotation_only  vN-annotation-only  -- what the analysis and fair roll-ups select
#   allstudies       vN-allstudies       -- dementia and emotion_regulation use these
#
# `null` means the tier genuinely does not exist for that project/family. Those gaps are
# findings, not omissions: five projects have no manually-iterated version at all, so a
# three-way comparison will have a smaller n for the manual tier than for the other two.
#
# STATUS: FIRST PASS, NEEDS REVIEW. Entries carrying `review:` are judgement calls where the
# header evidence is ambiguous. Please check those before any of these lists is used in the paper.

projects:

  cue_reactivity:
    canonical:
      initial: v1          # no header; earliest, precedes all report feedback
      untuned:  v4
      # v5 changes authorship AND adds report feedback: "GPT edited this schema ... using
      # feedback from reports (annotated inspection of false negatives primarily) ...
      # benchmark-tuned". v6 inherits v5 criteria unchanged.
      benchmark_tuned: v6
      # v5 is the tuned-criteria run ("it is benchmark-tuned"); v6 inherits v5's criteria
        # unchanged and adds a search chosen by reading which gold v4 missed. v6 is the
        # highest tuned run, so it is the tuned arm here.
      best:     v6
      # best-reason: highest screening F1 (0.455) and much the best recall (0.853)
      latest:   v6          # Claude; search-only change carrying v5's GPT-written criteria
      note: >-
        v2/v3/v4 are all hand-edited by the author. v5 is where authorship changes hands
        ("prompted GPT to improve criteria" from report feedback), so the manual tier stops at v4.
    annotation_only:
      initial: null
      untuned:  v4-annotation-only
      # Created 2026-11-03 by rolling the annotation criteria back from v5 to v4.
      # v5-annotation-only is genuinely benchmark-fitted: its v4 -> v5 edit adds an "ROI
      # exception FOR BENCHMARK COMPATIBILITY" (v4 excluded ROI analyses outright) and relaxes
      # whole-brain to accept small-volume-corrected maps, which is exactly what recovers the
      # false negatives its header says it was built from.
      benchmark_tuned: v5-annotation-only
      # v5's criteria, annotation-only pool.
      best:     v5-annotation-only
      # best-reason: only annotation-only run; fair dice 0.699
      latest:   v5-annotation-only
      review: >-
        The only annotation-only run carries v5's GPT-written criteria, so this family has no
        initial or manual entry. If the three-way comparison needs one, a v1-annotation-only or
        v4-annotation-only would have to be created and run.

  decision_making:
    canonical:
      initial: v1
      untuned:  v2
      # v1 -> v2 changes the ANNOTATION BLOCK ONLY (screening byte-identical) and only by
      # addition: 4 inclusion criteria added, 0 removed, exclusions untouched -- a
      # parsing-robustness rule, the paper own subtype taxonomy, and study-level subtype
      # mutual exclusivity. None names a study or an error. RECLASSIFIED 2026-11-03: the old
      # header "refine annotations using reports" had been read as benchmark fitting; the diff
      # does not support it. v3 remains disqualified (Claude-written, quotes a specific
      # wrongly-accepted study).
      benchmark_tuned: v3
      # "Tuned against the benchmark" -- v2 error reports in context.
      best:     v3
      # best-reason: highest screening F1 (0.312)
      latest:   v3          # Claude, full-text screening
      review: >-
        v1's header says "Used ChatGPT to refine query in an evaluation loop", so its SEARCH was
        tuned against results even though its criteria appear paper-faithful. It is the best
        initial candidate available but is not cleanly held-out. No hand-edited version exists.
    annotation_only:
      initial: null
      untuned:  v2-annotation-only
      # Shares v2 annotation criteria. RECLASSIFIED 2026-11-03 -- see the canonical note.
      # Author-edited with ChatGPT as a phrasing tool, not agent-written.
      benchmark_tuned: null
      # No tuned run exists for this family.
      best:     v2-annotation-only
      # best-reason: only annotation-only run
      latest:   v2-annotation-only    # GPT, "refine annotations using reports"

  dementia:
    canonical:
      initial: v1
      untuned:  v3
      # No report dependency anywhere in the v1/v2/v3 headers; v3 is "only changes to
      # annotation section". Same as the manual tier.
      benchmark_tuned: v4
      # "tuned against the benchmark"; v3's 94-paper FP report in context. Hurt recall, so not best.
      best:     v3
      # best-reason: highest screening F1 (0.545)
      latest:   v4
      # v4 is the LLM-tuned version (added 2026-11-04) and is NOT promoted to `best`. It raised
      # full-text precision 0.401 -> 0.562 and every sub-analysis map r2 (all 0.324 -> 0.393),
      # but bought that with recall 0.955 -> 0.610, which its own header pre-registered as the
      # failure condition. The cause is not a criteria misjudgement: 30 of 30 gold exclusions
      # cite absent peak coordinates in papers whose tables live in supplementary files the
      # pipeline never retrieved. The screener applied a correct rule to incomplete text.
    allstudies:
      initial: v1-allstudies
      untuned:  v3-allstudies
      # v4-allstudies is Claude-improved with precision "measured against this gold";
      # v5-allstudies is motivated by a false-positive diagnosis against the manual.
      benchmark_tuned: v5-allstudies
      # Claude-revised annotation, motivated by diagnosing v4 against the manual.
      best:     v5-allstudies
      # best-reason: the Claude annotation schema, the family latest
      latest:   v5-allstudies         # Claude, annotation schema
      note: >-
        The cleanest three-tier set in the corpus: all three tiers exist, in the same family,
        with the same benchmark. Worth leading with.
    annotation_only:
      initial: null                  # v2-annotation-only is already an iteration
      untuned:  v3-annotation-only
      # v1/v2/v3-annotation-only share one criteria generation (verified byte-identical);
      # v4-annotation-only is "TUNED AGAINST THE BENCHMARK" by its own header.
      #
      # THE ONE PLACE IN THE CORPUS WHERE `manual` AND `untuned` GENUINELY SEPARATE, which is the
      # case that shows the two tiers are not redundant. manual is v5-annotation-only and untuned
      # is BELOW it, at v3-annotation-only.
      #
      # v5-annotation-only is the former v3-annotation-only, renamed 2026-08-27 (f412631d) to free
      # the name; its criteria are from Apr 2026, so no agent wrote them -- it is hand-edited by
      # the author, which is why it is correctly the `manual` entry. But the edit is
      # report-informed, and so fails `untuned`. Against the original generation it moves in BOTH
      # directions at once: carve-outs that recover false negatives (connectivity/resting-state
      # excluded "unless a separate qualifying univariate task-evoked map is explicitly the
      # analyzed row"; between-group excluded only "without a qualifying within-group
      # healthy/control task-evoked map"; sample widened to a "healthy/control subgroup reported
      # separately"), AND a new exclusion naming particular false positives -- "Contrasts
      # dominated by task-irrelevant controls/baselines (e.g., rest > task, noise-only controls,
      # landmark/place-dominant controls)".
      #
      # That last phrase is the evidence. Control types that specific are not read off the source
      # paper's methods; they are written after seeing which analyses were wrongly accepted.
      # Compare decision_making v2, which added four inclusion criteria and ZERO exclusions -- a
      # one-directional disambiguation pass, which is why that one does qualify as untuned.
      benchmark_tuned: null
      # No tuned run exists for this family.
      best:     v3-annotation-only
      # best-reason: best fair dice of 3 (0.470)
      latest:   v3-annotation-only

  emotion_regulation_2022:
    canonical:
      initial: v2
      # REGISTERED 2026-11-04 under the rule "initial is the earliest run that executed a FULL
      # pipeline". Was null: ER's v1 exists only as v1-allstudies, which screens a fixed PMID
      # pool and runs no search, so it is not a full pipeline and cannot hold this tier. v2 is
      # the earliest that is -- and it reads the part: "CRITERIA ARE COPIED, NOT REWRITTEN", a
      # faithful transcription of the paper.
      untuned:  v2
      # Same run as initial: v2 was never revised before tuning began. v4 is driven by "the
      # v2-annotation-only trial criterion attribution (errors vs correct citations)".
      benchmark_tuned: v4
      # Fitted to the gold list by construction: the header enumerates the exact gold PMIDs each
        # faithful restriction was costing, then removes those restrictions.
      best:     v4
      # best-reason: v4, per the recall-first rule for canonical runs: recall 0.659 vs v2 0.500,
      # accepting F1 0.420 vs 0.492. USER-RESOLVED 2026-08-27.
      latest:   v4
      note: >-
        v4 (RUN 2026-08-26) is the deliberately UNFAITHFUL screening + repaired annotation
        version: full-text recall_all 0.500 -> 0.659 and in-search recall 0.815 -> 0.983 against
        v2, for precision 0.484 -> 0.309. Numbered v4 rather than v3 because
        archive/v3-allstudies.yaml holds a different v3 criteria set that failed by being more
        restrictive. v2 is the project's first plain search-driven run, so ER can now appear
        in the screening roll-up. It uses the SAME query as its baseline arm, deliberately, so the
        end-to-end comparison isolates screening plus annotation rather than a search difference.
        No initial or manual tier: v1/v2-allstudies screen a fixed PMID pool rather than running
        a search, so they are not members of this family.
    annotation_only:
      initial: null
      untuned:  v2-annotation-only
      # "trial harness for the draft annotation criteria"; v4-annotation-only is the tuned
      # successor.
      benchmark_tuned: v4-annotation-only
      # v4's annotation criteria.
      best:     v4-annotation-only
      # best-reason: best fair dice of 2 (0.650 vs 0.603)
      latest:   v4-annotation-only
      note: >-
        RUN 2026-08-27. v4-annotation-only carries v4's repaired annotation criteria over the same
        88-PMID pool as v2-annotation-only, so that pair isolates the ANNOTATION change alone --
        no screening at either end and an identical pool. Matched-only F1 v2 -> v4: reappraisal
        0.804 -> 0.851, decrease 0.812 -> 0.835, increase 0.769 -> 0.909, maintain 0.600 -> 0.833.
        The criteria were reviewed and approved by the project author on 2026-08-27. Read the per-construct
        numbers as covering roughly half the benchmark: retrieval reaches 63 of 88 texts.
    allstudies:
      initial: v1-allstudies
      untuned:  v2-allstudies
      # Corrects clear misreadings of the paper stated criteria; v4-allstudies carries the
      # tuned v4 criteria.
      benchmark_tuned: v4-allstudies
      # v4's criteria over the fixed pool.
      best:     v4-allstudies
      # best-reason: v4-allstudies, per the recall-first rule: recall 0.602 vs v2 0.477, accepting
      # F1 0.475 vs 0.519. Also reaches 94.6% of this pool's hard ceiling of 0.636.
      # USER-RESOLVED 2026-08-27.
      latest:   v4-allstudies         # v4 criteria over the fixed pool
      note: >-
        STALE BLOCKER REMOVED 2026-08-26: nmb_mappings.json is filled in and the manual reference
        maps are computed, so the benchmark side is ready. What still blocks scoring is that all
        three -allstudies configs have annotation disabled -- the draft criteria are being trialled
        in v2-annotation-only first and get ported into v2-allstudies afterwards. Note also that
        this project has NO canonical (plain vN) family at all, so it cannot appear in the
        screening roll-up until one is added.

  executive_function:
    canonical:
      initial: v1
      untuned:  v1
      # v1 criteria are GPT-DRAFTED from the source paper ("Used GPT to help draft inital
      # draft"), which this tier permits; its gold-derived 1988-2008 date window is a SEARCH
      # change, also permitted. v2/v3 are written from "this project own v1 error reports".
      benchmark_tuned: v3
      # "Benchmark-tuned"; combines v2's screening with v3-annotation-only's annotation.
      best:     v3
      # best-reason: v3, per the recall-first rule for canonical runs (see run_tiers.py). v1 has
      # the highest F1 (0.163 vs 0.151) but v2/v3 recover more gold (recall 0.386 vs 0.322).
      # Precision here is a floor, not a measurement: the benchmark searched BrainMap, so many
      # "false positives" were never candidates for its manual screen. USER-RESOLVED 2026-08-27.
      latest:   v3                    # Claude; combines v2 screening + v3 annotation
      note: >-
        RESOLVED 2026-08-26: initial is v1, not v1-2010. "Initial" means an attempt to stay
        close to the paper, and a narrowed search window still counts -- v1's 1988-2008 window
        was inferred from the gold set's publication range, but the CRITERIA are the paper's.
        v1-2010 is the archived original window and can be ignored. v1 was GPT-assisted in
        drafting from the paper, which the initial definition allows; no hand-edited version
        exists, so the manual tier is empty.
    annotation_only:
      initial: null
      untuned:  v1-annotation-only
      # Identical to v1 below the search/screening blocks. v3-annotation-only is "Derived by
      # reading this project full error reports ... benchmark-tuned".
      benchmark_tuned: v3-annotation-only
      # "agent-iterated and benchmark-tuned" by its own header.
      best:     v1-annotation-only
      # best-reason: the honest v1 still beats the tuned v3 at map level (0.566 vs 0.556)
      latest:   v3-annotation-only    # Claude
      review: >-
        v1-annotation-only's annotation criteria differ from v1's, so it is an independent
        criteria set rather than a mode wrapper. Classifying it as manual on that basis; it is
        also the outstanding convention violation for this project.

  problem_solving:
    canonical:
      initial: v1
      untuned:  v1
      # v1: "MANUAL CRITERIA ... the original human-written ones". Its query is
      # Claude-optimised against gold-membership counts -- SEARCH only, permitted. v2
      # annotation is "written by Claude ... from ... this project error reports".
      benchmark_tuned: v2
      # "benchmark-tuned"; shares its annotation block with v2-annotation-only.
      best:     v2
      # best-reason: v1 and v2 tie on screening F1; v2 carries the repaired annotation
      latest:   v2                    # Claude-revised annotation; identical to v1 otherwise
      review: >-
        RENUMBERED 2026-08-26 (d589fa7): the project was collapsed to v1/v2 and the older runs
        moved to archive/. What was v3 is now v2. IMPORTANT CAVEAT for the initial tier: v1's
        SEARCH QUERY was replaced with an agent-designed one, chosen by measuring gold recall
        across candidate queries (0.740 -> 0.890 while cutting the pool 44%). Its CRITERIA remain
        paper-verbatim, but its search is gold-tuned, so v1 is only held-out with respect to
        criteria. Same class of caveat as decision_making v1 and cue_reactivity v6.
      note: >-
        v1 and v2 differ in the annotation block ONLY, so v1 -> v2 isolates the annotation change
        exactly -- cleaner than the previous v3, whose pool size also moved. Neither has been
        re-run since the query change, so both currently lack outputs.
    annotation_only:
      initial: v1-annotation-only
      untuned:  v1-annotation-only
      # No header; v2-annotation-only is explicitly "Written by an LLM agent ... Inputs were
      # ... this project v1-annotation-only error reports".
      benchmark_tuned: v2-annotation-only
      # LLM-written from the paper plus this project's error reports.
      best:     v2-annotation-only
      # best-reason: tuning clearly helped: fair dice 0.633 vs v1 0.514
      latest:   v2-annotation-only    # Claude (formerly v3-annotation-only)
      note: >-
        The GPT-authored annotation-only run was archived in the same reorganisation, so this
        family is now a clean initial -> agent contrast with no manual tier.

  social:
    canonical:
      initial: v2
      # REGISTERED 2026-11-04 under the rule "initial is the earliest run that executed a FULL
      # pipeline". Was null: social's v1 exists only as annotation-only variants, which skip
      # screening entirely. v2 is the earliest full run.
      #
      # CAVEAT, and it is the same one the tier rename was for: v2 is described elsewhere as
      # HAND-EDITED, so it is not a guaranteed-faithful first transcription. `initial` claims
      # only "first pass that was actually run" -- not fidelity -- so v2 belongs here, with the
      # caveat recorded rather than hidden.
      untuned:  v3
      # v3's criteria are BYTE-IDENTICAL to v2 (v3 header: v2 and the v3 family "are ONE
      # criteria generation"); only the search block differs. So social's initial -> untuned
      # step changes no criteria at all -- the two tiers differ by search alone, and any
      # criteria-level comparison between them is empty by construction.
      benchmark_tuned: v4
      # "tuned against the benchmark". A NULL RESULT -- see the latest note below.
      best:     v3
      # best-reason: the new canonical search-driven run; v2 lacked study_fulltext
      latest:   v4
      # v4 is the LLM-tuned version (added 2026-11-04) and is a NULL RESULT, as its header
      # pre-registered: full-text 0.406/0.995 -> 0.402/0.981, maps within +-0.02 either way.
      # Note recall FELL after a criterion was loosened, which cannot happen mechanically --
      # read it as run-to-run screener variance, and treat deltas of this size in this corpus as
      # noise.
      review: >-
          v3 (created 2026-08-27) is social's canonical search-driven run: v3-allstudies' criteria
          and annotation mode, with the query from the former v3-search-all_pmids-multi_analysis-ft.
          It replaces v2 as `latest` because v2 lacks study_fulltext in its annotation
          metadata_fields and so is not mode-comparable with the rest of the v3 family. Still no
          initial entry: social has no v1 full run, its v1 existing only as annotation-only
          variants.
    annotation_only:
      initial: v1-annotation-only
      untuned:  v3-annotation-only
      # v1/v2/v3-annotation-only share one criteria generation (verified byte-identical);
      # v4-annotation-only is "TUNED AGAINST THE BENCHMARK" by its own header.
      benchmark_tuned: v4-annotation-only
      # LLM-written from the paper plus v3-annotation-only's error reports.
      best:     v4-annotation-only
      # best-reason: v4-annotation-only. v1 leads on fair dice (0.570 vs 0.550), but v4 carries the
      # multi-label fix that the corpus annotation-value analysis depends on, so v1's edge is not
      # comparable. NOT a recall/F1 tradeoff -- decided on criteria correctness.
      latest:   v4-annotation-only    # Claude, multi-label fix
      note: >-
        The other complete three-tier set. Also the project where the tiers disagree most
        sharply: v1 is best at map level (dice 0.570) while v4 has much better annotation F1.
        None of these three shares criteria with any full run, which is why the decomposition
        set below needed its own v3-annotation-only arm.
    allstudies:
      initial: null
      untuned:  v3-allstudies
      # Carries the untuned v3 criteria generation.
      benchmark_tuned: null
      # No tuned run exists for this family.
      best:     v3-allstudies
      # best-reason: the family latest
      latest:   v3-allstudies    # renamed from v3-all_pmids-multi_analysis-ft 2026-08-27
      note: >-
        Screens the 486-PMID curated pool. Only one tier: social's earlier pool runs
        (v3-all_pmids, v3-all_pmids-multi_analysis) differ in annotation mode, not criteria,
        so they are mode variants rather than tiers and are archived.
    decomposition:
      search:      v3                  # query only, no injected PMIDs
      pool:        v3-allstudies       # curated pool, same criteria and mode
      annotation:  v3-annotation-only  # 230-PMID gold list, screening skipped
      note: >-
        The three matched arms that isolate search / screening / annotation for social, all
        sharing v3 criteria and annotation mode. Created 2026-08-27, because the arms that
        looked like they served this purpose did not: the v3-search-* runs set both a query
        and a pmids_file, and autonima unions the two, so each screened its query hits plus
        the curated pool that contains every gold study. For the arm the cross-project
        overrides used to point at, that lifted gold coverage from 0.952 (query alone,
        219/230) to 1.000. See autonima#57 and PAPER_OUTLINE.md.

  vbm_of_ptsd:
    canonical:
      initial: v1
      untuned:  v1
      # Only version in the project.
      benchmark_tuned: v2
      # LLM-authored with the 11-FP report in context. Content is source-uncovered (it restores
        # two criteria the paper states and v1 omits) but provenance is LLM, so it was not
        # promoted -- author's decision 2026-11-04.
      best:     v1
      # best-reason: only run
      latest:   v2
      # v2 is the LLM-tuned version (added 2026-11-04). It encodes the paper's adult-only and
      # voxel-based-only restrictions, which v1 never did: full-text precision 0.593 -> 0.762
      # with recall unchanged at 0.941, dropping five paediatric/adolescent studies and one
      # FreeSurfer cortical-thickness study. The MAP IS UNCHANGED (r2 0.5784, Dice 0.1109, 7
      # studies) because none of the six contributed coordinates, so the gain is real at
      # screening and map-neutral. `best` is left at v1 pending a decision: v2 dominates it on
      # both axes, but moving `best` changes a number the manuscript already reports.
      note: Single-version project. Contributes to no tier contrast.
    annotation_only:
      initial: v1-annotation-only
      untuned:  v1-annotation-only
      # Only version in the project.
      benchmark_tuned: null
      # No tuned run exists for this family.
      best:     v1-annotation-only
      # best-reason: only run; fair dice 0.875, the corpus high
      latest:   v1-annotation-only

  vbm_of_substance_use:
    canonical:
      initial: v1
      untuned:  v2
      # RECLASSIFIED 2026-11-03. The v1 -> v2 diff is wording only at both stages: "fMRI" ->
      # "structural MRI" (a bug in a VBM project), "cue type" -> "substance use
      # characteristics" (a cue-reactivity template leftover), and clarifying restatements. No
      # criterion added or removed. The "Benchmark-tuned" label came from the 2026-08-26
      # renaming pass, not from the edit, and has been withdrawn from both headers. untuned
      # therefore equals best here.
      benchmark_tuned: v3
      # "tuned against the benchmark"; v2's reports in context. Hurt recall, so not best.
      best:     v2
      # best-reason: v2, per the recall-first rule: better recall than v1, accepting F1 0.570 vs
      # 0.585. v2 also carries the GPT-reviewed criteria. USER-RESOLVED 2026-08-27.
      latest:   v3
      # v3 is the LLM-tuned version (added 2026-11-04) and is NOT promoted to `best`. Its
      # abstract change worked as forecast (recall 0.944 -> 0.972, +2 gold), but adding the
      # paper's coordinate-reporting requirement cost full-text recall 0.969 -> 0.783 for the
      # same reason as dementia v4: 17 of 19 gold exclusions cite coordinates that sit in
      # unretrieved supplementary files. Maps flat or down.
      review: >-
