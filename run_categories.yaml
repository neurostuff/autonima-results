# Three-tier run registry for cross-project comparisons.
#
# WHY THIS FILE EXISTS
#
# The comparison scripts currently auto-pick the highest version number per project. That is a
# reasonable default -- it picks the latest iteration, usually the best performing -- but it
# collapses three genuinely different things, and the difference matters for the overfitting
# argument in the paper. The tiers:
#
#   verbatim   Criteria transcribed from the source paper BEFORE any results were seen.
#              Held-out by construction. Note that GPT or a human helping to DRAFT from the
#              paper does not disqualify a schema here -- what disqualifies it is having been
#              revised against error reports.
#
#   manual     The highest version whose criteria the project author revised BY HAND. These were
#              informed by the reports, but only lightly: a few examples inspected, obviously
#              wrong patterns noticed and fixed, under time pressure. Overfitting is real but
#              shallow.
#
#   latest     The absolute highest version number, whoever wrote it. In practice these are the
#              agent-written schemas (Claude or GPT) produced by reading a project's error
#              reports IN FULL and rewriting criteria against them. Overfitting is deep, and
#              these must never be presented as held-out.
#
# The verbatim -> manual -> latest progression is therefore also a gradient of how much
# gold-standard information reached the schema. That is the point of separating them.
#
# FAMILIES. A project can have parallel run families that the comparison scripts treat
# separately, so each is registered independently:
#   canonical        plain vN            -- what the screening roll-up selects
#   annotation_only  vN-annotation-only  -- what the analysis and fair roll-ups select
#   allstudies       vN-allstudies       -- dementia and emotion_regulation use these
#
# `null` means the tier genuinely does not exist for that project/family. Those gaps are
# findings, not omissions: five projects have no manually-iterated version at all, so a
# three-way comparison will have a smaller n for the manual tier than for the other two.
#
# STATUS: FIRST PASS, NEEDS REVIEW. Entries carrying `review:` are judgement calls where the
# header evidence is ambiguous. Please check those before any of these lists is used in the paper.

projects:

  cue_reactivity:
    canonical:
      verbatim: v1          # no header; earliest, precedes all report feedback
      manual:   v4          # "Modified from v4 to revert correlational analysis exclusion criteria"
      best:     v6
      # best-reason: highest screening F1 (0.455) and much the best recall (0.853)
      latest:   v6          # Claude; search-only change carrying v5's GPT-written criteria
      note: >-
        v2/v3/v4 are all hand-edited by the author. v5 is where authorship changes hands
        ("prompted GPT to improve criteria" from report feedback), so the manual tier stops at v4.
    annotation_only:
      verbatim: null
      manual:   null
      best:     v5-annotation-only
      # best-reason: only annotation-only run; fair dice 0.699
      latest:   v5-annotation-only
      review: >-
        The only annotation-only run carries v5's GPT-written criteria, so this family has no
        verbatim or manual entry. If the three-way comparison needs one, a v1-annotation-only or
        v4-annotation-only would have to be created and run.

  decision_making:
    canonical:
      verbatim: v1
      manual:   null
      best:     v3
      # best-reason: highest screening F1 (0.312)
      latest:   v3          # Claude, full-text screening
      review: >-
        v1's header says "Used ChatGPT to refine query in an evaluation loop", so its SEARCH was
        tuned against results even though its criteria appear paper-faithful. It is the best
        verbatim candidate available but is not cleanly held-out. No hand-edited version exists.
    annotation_only:
      verbatim: null
      manual:   null
      best:     v2-annotation-only
      # best-reason: only annotation-only run
      latest:   v2-annotation-only    # GPT, "refine annotations using reports"

  dementia:
    canonical:
      verbatim: v1
      manual:   v3          # v2 and v3 are both hand-edited; v3 is the highest
      best:     v3
      # best-reason: highest screening F1 (0.545)
      latest:   v3          # no agent-written plain vN exists; v4/v5 are allstudies only
    allstudies:
      verbatim: v1-allstudies
      manual:   v3-allstudies
      best:     v5-allstudies
      # best-reason: the Claude annotation schema, the family latest
      latest:   v5-allstudies         # Claude, annotation schema
      note: >-
        The cleanest three-tier set in the corpus: all three tiers exist, in the same family,
        with the same benchmark. Worth leading with.
    annotation_only:
      verbatim: null                  # v2-annotation-only is already an iteration
      manual:   v3-annotation-only
      best:     v3-annotation-only
      # best-reason: best fair dice of 3 (0.470)
      latest:   v3-annotation-only

  emotion_regulation_2022:
    canonical:
      verbatim: null
      manual:   null
      best:     v4
      # best-reason: CONTESTED: v4 has far better recall (0.659 vs 0.500) but lower F1 (0.420 vs 0.492) than v2
      latest:   v4
      note: >-
        v4 (RUN 2026-08-26) is the deliberately UNFAITHFUL screening + repaired annotation
        version: full-text recall_all 0.500 -> 0.659 and in-search recall 0.815 -> 0.983 against
        v2, for precision 0.484 -> 0.309. Numbered v4 rather than v3 because
        archive/v3-allstudies.yaml holds a different v3 criteria set that failed by being more
        restrictive. v2 is the project's first plain search-driven run, so ER can now appear
        in the screening roll-up. It uses the SAME query as its baseline arm, deliberately, so the
        end-to-end comparison isolates screening plus annotation rather than a search difference.
        No verbatim or manual tier: v1/v2-allstudies screen a fixed PMID pool rather than running
        a search, so they are not members of this family.
    annotation_only:
      verbatim: null
      manual:   null
      best:     v4-annotation-only
      # best-reason: best fair dice of 2 (0.650 vs 0.603)
      latest:   v4-annotation-only
      note: >-
        RUN 2026-08-27. v4-annotation-only carries v4's repaired annotation criteria over the same
        88-PMID pool as v2-annotation-only, so that pair isolates the ANNOTATION change alone --
        no screening at either end and an identical pool. Matched-only F1 v2 -> v4: reappraisal
        0.804 -> 0.851, decrease 0.812 -> 0.835, increase 0.769 -> 0.909, maintain 0.600 -> 0.833.
        The criteria were reviewed and approved by the project author on 2026-08-27. Read the per-construct
        numbers as covering roughly half the benchmark: retrieval reaches 63 of 88 texts.
    allstudies:
      verbatim: v1-allstudies
      manual:   v2-allstudies         # NOT v3 -- v3 regressed and is archived
      best:     v4-allstudies
      # best-reason: CONTESTED: recall 0.602 vs v2 0.477, F1 0.475 vs 0.519
      latest:   v4-allstudies         # v4 criteria over the fixed pool
      note: >-
        STALE BLOCKER REMOVED 2026-08-26: nmb_mappings.json is filled in and the manual reference
        maps are computed, so the benchmark side is ready. What still blocks scoring is that all
        three -allstudies configs have annotation disabled -- the draft criteria are being trialled
        in v2-annotation-only first and get ported into v2-allstudies afterwards. Note also that
        this project has NO canonical (plain vN) family at all, so it cannot appear in the
        screening roll-up until one is added.

  executive_function:
    canonical:
      verbatim: v1
      manual:   null
      best:     v1
      # best-reason: CONTESTED: v1 has the highest F1 (0.163) but v2/v3 have better recall (0.386 vs 0.322)
      latest:   v3                    # Claude; combines v2 screening + v3 annotation
      note: >-
        RESOLVED 2026-08-26: verbatim is v1, not v1-2010. "Verbatim" means an attempt to stay
        close to the paper, and a narrowed search window still counts -- v1's 1988-2008 window
        was inferred from the gold set's publication range, but the CRITERIA are the paper's.
        v1-2010 is the archived original window and can be ignored. v1 was GPT-assisted in
        drafting from the paper, which the verbatim definition allows; no hand-edited version
        exists, so the manual tier is empty.
    annotation_only:
      verbatim: null
      manual:   v1-annotation-only
      best:     v1-annotation-only
      # best-reason: the honest v1 still beats the tuned v3 at map level (0.566 vs 0.556)
      latest:   v3-annotation-only    # Claude
      review: >-
        v1-annotation-only's annotation criteria differ from v1's, so it is an independent
        criteria set rather than a mode wrapper. Classifying it as manual on that basis; it is
        also the outstanding convention violation for this project.

  problem_solving:
    canonical:
      verbatim: v1
      manual:   null
      best:     v2
      # best-reason: v1 and v2 tie on screening F1; v2 carries the repaired annotation
      latest:   v2                    # Claude-revised annotation; identical to v1 otherwise
      review: >-
        RENUMBERED 2026-08-26 (d589fa7): the project was collapsed to v1/v2 and the older runs
        moved to archive/. What was v3 is now v2. IMPORTANT CAVEAT for the verbatim tier: v1's
        SEARCH QUERY was replaced with an agent-designed one, chosen by measuring gold recall
        across candidate queries (0.740 -> 0.890 while cutting the pool 44%). Its CRITERIA remain
        paper-verbatim, but its search is gold-tuned, so v1 is only held-out with respect to
        criteria. Same class of caveat as decision_making v1 and cue_reactivity v6.
      note: >-
        v1 and v2 differ in the annotation block ONLY, so v1 -> v2 isolates the annotation change
        exactly -- cleaner than the previous v3, whose pool size also moved. Neither has been
        re-run since the query change, so both currently lack outputs.
    annotation_only:
      verbatim: v1-annotation-only
      manual:   null
      best:     v2-annotation-only
      # best-reason: tuning clearly helped: fair dice 0.633 vs v1 0.514
      latest:   v2-annotation-only    # Claude (formerly v3-annotation-only)
      note: >-
        The GPT-authored annotation-only run was archived in the same reorganisation, so this
        family is now a clean verbatim -> agent contrast with no manual tier.

  social:
    canonical:
      verbatim: null
      manual:   v2
      best:     v3
      # best-reason: the new canonical search-driven run; v2 lacked study_fulltext
      latest:   v3
      review: >-
          v3 (created 2026-08-27) is social's canonical search-driven run: v3-allstudies' criteria
          and annotation mode, with the query from the former v3-search-all_pmids-multi_analysis-ft.
          It replaces v2 as `latest` because v2 lacks study_fulltext in its annotation
          metadata_fields and so is not mode-comparable with the rest of the v3 family. Still no
          verbatim entry: social has no v1 full run, its v1 existing only as annotation-only
          variants.
    annotation_only:
      verbatim: v1-annotation-only
      manual:   v5-annotation-only    # renamed from v3-annotation-only 2026-08-27
      best:     v4-annotation-only
      # best-reason: CONTESTED: v1 leads on fair dice (0.570 vs 0.550) but v4 carries the multi-label fix
      latest:   v4-annotation-only    # Claude, multi-label fix
      note: >-
        The other complete three-tier set. Also the project where the tiers disagree most
        sharply: v1 is best at map level (dice 0.570) while v4 has much better annotation F1.
        None of these three shares criteria with any full run, which is why the decomposition
        set below needed its own v3-annotation-only arm.
    allstudies:
      verbatim: null
      manual:   null
      best:     v3-allstudies
      # best-reason: the family latest
      latest:   v3-allstudies    # renamed from v3-all_pmids-multi_analysis-ft 2026-08-27
      note: >-
        Screens the 486-PMID curated pool. Only one tier: social's earlier pool runs
        (v3-all_pmids, v3-all_pmids-multi_analysis) differ in annotation mode, not criteria,
        so they are mode variants rather than tiers and are archived.
    decomposition:
      search:      v3                  # query only, no injected PMIDs
      pool:        v3-allstudies       # curated pool, same criteria and mode
      annotation:  v3-annotation-only  # 230-PMID gold list, screening skipped
      note: >-
        The three matched arms that isolate search / screening / annotation for social, all
        sharing v3 criteria and annotation mode. Created 2026-08-27, because the arms that
        looked like they served this purpose did not: the v3-search-* runs set both a query
        and a pmids_file, and autonima unions the two, so each screened its query hits plus
        the curated pool that contains every gold study. For the arm the cross-project
        overrides used to point at, that lifted gold coverage from 0.952 (query alone,
        219/230) to 1.000. See autonima#57 and PAPER_OUTLINE.md.

  vbm_of_ptsd:
    canonical:
      verbatim: v1
      manual:   v1                    # never iterated; verbatim and manual are the same run
      best:     v1
      # best-reason: only run
      latest:   v1
      note: Single-version project. Contributes to no tier contrast.
    annotation_only:
      verbatim: v1-annotation-only
      manual:   v1-annotation-only
      best:     v1-annotation-only
      # best-reason: only run; fair dice 0.875, the corpus high
      latest:   v1-annotation-only

  vbm_of_substance_use:
    canonical:
      verbatim: v1
      manual:   null
      best:     v2
      # best-reason: CONTESTED: v1 has higher F1 (0.585 vs 0.570); v2 has better recall and the reviewed criteria
      latest:   v2                    # GPT, "Double checked criteria using GPT 5.4"
      review: >-
        v1's query was "copied from original study and expanded using suggestions by GPT" --
        paper-faithful criteria with a GPT-widened search, so verbatim with a caveat. v2's header
        does not mention reports, so whether it counts as report-iterated or as a GPT criteria
        review is unclear; classified as agent-written on authorship grounds.
    annotation_only:
      verbatim: null
      manual:   null
      best:     v2-annotation-only
      # best-reason: only annotation-only run
      latest:   v2-annotation-only    # GPT

# ---------------------------------------------------------------------------------------------
# COVERAGE, MEASURED (validated against disk 2026-08-26)
#
# Non-null entries: verbatim 12, manual 10, latest 18.
#
# Families supporting a FULL three-way contrast (three DISTINCT runs) -- only three:
#     cue_reactivity/canonical        v1        -> v4              -> v6
#     dementia/allstudies             v1-all    -> v3-all          -> v5-all
#     social/annotation_only          v1-ao     -> v3-ao           -> v4-ao
#
# Families with only two distinct runs (eight): decision_making/canonical,
# dementia/canonical, emotion_regulation_2022/allstudies, executive_function/canonical,
# executive_function/annotation_only, problem_solving/canonical,
# problem_solving/annotation_only, vbm_of_substance_use/canonical.
#
# IMPLICATION FOR THE PAPER. A three-tier cross-project comparison has n=3, not n=8. The
# verbatim -> latest contrast is much better supported (most families have both), and the
# manual tier is the scarce one -- it exists in only 10 of 18 families and is distinct from
# `latest` in only 5. So the defensible framings are:
#
#   (a) verbatim vs latest, across most families        -- the main claim, well powered
#   (b) verbatim vs manual vs latest, n=3               -- the gradient-of-overfitting claim,
#                                                          a case study rather than a result
#
# Do not report (b) as a cross-project result. It is the same scoping problem already noted for
# the schema-sensitivity section.
#
# NOT YET RUNNABLE: executive_function/v3 is registered as its `latest` but has no outputs/ yet.
