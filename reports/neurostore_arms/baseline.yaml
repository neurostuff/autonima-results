# Baseline for autonima-skills: each project's best config run end to end on NeuroStore
# (title-and-abstract search + NeuroStore coordinates). Chosen 2026-11-04; see README.md here.
#
# `best` is the run_categories.yaml best the arm was derived from, as registered on 2026-11-04.
# The baseline does not follow later changes to best. `neurostore_fetched` is when the arm's
# search ran; outputs/neurostore_search_log.json and outputs/neurostore_analyses.json freeze what
# NeuroStore returned then (study_schema parses are updated in place).
#
# Scores: summary.csv and maps.csv here, rows with arm == search.

arm: search
projects:
  cue_reactivity:          {run: v6-ns-search, best: v6, neurostore_fetched: 2026-11-03}
  decision_making:         {run: v3-ns-search, best: v3, neurostore_fetched: 2026-11-03}
  dementia:                {run: v3-ns-search, best: v3, neurostore_fetched: 2026-11-03}
  emotion_regulation_2022: {run: v4-ns-search, best: v4, neurostore_fetched: 2026-11-03}
  executive_function:      {run: v3-ns-search, best: v3, neurostore_fetched: 2026-11-03}
  problem_solving:         {run: v2-ns-search, best: v2, neurostore_fetched: 2026-11-03}
  social:                  {run: v3-ns-search, best: v3, neurostore_fetched: 2026-11-03}
  vbm_of_ptsd:             {run: v1-ns-search, best: v1, neurostore_fetched: 2026-11-03}
  vbm_of_substance_use:    {run: v2-ns-search, best: v2, neurostore_fetched: 2026-11-03}
