# social, cbma-skills arm.
#
# Translated from the autonima config for this project's v3 run, the registry's "best".
# The objectives, the query, the dates and every criterion are the same strings after YAML parsing;
# scripts/check_cbma_translation.py checks that. 1 line(s) that v3 lists as criteria are guidance
# rather than properties of a study or analysis, so they sit verbatim in instructions.
# Full-text sources are the corpora autonima's run used. Meta-analysis: MKDA density with FDR.

name: social
objective: Identify fMRI studies of social related processing in healthy adults
search:
  query: ( ('functional MRI'[Title/Abstract] OR 'functional magnetic resonance imaging'[Title/Abstract]
    OR 'fMRI'[Title/Abstract] ) AND ( 'social communication'[Title/Abstract] OR 'social processing'[Title/Abstract]
    OR 'social interaction'[Title/Abstract] OR 'affiliation'[Title/Abstract] OR 'social attachment'[Title/Abstract]
    OR 'social cognition'[Title/Abstract] OR 'understanding others'[Title/Abstract] ) AND 'Humans'[MeSH])
  date_from: 1995/01/01
  date_to: 2020/03/01
  email: delavega@utexas.edu
screening:
  abstract:
    inclusion:
    - Functional MRI scan conducted while human participants performed a social-related task. Relevant
      constructs include (but are not limited to) Affiliation and Attachment, Social Communication, Perception
      and Understanding of Self, and Perception and Understanding of Others.
    - At least one group of healthy participants, age 18–65, even if other groups include participants
      with psychiatric or neurological disorders.
    exclusion:
    - systematic reviews or meta-analyses
  fulltext:
    inclusion:
    - Study uses functional MRI during a social-related task. Relevant constructs include (but are not
      limited to)- Affiliation and Attachment, Social Communication, Perception and Understanding of Self,
      and Perception and Understanding of Others.
    - Sample- At least one group of healthy adult participants (age 18–65). Studies that also include
      clinical or special groups are eligible only if results for the healthy group are reported separately.
    - Whole-brain evidence- The paper must report at least one group-level, whole-brain (voxelwise) task-evoked
      statistical map (e.g., main effect or within-group contrast) that is clearly identified as coming
      from the healthy/control group (i.e., not limited to a narrowly defined subgroup).
    exclusion:
    - Studies that report only region-of-interest (ROI) analyses with no whole-brain results.
    - Studies that report only seed-based connectivity, effective connectivity (e.g., PPI, DCM), or resting-state
      analyses (e.g., ICA, PLE, Hurst exponents) without also reporting a healthy-group whole-brain task
      activation map.
    - Studies that report only between-group contrasts or interactions (e.g., subgroup vs subgroup, patient
      vs control) without an accompanying unmasked, whole-brain healthy-group task effect.
    - Studies that include only participants outside the age range of 18–65, unless a healthy adult subgroup
      in this range is analyzed and reported separately.
    - Non-empirical papers (e.g., reviews, meta-analyses, methods-only, simulations) without original
      fMRI data in healthy adults.
    instructions: It is acceptable for qualifying whole-brain results to be reported in tables of coordinates,
      figures, or supplementary materials, as long as they are clearly described in the text.
fulltext:
  sources:
  - type: pmc
  - type: local
    name: elsevier_xml
    path: ../corpora/elsevier_output
    pattern: '*/article.xml'
    id_from: parent_dir
    id_kind: pmid
    format: elsevier
  - type: local
    name: ace_html
    path: ../corpora/ace_html
    pattern: '**/*.html'
    id_from: filename
    id_kind: pmid
    format: html
extraction:
  drop_unverified: true
selection:
  global:
    inclusion:
    - Sample- The analysis must be on a healthy adult participants (alone, not a clinical or special group,
      or a comparison between healthy and clinical/special groups).
    - Whole-brain evidence- The analysis must be from a group-level, univariate whole-brain (voxelwise)
      task-evoked statistical map (e.g., main effect or within-group contrast) that is from the healthy/control
      group and is generalizable to the healthy adult population.
    exclusion:
    - Region-of-interest (ROI) analyses
    - Seed-based connectivity, effective connectivity (e.g., PPI, DCM), or resting-state analyses (e.g.,
      ICA, PLE, Hurst exponents)
    - Between-group contrasts or interactions (e.g., subgroup vs subgroup, patient vs control)
  targets:
  - name: social_processing_all
    description: Social Processing encompasses a broad range of processes that enable individuals to perceive,
      interpret, and respond to social information. This includes understanding social cues, recognizing
      emotions in others, engaging in social interactions, and forming social bonds. Social processing
      is fundamental to human behavior and is crucial for effective communication and relationship-building.
    inclusion:
    - Analyses performed a social-related task. Relevant constructs include (but are not limited to) Affiliation
      and Attachment, Social Communication, Perception and Understanding of Self, and Perception and Understanding
      of Others.
    - The analysis/contrast must measure Social Processing
  - name: affiliation_attachment
    description: Affiliation and Attachment is characterized by positive interactions and social bonds,
      and typically involves the detection of and attention to social cues, as well as social learning
      associated with the formation of relationships. Assessment measures generally relate to attachment
      styles, close relationship scales, and parental and peer bonding.
    inclusion:
    - 'Analyses must be on a task measuring affiliation and attachment (example tasks: Kinship-related
      social scenarios; Cooperation and competition; Social comparison)'
    - 'The analysis/contrast must measure Affiliation and Attachment (example contrast: Loved one vs Stranger)'
  - name: social_communication
    description: 'Social Communication involves the exchange of socially relevant information and involves
      both receptive (e.g., affect recognition, facial recognition, and characterization) and productive
      (e.g., eye contact, expressive reciprocation, gaze following) aspects of communication. Within this
      construct, there exist four subconstructs: (i) Reception of Facial Communication, (ii) Production
      of Facial Communication, (iii) Reception of Non-Facial Communication, and (iv) Production of Non-Facial
      Communication. '
    inclusion:
    - 'Analyses from tasks measuring Social Communication (example tasks: Kinship-related social scenarios;
      Cooperation and competition; Social comparison)'
    - 'The analysis/contrast must measure Social Communication (example contrast: Loved one vs Stranger)'
  - name: perception_self
    description: 'Perception and Understanding of Self includes processes involved in being aware of,
      accessing knowledge, or making judgments about the self, and can include current cognitive or emotional
      internal states, traits, and/or abilities, as well as mechanisms that support self-awareness, self-monitoring,
      and self-knowledge. Within this construct, there exist two subconstructs: (i) Agency and (ii) Self-knowledge. '
    inclusion:
    - 'Analyses from tasks measuring Perception and Understanding of Self (example tasks: Kinship-related
      social scenarios; Cooperation and competition; Social comparison)'
    - 'The analysis/contrast must measure Perception and Understanding of Self (example contrast: Loved
      one vs Stranger)'
  - name: perception_others
    description: 'Perception and Understanding of Others are the representations involved in being aware
      of, assessing knowledge about, and reasoning about others’ emotional states, traits, or abilities.
      Among this construct exist three subconstructs: (i) Animacy Perception, (ii) Action Perception,
      and (iii) Understanding Mental States.'
    inclusion:
    - 'Analyses from tasks measuring Perception and Understanding of Others (example tasks: Kinship-related
      social scenarios; Cooperation and competition; Social comparison)'
    - 'The analysis/contrast must measure Perception and Understanding of Others (example contrast: Loved
      one vs Stranger)'
meta:
  estimator: mkdadensity
  corrector: fdr
