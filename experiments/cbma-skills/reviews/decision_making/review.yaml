# decision_making, cbma-skills arm.
#
# Translated from the autonima config for this project's v3 run, the registry's "best".
# The objectives, the query, the dates and every criterion are the same strings after YAML parsing;
# scripts/check_cbma_translation.py checks that. 7 line(s) that v3 lists as criteria are guidance
# rather than properties of a study or analysis, so they sit verbatim in instructions.
# Full-text sources are the corpora autonima's run used. Meta-analysis: MKDA density with FDR.
#
# Judgment calls: the study-level subtype rules (one subtype per study, all analyses following it)
# govern how a study's analyses relate, not what one analysis is; as criteria a judge would have
# to mark them met per analysis. Each subtype target keeps its own "assign this only if <subtype>
# is the single study-level subtype" criterion, so the rule still gates selection. Note:
# autonima's decision_making runs left 25 studies unannotated (memory: decision_making annotation
# gaps).

name: decision_making
objective: Meta-analysis of fMRI studies of risky, ambiguous, and perceptual decision-making.
search:
  query: ((((risk*[tiab] OR "risk taking"[tiab] OR "risk-taking"[tiab]) AND (decision-making[tiab] OR
    "decision making"[tiab] OR choice[tiab] OR choices[tiab])) OR ((ambigu*[tiab] OR uncertainty[tiab]
    OR probabilistic[tiab]) AND (decision-making[tiab] OR "decision making"[tiab] OR choice[tiab] OR choices[tiab]))
    OR ("perceptual decision-making"[tiab] OR "perceptual decision making"[tiab]) OR (((ambigu*[tiab]
    OR uncertainty[tiab] OR probabilistic[tiab]) AND (reward*[tiab] OR learning[tiab])))) AND (fMRI[tiab]
    OR "functional MRI"[tiab] OR "functional magnetic resonance imaging"[tiab] OR BOLD[tiab] OR "blood
    oxygenation level dependent"[tiab]) AND Humans[mh] AND English[lang] NOT (review[pt] OR "systematic
    review"[tiab] OR meta-analysis[pt]))
  date_from: 1995/01/01
  date_to: 2019/03/31
  email: delavega@utexas.edu
screening:
  abstract:
    inclusion:
    - English language empirical studies with original data
    - Functional MRI scan conducted while human participants performed a risky, ambiguous, or perceptual
      decision-making task
    - Sample- humans of any age that were either healthy participants, substance users, as well as groups
      with other neuropsychiatric conditions
    exclusion:
    - Studies using only PET or other non-fMRI neuroimaging methods
    - Systematic reviews or meta-analyses
  fulltext:
    inclusion:
    - Functional MRI (fMRI) scan conducted while human participants performed a risky, ambiguous, or perceptual
      decision-making task
    - At least one contrast comparing two decision-making conditions, or a decision-making task against
      an active CONTROL TASK. The admitted forms are- for risky-DM "risky > safe", "high-risk > low-risk",
      "risk > certainty", "riskier > surer", or "experimental task (risk) > control task"; for ambiguous-DM
      "high uncertainty > low uncertainty", "ambiguity > ignorance", "ambiguous > non-ambiguous", or "ambiguous
      task > control task"; for perceptual-DM "hard > easy", "low coherence > high coherence", or "perceptual
      task > control task". Both within-task and between-task comparisons qualify.
    - Whole-brain evidence- The target analysis must be a group-level, whole-brain (voxelwise) task-evoked
      statistical map
    - Any participant group qualifies- healthy participants, substance users, and participants with other
      neuropsychiatric conditions (internet addiction, gambling disorder, internet gaming disorder, obesity,
      depressive, anxiety or conduct disorders, antisocial personality disorder, schizophrenia). All age
      groups from roughly 10 to 69 years qualify. Do not exclude a study because of who its participants
      were.
    exclusion:
    - Studies whose only decision-making contrasts are against an implicit baseline, rest or fixation
      (e.g. "50% probability condition > implicit baseline", "task > rest"). This benchmark admits only
      condition-versus-condition and task-versus-control-task contrasts.
    - Positron emission tomography (PET) studies. The source meta-analysis excluded PET deliberately,
      to remove heterogeneity across imaging modalities.
    - Studies whose decision-making task is not risky, ambiguous or perceptual DM- for example delay discounting
      or intertemporal choice, moral or social decision-making, reward receipt or consumption without
      an uncertainty manipulation, and effort-based choice.
    - Studies that report only region-of-interest (ROI) analyses with no whole-brain results.
    - Studies that report only seed-based connectivity, effective connectivity (e.g., PPI, DCM), or resting-state
      analyses (e.g., ICA, PLE, Hurst exponents) without also reporting a whole-brain task activation
      map.
    - Studies that report ONLY between-group contrasts or interactions (e.g. substance users vs non-users,
      patient vs control) with no accompanying unmasked, whole-brain within-group task effect. Note this
      is about the contrast, not the sample- a within-group contrast in a patient or substance-using sample
      qualifies.
    - Non-empirical papers (e.g., reviews, meta-analyses, methods-only, simulations) without original
      fMRI data.
    instructions: It is acceptable for qualifying whole-brain results to be reported in tables of coordinates,
      figures, or supplementary materials, as long as they are clearly described in the text.
fulltext:
  sources:
  - type: pmc
  - type: local
    name: elsevier_xml
    path: ../corpora/elsevier_output
    pattern: '*/article.xml'
    id_from: parent_dir
    id_kind: pmid
    format: elsevier
  - type: local
    name: ace_html
    path: ../corpora/ace_html
    pattern: '**/*.html'
    id_from: filename
    id_kind: pmid
    format: html
extraction:
  drop_unverified: true
selection:
  global:
    inclusion:
    - Task-evoked contrasts related to decision-making
    - Whole-brain evidence- Must be a group-level, whole-brain (voxelwise) task-evoked statistical map
    exclusion:
    - Region-of-interest (ROI) analyses
    - Seed-based connectivity, effective connectivity (e.g., PPI, DCM), or resting-state analyses (e.g.,
      ICA, PLE, Hurst exponents)
  instructions: 'If an analysis label is generic/truncated (e.g., analysis_0), use table caption, neighboring
    contrasts, and study_fulltext to infer eligibility; do not fail only because the label text is sparse.

    Resolve subtype overlaps by primary uncertainty source- sensory evidence uncertainty -> perceptual_dm;
    uncertainty/ambiguity in contingencies or information -> ambiguous_dm; explicit known-risk vs safe/certain
    choice -> risky_dm.

    Study-level subtype mutual exclusivity is required- for each study/PMID, assign exactly one subtype
    among ambiguous_dm, perceptual_dm, and risky_dm.

    Once a study-level subtype is chosen, all included analyses from that study must follow that same
    subtype; do not split analyses from one study across multiple subtypes.'
  targets:
  - name: common_dm
    description: decision making contrasts that are common across risky, ambiguous, and perceptual decision-making
      studies
    inclusion:
    - contrasts related to risky, ambiguous, or perceptual decision-making
    - all populations (e.g., healthy controls, non-users, drug users, patients with substance use disorders,
      or other neuropsychiatric conditions)
  - name: ambiguous_dm
    description: ambiguous decision-making contrasts
    inclusion:
    - assign this annotation only if ambiguous_dm is the single study-level subtype for that PMID.
    - contrasts where uncertainty/ambiguity is central to the decision (e.g., “ambiguous > certain”, “high
      uncertainty > low uncertainty”, “ambiguity > risk”, uncertainty-driven information sampling/decision
      contrasts).
    - all populations (e.g., healthy controls, non-users, drug users, patients with substance use disorders,
      or other neuropsychiatric conditions)
    exclusion:
    - exclude sensory-perceptual difficulty contrasts (e.g., low coherence > high coherence, noisy > clear,
      hard > easy perceptual discrimination); those belong in perceptual_dm.
    - exclude purely outcome/feedback contrasts unless the contrast directly indexes uncertainty during
      the decision phase.
    instructions: include uncertainty-based choice contrasts even when labels are generic (analysis_0/analysis_1)
      if study/table context shows they are uncertainty decision maps.
  - name: perceptual_dm
    description: perceptual decision-making contrasts
    inclusion:
    - assign this annotation only if perceptual_dm is the single study-level subtype for that PMID.
    - contrasts where decisions are based on sensory/perceptual evidence (e.g., coherence/noise/category
      discrimination, hard > easy perceptual judgments, perceptual task > control).
    - all populations (e.g., healthy controls, non-users, drug users, patients with substance use disorders,
      or other neuropsychiatric conditions)
    exclusion:
    - exclude economic/probability uncertainty, reward prediction, or gambling ambiguity/risk contrasts
      even if stimuli are visual.
    instructions: include low-coherence/noisy > high-coherence/clear contrasts as perceptual_dm, not ambiguous_dm.
  - name: risky_dm
    description: risky decision-making contrasts
    inclusion:
    - assign this annotation only if risky_dm is the single study-level subtype for that PMID.
    - contrasts with explicit known-risk manipulation focused on risky vs safe/certain choice (e.g., risky
      > safe, high-risk > low-risk, risk > certainty, riskier > surer, risk task > control).
    - all populations (e.g., healthy controls, non-users, drug users, patients with substance use disorders,
      or other neuropsychiatric conditions)
    exclusion:
    - exclude ambiguity-dominant contrasts (e.g., ambiguity > risk, mixed risk-vs-ambiguity contrasts
      where ambiguity is the target); route these to ambiguous_dm.
    - exclude generic uncertainty/prediction contrasts without a clear risky-vs-safe decision manipulation.
  - name: non_using_risky
    description: contrasts related to risky decision-making in non-substance using populations (e.g.,
      healthy controls, non-users, or other neuropsychiatric conditions)
    inclusion:
    - only apply when the study-level subtype for that PMID is risky_dm.
    - 'same risky_dm contrast rules: explicit known-risk vs safe/certain choice contrasts; exclude ambiguity-dominant
      or generic uncertainty-only contrasts.'
    - non-substance using populations (e.g., healthy controls, non-users, or other neuropsychiatric conditions)
      compared to substance using populations (e.g., drug users, patients with substance use disorders)
  - name: using_risky
    description: contrasts related to risky decision-making in substance using populations (e.g., drug
      users, patients with substance use disorders)
    inclusion:
    - only apply when the study-level subtype for that PMID is risky_dm.
    - 'same risky_dm contrast rules: explicit known-risk vs safe/certain choice contrasts; exclude ambiguity-dominant
      or generic uncertainty-only contrasts.'
    - substance using populations (e.g., drug users, patients with substance use disorders) compared to
      non-substance using populations (e.g., healthy controls, non-users, or other neuropsychiatric conditions)
meta:
  estimator: mkdadensity
  corrector: fdr
