<?xml version="1.0" encoding="UTF-8"?>
<!--
  Figure 1 - AutoNIMA: LLM-Assisted Meta-Analysis Pipeline.

  Hand-authored SVG reproduction of the poster schematic. Pure SVG: no embedded raster, no
  external fonts beyond a generic sans stack, so it scales to any figure width and can be
  edited in a text editor or a vector editor.

  Kept OUT of reports/nature_methods_figures/, which is generated output that
  make_nature_methods_figures.py rewrites. This one is drawn by hand and has no generator.

  Layout is a single vertical spine at x=388 with five stages; every arrow on that spine is
  drawn by the `spine` block-arrow path so the vertical rhythm stays consistent.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="776" height="1300" viewBox="0 0 776 1300"
     font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <defs>
    <style>
      .title      { font-size:25px; font-weight:700; fill:#111; text-anchor:middle }
      .stage      { font-size:19px; font-weight:700; fill:#111; text-anchor:middle }
      .boxTitle   { font-size:12.5px; font-weight:700; fill:#111 }
      .boxSub     { font-size:10px; fill:#555 }
      .lbl        { font-size:10px; fill:#222; text-anchor:middle }
      .lblL       { font-size:10px; fill:#222 }
      .task       { font-size:9.5px; fill:#222; text-anchor:middle }
      .taskU      { font-size:9.5px; fill:#222; text-anchor:middle;
                    text-decoration:underline }
      .tiny       { font-size:8px; fill:#333 }
      .tinyC      { font-size:8px; fill:#333; text-anchor:middle }
      .chip       { font-size:9.5px; font-weight:700; fill:#fff; text-anchor:middle }
      .ok         { font-size:9px; font-weight:700; fill:#1b7f3b }
      .no         { font-size:9px; font-weight:700; fill:#b23b3b }
      .panel      { fill:#fff; stroke:#c9cdd1; stroke-width:1.2 }
      .green      { fill:#e6f4ea; stroke:#7cbf95; stroke-width:1.6 }
      .white      { fill:#fff; stroke:#c9cdd1; stroke-width:1.2 }
      .arrowGrey  { fill:#b9bcc0 }
      .thin       { stroke:#8f9296; stroke-width:1.6; fill:none; marker-end:url(#tip) }
      .rule       { stroke:#c9cdd1; stroke-width:1 }
    </style>
    <marker id="tip" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L6.5,3 L0,6 z" fill="#8f9296"/>
    </marker>
    <marker id="tipDark" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L6.5,3 L0,6 z" fill="#555"/>
    </marker>

    <!-- Block arrow used for every step on the vertical spine. -->
    <g id="spine">
      <path class="arrowGrey" d="M-7,0 h14 v20 h9 l-16,17 l-16,-17 h9 z"/>
    </g>
    <!-- Horizontal twin, for the left-to-right flows inside the stage panels. -->
    <g id="spineR">
      <path class="arrowGrey" d="M0,-7 v14 h20 v9 l17,-16 l-17,-16 v9 z"/>
    </g>

    <!-- The LLM. A dark tile with AI and a four-point sparkle. -->
    <g id="ai">
      <rect x="0" y="0" width="34" height="30" rx="6" fill="#1e2b45"/>
      <text x="12" y="21" font-size="13" font-weight="700" fill="#fff"
            text-anchor="middle">AI</text>
      <path d="M25,8 l1.8,4.4 l4.4,1.8 l-4.4,1.8 l-1.8,4.4 l-1.8,-4.4 l-4.4,-1.8
               l4.4,-1.8 z" fill="#8fd0ff"/>
    </g>

    <!-- A page with a turned corner. -->
    <g id="doc">
      <path d="M0,0 h20 l8,8 v28 h-28 z" fill="#fff" stroke="#7a7f85" stroke-width="1.3"/>
      <path d="M20,0 v8 h8" fill="none" stroke="#7a7f85" stroke-width="1.3"/>
      <path d="M5,15 h18 M5,21 h18 M5,27 h11" stroke="#9aa0a6" stroke-width="1.6"/>
    </g>

    <!-- Criteria clipboard. -->
    <g id="clip">
      <rect x="0" y="3" width="26" height="33" rx="3" fill="#fff"
            stroke="#7a7f85" stroke-width="1.3"/>
      <rect x="8" y="0" width="10" height="6" rx="2" fill="#c9cdd1"
            stroke="#7a7f85" stroke-width="1.1"/>
      <path d="M5,14 h16 M5,20 h16 M5,26 h10" stroke="#9aa0a6" stroke-width="1.6"/>
    </g>

    <!-- The three-criterion verdict card: two met, one violated. -->
    <g id="verdict">
      <rect x="0" y="0" width="60" height="40" rx="4" fill="#dff2e4"
            stroke="#7cbf95" stroke-width="1.2"/>
      <circle cx="8" cy="11" r="1.6" fill="#1b7f3b"/>
      <text class="ok" x="13" y="14">✓ meet</text>
      <circle cx="8" cy="23" r="1.6" fill="#1b7f3b"/>
      <text class="ok" x="13" y="26">✓ meet</text>
      <circle cx="8" cy="35" r="1.6" fill="#b23b3b"/>
      <text class="no" x="13" y="38">✗ exclude</text>
    </g>
  </defs>

  <rect width="776" height="1300" fill="#fff"/>

  <!-- ============================== TITLE ============================== -->
  <text class="title" x="388" y="34">AutoNIMA: LLM-Assisted Meta-Analysis Pipeline</text>

  <!-- ====================== EXPERT CONFIGURATION ====================== -->
  <g transform="translate(354,80)">
    <!-- researcher at a workstation -->
    <rect x="6" y="40" width="56" height="34" rx="3" fill="#e8eaed"
          stroke="#7a7f85" stroke-width="1.4"/>
    <rect x="12" y="45" width="44" height="24" fill="#fff" stroke="#9aa0a6"
          stroke-width="1"/>
    <path d="M17,52 h30 M17,58 h30 M17,64 h18" stroke="#b9bcc0" stroke-width="1.6"/>
    <rect x="0" y="74" width="68" height="5" rx="2.5" fill="#7a7f85"/>
    <path d="M17,40 c0,-16 34,-16 34,0 z" fill="#3d7f96"/>
    <circle cx="34" cy="18" r="12" fill="#f0c9a4"/>
    <path d="M22,16 a12,12 0 0 1 24,0 q-4,-6 -12,-6 t-12,6 z" fill="#2f3640"/>
    <path d="M22,16 q0,-14 12,-14 t12,14 q-2,-8 -12,-8 t-12,8 z" fill="#2f3640"/>
  </g>
  <text class="lbl" x="388" y="176">Expert Defined Configuration</text>

  <use href="#spine" xlink:href="#spine" x="388" y="186"/>

  <!-- ============================== SEARCH ============================== -->
  <g id="stage-search">
    <rect class="panel" x="10" y="230" width="756" height="70" rx="10"/>
    <text class="stage" x="388" y="256">Search</text>
    <!-- PubMed wordmark, drawn as text rather than the trademarked logotype -->
    <g transform="translate(96,270)">
      <text x="0" y="12" font-size="21" font-weight="700" fill="#2c5f9e">Pub</text>
      <rect x="33" y="-4" width="20" height="20" rx="4" fill="#c8492f"/>
      <text x="43" y="12" font-size="16" font-weight="700" fill="#fff"
            text-anchor="middle">M</text>
      <text x="56" y="12" font-size="21" font-weight="700" fill="#2c5f9e">ed</text>
    </g>
    <text class="lblL" x="240" y="282" font-size="11">PubMed API Query: 100s-1000s of results</text>
    <g transform="translate(600,260)" stroke="#2c5f9e" fill="none">
      <circle cx="14" cy="14" r="12" stroke-width="3.4"/>
      <path d="M23,23 l11,11" stroke-width="4.6" stroke-linecap="round"/>
    </g>
  </g>

  <use href="#spine" xlink:href="#spine" x="388" y="308"/>

  <!-- ============================= SCREENING ============================= -->
  <g id="stage-screening">
    <rect class="green" x="10" y="352" width="756" height="272" rx="10"/>
    <text class="stage" x="388" y="378">Screening</text>

    <!-- the three sequential passes -->
    <g transform="translate(24,390)">
      <rect class="white" x="0" y="0" width="348" height="44" rx="7"/>
      <text class="boxTitle" x="12" y="19">1. Abstract Screening</text>
      <text class="boxSub" x="12" y="34">First pass, scalable</text>

      <path class="thin" d="M174,48 v14"/>

      <rect class="white" x="0" y="66" width="348" height="84" rx="7"/>
      <text class="boxTitle" x="12" y="85">2. Retrieval</text>
      <text class="boxSub" x="12" y="100">Fetch Full-Text</text>
      <text class="tiny" x="12" y="116">• PubMed Central</text>
      <text class="tiny" x="12" y="129">• Elsevier API</text>
      <text class="tiny" x="12" y="142">• HTML Scraper + Manual</text>
      <!-- PMC + API glyphs -->
      <g transform="translate(250,78)">
        <rect x="0" y="0" width="40" height="26" rx="3" fill="#fff"
              stroke="#7a7f85" stroke-width="1.3"/>
        <path d="M4,8 h32 M4,14 h32 M4,20 h20" stroke="#b9bcc0" stroke-width="1.4"/>
        <text x="20" y="19" font-size="11" font-weight="700" fill="#3d7f96"
              text-anchor="middle">PMC</text>
      </g>
      <g transform="translate(252,112)">
        <path d="M9,20 a9,9 0 0 1 1,-18 a12,12 0 0 1 22,4 a8,8 0 0 1 -2,14 z"
              fill="#dfe9ef" stroke="#7a7f85" stroke-width="1.3"/>
        <path d="M20,10 v10 M16,16 l4,4 l4,-4" stroke="#3d7f96" stroke-width="1.8"
              fill="none" stroke-linecap="round"/>
      </g>

      <path class="thin" d="M174,154 v14"/>

      <rect class="white" x="0" y="172" width="348" height="44" rx="7"/>
      <text class="boxTitle" x="12" y="191">3. Full-Text Screening</text>
      <text class="boxSub" x="12" y="206">High-quality detailed criteria</text>
    </g>

    <!-- feeds the LLM decision box -->
    <g transform="translate(378,491)"><use href="#spineR" xlink:href="#spineR"/></g>

    <!-- how a screening decision is made -->
    <g id="screen-mechanism" transform="translate(424,390)">
      <rect class="white" x="0" y="0" width="330" height="216" rx="8"/>

      <use href="#doc" xlink:href="#doc" x="30" y="14"/>
      <use href="#clip" xlink:href="#clip" x="76" y="14"/>
      <text class="lbl" x="62" y="70">Text + Inclusion Criteria</text>

      <text class="tiny" x="26" y="90" font-weight="700">PROMPT</text>
      <path class="thin" d="M62,80 v14"/>
      <use href="#ai" xlink:href="#ai" x="45" y="98"/>
      <text class="task" x="62" y="146">Task: Screen studies</text>
      <text class="task" x="62" y="158">using criteria and text</text>

      <use href="#verdict" xlink:href="#verdict" x="128" y="52"/>
      <text class="tinyC" x="158" y="108">+ LLM reasoning</text>

      <path class="thin" d="M192,60 h22"/>
      <path class="thin" d="M192,84 h22"/>

      <!-- the two outcomes -->
      <g transform="translate(218,38)">
        <rect x="0" y="0" width="102" height="34" rx="5" fill="#cfe9d5"
              stroke="#3f8f5b" stroke-width="1.4"/>
        <text x="51" y="15" font-size="10.5" font-weight="700" fill="#1b6b36"
              text-anchor="middle">INCLUDE ✓</text>
        <text x="51" y="27" font-size="8" fill="#1b6b36"
              text-anchor="middle">Pass to next stage</text>
      </g>
      <g transform="translate(218,84)">
        <rect x="0" y="0" width="102" height="42" rx="5" fill="#f6d4d4"
              stroke="#b23b3b" stroke-width="1.4"/>
        <text x="51" y="15" font-size="10.5" font-weight="700" fill="#8f2b2b"
              text-anchor="middle">EXCLUDE ✗</text>
        <text x="51" y="27" font-size="8" fill="#8f2b2b"
              text-anchor="middle">Any exclusion or not</text>
        <text x="51" y="36" font-size="8" fill="#8f2b2b"
              text-anchor="middle">all inclusions met</text>
      </g>
    </g>
  </g>

  <!-- ========================= INCLUDED STUDIES ========================= -->
  <use href="#spine" xlink:href="#spine" x="388" y="632"/>
  <g transform="translate(224,634)">
    <use href="#doc" xlink:href="#doc" x="0" y="0"/>
    <text class="lblL" x="40" y="24" font-size="11">Included Studies</text>
  </g>

  <!-- ========================= COORDINATE PARSING ========================= -->
  <g id="stage-parsing">
    <rect class="green" x="10" y="678" width="756" height="216" rx="10"/>
    <text class="stage" x="388" y="704">Coordinate Parsing</text>
    <rect class="white" x="24" y="714" width="728" height="168" rx="8"/>

    <!-- included studies -->
    <g transform="translate(48,782)">
      <use href="#doc" xlink:href="#doc" x="0" y="0"/>
      <use href="#doc" xlink:href="#doc" x="12" y="10"/>
      <path d="M20,44 l5,5 l10,-12" stroke="#1b7f3b" stroke-width="2.6" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
      <text class="lbl" x="22" y="72">Included</text>
      <text class="lbl" x="22" y="83">Studies</text>
    </g>
    <path class="thin" d="M112,812 h34"/>

    <!-- raw activation tables -->
    <g transform="translate(156,776)">
      <g stroke="#7a7f85" stroke-width="1.1">
        <rect x="0" y="10" width="52" height="34" fill="#fff"/>
        <rect x="7" y="5" width="52" height="34" fill="#fff"/>
        <rect x="14" y="0" width="52" height="34" fill="#fff"/>
      </g>
      <path d="M14,9 h52 M14,18 h52 M14,27 h52 M31,0 v34 M48,0 v34"
            stroke="#c2c6ca" stroke-width="1"/>
      <text class="lbl" x="33" y="62">Extract Raw</text>
      <text class="lbl" x="33" y="73">Activation Tables</text>
    </g>
    <path class="thin" d="M228,812 h30"/>

    <!-- the LLM step -->
    <g transform="translate(268,786)">
      <use href="#ai" xlink:href="#ai" x="0" y="0"/>
      <text class="tiny" x="38" y="12" font-weight="700">PROMPT</text>
      <text class="taskU" x="16" y="56">Task:</text>
      <text class="task" x="74" y="56">Parse Coordinate</text>
      <text class="task" x="60" y="68">Tables into Distinct Analyses</text>
    </g>

    <!-- split into two contrasts -->
    <path class="thin" d="M352,800 C400,800 400,780 448,780"/>
    <path class="thin" d="M352,824 C400,824 400,858 448,858"/>

    <g transform="translate(458,758)">
      <rect x="0" y="0" width="152" height="16" rx="3" fill="#233a52"/>
      <text class="chip" x="76" y="12">CONTRAST 1: A &gt; B</text>
      <rect x="0" y="16" width="152" height="44" fill="#fff" stroke="#7a7f85"
            stroke-width="1.1"/>
      <path d="M0,30 h152 M0,45 h152 M38,16 v44 M76,16 v44 M114,16 v44"
            stroke="#c2c6ca" stroke-width="1"/>
      <text class="tinyC" x="19" y="27">x</text><text class="tinyC" x="57" y="27">y</text>
      <text class="tinyC" x="95" y="27">z</text><text class="tinyC" x="133" y="27">stat</text>
      <text class="tinyC" x="19" y="42">-23</text><text class="tinyC" x="57" y="42">10</text>
      <text class="tinyC" x="95" y="42">4</text><text class="tinyC" x="133" y="42">2.5</text>
      <text class="tinyC" x="19" y="56">-4</text><text class="tinyC" x="57" y="56">-12</text>
      <text class="tinyC" x="95" y="56">5</text><text class="tinyC" x="133" y="56">3.2</text>
    </g>

    <g transform="translate(458,836)">
      <rect x="0" y="0" width="152" height="16" rx="3" fill="#6e2b2b"/>
      <text class="chip" x="76" y="12">CONTRAST 2: B &gt; A</text>
      <rect x="0" y="16" width="152" height="44" fill="#fff" stroke="#7a7f85"
            stroke-width="1.1"/>
      <path d="M0,30 h152 M0,45 h152 M38,16 v44 M76,16 v44 M114,16 v44"
            stroke="#c2c6ca" stroke-width="1"/>
      <text class="tinyC" x="19" y="27">x</text><text class="tinyC" x="57" y="27">y</text>
      <text class="tinyC" x="95" y="27">z</text><text class="tinyC" x="133" y="27">stat</text>
      <text class="tinyC" x="19" y="42">-5</text><text class="tinyC" x="57" y="42">-8</text>
      <text class="tinyC" x="95" y="42">2</text><text class="tinyC" x="133" y="42">3.5</text>
      <text class="tinyC" x="19" y="56">-10</text><text class="tinyC" x="57" y="56">-5</text>
      <text class="tinyC" x="95" y="56">0</text><text class="tinyC" x="133" y="56">3.3</text>
    </g>
  </g>

  <use href="#spine" xlink:href="#spine" x="388" y="902"/>

  <!-- ========================= ANALYSIS ANNOTATION ========================= -->
  <g id="stage-annotation">
    <rect class="green" x="10" y="948" width="756" height="182" rx="10"/>
    <text class="stage" x="388" y="974">Analysis Annotation</text>
    <rect class="white" x="24" y="984" width="728" height="138" rx="8"/>

    <!-- the contrasts that came out of parsing -->
    <g transform="translate(40,1030)">
      <rect x="0" y="0" width="136" height="20" rx="3" fill="#233a52"/>
      <text class="chip" x="68" y="14">CONTRAST 1: A &gt; B</text>
      <rect x="0" y="28" width="136" height="20" rx="3" fill="#6e2b2b"/>
      <text class="chip" x="68" y="42">CONTRAST 2: B &gt; A</text>
      <rect x="0" y="56" width="136" height="20" rx="3" fill="#7a6a1c"/>
      <text class="chip" x="68" y="70">CONTRAST 3: G¹ &gt; G²</text>
    </g>

    <text x="188" y="1075" font-size="17" fill="#555" text-anchor="middle">+</text>

    <g transform="translate(200,1052)">
      <use href="#doc" xlink:href="#doc" x="0" y="0"/>
      <text class="lbl" x="14" y="50">Full Text</text>
    </g>
    <g transform="translate(264,1052)">
      <use href="#clip" xlink:href="#clip" x="0" y="0"/>
      <text class="lbl" x="13" y="50">Annotation</text>
      <text class="lbl" x="13" y="61">Criteria</text>
    </g>

    <path class="thin" d="M300,1070 h28"/>

    <g transform="translate(336,1046)">
      <use href="#ai" xlink:href="#ai" x="0" y="0"/>
      <text class="tiny" x="0" y="-4" font-weight="700">PROMPT</text>
      <use href="#verdict" xlink:href="#verdict" x="42" y="-2"/>
      <text class="taskU" x="16" y="56">Task:</text>
      <text class="task" x="82" y="56">Categorize Analyses Into</text>
      <text class="task" x="66" y="68">User-defined Groups</text>
    </g>

    <path class="thin" d="M444,1060 C486,1060 486,1044 528,1044"/>
    <path class="thin" d="M444,1084 C486,1084 486,1104 528,1104"/>

    <g transform="translate(538,1026)">
      <rect x="0" y="0" width="140" height="36" rx="4" fill="#f0d7b4"
            stroke="#a8823f" stroke-width="1.3"/>
      <text x="70" y="15" font-size="10" font-weight="700" fill="#5c4415"
            text-anchor="middle">ANN 1: Sz &gt; Healthy</text>
      <text x="70" y="29" font-size="9" fill="#5c4415" text-anchor="middle">C1, C2</text>
    </g>
    <g transform="translate(538,1086)">
      <rect x="0" y="0" width="140" height="36" rx="4" fill="#f0d7b4"
            stroke="#a8823f" stroke-width="1.3"/>
      <text x="70" y="15" font-size="10" font-weight="700" fill="#5c4415"
            text-anchor="middle">ANN 2: Healthy &gt; Sz</text>
      <text x="70" y="29" font-size="9" fill="#5c4415" text-anchor="middle">C1, C2</text>
    </g>
  </g>

  <use href="#spine" xlink:href="#spine" x="388" y="1138"/>

  <!-- ============================ META-ANALYSIS ============================ -->
  <g id="stage-meta">
    <rect class="panel" x="10" y="1184" width="756" height="106" rx="10"/>
    <text class="stage" x="388" y="1208">Meta-Analysis</text>

    <!-- NiMADS bundle -->
    <g transform="translate(120,1218)">
      <path d="M0,10 l22,-9 l22,9 v22 l-22,9 l-22,-9 z" fill="#f2c85c"
            stroke="#a8823f" stroke-width="1.3"/>
      <path d="M0,10 l22,9 l22,-9 M22,19 v22" fill="none" stroke="#a8823f"
            stroke-width="1.3"/>
      <circle cx="34" cy="34" r="9" fill="#2f6fb0"/>
      <path d="M30,34 l3,3 l6,-7" stroke="#fff" stroke-width="2" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
      <text class="lbl" x="22" y="60">NiMADS Bundle</text>
    </g>

    <path class="thin" d="M180,1254 h30"/>

    <g transform="translate(224,1226)">
      <rect x="0" y="0" width="70" height="22" rx="6" fill="#dfe2e5"
            stroke="#9aa0a6" stroke-width="1.1"/>
      <text x="35" y="15" font-size="11" font-weight="700" fill="#444"
            text-anchor="middle">NiMARE</text>
      <text class="lbl" x="35" y="38">Coordinate-Based Meta-Analysis</text>
      <text class="lbl" x="35" y="50">Methods: MKDA, ALE, etc</text>
    </g>

    <path class="thin" d="M432,1254 h30"/>

    <!-- a meta-analytic map -->
    <g transform="translate(478,1216)">
      <ellipse cx="42" cy="26" rx="42" ry="26" fill="#4a4a4a"/>
      <ellipse cx="42" cy="26" rx="34" ry="20" fill="#6b6b6b"/>
      <path d="M42,8 v36" stroke="#4a4a4a" stroke-width="1.6"/>
      <ellipse cx="27" cy="20" rx="9" ry="6" fill="#e8a33d"/>
      <ellipse cx="57" cy="20" rx="8" ry="5.5" fill="#e8a33d"/>
      <ellipse cx="42" cy="37" rx="7" ry="4.5" fill="#f2c85c"/>
      <ellipse cx="20" cy="32" rx="5" ry="3.5" fill="#f2c85c"/>
      <text class="lbl" x="42" y="66">Meta-Analytic Maps</text>
    </g>
  </g>
</svg>
