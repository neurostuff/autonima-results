# This repository is an analysis workspace, not a Python package. It used to declare
# itself as one -- src/autonima_results/ held a single empty __init__.py, built by
# hatchling and installed editable through pypi-dependencies below. Of the eleven
# dependencies that arrangement delivered, exactly one (nimare) is imported by any
# code here, and it is declared on its own account. The rest belong to autonima,
# pubget and ACE, which declare them themselves. The package was a decoy: it made
# the repo look importable while every module lived in scripts/ and was reached by
# sys.path insertion.
[project]
authors = [{name = "Alejandro de la Vega", email = "aleph4@gmail.com"}]
name = "autonima-results"
requires-python = ">= 3.11"
version = "0.1.0"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[tool.pixi.pypi-dependencies]
nimare = ">=0.2.1,<0.3"

# TWO ENVIRONMENTS, because the siblings are wanted two different ways.
#
#   pixi run <cmd>            default: siblings pinned to public commits.
#                             Reproducible from a clone; edits to ../autonima
#                             have NO effect.
#   pixi run -e dev <cmd>     development: siblings as editable local checkouts,
#                             exactly as before. Edits take effect immediately.
#
# The siblings used to sit in the default pypi-dependencies as ../ paths, which
# meant the environment could only be built in one directory on one machine.

[tool.pixi.feature.pinned.pypi-dependencies]
# v0.1.0 (12a3d75), the release cut for the manuscript. Not 440de05, where master
# stood when the canonical runs finished: the eight commits between the two are
# inert here -- the model-parameter passthrough only applies when
# AUTONIMA_MODEL_PARAMS or a config model_params block is set, and no benchmark
# project uses either -- while 12a3d75 additionally carries the per-stage token
# and cost accounting that Supplementary S5 was measured with. Pinning the release
# therefore covers every number in the paper, which 440de05 did not.
autonima = { git = "https://github.com/neurostuff/autonima.git", tag = "v0.1.0", extras = ["meta"] }
# no_miss was merged upstream; d64291e is origin/master. ACE supplies scraped HTML as
# a retrieval source (articles/ace_outputs), which the manuscript covers as
# "user-provided article files".
ace = { git = "https://github.com/neurosynth/ACE.git", rev = "d64291e06655d60049e046baeb670f8ffb5db360" }
# 236b762 is the merge of neuroquery/pubget#61, which carries the fix the
# retrieval depended on: "Skip an article with no usable PMCID instead of failing
# its whole batch". Before it, one unidentifiable record discarded every sibling
# in its batch -- observed on a 413-PMCID retrieval that produced zero article
# directories. Pinned to the merge commit because pubget has cut no release since.
pubget = { git = "https://github.com/neuroquery/pubget.git", rev = "236b762e2be90bb7525e296922bfc463c9e01605" }

[tool.pixi.feature.dev.pypi-dependencies]
autonima = { path = '../autonima', editable = true, extras = ["meta"] }
ace = { path = '../ACE', editable = true }
pubget = { path = "../pubget", editable = true }

[tool.pixi.environments]
default = { features = ["pinned"], solve-group = "pinned" }
dev = { features = ["dev"], solve-group = "dev" }

[tool.pixi.tasks]

[tool.pixi.dependencies]
sqlalchemy = ">=2.0.44,<3"
simplejson = ">=3.20.2,<4"
readabilipy = ">=0.3.0,<0.4"
nodejs = ">=20.18.0,<21" 
openai = ">=2.6.0,<3"
joblib = "==1.1.1"
nilearn = "==0.10.1"
numpy = "==1.25.2"
scipy = "==1.10.1"
scikit-learn = "==1.2.2"
ipython = ">=9.6.0,<10"
ipykernel = ">=7.1.0,<8"
pip = ">=25.2,<26"
seaborn = ">=0.13.2,<0.14"
jupyterlab = ">=4.4.10,<5"
python = ">=3.11.14,<3.12"
ipdb = ">=0.13.13,<0.14"

[tool.pixi.activation.env]
PYTHONNOUSERSITE = "1"
