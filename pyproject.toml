# This repository is an analysis workspace, not a Python package. It used to declare
# itself as one -- src/autonima_results/ held a single empty __init__.py, built by
# hatchling and installed editable through pypi-dependencies below. Of the eleven
# dependencies that arrangement delivered, exactly one (nimare) is imported by any
# code here, and it is declared on its own account. The rest belong to autonima,
# pubget and ACE, which declare them themselves. The package was a decoy: it made
# the repo look importable while every module lived in scripts/ and was reached by
# sys.path insertion.
[project]
authors = [{name = "Alejandro de la Vega", email = "aleph4@gmail.com"}]
name = "autonima-results"
requires-python = ">= 3.11"
version = "0.1.0"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

# The three siblings used to resolve through ../ paths, so the environment could only
# be built in one directory on one machine. Pinned to public commits instead.
[tool.pixi.pypi-dependencies]
# 440de05 is where master stood locally when the evaluation was run (2026-09-08).
# Deliberately NOT origin/master: the eight commits after it change how the model is
# called (model-parameter passthrough, model_params read from config), and the
# canonical runs finished 2026-08-27. One caveat for Methods -- Supplementary S5's
# cost figures were measured 2026-09-04 and therefore come from fef53ac, which is
# AFTER this pin. No single commit produced every number in the paper, and
# execution_manifest.json records no version, so this cannot be recovered from the
# artifacts.
autonima = { git = "https://github.com/neurostuff/autonima.git", rev = "440de05b77a1ce00ca05cc9b5c73755ac8987b11", extras = ["meta"] }
# no_miss was merged upstream; d64291e is origin/master. ACE supplies scraped HTML as
# a retrieval source (articles/ace_outputs), which the manuscript covers as
# "user-provided article files".
ace = { git = "https://github.com/neurosynth/ACE.git", rev = "d64291e06655d60049e046baeb670f8ffb5db360" }
# NOT YET PINNABLE. The retrieval used a local fix that exists on no public commit:
# "Skip an article with no usable PMCID instead of failing its whole batch". It is
# open as neuroquery/pubget#61; pin the merge commit, or a release, once it lands.
pubget = { path = "../pubget", editable = true }
nimare = ">=0.2.1,<0.3"

[tool.pixi.tasks]

[tool.pixi.dependencies]
sqlalchemy = ">=2.0.44,<3"
simplejson = ">=3.20.2,<4"
readabilipy = ">=0.3.0,<0.4"
nodejs = ">=20.18.0,<21" 
openai = ">=2.6.0,<3"
joblib = "==1.1.1"
nilearn = "==0.10.1"
numpy = "==1.25.2"
scipy = "==1.10.1"
scikit-learn = "==1.2.2"
ipython = ">=9.6.0,<10"
ipykernel = ">=7.1.0,<8"
pip = ">=25.2,<26"
seaborn = ">=0.13.2,<0.14"
jupyterlab = ">=4.4.10,<5"
python = ">=3.11.14,<3.12"
ipdb = ">=0.13.13,<0.14"

[tool.pixi.activation.env]
PYTHONNOUSERSITE = "1"
