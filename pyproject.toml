# This repository is an analysis workspace, not a Python package. It used to declare
# itself as one -- src/autonima_results/ held a single empty __init__.py, built by
# hatchling and installed editable through pypi-dependencies below. Of the eleven
# dependencies that arrangement delivered, exactly one (nimare) is imported by any
# code here, and it is declared on its own account. The rest belong to autonima,
# pubget and ACE, which declare them themselves. The package was a decoy: it made
# the repo look importable while every module lived in scripts/ and was reached by
# sys.path insertion.
[project]
authors = [{name = "Alejandro de la Vega", email = "aleph4@gmail.com"}]
name = "autonima-results"
requires-python = ">= 3.11"
version = "0.1.0"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[tool.pixi.pypi-dependencies]
autonima = { path = '../autonima', editable = true, extras = ["meta"] }
ace = { path = '../ACE', editable = true }
pubget = { path = "../pubget", editable = true }
nimare = ">=0.2.1,<0.3"

[tool.pixi.tasks]

[tool.pixi.dependencies]
sqlalchemy = ">=2.0.44,<3"
simplejson = ">=3.20.2,<4"
readabilipy = ">=0.3.0,<0.4"
nodejs = ">=20.18.0,<21" 
openai = ">=2.6.0,<3"
joblib = "==1.1.1"
nilearn = "==0.10.1"
numpy = "==1.25.2"
scipy = "==1.10.1"
scikit-learn = "==1.2.2"
ipython = ">=9.6.0,<10"
ipykernel = ">=7.1.0,<8"
pip = ">=25.2,<26"
seaborn = ">=0.13.2,<0.14"
jupyterlab = ">=4.4.10,<5"
python = ">=3.11.14,<3.12"
ipdb = ">=0.13.13,<0.14"

[tool.pixi.activation.env]
PYTHONNOUSERSITE = "1"
